const mdContent = "# PRD-09: Navigation & Movement（导航与移动系统）\n\n> 版本：基于 Stage 1 扫描报告（`report_Input_Nav.md`）\n> 关联模块：`src/Core/Navigation/`、`src/Core/MovePlanning/`、`src/Core/MassNavigation/`\n\n---\n\n## 1. 功能概述\n\nNavigation & Movement 子系统是 Ludots 引擎中负责\"路径规划 → 移动计划 → 大规模执行\"全链路的模块。它横跨三个核心层级：\n\n1. **Navigation（导航系统）**：提供多域寻路能力——基于 chunk 的 `NodeGraph`（A* + RouteTable 快速查询）、基于 Detour 的 tile 化 `NavMesh`（增量烘焙）、以及分层抽象图（HPA / `MultiLayerGraph`）。`PathServiceRouter` 按域自动路由请求，`PathStore` 以池化方式存储路径点。\n\n2. **MovePlanning（移动规划）**：将高层 Order 绑定到具体的路径点序列（waypoints），管理 Plan 生命周期（绑定、推进、超时、重试），并通过 `IMovePlanExecutionSink` 将执行意图转发到底层移动系统。\n\n3. **MassNavigation（大规模导航执行）**：面向 RTS/战场场景的密集单位移动执行引擎。核心求解器 `MassNavigationFlowSolverState` 集成 Flow Field、ORCA/Sonar 局部避障、Hard Resolve（穿透校正）、Arrival Recovery（到达恢复）和 Streaming Window（动态加载窗口），在固定步长下支持数百至上千单位的大规模群体移动。\n\n---\n\n## 2. 目标用户\n\n| 用户角色 | 使用场景 |\n|----------|----------|\n| **Mod 作者** | 配置新的地图导航域、调整 Agent Profile、设计自定义寻路策略 |\n| **Gameplay 设计师** | 调整群体移动手感（避障强度、到达容忍、队形紧凑度） |\n| **关卡设计师** | 烘焙 NavMesh、配置 NodeGraph 标签过滤器、设置道路网络 |\n| **引擎开发者** | 接入新的寻路后端（如飞行路径、水路径）、优化 Flow Solver 性能 |\n| **AI 开发者** | 通过 `IPathService` 为 AI 决策层提供路径查询 |\n\n---\n\n## 3. 使用场景\n\n### 场景 A：RTS 大规模单位移动\n玩家框选 200 个单位 → 右键点击目标点 → `PathServiceRouter` 选择 `Auto` 域 → `AutoPathService` 对比 `NodeGraph` 与 `NavMesh` 成本 → 返回最优路径 → `MovePlanRuntimeService` 绑定 Plan → `MassNavigationMovePlanExecutionSink` 将目标写入 `MassNavigationSimulationRuntime` → `MassNavigationFlowSolverState` 重建 Flow Field → 每步执行 ORCA 避障 + Hard Resolve → 单位同步到 `WorldPositionCm`。\n\n### 场景 B：道路网络（Road Network）移动\n单位沿道路移动 → `TransportNetworkBakedAsset` 提供道路图数据 → `GraphPathfindingSystem` 在道路图上寻路 → `MassNavigationRouteExecutionSink` 跟踪路径目标 → 路径点依次推进 → 单位沿道路样条（Spline Ribbon）移动。\n\n### 场景 C：NavMesh 增量烘焙\n关卡编辑期间修改地形 → `RuntimeIncrementalNavMeshRebuildQueue` 标记受影响 tile → `NavBakeService` 增量重建 tile → `NavTileStore` 更新缓存 → 运行中单位自动感知新 NavMesh 数据。\n\n---\n\n## 4. 核心能力\n\n### 4.1 导航系统（Navigation）——多域寻路\n\nLudots 的导航系统支持三种寻路域，通过统一的 `IPathService` 接口暴露：\n\n| 寻路域 | 核心类 | 特点 | 适用场景 |\n|--------|--------|------|----------|\n| **NodeGraph** | `NodeGraphPathService` | 基于 chunk 的紧凑节点图（SoA：posXcm/posYcm/edgeStart/edgeTo/edgeBaseCost/edgeDepthCm/edgeWidthCm），支持 A* 和 RouteTable 快速查询 | 战略级寻路、道路网络、大尺度移动 |\n| **NavMesh** | `NavQueryService` | 基于 Detour 的 tile 化寻路，支持增量烘焙、多 Agent Profile、区域成本表 | 战术级寻路、精细避障、室内/复杂地形 |\n| **Direct** | `DirectPathService` | 直线路径，无地形成本 | 飞行单位、传送、视野投射 |\n\n**多域路由**：`PathServiceRouter`（`src/Core/Navigation/Pathing/PathServiceRouter.cs:5`）按 `PathDomain`（`None` / `NodeGraph` / `NavMesh` / `Auto`）路由请求。`AutoPathService` 自动选择 cheapest domain，Mod 作者可通过 `PathingSelectionConfig`（`PathDomain.Auto` / `PreferGraph` / `PreferMesh` / `Direct`）配置偏好策略。\n\n**HPA（Hierarchical Pathfinding A*）**：`HierarchicalPathService`（`src/Core/Navigation/MultiLayerGraph/HierarchicalPathService.cs`）在 `MultiLayerGraph` 上执行分层寻路。`ClusterGraph` 维护粗粒度簇图，`InterLayerMapping` 管理层间映射，实现长距离快速路径规划。\n\n**图遍历策略扩展**：`INodeGraphTraversalPolicy`（`src/Core/Navigation/GraphCore/NodeGraphTraversalPolicy.cs`）允许自定义 `IsNodeAllowed` / `IsEdgeAllowed` / `GetEdgeCost` / `GetHeuristic`。`DefaultTraversalPolicy` 提供默认实现，`TagFilter256`（256-bit 标签位图）支持 required/forbidden 标签过滤。\n\n**动态边成本覆盖**：`GraphEdgeCostOverlay` + `GraphEdgeCostOverlaySink` 允许 GAS 在运行时动态覆盖边成本（如技能制造的减速区、地形破坏）。\n\n### 4.2 NavMesh 烘焙与查询\n\nNavMesh 子系统具备完整的运行时烘焙能力：\n\n| 阶段 | 关键类 | 说明 |\n|------|--------|------|\n| 配置 | `NavMeshBakeConfig` / `NavMeshBakeConfigLoader` | 烘焙参数配置 |\n| 地形加载 | `NavBakeTerrainLoader` | 加载地形数据 |\n| 行走掩码 | `WalkMaskBuilder` | 构建可行走区域掩码 |\n| 轮廓提取 | `ContourExtractor` | 从掩码提取多边形轮廓 |\n| 三角化 | `Triangulator` / `CdtTriangulator` | 轮廓三角化（含 CDT） |\n| 网格构建 | `GridMeshBuilder` / `PolygonProcessor` | 构建导航网格 |\n| 漏斗优化 | `FunnelAlgorithm` | 路径点优化（拉直拐角） |\n| 产物构建 | `BakeArtifactBuilder` | 生成最终烘焙产物 |\n| 增量重建 | `RuntimeIncrementalNavMeshRebuildQueue` | 运行时标记 dirty tile 并排队重建 |\n\n运行时查询通过 `NavQueryService`（`src/Core/Navigation/NavMesh/NavQueryService.cs:50`）提供 `Project`（点投影到网格）和 `FindPath`（路径查询）能力，底层封装 `DetourNavQueryEngine`。`NavTileStore` 管理 tile 的加载与缓存，`NavTileBinary` 负责二进制序列化。\n\n### 4.3 移动规划（MovePlanning）\n\n`MovePlanRuntimeService`（`src/Core/MovePlanning/MovePlanRuntimeService.cs:10`）是 Order 与 MassNavigation 之间的 seam：\n\n```\nOrder (with Spatial points)\n  → MovePlanRuntimeService.TryBindActiveOrder()\n    → MovePlanStore.TryBindFromOrder() (copy route points)\n    → MovePlanRuntime (CurrentWaypointIndex = 0)\n      → MovePlanExecutionIntent (TargetWorldCm / Speed / StopRadius)\n        → IMovePlanExecutionSink.TryApply()\n          → MassNavigationMovePlanExecutionSink → MassNavigationSimulationRuntime.SetAgentNavigationTargetWorldCm()\n```\n\n| 类型 | 文件路径 | 说明 |\n|------|----------|------|\n| `MovePlanRuntime` | `src/Core/MovePlanning/MovePlanTypes.cs:37` | Plan 运行时状态（BoundOrderId / PlanGeneration / CurrentWaypointIndex） |\n| `MovePlanOrderRuntime` | `src/Core/MovePlanning/MovePlanTypes.cs:28` | 绑定到 Order 的运行时状态 |\n| `MovePlanExecutionIntent` | `src/Core/MovePlanning/MovePlanTypes.cs:51` | 执行意图（TargetWorldCm / Speed / StopRadius） |\n| `MovePlanView` | `src/Core/MovePlanning/MovePlanTypes.cs:59` | Plan 只读视图（PathXcm / PathYcm / FinalGoalWorldCm） |\n| `MovePlanStore` | `src/Core/MovePlanning/MovePlanStore.cs` | Plan 存储：实体/OrderId → waypoints 映射 |\n| `IMovePlanStore` | `src/Core/MovePlanning/MovePlanTypes.cs:94` | Plan 存储接口 |\n| `IMovePlanExecutionSink` | `src/Core/MovePlanning/MovePlanTypes.cs:107` | 执行 Sink 接口 |\n| `IMovePlanFinalTargetResolver` | `src/Core/MovePlanning/MovePlanTypes.cs:102` | 最终目标解析器接口 |\n\n### 4.4 大规模导航执行（MassNavigation）\n\n`MassNavigationSimulationRuntime`（`src/Core/MassNavigation/Runtime/MassNavigationSimulationRuntime.cs:99`）是高层 facade，提供选择同步、命令焦点、求解器窗口、Team 管理、Telemetry。\n\n核心求解器 `MassNavigationFlowSolverState`（`src/Core/MassNavigation/Runtime/MassNavigationFlowSolverState.cs:15`）是一个大型 `partial class`（~2700 行），实现分散在多个文件中：`EntitySync`、`ArrivalRecovery`、`SpatialHash`、`FlowSolver` 等。其每步执行管线：\n\n```\n1. UpdateTargets()       — 更新 Group 目标与 Route 目标\n2. AdvanceFlowPipeline() — 若 Flow Field dirty，重建场数据\n3. Step()                — 每 Agent：局部转向 + 避障 + Hard Resolve\n4. SyncEntities()        — 将结果写回 WorldPositionCm / FacingDirection / VisualTransform\n```\n\n**避障系统**：支持两种局部避障算法，通过 `MassNavigationFlowAvoidanceTuning` 配置：\n- **ORCA 2D**：`OrcaSolver2D`（`src/Core/Navigation/Avoidance/OrcaSolver2D.cs:7`），纯数学实现，无状态。\n- **Sonar 2D**：`SonarSolver2D`（`src/Core/Navigation/Avoidance/SonarSolver2D.cs`），扇区扫描避障。\n\n**队形系统**：`MassNavigationFormationRuntime`（`src/Core/MassNavigation/Runtime/MassNavigationFormationRuntime.cs`）支持 5 种队形：`None` / `Grid` / `Wedge` / `Line` / `Square` / `Circle`。`MassNavigationFormationSystem` 固定步长调度，更新目标、Flow Pipeline、Step、EntitySync。\n\n**AOI（Area of Interest）**：`HexGridAOI`（`src/Core/Navigation/AOI/HexGridAOI.cs`）提供六边形网格 AOI，支持 chunk 加载兴趣管理。\n\n**流式加载**：`MassNavigationStreamingConfig`（`src/Core/MassNavigation/Runtime/MassNavigationConfig.cs:642`）定义 `RetainSeconds` 和 `RadiusCm`，支持动态加载/卸载 chunk 中的 Agent。\n\n---\n\n## 5. 输入 / 输出\n\n### 5.1 输入\n\n| 输入 | 来源 | 说明 |\n|------|------|------|\n| `PathRequest` | GAS / AI / 输入系统 | Actor / Domain / Start / Goal / Budget |\n| `Move Order` | GAS OrderBuffer | `MassNavigationOrderIngestionSystem` 摄取 |\n| `Selection` | 选择系统 | `MassNavigationSelectionSyncSystem` 同步选择状态到 Flow |\n| `Terrain / Obstacle` | Map / 环境系统 | `MassNavigationEnvironmentBindingSystem` 绑定障碍与热点 |\n| `NavMesh Tile` | 烘焙系统 | `NavTileStore` 加载/缓存 tile |\n| `Graph Chunk` | 地图系统 | `ChunkedNodeGraphStore` 加载 chunk 图数据 |\n\n### 5.2 输出\n\n| 输出 | 消费者 | 说明 |\n|------|--------|------|\n| `PathResult` + `PathHandle` | MovePlan / AI | 路径状态（Found / NoPath / BudgetExceeded）和路径句柄 |\n| `MovePlanExecutionIntent` | MassNavigation | 目标世界坐标、速度、停止半径 |\n| `WorldPositionCm` / `FacingDirection` | ECS World | 更新后的实体位置与朝向 |\n| `VisualTransform` | Presentation | 表现层同步位置用于插值 |\n| `ArrivalEvent` | GAS / 触发器 | 单位到达目标的事件通知 |\n| `Telemetry` | 调试 / 监控 | `MassNavigationTelemetry` 计时、计数、频率观测 |\n\n---\n\n## 6. 依赖关系\n\n| 依赖模块 | 依赖类型 | 说明 |\n|----------|----------|------|\n| **Map / Board** | 强依赖 | `NodeGraphBoard` 提供图数据；`GridBoard` / `HexGridBoard` 提供地形与导航服务 |\n| **Input / Selection** | 强依赖 | `MassNavigationLocalCommandInputSystem` 读取本地输入；`MassNavigationSelectionSyncSystem` 同步选择 |\n| **GAS** | 强依赖 | `MassNavigationOrderIngestionSystem` 消费 GAS OrderBuffer；`GraphEdgeCostOverlaySink` 响应 GAS 属性变化 |\n| **Physics2D** | 弱依赖 | `MassNavigationAgent` 的 `CollisionParticipation` 组件标记是否参与 Physics2D |\n| **Presentation** | 弱依赖 | `MassNavigationLocomotionAnimatorParamSystem` 输出动画参数；`Performer` 消费位置状态 |\n| **TransportNetwork** | 弱依赖 | `MassNavigationRouteExecutionSink` 可跟踪道路网络路径 |\n\n---\n\n## 7. 非功能需求\n\n| 需求项 | 目标 | 验证方式 |\n|--------|------|----------|\n| **性能** | 1000+ 单位 @ 60Hz 模拟 | Flow Solver 并行 worker + SpatialHash 优化 |\n| **确定性** | 跨平台固定步长结果一致 | 全 Fix64 运算（物理、Flow、Pathing） |\n| **内存效率** | 路径池化、Plan 复用 | `PathStore` 池化 Xcm/Ycm 数组；`MovePlanStore` 复用存储 |\n| **可扩展性** | Mod 可新增寻路域、Agent Profile | `IPathService` 接口 + `AgentProfileRegistry` 注册模型 |\n| **流式加载** | 大规模地图支持动态加载 | `StreamingWindow` + `Chunk` 覆盖机制 |\n| **配置验证** | 20+ 必填字段严格校验 | `MassNavigationConfig.Validate()` fail-fast |\n| **遥测** | 生产环境可观测 | `MassNavigationTelemetry` 提供计时、计数、频率数据 |\n\n> **注意**：`MassNavigationConfig` 的验证极其严格（`ValidateRequiredTopLevelProperties` 要求 20+ 字段），任何缺失都会导致加载失败。Mod 作者需参考文档提供完整配置。\n\n---\n\n## 8. 关键类清单\n\n### 8.1 寻路核心\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `IPathService` | `src/Core/Navigation/Pathing/IPathService.cs:5` | 路径服务接口（TrySolve / TryCopyPath） |\n| `PathServiceRouter` | `src/Core/Navigation/Pathing/PathServiceRouter.cs:5` | 按 PathDomain 路由到 NodeGraph / NavMesh / Auto |\n| `PathRequest` | `src/Core/Navigation/Pathing/PathTypes.cs:75` | 路径请求（Actor / Domain / Start / Goal / Budget） |\n| `PathResult` | `src/Core/Navigation/Pathing/PathTypes.cs:108` | 路径结果（Status / Handle / Expanded / ErrorCode） |\n| `PathHandle` | `src/Core/Navigation/Pathing/PathTypes.cs:61` | 路径句柄（Index + Generation） |\n| `PathStore` | `src/Core/Navigation/Pathing/PathStore.cs:5` | 池化路径存储 |\n| `PathDomain` | `src/Core/Navigation/Pathing/PathTypes.cs:5` | 寻路域枚举 |\n| `PathStatus` | `src/Core/Navigation/Pathing/PathTypes.cs:13` | 路径状态枚举 |\n| `AutoPathService` | `src/Core/Navigation/Pathing/AutoPathService.cs` | 自动路径服务（选择 cheapest domain） |\n| `DirectPathService` | `src/Core/Navigation/Pathing/DirectPathService.cs` | 直线路径服务 |\n| `NodeGraphPathServiceAdapter` | `src/Core/Navigation/Pathing/NodeGraphPathServiceAdapter.cs` | NodeGraph → IPathService 适配器 |\n| `NavMeshPathServiceAdapter` | `src/Core/Navigation/Pathing/NavMeshPathServiceAdapter.cs` | NavMesh → IPathService 适配器 |\n| `PathingConfig` | `src/Core/Navigation/Pathing/Config/PathingConfig.cs:6` | 寻路配置根 |\n| `PathingConfigLoader` | `src/Core/Navigation/Pathing/Config/PathingConfigLoader.cs` | 寻路配置加载器 |\n\n### 8.2 NodeGraph\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `NodeGraph` | `src/Core/Navigation/GraphCore/NodeGraph.cs:5` | 紧凑节点图（SoA 存储） |\n| `NodeGraphPathService` | `src/Core/Navigation/GraphCore/NodeGraphPathService.cs:5` | A* 寻路静态方法（泛型 TraversalPolicy） |\n| `INodeGraphTraversalPolicy` | `src/Core/Navigation/GraphCore/NodeGraphTraversalPolicy.cs` | 图遍历策略接口 |\n| `DefaultTraversalPolicy` | `src/Core/Navigation/GraphCore/NodeGraphTraversalPolicy.cs` | 默认遍历策略 |\n| `NodeGraphPathScratch` | `src/Core/Navigation/GraphCore/NodeGraphPathScratch.cs` | A* 临时数据结构 |\n| `GraphPathfindingSystem` | `src/Core/Navigation/GraphEcs/GraphPathfindingSystem.cs:7` | 图寻路 ECS System |\n| `GraphPathRequest` | `src/Core/Navigation/GraphEcs/GraphPathComponents.cs:11` | ECS 寻路请求组件 |\n| `GraphPathBuffer` | `src/Core/Navigation/GraphEcs/GraphPathComponents.cs:25` | ECS 寻路结果节点数组 |\n| `GraphRouteTable` | `src/Core/Navigation/GraphCore/GraphRouteTable.cs` | 预计算路由表 |\n| `GraphRouteTableBuilder` | `src/Core/Navigation/GraphCore/GraphRouteTableBuilder.cs` | 路由表构建器 |\n| `LoadedGraphRuntime` | `src/Core/Navigation/GraphWorld/LoadedGraphRuntime.cs:14` | Chunk 加载图运行时 |\n| `ChunkedNodeGraphStore` | `src/Core/Navigation/GraphWorld/ChunkedNodeGraphStore.cs` | 分块节点图存储 |\n| `LoadedGraphView` | `src/Core/Navigation/GraphWorld/LoadedGraphView.cs` | 当前加载 chunk 的扁平化图视图 |\n| `GraphChunkData` | `src/Core/Navigation/GraphWorld/GraphChunkData.cs` | 单个 Chunk 的图数据 |\n| `GraphCrossEdge` | `src/Core/Navigation/GraphWorld/GraphCrossEdge.cs` | 跨 Chunk 边 |\n| `UniformGridNodeGraphSpatialIndex` | `src/Core/Navigation/GraphCore/UniformGridNodeGraphSpatialIndex.cs` | 均匀网格空间索引 |\n| `LinearScanNodeGraphSpatialIndex` | `src/Core/Navigation/GraphCore/LinearScanNodeGraphSpatialIndex.cs` | 线性扫描空间索引（小图 fallback） |\n| `TagBits256` | `src/Core/Navigation/GraphCore/TagBits256.cs:5` | 256-bit 标签位图 |\n| `TagFilter256` | `src/Core/Navigation/GraphCore/TagFilter256.cs` | 标签过滤器 |\n| `GraphTagSetRegistry` | `src/Core/Navigation/GraphSemantics/GAS/GraphTagSetRegistry.cs:8` | 标签集合去重注册表 |\n| `GraphEdgeCostOverlay` | `src/Core/Navigation/GraphCore/GraphEdgeCostOverlay.cs` | 动态边成本覆盖 |\n| `GraphEdgeCostOverlaySink` | `src/Core/Navigation/GraphSemantics/GAS/GraphEdgeCostOverlaySink.cs` | GAS 驱动的边成本覆盖 Sink |\n\n### 8.3 NavMesh\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `NavQueryService` | `src/Core/Navigation/NavMesh/NavQueryService.cs:50` | NavMesh 查询服务（Project / FindPath） |\n| `NavTileStore` | `src/Core/Navigation/NavMesh/NavTileStore.cs` | NavTile 存储（加载/缓存） |\n| `NavTileBuilder` | `src/Core/Navigation/NavMesh/NavTileBuilder.cs` | Tile 构建器 |\n| `NavTileBinary` | `src/Core/Navigation/NavMesh/NavTileBinary.cs` | Tile 二进制序列化 |\n| `NavMeshBakeConfig` | `src/Core/Navigation/NavMesh/Config/NavMeshBakeConfig.cs` | NavMesh 烘焙配置 |\n| `NavMeshBakeConfigLoader` | `src/Core/Navigation/NavMesh/Config/NavMeshBakeConfigLoader.cs` | 烘焙配置加载器 |\n| `NavMeshProfileRegistry` | `src/Core/Navigation/NavMesh/NavMeshProfileRegistry.cs:8` | NavMesh Profile 注册表 |\n| `NavQueryServiceRegistry` | `src/Core/Navigation/NavMesh/NavQueryServiceRegistry.cs` | Na  | 类型定义枚举 |\n| `MovePlanOrderRuntime` | `src/Core/MovePlanning/MovePlanTypes.cs:28` | 绑定到 Order 的运行时状态 |\n| `MovePlanRuntime` | `src/Core/MovePlanning/MovePlanTypes.cs:37` | Plan 运行时状态 |\n| `MovePlanExecutionIntent` | `src/Core/MovePlanning/MovePlanTypes.cs:51` | 执行意图 |\n| `MovePlanView` | `src/Core/MovePlanning/MovePlanTypes.cs:59` | Plan 只读视图 |\n\n### 8.6 MassNavigation 核心\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `MassNavigationRuntime` | `src/Core/MassNavigation/Runtime/MassNavigationRuntime.cs:16` | 高层运行时：生命周期 + 系统安装 |\n| `MassNavigationSimulationRuntime` | `src/Core/MassNavigation/Runtime/MassNavigationSimulationRuntime.cs:99` | 模拟运行时 facade |\n| `MassNavigationFlowSolverState` | `src/Core/MassNavigation/Runtime/MassNavigationFlowSolverState.cs:15` | 核心流求解器（partial class，~2700 行） |\n| `MassNavigationConfig` | `src/Core/MassNavigation/Runtime/MassNavigationConfig.cs:13` | 配置根（20+ 必填字段） |\n| `MassNavigationConfigLoader` | `src/Core/MassNavigation/Runtime/MassNavigationConfig.cs:580` | 配置加载器 |\n| `MassNavigationFlowSolverConfig` | `src/Core/MassNavigation/Runtime/MassNavigationConfig.cs:773` | 求解器配置 |\n| `MassNavigationWorldConfig` | `src/Core/MassNavigation/Runtime/MassNavigationConfig.cs:916` | 世界配置 |\n| `MassNavigationCadenceConfig` | `src/Core/MassNavigation/Runtime/MassNavigationCadenceConfig.cs:6` | 节奏配置 |\n| `MassNavigationFlowTuning` | `src/Core/MassNavigation/Runtime/MassNavigationFlowTuning.cs` | Flow 调参 |\n| `MassNavigationFlowArrivalTuning` | `src/Core/MassNavigation/Runtime/MassNavigationFlowArrivalTuning.cs` | 到达调参 |\n| `MassNavigationFlowAvoidanceTuning` | `src/Core/MassNavigation/Runtime/MassNavigationFlowAvoidanceTuning.cs` | 避障调参 |\n| `MassNavigationAgentState` | `src/Core/MassNavigation/Runtime/MassNavigationAgentState.cs:7` | Agent 状态管理 |\n| `MassNavigationAgent` | `src/Core/MassNavigation/Runtime/MassNavigationComponents.cs:6` | Agent 标记组件 |\n| `MassNavigationAgentIndex` | `src/Core/MassNavigation/Runtime/MassNavigationComponents.c function buildNav() {
  let html = '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      html += '<a href="' + href + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
