const mdContent = "# Mod 体系（Modding）\n\n## 1. 功能概述\n\nLudots 的 Mod 体系是引擎 **\"一切皆 Mod\"** 设计哲学的核心实现。引擎本身的最小核心（`LudotsCoreMod`）以最低优先级（`priority: -1000`）加载，所有游戏功能——RTS 的单位调度、MOBA 的技能系统、ARPG 的装备与叙事——均以独立 `IMod` 模块存在。Mod 通过 `IModContext` 的正式扩展点与引擎交互，禁止直接访问 Core 内部状态。这种设计确保引擎的纯粹性，同时赋予 Mod 作者极大的扩展自由。\n\nMod 体系的核心设计特征包括：\n- **ALC 隔离**：`ModLoadContext` 继承 `AssemblyLoadContext`（`isCollectible: true`），支持进程共享、Host 共享、Mod 私有三层 Assembly 解析策略。\n- **依赖拓扑排序**：`DependencyResolver` 解析 `mod.json` 的 `dependencies` 字段，支持 SemVer 范围匹配（`^`、`~`、`>=`、`<=`、`>`、`<`、`=`）。\n- **VFS 统一资源访问**：`VirtualFileSystem` 以 `ModId:Path` 格式挂载和读取资源，Mod 可以覆写其他 Mod 的资源。\n- **Config 自动合并**：Mod 的 `assets/Configs/game.json` 自动参与 `ConfigPipeline` 合并，无需显式注册。\n- **正式扩展点**：`IModContext` 提供 6 个正式扩展点（`OnEvent`、`SystemFactoryRegistry`、`TriggerDecorators`、`FunctionRegistry`、`VFS`、`LogChannel`）。\n\n## 2. 目标用户\n\n- **Mod 作者**：需要理解 Mod 加载生命周期、扩展点 API、配置覆写机制和 VFS 资源访问。\n- **Gameplay 开发者**：需要将自定义玩法封装为独立 Mod，通过 `IModContext` 注册 System、Trigger、函数和组件 authoring。\n- **引擎开发者**：需要理解 `ModLoader` 的加载流程、`ModLoadContext` 的 ALC 隔离机制和 `DependencyResolver` 的拓扑排序算法。\n- **技术负责人**：需要理解 Mod 依赖管理、版本兼容性、冲突检测和内存隔离机制，以制定 Mod 生态规范。\n\n## 3. 使用场景\n\n- **创建新 Mod**：复制 `ExampleMod` 目录，修改 `mod.json`（name、version、priority、dependencies），编写 `*ModEntry.cs` 实现 `IMod`，在 `OnLoad` 中注册系统工厂和事件处理器。\n- **覆写引擎配置**：在 Mod 的 `assets/Configs/game.json` 中声明同名配置项，`ConfigPipeline` 自动将其与 Core 配置合并，Mod 的 priority 决定合并顺序。\n- **扩展 GAS 能力**：Mod 在 `OnLoad` 中调用 `context.OnEvent(GameEvents.GameStart, ...)` 注册能力定义到 `AbilityDefinitionRegistry`。\n- **跨 Mod 注入**：Mod A 通过 `TriggerDecoratorRegistry.RegisterAnchor(\"map_ready\", ...)` 给所有含 `map_ready` 锚点的 Trigger（可能由 Mod B 声明）注入命令。\n- **热卸载与重载**：通过 `ModLoader.UnloadAll()` 卸载所有 Mod（释放 ALC），然后重新加载，实现开发时的快速迭代。\n\n## 4. 核心能力\n\n### 4.1 IMod / IModContext 接口契约\n\n#### IMod\n\n```csharp\npublic interface IMod\n{\n    // Mod 加载时调用，完成所有注册\n    void OnLoad(IModContext context);\n\n    // Mod 卸载时调用，清理资源\n    void OnUnload();\n}\n```\n\n**典型实现模式**：\n\n```csharp\npublic sealed class MyModEntry : IMod\n{\n    public void OnLoad(IModContext context)\n    {\n        context.Log(\"[MyMod] Loaded\");\n\n        // 1. 注册 GameStart 事件\n        context.OnEvent(GameEvents.GameStart, async ctx => {\n            var registry = ctx.Get(CoreServiceKeys.AbilityDefinitionRegistry);\n            registry.Register(...);\n        });\n\n        // 2. 注册系统工厂\n        context.SystemFactoryRegistry.Register(\"MySystem\", SystemGroup.PostMovement, ctx =>\n            new MySystem(ctx.GetWorld()));\n\n        // 3. 注册 Trigger 修饰器\n        context.TriggerDecorators.RegisterAnchor(\"map_ready\", new MyCameraCommand());\n\n        // 4. 注册脚本函数\n        context.FunctionRegistry.Register(\"MyFunction\", (ctx, args) => { ... });\n\n        // 5. 注册组件 authoring\n        MyComponentAuthoring.Register(context.ModId);\n    }\n\n    public void OnUnload() { }\n}\n```\n\n#### IModContext\n\n```csharp\npublic interface IModContext\n{\n    string ModId { get; }\n    IVirtualFileSystem VFS { get; }\n    FunctionRegistry FunctionRegistry { get; }\n    SystemFactoryRegistry SystemFactoryRegistry { get; }\n    TriggerDecoratorRegistry TriggerDecorators { get; }\n    LogChannel LogChannel { get; }\n\n    // 注册事件处理器\n    void OnEvent(EventKey eventKey, Func<ScriptContext, Task> handler);\n\n    // 日志\n    void Log(string message);\n\n    // 获取资源\n    Stream GetResource(string path);\n}\n```\n\n⚠️ **注意**：`IModContext` 中确实没有 `TriggerManager` 属性（`mod_architecture.md` 中提到这一点是准确的）。Mod 通过 `OnEvent` 注册事件处理器，而不是直接访问 `TriggerManager`。\n\n⚠️ **注意**：`mod_architecture.md` 的 API 表格中缺少 `LogChannel` 属性。`IModContext` 实际有 `LogChannel` 属性（`IModContext.cs` 第 17 行）。\n\n**关键文件**：`src/Core/Modding/IMod.cs`、`src/Core/Modding/IModContext.cs`。\n\n### 4.2 ModLoader — 扫描、加载、卸载\n\n#### 整体流程\n\n```\n启动器/CLI 指定 mod 根目录\n    ↓\nModDiscovery.DiscoverModDirectories() 递归扫描，忽略 bin/obj\n    ↓\nModManifestJson.ParseStrict() 读取每个 mod.json（白名单校验、字段类型检查）\n    ↓\nDependencyResolver.Resolve() 拓扑排序 + Priority 降序 + CreationIndex 升序\n    ↓\nModLoader.LoadResolvedPlan() 校验计划一致性、版本匹配、依赖顺序\n    ↓\nVirtualFileSystem.Mount(modId, modDir) 挂载各 Mod 目录\n    ↓\nModLoadContext (collectible ALC) 加载主程序集\n    │   ├─ 优先复用 preloaded / shared assembly\n    │   ├─ processSharedAssemblyNames 中的程序集走 Default ALC\n    │   ├─ `Ludots.*` / `Arch` / `Arch.System` 视为 host shared\n    │   └─ 其余程序集通过 stream-load（避免锁定磁盘 DLL）\n    ↓\n扫描程序集中 IMod 实现类 → Activator.CreateInstance() → 调用 OnLoad(ModContext)\n    ↓\nMod 内部通过 IModContext 注册：\n    - OnEvent(GameEvents.GameStart / MapLoaded / MapResumed / MapUnloaded, handler)\n    - SystemFactoryRegistry.Register / RegisterPresentation\n    - TriggerDecorators.Register / RegisterAnchor\n    - FunctionRegistry.Register\n    ↓\n引擎运行期触发事件 → 已注册的 handler / SystemFactory 被激活\n```\n\n**关键文件**：`src/Core/Modding/ModLoader.cs`（599 行）。\n\n#### ModDiscovery\n\n`ModDiscovery` 递归扫描 Mod 目录，自动忽略 `bin/`、`obj/`、`node_modules/`：\n\n- 使用深度优先 + 栈（LIFO）递归扫描。\n- 子目录按字母序倒序入栈，同级目录的发现顺序是字母升序。\n\n**关键文件**：`src/Core/Modding/ModDiscovery.cs`。\n\n#### DependencyResolver\n\n`DependencyResolver` 解析 Mod 依赖并执行拓扑排序：\n\n- 支持 SemVer 范围匹配：`^1.2.3`、`~1.2.3`、`>=1.2.3`、`<=1.2.3`、`>1.2.3`、`<1.2.3`、`=1.2.3`、`*`。\n- 排序规则：拓扑排序 → Priority 降序 → CreationIndex 升序。\n- 循环依赖检测：抛出异常。\n\n**关键文件**：`src/Core/Modding/DependencyResolver.cs`。\n\n#### ModManifest / ModManifestJson\n\n`ModManifest` 是 `mod.json` 的强类型模型：\n\n```csharp\npublic class ModManifest\n{\n    public string Name { get; set; }\n    public string Version { get; set; }\n    public string Description { get; set; }\n    public string Main { get; set; }           // 入口 DLL 路径\n    public int Priority { get; set; }          // 加载优先级\n    public Dictionary<string, string> Dependencies { get; set; }\n    public string Author { get; set; }\n    public string Url { get; set; }\n    public string Changelog { get; set; }\n    public List<string> Tags { get; set; }\n    public List<string> ProcessSharedAssemblies { get; set; }  // 跨 Mod 共享程序集\n}\n```\n\n`ModManifestJson` 使用严格解析（白名单字段、类型校验），拒绝未知字段。\n\n⚠️ **注意**：`mod.json.main` 大部分指向 `bin/net8.0/*.dll`，但文档中提到这一点时部分 Mod 的实际情况需要确认。\n\n**关键文件**：`src/Core/Modding/ModManifest.cs`、`src/Core/Modding/ModManifestJson.cs`。\n\n### 4.3 ModLoadContext — ALC 隔离\n\n`ModLoadContext`（290 行）是 `AssemblyLoadContext` 的内部实现，提供三层 Assembly 解析策略：\n\n```csharp\ninternal sealed class ModLoadContext : AssemblyLoadContext\n{\n    // 三层解析策略（按优先级）：\n    // 1. ProcessShared：processSharedAssemblyNames 中的程序集 → Default ALC\n    // 2. HostShared：`Ludots.*` / `Arch` / `Arch.System` 等 host 共享程序集\n    // 3. Default：Default ALC 回退\n    // 4. SharedMod：其他 Mod 的共享程序集\n    // 5. Resolvers：自定义解析器\n\n    protected override Assembly Load(AssemblyName assemblyName) { ... }\n    protected override IntPtr LoadUnmanagedDll(string unmanagedDllName) { ... }\n\n    // stream-load 避免文件锁定\n    Assembly LoadManagedAssemblyFromStream(string path);\n}\n```\n\n**关键特征**：\n- `isCollectible: true`：支持 ALC 卸载，释放内存。\n- `stream-load`：对非 process-shared 程序集使用 `FileStream` + `LoadFromStream`（带 PDB），避免运行时锁定磁盘 DLL。\n- `RequiresProcessAssemblyLoad`：基于文件名判断程序集是否为 process-shared。\n\n⚠️ **注意**：`ModLoadContext` 的 `Load` 方法包含 7 层回退，解析逻辑非常深，调试困难。没有显式的解析日志记录，难以追踪 Assembly 加载失败原因。\n\n⚠️ **注意**：`RequiresProcessAssemblyLoad` 判断仅基于文件名，如果同一程序集在不同路径出现，行为可能不一致。\n\n**关键文件**：`src/Core/Modding/ModLoadContext.cs`（290 行）。\n\n### 4.4 VirtualFileSystem — VFS 资源访问\n\n`VirtualFileSystem` 以 `ModId:Path` 格式统一资源访问：\n\n```csharp\npublic interface IVirtualFileSystem\n{\n    void Mount(string modId, string rootPath);\n    void Unmount(string modId);\n    Stream GetStream(string uri);           // \"ModId:Path/To/Resource\"\n    bool TryResolveFullPath(string uri, out string fullPath);\n}\n```\n\n**安全约束**：\n- 严格前缀校验，防止目录逃逸（`../` 攻击）。\n- 返回只读 `FileStream`。\n\n**关键文件**：`src/Core/Modding/VirtualFileSystem.cs`、`src/Core/Modding/IVirtualFileSystem.cs`。\n\n### 4.5 正式扩展点\n\nMod 通过 `IModContext` 访问以下 6 个正式扩展点：\n\n| 扩展点 | 类型 | 注册方式 | 说明 |\n|--------|------|---------|------|\n| `SystemFactoryRegistry` | Registry | `IModContext.SystemFactoryRegistry.Register` | 按 `SystemGroup` 注册 System 工厂 |\n| `TriggerDecoratorRegistry` | Registry | `IModContext.TriggerDecorators.Register` / `RegisterAnchor` | 对 Trigger 进行 AOP 装饰 |\n| `FunctionRegistry` | Registry | `IModContext.FunctionRegistry.Register` | 注册全局可调用函数 |\n| `OnEvent` | 回调 | `IModContext.OnEvent(EventKey, handler)` | 注册全局/Map 事件处理器 |\n| `VFS` | 服务 | `IModContext.VFS` | 资源挂载和访问 |\n| `LogChannel` | 服务 | `IModContext.LogChannel` | 带 Mod 前缀的诊断日志 |\n\n**Config 自动合并**：Mod 的 `Configs/` 目录无需显式注册，按约定自动合并到 `ConfigPipeline`。\n\n### 4.6 Mod 加载生命周期\n\n```\n1. 发现阶段\n   ModDiscovery.DiscoverModDirectories() → 递归扫描，忽略 bin/obj\n   → 返回 DiscoveredMod 列表\n\n2. 解析阶段\n   ModManifestJson.ParseStrict() → 读取每个 mod.json\n   → 白名单校验、字段类型检查\n\n3. 排序阶段\n   DependencyResolver.Resolve(modNodes) → 拓扑排序\n   → 检查循环依赖、SemVer 范围匹配\n   → 输出 orderedModIds\n\n4. 加载阶段\n   ModLoader.LoadResolvedPlan(orderedPlan) → 校验计划一致性\n   → 对每个 Mod：\n      a. VirtualFileSystem.Mount(modId, modDir)\n      b. 配置 processSharedAssemblies\n      c. ModLoadContext.LoadMainAssembly(path)\n      d. 扫描程序集中的 IMod 实现类\n      e. Activator.CreateInstance<IMod>()\n      f. mod.OnLoad(ModContext)\n\n5. 运行阶段\n   引擎触发事件 → 已注册的 handler / SystemFactory 被激活\n\n6. 卸载阶段\n   ModLoader.UnloadAll() → 调用每个 mod.OnUnload()\n   → 卸载 ModLoadContext（ALC）\n   → VirtualFileSystem.Unmount(modId)\n```\n\n⚠️ **注意**：`GameEvents.ModLoaded` 事件当前未实现（`ModLoader.cs` 第 419 行注释 \"will be implemented in future TriggerManager\"）。\n\n⚠️ **注意**：几乎所有 Mod Entry 的 `OnUnload()` 为空实现。当前卸载链只调用 `OnUnload()` 但未要求 Mod 清理自身注册（如 `SystemFactoryRegistry._activated` 和 `TriggerDecoratorRegistry` 的注册不会被清理）。`ModLoader.ResetLoadedState()` 会卸载 ALC，但全局注册表状态可能泄漏。\n\n## 5. 关键类清单（带文件路径）\n\n| 类名 | 文件路径 | 说明 | 行数 |\n|------|----------|------|------|\n| `IMod` | `src/Core/Modding/IMod.cs` | Mod 入口接口契约 | — |\n| `IModContext` | `src/Core/Modding/IModContext.cs` | Mod 扩展 API | — |\n| `ModContext` | `src/Core/Modding/ModContext.cs` | `IModContext` 实现 | — |\n| `ModLoader` | `src/Core/Modding/ModLoader.cs` | Mod 扫描、加载、卸载 | 599 |\n| `ModLoadContext` | `src/Core/Modding/ModLoadContext.cs` | collectible ALC | 290 |\n| `ModManifest` | `src/Core/Modding/ModManifest.cs` | `mod.json` 强类型模型 | — |\n| `ModManifestJson` | `src/Core/Modding/ModManifestJson.cs` | 严格解析 `mod.json` | — |\n| `DependencyResolver` | `src/Core/Modding/DependencyResolver.cs` | 拓扑排序 + SemVer | — |\n| `ModDiscovery` | `src/Core/Modding/ModDiscovery.cs` | 递归扫描 Mod 目录 | — |\n| `VirtualFileSystem` | `src/Core/Modding/VirtualFileSystem.cs` | `ModId:Path` 挂载与读取 | — |\n| `IVirtualFileSystem` | `src/Core/Modding/IVirtualFileSystem.cs` | VFS 抽象 | — |\n| `SystemFactoryRegistry` | `src/Core/Engine/SystemFactoryRegistry.cs` | System 工厂注册 | — |\n| `TriggerDecoratorRegistry` | `src/Core/Scripting/TriggerDecoratorRegistry.cs` | Trigger 修饰器 | — |\n| `FunctionRegistry` | `src/Core/Scripting/FunctionRegistry.cs` | 脚本函数 | — |\n| `RegistrationConflictReport` | `src/Core/Modding/RegistrationConflictReport.cs` | 注册冲突报告 | — |\n\n## 6. 输入 / 输出\n\n| 输入 | 来源 | 处理路径 |\n|------|------|---------|\n| `mod.json` | 文件系统 | `ModDiscovery` → `ModManifestJson.ParseStrict` → `DependencyResolver` |\n| 程序集 DLL | 文件系统 | `ModLoadContext.LoadMainAssembly` → `stream-load` |\n| `game.json` | VFS（`ModId:Path`） | `ConfigPipeline` 自动合并 |\n| 资源文件 | VFS（`ModId:Path`） | `VirtualFileSystem.GetStream` |\n| Launcher Graph | CLI | `ResolvedModLoadPlan` → `ModLoader.LoadResolvedPlan` |\n\n| 输出 | 目标 | 生成路径 |\n|------|------|---------|\n| 挂载的 VFS | 引擎运行时 | `VirtualFileSystem.Mount(modId, modDir)` |\n| 注册的 System | `GameEngine` | `IModContext.SystemFactoryRegistry.Register` |\n| 注册的 Trigger | `TriggerManager` | `IModContext.OnEvent` + `TriggerDecoratorRegistry` |\n| 注册的函数 | `FunctionRegistry` | `IModContext.FunctionRegistry.Register` |\n| 冲突报告 | 日志 | `RegistrationConflictReport` |\n| 加载日志 | 控制台 | `ILogBackend` / `LogChannel` |\n\n## 7. 依赖关系\n\n| 依赖项 | 说明 |\n|--------|------|\n| `AssemblyLoadContext` | .NET 运行时提供的 ALC 基础设施 |\n| `System.IO.FileSystem` | VFS 的物理文件读取 |\n| `System.Text.Json` | `mod.json` 与 `ModManifestJson` 的解析 |\n| `ConfigPipeline` | Mod 配置自动合并 |\n| `GameEngine` | Mod 注册 System 的目标 |\n| `TriggerManager` | Mod 注册事件处理器的目标 |\n| `StringIntRegistry` | 各子系统的 ID 映射 |\n\n## 8. 非功能需求（性能约束）\n\n| 约束项 | 目标 | 实现 |\n|--------|------|------|\n| Mod 加载时间 | < 5 秒（10 个 Mod） | `stream-load` 避免文件锁定，`DependencyResolver` 拓扑排序 |\n| 内存隔离 | 支持 collectible ALC 卸载 | `ModLoadContext`（`isCollectible: true`） |\n| 文件锁避免 | 运行时 DLL 可覆盖 | `LoadManagedAssemblyFromStream` 使用 `FileStream` + `LoadFromStream` |\n| 依赖冲突检测 | 启动时 fail-fast | `DependencyResolver` 的循环检测与 SemVer 不匹配检测 |\n| 版本兼容性 | SemVer 范围匹配 | `^`、`~`、`>=`、`<=`、`>`、`<`、`=` |\n| 资源安全 | 防止目录逃逸 | `VirtualFileSystem` 严格前缀校验 |\n| 卸载完整性 | 释放所有资源 | `UnloadAll` → `OnUnload` → ALC 卸载 → VFS 卸载 |\n\n---\n\n> **版本说明**：本章节基于 Ludots `main` 分支（2026-07-02 扫描）。\n> - ⚠️ `GameEvents.ModLoaded` 事件未实现。\n> - ⚠️ `OnUnload` 链不完整，全局注册表状态可能泄漏。\n> - ⚠️ `ModLoadContext` 的 7 层解析链调试困难。\n> - ⚠️ `RequiresProcessAssemblyLoad` 基于文件名判断，可能不一致。\n> - ⚠️ `mod_architecture.md` 的 VFS 路径描述不准确（使用了 `mods/<modId>/` 前缀而非 `ModId:` 格式）。\n> - ⚠️ `mod_architecture.md` 的 API 表格缺少 `LogChannel` 属性。\n> - ⚠️ `mod_architecture.md` 未提及 `processSharedAssemblies` 字段和 `stream-load` 机制。";

function buildNav() {
  let html = '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      html += '<a href="' + href + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
