const mdContent = "# 功能架构（Feature Architecture）\n\n## 1. 功能概述\n\nLudots 的功能架构遵循**六边形架构**（Hexagonal Architecture）与**分层职责隔离**原则，将引擎能力划分为 **Core（引擎）→ Gameplay（业务）→ Presentation（表现）→ Adapter（平台）** 四个层级。每一层只向下依赖，禁止跨层调用或反向依赖。所有游戏功能——无论引擎内置还是第三方 Mod——均通过 `IModContext` 的正式扩展点注册，引擎本身（`LudotsCoreMod`）也以 Mod 形式加载，确保架构的对称性与一致性。\n\n功能架构的核心设计约束包括：\n- **SystemGroup Phase 固化**：11 个明确的 phase 顺序，任何新增 System 必须归属其中之一，禁止在 phase 之间插入自定义阶段。\n- **Pacemaker 仿真预算**：`IPacemaker` 控制每帧 simulation 循环的时间预算，确保逻辑帧不会耗尽宿主线程，保障视觉帧率稳定。\n- **Config 合并管线**：Core 与 Mod 的配置按优先级自动合并，支持对象递归合并、数组按 ID 合并、数组追加等多种策略。\n- **ALC 隔离的 Mod 加载**：每个 Mod 的程序集通过 `ModLoadContext`（collectible `AssemblyLoadContext`）加载，支持热卸载与重载。\n- **VFS 统一资源访问**：所有资源通过 `VirtualFileSystem` 以 `ModId:Path/To/Resource` 的 URI 访问，Mod 可覆写其他 Mod 的资源。\n\n## 2. 目标用户\n\n- **架构师与技术负责人**：需要理解引擎的整体模块划分、依赖关系与扩展点，以制定团队开发规范与 Mod 接口契约。\n- **Mod 作者**：需要了解各能力域的职责边界，以便选择正确的扩展点注册自定义功能。\n- **新加入开发者**：需要一张总览图快速定位自己负责模块在整体架构中的位置。\n\n## 3. 使用场景\n\n- **架构评审**：技术负责人使用本章节作为架构评审的基准文档，验证新增模块是否遵循分层原则。\n- **Mod 开发规划**：Mod 作者在规划新 Mod 时，查阅本章节确定应使用哪些扩展点、依赖哪些子系统。\n- ** onboarding 培训**：新开发者通过本章节快速理解 Ludots 的 10 大能力域及其交互关系。\n\n## 4. 十大能力域总览\n\n| 能力域 | 核心子系统 | 关键文件路径 | 职责简述 |\n|--------|-----------|------------|---------|\n| **1. ECS 引擎核心** | `GameEngine`, `WorldRuntime`, `SystemFactoryRegistry`, `Time`, `ClockFoundation` | `src/Core/Engine/GameEngine.cs`, `src/Core/Engine/WorldRuntime.cs`, `src/Core/Engine/SystemFactoryRegistry.cs`, `src/Core/Engine/Time.cs`, `src/Core/Engine/ClockFoundation.cs` | 游戏主循环、System 分组执行、时间流管理、仿真预算控制 |\n| **2. 配置与脚本** | `ConfigPipeline`, `ConfigMerger`, `ConfigCatalog`, `TriggerManager`, `FunctionRegistry`, `GraphExecutor` | `src/Core/Config/ConfigPipeline.cs`, `src/Core/Config/ConfigMerger.cs`, `src/Core/Scripting/TriggerManager.cs`, `src/Core/Scripting/FunctionRegistry.cs`, `src/Core/GraphRuntime/GraphExecutor.cs` | 配置合并、事件触发、脚本函数、图 VM 执行 |\n| **3. Mod 加载与管理** | `ModLoader`, `ModLoadContext`, `DependencyResolver`, `VirtualFileSystem` | `src/Core/Modding/ModLoader.cs`, `src/Core/Modding/ModLoadContext.cs`, `src/Core/Modding/DependencyResolver.cs`, `src/Core/Modding/VirtualFileSystem.cs` | Mod 扫描、依赖拓扑排序、ALC 隔离、VFS 挂载 |\n| **4. 存档与恢复** | `WorldSnapshotService`, `LudotsBinaryWorldSerializer`, `SaveContainerCodec`, `SaveParticipantRegistry` | `src/Core/Persistence/WorldSnapshotService.cs`, `src/Core/Persistence/LudotsBinaryWorldSerializer.cs`, `src/Core/Persistence/SaveContainerCodec.cs`, `src/Core/Persistence/SaveParticipantRegistry.cs` | 世界快照捕获、二进制序列化、.ldsave 容器、非 ECS 域存档 |\n| **5. Gameplay Ability System (GAS)** | `AbilityDefinitionRegistry`, `EffectPhaseExecutor`, `BuiltinHandlerRegistry`, `AttributeBindingSystem`, `GameplayEventBus` | `src/Core/Gameplay/GAS/AbilityDefinitionRegistry.cs`, `src/Core/Gameplay/GAS/EffectPhaseExecutor.cs`, `src/Core/Gameplay/GAS/BuiltinHandlerRegistry.cs`, `src/Core/Gameplay/GAS/AttributeBindingSystem.cs` | 能力定义、效果阶段执行、内置 Handler、属性计算、事件总线 |\n| **6. 实体生成与空间** | `RuntimeEntitySpawnSystem`, `TemplateEntityBatchSpawner`, `EntityBuilder`, `SpatialQueryService`, `ChunkedGridSpatialPartitionWorld` | `src/Core/Gameplay/Spawning/RuntimeEntitySpawnSystem.cs`, `src/Core/Config/TemplateEntityBatchSpawner.cs`, `src/Core/Config/EntityBuilder.cs`, `src/Core/Spatial/SpatialQueryService.cs`, `src/Core/Spatial/ChunkedGridSpatialPartitionWorld.cs` | 批量实体生成、模板构建、空间查询、空间分区 |\n| **7. 输入与导航** | `InputRequestQueue`, `SelectionRuntime`, `MassNavigationRuntime`, `NavQueryServiceRegistry`, `PathStore`, `AutoPathService` | `src/Core/Input/InputRequestQueue.cs`, `src/Core/Input/SelectionRuntime.cs`, `src/Core/MassNavigation/MassNavigationRuntime.cs`, `src/Core/Navigation/NavQueryServiceRegistry.cs`, `src/Core/Navigation/PathStore.cs` | 输入收集、选择系统、MassNavigation 寻路、多策略路径 |\n| **8. 物品与交易** | `InventoryRuntimeService`, `ItemModel`, `ExchangeRuntime`, `ExchangeOperationRegistry` | `src/Core/Gameplay/Items/InventoryRuntimeService.cs`, `src/Core/Gameplay/Items/ItemModel.cs`, `src/Core/Gameplay/Exchange/ExchangeRuntime.cs`, `src/Core/Gameplay/Exchange/ExchangeOperationRegistry.cs` | 库存管理、物品定义、交易执行、回滚支持 |\n| **9. 关系与叙事** | `RelationshipRuntime`, `TeamManager`, `NarrativeDirector`, `ProgressionDomain` | `src/Core/Gameplay/Relationships/RelationshipRuntime.cs`, `src/Core/Gameplay/Teams/TeamManager.cs`, `src/Core/Gameplay/Narrative/NarrativeDirector.cs`, `src/Core/Gameplay/Progression/ProgressionDomain.cs` | 关系图、阵营管理、叙事导演、进度系统 |\n| **10. 平台适配与渲染** | `RaylibHostLoop`, `RaylibPrimitiveRenderer`, `WebHostLoop`, `WebTransportLayer`, `BinaryFrameEncoder`, `FrameProtocol` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibHostLoop.cs`, `src/Client/Ludots.Client.Raylib/Rendering/RaylibPrimitiveRenderer.cs`, `src/Adapters/Web/Ludots.Adapter.Web/WebHostLoop.cs`, `src/Adapters/Web/Ludots.Adapter.Web/Streaming/WebTransportLayer.cs` | Raylib 桌面渲染、Web 串流、二进制帧协议、Delta 压缩 |\n\n## 5. 模块依赖图\n\n### 5.1 文本层级描述\n\n```\nAdapter 层（平台 specific）\n├── Raylib 桌面路径\n│   ├── Ludots.App.Raylib/Program.cs\n│   ├── RaylibGameHost\n│   ├── RaylibHostComposer ──► GameBootstrapper\n│   ├── RaylibHostLoop ──► engine.Tick(dt) + 3D/2D 渲染\n│   └── RaylibPrimitiveRenderer / RaylibTerrainRenderer / RaylibOverlayCompositor\n│\n├── Web 串流路径\n│   ├── Ludots.App.Web/Program.cs\n│   ├── WebGameHost\n│   ├── WebHostComposer ──► GameBootstrapper\n│   ├── WebHostLoop ──► engine.Tick(dt) + PresentationExtractor\n│   ├── BinaryFrameEncoder / DeltaCompressor / FrameProtocol\n│   └── WebTransportLayer ──► WebSocket 广播\n│\n└── ⚠️ UE5 路径（空壳，待实现）\n        src/Adapters/UE5/ 无任何 .cs 源码\n\nPresentation 层（表现抽象）\n├── Performer 系统\n│   ├── PerformerEntityRuntime / PerformerDefinitionRegistry\n│   ├── PerformerRuntimeSystem / PerformerBehaviorSystem / PerformerRuleSystem\n│   └── PresentationEntityLifecycle\n├── UI 系统\n│   ├── UIRoot / IUiSystem / SkiaUiRenderer / MarkupUiSystem\n│   └── DesktopUiSystem / WebUiRuntimeBridge\n├── 相机系统\n│   ├── CameraRuntimeSystem / CameraCullingSystem\n│   └── CameraRenderState3D / ICameraAdapter\n├── 渲染缓冲\n│   ├── PrimitiveDrawBuffer / InstancedBatchRequestBuffer / GroundOverlayBuffer\n│   ├── WorldHudBatchBuffer / ScreenHudBatchBuffer / DebugDrawCommandBuffer\n│   └── PresentationEventStream / GlobalPresentationEventBuffer / GasPresentationEventBuffer\n└── 其他表现\n    ├── MinimapRenderSystem / VisionSystem / FogField\n    └── TweenTrack / TweenEasing\n\nGameplay 层（业务逻辑）\n├── GAS\n│   ├── AbilityDefinitionRegistry / AbilityPresentationConfig / AbilityIndicatorConfig\n│   ├── EffectPhaseExecutor / EffectRequestQueue / EffectLifetimeSystem\n│   ├── BuiltinHandlerRegistry (64 槽) / BuiltinHandlers (11 个内置)\n│   ├── AttributeBindingSystem / AttributeCalculationSystem / AttributeMutationOps\n│   └── GameplayEventBus / GameplayCueSystem / CueEventBuffer\n├── 实体生成\n│   ├── RuntimeEntitySpawnSystem / RuntimeEntitySpawnQueue / RuntimeEntitySpawnReceiptQueue\n│   ├── TemplateEntityBatchSpawner / EntityBuilder / EntityTemplate\n│   └── EntityTemplateKeyRegistry\n├── 物品与交易\n│   ├── InventoryRuntimeService / ItemModel / ItemConfigLoader\n│   ├── ExchangeRuntime / ExchangeOperationRegistry / ExchangeConfigLoader\n│   └── ItemShapeRegistry / ItemLayoutRegistry / ItemDefinitionRegistry\n├── 关系与团队\n│   ├── RelationshipRuntime / RelationshipProcessingSystem / RelationshipChangeBuffer\n│   ├── RelationshipTypeRegistry / MetricRegistry / FlagRegistry / BandRegistry / ReasonRegistry\n│   └── TeamManager / TeamEntityLookup / PlayerEntityLookup\n├── 叙事与进度\n│   ├── NarrativeDirector / NarrativeRuntimeSystem / NarrativeValueStore\n│   ├── ProgressionDomain / ProgressionRequirementEvaluator / ProgressionDefinitionRegistry\n│   └── NarrativeConfigLoader / NarrativeDefinitions\n├── 空间与导航\n│   ├── SpatialQueryService / ChunkedGridSpatialPartitionWorld / HexGridAOI\n│   ├── MassNavigationRuntime / NavQueryServiceRegistry / NavTileStore\n│   ├── PathStore / AutoPathService / NodeGraphPathServiceAdapter\n│   └── MapManager / MapSession / MapSessionManager / MapConfig\n├── 输入与交互\n│   ├── InputRequestQueue / InputResponseBuffer / InputCollectionSystem\n│   ├── SelectionRuntime / SelectionRequestQueue / SelectionRuleRegistry\n│   ├── InteractionActionBindings / OrderQueue / OrderRequestQueue\n│   └── OrderProcessingSystem / ResponseChainSystem / ResponseChainTelemetryBuffer\n└── 物理\n    ├── PhysicsWorld / Physics2DController / ForceInput2D\n    └── ⚠️ 命名空间混乱：Physics/ + Physics2D/ + Ludots.Physics2D/ + Ludots.Physics.Broadphase/\n\nCore 层（引擎基础设施）\n├── ECS 运行时\n│   ├── GameEngine (partial, 2967 行) / WorldRuntime / GameContext\n│   ├── SystemFactoryRegistry / Time / GameTask\n│   ├── GameSynchronizationContext / ClockFoundation\n│   └── GameSessionSystem / MapLoader\n├── 配置管线\n│   ├── ConfigPipeline / ConfigMerger / ConfigCatalog / ConfigCatalogLoader\n│   ├── GameConfig / MapConfig / DataRegistry<T>\n│   ├── ComponentRegistry (60+ 组件) / EntityBuilder / EntityTemplate\n│   └── StrictJsonOptions / JsonMerger\n├── 脚本与事件\n│   ├── TriggerManager / Trigger / TriggerBuilder / TriggerDecoratorRegistry\n│   ├── FunctionRegistry / ScriptContext / CoreServiceKeys\n│   └── GameEvents / EventKey / ServiceKey<T>\n├── Mod 加载\n│   ├── ModLoader / ModLoadContext / ModManifest / ModManifestJson\n│   ├── DependencyResolver / ModDiscovery\n│   └── VirtualFileSystem / IVirtualFileSystem\n├── 存档\n│   ├── WorldSnapshotService / WorldRestoreService / SaveContextFactory\n│   ├── LudotsBinaryWorldSerializer / SaveContainerCodec / SaveSlotStore\n│   └── ISaveParticipant / SaveParticipantRegistry / CoreSaveParticipants\n├── 图运行时\n│   ├── GraphExecutor / GraphProgramRegistry / GraphInstruction / GraphProgramPackage\n│   ├── GraphCompiler / GraphValidator / GraphConfig / GraphNodeConfig\n│   ├── GasGraphRuntimeApi / GasGraphOpHandlerTable / GasGraphSymbolResolver\n│   └── GraphIdRegistry / GraphVmLimits / GraphDiagnostics\n├── 注册表基础设施\n│   ├── StringIntRegistry / RegistryMapping / RegistryMappingSnapshot\n│   └── EntityKeyedSoaTable / EntityKeyedSoaKey / OwnershipResolver / ScopeKey\n└── 其他基础设施\n    ├── LayerRegistry / LayerMask / EntityLayerAuthoring\n    ├── TransportNetworkAsset / TransportNetworkBaker / TransportNetworkBakedAsset\n    └── VisionResolver / FogFieldStore / FogRules\n```\n\n### 5.2 Mermaid 依赖图\n\n```mermaid\ngraph TD\n    subgraph Adapter[\"Adapter 层（平台）\"]\n        RAY[RaylibHostLoop]\n        WEB[WebHostLoop]\n        UE5[\"⚠️ UE5（空壳）\"]\n    end\n\n    subgraph Presentation[\"Presentation 层（表现）\"]\n        PERF[Performer系统]\n        UI[UI系统]\n        CAM[相机系统]\n        BUF[渲染Buffer]\n    end\n\n    subgraph Gameplay[\"Gameplay 层（业务）\"]\n        GAS[GAS管线]\n        SPAWN[实体生成]\n        ITEM[物品与交易]\n        REL[关系与团队]\n        NAR[叙事与进度]\n        NAV[空间与导航]\n        INP[输入与交互]\n    end\n\n    subgraph Core[\"Core 层（引擎）\"]\n        ENGINE[GameEngine / WorldRuntime]\n        CONFIG[ConfigPipeline]\n        SCRIPT[TriggerManager / FunctionRegistry]\n        MOD[ModLoader / ModLoadContext]\n        SAVE[存档系统]\n        GRAPH[GraphRuntime VM]\n        REG[StringIntRegistry / EntityKeyedSoaTable]\n    end\n\n    RAY --> ENGINE\n    WEB --> ENGINE\n    UE5 -.->|待实现| ENGINE\n\n    PERF --> ENGINE\n    UI --> ENGINE\n    CAM --> ENGINE\n    BUF --> ENGINE\n\n    GAS --> ENGINE\n    GAS --> CONFIG\n    SPAWN --> ENGINE\n    SPAWN --> CONFIG\n    ITEM --> ENGINE\n    ITEM --> CONFIG\n    REL --> ENGINE\n    NAR --> ENGINE\n    NAR --> SAVE\n    NAV --> ENGINE\n    INP --> ENGINE\n\n    CONFIG --> MOD\n    SCRIPT --> MOD\n    GRAPH --> GAS\n    SAVE --> ENGINE\n    REG --> ENGINE\n    REG --> GAS\n    REG --> REL\n```\n\n## 6. 能力分层详述\n\n### 6.1 Core 层（引擎基础设施）\n\nCore 层是 Ludots 的最小不可约引擎，包含 ECS 运行时、配置管线、脚本事件、Mod 加载、存档、图 VM 与注册表基础设施。Core 层本身通过 `LudotsCoreMod` 以 Mod 形式加载，体现 \"一切皆 Mod\" 的对称性。\n\n**核心约束**：\n- `GameEngine` 是 `partial class`（2967 行），主逻辑集中在 `GameEngine.cs`，部分生命周期已拆分到 `GameEngine.MapLoadLifecycle.cs` 和 `GameEngine.SaveRestore.cs`。\n- `SystemGroup` 枚举定义 11 个 phase，顺序不可变更：\n  1. `SchemaUpdate` — 运行时 schema 注册（属性/图等）\n  2. `InputCollection` — 输入收集\n  3. `PostMovement` — 移动后处理\n  4. `AbilityActivation` — 能力激活\n  5. `EffectProcessing` — 效果处理\n  6. `RuntimeEntityBinding` — 运行时实体绑定\n  7. `AttributeCalculation` — 属性计算\n  8. `DeferredTriggerCollection` — 延迟触发器收集\n  9. `Cleanup` — 清理\n  10. `EventDispatch` — 事件分发\n  11. `ClearPresentationFlags` — 清除表现标记\n- `InitializeCoreSystems` 方法在 `GameEngine.InitializeWithConfigPipeline` 中调用，构建所有 GAS、Presentation、Spatial 系统。\n\n### 6.2 Gameplay 层（业务逻辑）\n\nGameplay 层包含所有游戏特定的逻辑系统，通过 `SystemFactoryRegistry` 注册到 Core 的 `SystemGroup` phase 中。所有 Gameplay 系统均存在于独立 Mod 中（如 `RtsDemoMod`、`MobaDemoMod`），引擎本身不提供任何游戏玩法。\n\n**核心约束**：\n- Gameplay System 必须在 `IMod.OnLoad` 中通过 `context.SystemFactoryRegistry.Register(name, SystemGroup, factory)` 注册。\n- Gameplay System 禁止直接访问 `GameEngine` 的内部状态，应通过 `ScriptContext` + `CoreServiceKeys` 读取服务。\n- `BuiltinHandlerRegistry` 仅提供 64 个固定槽位，当前已注册 11 个 handler（`ApplyModifiers`、`ApplyForce`、`SpatialQuery`、`DispatchPayload`、`ReResolveAndDispatch`、`CreateProjectile`、`CreateUnit`、`ApplyDisplacement`、`ApplyRelation`、`ExecuteExchange`、`CompleteProgression`）。\n\n### 6.3 Presentation 层（视觉表现）\n\nPresentation 层负责将 ECS 世界的状态转换为视觉输出。它在 `GameEngine.Update` 循环中运行（独立于 `Tick` 的 simulation 循环），不受仿真预算限制。\n\n**核心约束**：\n- Presentation System 通过 `SystemFactoryRegistry.RegisterPresentation(name, factory)` 注册，不绑定到 `SystemGroup`。\n- 每帧开始时，所有表现 Buffer（`PrimitiveDrawBuffer`、`WorldHudBatchBuffer`、`ScreenHudBatchBuffer`、`DebugDrawCommandBuffer`、`GroundOverlayBuffer`、`RoadSplineBuffer`）被清空。\n- `PresentationEntityLifecycle.RequestDestroy` 要求实体必须携带 `PresentationStableId` 标签，否则抛出异常（对纯逻辑实体过于严格）。\n- `PerformerEntityRuntime` 是表现层与 ECS 实体的绑定桥梁，通过 `PresentationStableIdAllocator` 分配稳定 ID。\n\n### 6.4 Adapter 层（平台适配）\n\nAdapter 层将 Core 的抽象端口（`IInputBackend`、`ICameraAdapter`、`IViewController`）嫁接到具体平台（Raylib、Web）。Adapter 层不是 Mod，不走 `IMod.OnLoad`，而是由 Launcher CLI 在启动时选择（`--adapter raylib` / `--adapter web`）。\n\n**核心约束**：\n- `RaylibHostComposer` 和 `WebHostComposer` 均通过 `GameBootstrapper.InitializeFromBaseDirectory` 启动引擎，然后注入平台特定的服务（`IInputBackend`、`IViewController`、`ILogBackend` 等）。\n- 当前支持两条完整路径：Raylib（桌面 3D 渲染 + Skia UI）和 Web（WebSocket 串流 + Three.js 瘦客户端）。\n- ⚠️ UE5 Adapter 为空壳：`src/Adapters/UE5/` 目录下无任何 `.cs` 源码文件，仅有构建残留。\n\n## 7. 输入 / 输出\n\n| 输入 | 来源 | 处理路径 |\n|------|------|---------|\n| `mod.json` + 程序集 | 文件系统 | `ModDiscovery` → `DependencyResolver` → `ModLoader.LoadResolvedPlan` → `ModLoadContext` → `IMod.OnLoad` |\n| `game.json` + 配置片段 | VFS（`ModId:Path`） | `ConfigPipeline.CollectFragments` → `DeepMerge` / `MergeArrayById` → `JsonSerializer.Deserialize<GameConfig>` |\n| 玩家输入 | `RaylibInputBackend` / `WebInputBackend` | `InputRequestQueue` → `InputCollection` phase → `AbilityActivation` / `OrderProcessing` |\n| 网络输入（Web） | WebSocket `InputProtocol`（33 字节） | `WebInputBackend` → `WireInputState` → `QueuedFrameState` → `InputRequestQueue` |\n\n| 输出 | 目标 | 生成路径 |\n|------|------|---------|\n| 表现 Buffer | 渲染器 | `Presentation` systems → `Update` 循环中生成各 Buffer |\n| 二进制帧（Web） | Three.js 瘦客户端 | `PresentationExtractor.CaptureFrame` → `BinaryFrameEncoder` → `WebTransportLayer.BroadcastFrame` |\n| `.ldsave` 存档 | 文件系统 | `WorldSnapshotService.Capture` → `SaveContainerCodec.Encode` → `SaveSlotStore.Write` |\n\n## 8. 依赖关系\n\n| 依赖项 | 被谁依赖 | 说明 |\n|--------|---------|------|\n| `Arch` / `Arch.System` | Core 层全部 | ECS 运行时 |\n| `Arch.Persistence` | `LudotsBinaryWorldSerializer` | 二进制世界序列化 |\n| `JobScheduler` | `GameEngine.InitializeWorld` | 并行 System 执行 |\n| `Raylib-cs` | `RaylibHostLoop`, `RaylibPrimitiveRenderer` | 桌面图形/输入 |\n| `SkiaSharp` | `RaylibOverlayCompositor`, `SkiaUiRenderer` | 2D 矢量 UI |\n| `ASP.NET Core` | `WebHostLoop`, `WebTransportLayer` | WebSocket 服务器 |\n| `Three.js` | Web 客户端 | 浏览器 3D 渲染 |\n\n## 9. 非功能需求（性能约束）\n\n| 约束项 | 目标 | 机制 |\n|--------|------|------|\n| SystemGroup 顺序不可变更 | 严格 11 phase | 枚举定义在 `GameEngine.cs` 第 97-134 行，新增 System 必须归属其中之一 |\n| 仿真预算 | `SimulationBudgetMsPerFrame` + `SimulationMaxSlicesPerLogicFrame` | `IPacemaker` 控制 simulation 循环时间上限 |\n| 零 GC 触发 | 固定 64 槽 | `BuiltinHandlerRegistry` 通过索引直接访问 |\n| 批量实体生成 | 10,000+ 实体/帧 | `TemplateEntityBatchSpawner` 直接通过 Arch chunk span 填充 |\n| 二进制帧零分配 | `Span<byte>` 编码 | `BinaryFrameEncoder` 连续字节编码，无每帧分配 |\n| 图 VM 防无限循环 | 4096 指令上限 | `GraphVmLimits.MaxInstructionsPerExecution` |\n| Mod 内存隔离 | collectible ALC | `ModLoadContext`（`isCollectible: true`） |\n| 存档引用完整性 | 验证 entity ref | `SaveEntityReferenceValidator` 在序列化时校验 |\n\n---\n\n> **版本说明**：本章节基于 Ludots `main` 分支（2026-07-02 扫描）。⚠️ 标注为「文档过承诺/待实现」的能力，在当前代码中不存在或仅有空壳。";

function buildNav() {
  let html = '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      html += '<a href="' + href + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
