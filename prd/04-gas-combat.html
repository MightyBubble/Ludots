const mdContent = "# Gameplay Ability System（GAS）PRD\n\n## 1. 功能概述\n\nGameplay Ability System（GAS）是 Ludots 引擎的核心 gameplay 语义层，负责能力（Ability）、效果（Effect）、属性（Attribute）、标签（Tag）及表现事件（Cue）的完整生命周期管理。GAS 基于 **Arch ECS** 构建，采用 **0-GC unsafe struct** 设计，通过密集的 Registry + System 模式将配置期数据编译为运行时数组/位图，以支持大规模实体仿真。\n\nGAS 不是一个单一系统，而是一个**分层管线**：输入 → 能力激活 → EffectRequest → 效果处理（含 Proposal/ResponseChain/Resolve/Apply） → 属性计算 → Sink 落地 → 延迟触发收束。整个管线在固定帧或回合驱动下按 `SystemGroup` 严格顺序执行，不跨层直接写状态。\n\n---\n\n## 2. 目标用户\n\n| 用户类型 | 使用方式 |\n|----------|----------|\n| **Gameplay 程序员** | 编写自定义 `BuiltinHandlerFn`、扩展 `AttributeSink`、调试 Effect Pipeline |\n| **Mod 开发者** | 通过 JSON 配置定义 Ability、EffectTemplate、TagRule，注册到各 Registry |\n| **技术策划** | 配置能力时间线（`AbilityExecSpec`）、EffectModifier、Tag 联动规则 |\n| **UI/表现程序员** | 消费 `GameplayCueSystem` 输出的 `CueDescriptor`，驱动视觉/音频反馈 |\n\n---\n\n## 3. 使用场景\n\n| 场景 | 描述 |\n|------|------|\n| **角色释放技能** | 玩家输入 → `AbilitySystem` 校验 → `AbilityExecSystem` 按时间线发射 EffectClip → 效果申请 → 属性修改 → Sink 落地（Physics2D/Nav/UI） |\n| **Buff/Debuff 管理** | 效果按 `Duration` / `Infinite` / `Instant` 生命周期运行，周期性 tick 和过期检查由 `EffectLifetimeSystem` 处理 |\n| **属性派生与聚合** | 基础属性（`AttributeBuffer`）经 `AttributeAggregationSystem` 聚合，派生属性通过 `AttributeDerivedGraphBinding` 图绑定计算 |\n| **延迟触发响应** | 属性/标签变更通过 `DeferredTriggerQueue` 延迟一帧，触发下一轮的 `GameplayEvent` 或 `EffectRequest` |\n| **表现事件触发** | `GameplayCueSystem` 查询 `GameplayEvent` 并生成 `CueDescriptor`，驱动 VFX/SFX/屏幕震动 |\n\n---\n\n![GAS 组件关系](diagrams/gas-component-relation.svg)\n\n## 4. 核心能力\n\n### 4.1 Ability（能力）\n\n![Ability 激活流程](diagrams/ability-activation-flow.svg)\n\n- **定义注册**：`AbilityDefinitionRegistry`（`src/Core/Gameplay/GAS/AbilityDefinitionRegistry.cs`）支持 4096 槽动态扩容，Mod 在加载期调用 `Register` 或 `RegisterFromEntity` 注册能力定义。\n- **状态槽位**：`AbilityStateBuffer`（`Components/AbilityStateBuffer.cs`）提供基础 8 槽能力槽位；`GrantedSlotBuffer` 提供临时授予槽位（Buff/物品）；`AbilityFormSlotBuffer` 提供形态/姿态槽位覆盖。\n- **执行规格**：`AbilityExecSpec`（`Components/AbilityExecComponents.cs`）定义时间线上 16 个 SoA 条目，每个条目可为 `EffectClip`、`TagClip`、`EffectSignal`、`EventSignal`、`GraphSignal`、`InputGate`、`EventGate`、`SelectionGate`。\n- **激活校验**：`AbilityActivationBlockTags`（阻挡标签）、`AbilityActivationPrecondition`（前置图程序 ID）、`AbilityCooldown`（冷却标签与步数）。\n- **Toggle 能力**：`AbilityToggleSpec`（定义在 `AbilityDefinitionRegistry.cs`）支持关闭时间线 + 持续效果。但 **`AbilityDefinitionRegistry.RegisterFromEntity` 未读取 `ToggleSpec`、`Indicator`、`Presentation`、`InputBindingOverride`**，导致模板实体无法配置这些高级特性。> **文档过承诺/待实现**：模板实体暂不支持 `ToggleSpec`/`Indicator`/`Presentation`/`InputBindingOverride` 的自动化注册。\n\n### 4.2 Effect（效果）\n\n![Effect 生命周期](diagrams/effect-lifecycle.svg)\n\n- **生命周期状态**：`GameplayEffect`（`Components/GameplayEffect.cs`）管理状态机：Created → Pending → Trigger → Calculate → Apply → Committed。\n- **效果工厂**：`GameplayEffectFactory`（`src/Core/Gameplay/GAS/GameplayEffectFactory.cs`）创建 Effect 实体，支持最多 8 个 Modifier（`EffectModifiers`，`Components/EffectModifiers.cs`）。\n- **申请队列**：`EffectRequestQueue`（`src/Core/Gameplay/GAS/EffectRequestQueue.cs`）提供双缓冲队列，支持 `Publish` 与 `ConsumePrefix`。\n- **处理管线**：`EffectProcessingLoopSystem` 驱动完整管线：\n  - `EffectProposalProcessingSystem`：打开响应链窗口（`ResponseChain`）→ TagRule 与预算控制 → `OnCalculate` 修正 → `OnApply`/`OnCommit`\n  - `EffectApplicationSystem`：分 stage 执行，含 listener 延迟回放\n  - `EffectLifetimeSystem` / `EffectPeriodicTickSystem` / `EffectExpirationSystem`：周期 tick、过期检查、移除\n  - `PostLifetimeProposalAndApply`：Duration 结束后收尾\n- **堆叠与容器**：`EffectStack`（`Components/EffectStack.cs`）管理堆叠计数与策略；`ActiveEffectContainer`（`Components/ActiveEffectContainer.cs`）每个实体最多承载 32 个活跃 Effect 引用。\n- **阶段图绑定**：`EffectPhaseGraphBindings`（最大 16 步）与 `EffectPhaseListenerBuffer`（最大 8 个监听器）支持按阶段触发自定义逻辑。\n- **Modifier 截断**：`EffectModifiers.Add` 返回 `bool`，但 `GameplayEffectFactory.AddModifier` 不检查返回值，超过 8 个 modifier 会被静默丢弃。> **注意**：设计上限为 8 个 modifier，配置时需注意不溢出。\n\n### 4.3 Attribute（属性）\n\n![Attribute 计算链路](diagrams/attribute-calculation.svg)\n\n- **属性缓冲**：`AttributeBuffer`（`Components/AttributeBuffer.cs`）为 0GC 结构，含 64 个 float（Base / Cap / Current）。\n- **属性修改**：`AttributeMutationOps`（`src/Core/Gameplay/GAS/AttributeMutationOps.cs`）执行 `ApplyModifiers`。\n- **聚合与派生**：`AttributeAggregationSystem` 聚合基础值；`AttributeDerivedGraphBinding`（`Components/AttributeDerivedGraphBinding.cs`）绑定派生属性图。\n- **Sink 落地**：`AttributeBindingSystem` 将最终属性值通过 `AttributeSinkRegistry` 分发到 Physics2D、UI、Nav 等外部系统。内建示例：`ForceInput2DSink`（`src/Core/Gameplay/GAS/Bindings/ForceInput2DSink.cs`）。\n- **扩展属性**：`ExtensionAttributeRegistry`（`src/Core/Gameplay/GAS/ExtensionAttributeRegistry.cs`）支持 Mod 在运行时注册 ID 范围 10001–20000 的扩展属性（上限 1000 个）。\n- **Schema 更新**：`AttributeSchemaUpdateQueue`（`src/Core/Gameplay/GAS/AttributeSchemaUpdateQueue.cs`）支持属性 Schema 热更新。\n\n### 4.4 Tag（标签）\n\n- **标签容器**：`GameplayTagContainer`（`Components/GameplayTagContainer.cs`）采用 256 位固定 bitset（4×ulong）存储标签。\n- **有效缓存**：`GameplayTagEffectiveCache`（`Components/GameplayTagEffectiveCache.cs`）存储规则计算后的有效标签集合。\n- **标签规则**：`TagRuleRegistry`（`src/Core/Gameplay/GAS/TagRuleRegistry.cs`）支持 Required、Blocked、Attached、Removed、DisabledIf、RemoveIf 六种规则。\n- **标签贡献**：`EffectTagContributionHelper`（`src/Core/Gameplay/GAS/EffectTagContributionHelper.cs`）聚合效果对目标标签的贡献。\n- **变更检测**：`GameplayAttributeChangedBits` 与 `GameplayTagChangedBits`（`Components/GameplayAttributeChangedBits.cs`）驱动延迟触发。\n\n### 4.5 TargetResolver（三层目标解析）\n\n![Target 解析器](diagrams/target-resolver.svg)\n\n三层目标解析由 `TargetResolverFanOutHelper`（`src/Core/Gameplay/GAS/TargetResolverFanOutHelper.cs`）实现：\n\n```\nEffectTemplateData.TargetQuery   → 如何找目标（BuiltinSpatial / GraphProgram）\n    ↓ ResolveTargets(...) → 候选实体数组\nEffectTemplateData.TargetFilter  → 如何过滤（RelationshipFilter / LayerMask / MaxTargets）\n    ↓ ValidateAndCollect(...) → 有效目标\nEffectTemplateData.TargetDispatch → 如何分发（PayloadEffectTemplateId + ContextMapping）\n    ↓ 为每个 resolved target 创建新的 EffectRequest\n```\n\n- **Query 类型**：`None`（1:1）、`BuiltinSpatial`（圆/锥/矩形/线/环）、`GraphProgram`（图 VM 逻辑）。\n- **ContextSlot**：`OriginalSource`、`OriginalTarget`、`OriginalTargetContext`、`ResolvedEntity`，支持按预设映射重定向 Source/Target。\n- **分发预设**：`TargetDispatchPresetRegistry`（`src/Core/Gameplay/GAS/TargetDispatchPresetRegistry.cs`）管理目标分发预设映射。\n\n### 4.6 Cue（表现事件）\n\n- **Cue 系统**：`GameplayCueSystem`（`Cue/GameplayCueSystem.cs`）每帧查询 `GameplayEvent`，生成 `CueDescriptor`。\n- **描述符**：`CueDescriptor`（`Cue/CueDescriptor.cs`）包含 `CueTagId`、`Position`、`Rotation`、`Scale`、`Source`、`Target`、`AssetId`。\n- **事件缓冲**：`CueEventBuffer`（`Cue/CueEventBuffer.cs`）提供 `TryAdd`/`Clear` API。\n- **已知限制**：`GameplayCueSystem` 硬编码了 `EventTagId == CueTagId` 的假设（Primitive 阶段残留）；Loop Cue（持续效果的表现循环）尚未实现。> **文档过承诺/待实现**：Loop Cue 处理与 EventTagId→CueTagId 的灵活映射待后续迭代。\n\n---\n\n## 5. 输入 / 输出\n\n### 5.1 输入\n\n| 输入 | 来源 | 处理者 |\n|------|------|--------|\n| 玩家输入 / AI OrderIntent | `InputCollection` / `AI` | `OrderBufferSystem` |\n| EffectRequest | `AbilitySystem` / `AbilityExecSystem` / `ExchangeRuntime` | `EffectRequestQueue` |\n| GameplayEvent | 游戏逻辑 / 延迟触发器 | `GameplayEventBus` |\n| 配置数据 | Mod JSON / `ConfigPipeline` | 各 `*Registry` / `*Loader` |\n| 属性/标签变更 | `EffectApplicationSystem` | `DeferredTriggerQueue` |\n\n### 5.2 输出\n\n| 输出 | 目标 | 驱动者 |\n|------|------|--------|\n| 属性值更新 | `AttributeBindingSystem` → `AttributeSinkRegistry` | `AttributeAggregationSystem` |\n| CueDescriptor | 表现层（VFX/SFX/Animator） | `GameplayCueSystem` |\n| GameplayEvent | 下一帧 GAS / AI / Narrative | `DeferredTriggerDispatchSystem` |\n| EffectRequest（链式） | `EffectRequestQueue` | `ResponseChainSystem` / `DeferredTriggerQueue` |\n| 能力状态变更 | UI / AI 决策 | `AbilitySystem` / `AbilityExecSystem` |\n\n---\n\n## 6. 依赖关系\n\n```\nGAS\n├── 依赖 Core/Engine：Arch ECS World, SystemGroup, GameEngine\n├── 依赖 Input/Nav：OrderBufferSystem 消费 InputCollection 的输入\n├── 依赖 Presentation：GameplayCueSystem 输出 CueDescriptor 到表现层\n├── 依赖 Items/Exchange：InventoryRuntimeService 在 Exchange 原子结算中消费物品\n├── 依赖 Relationships：RelationshipFilter 在 TargetResolver 中过滤目标\n├── 依赖 AI：AI 系统通过 OrderQueue 激活 Ability，不直接操作 GAS 状态\n└── 依赖 Mod/Config：ConfigPipeline 加载 JSON 到各 Registry\n```\n\n---\n\n## 7. 非功能需求\n\n| 需求 | 目标 | 实现方式 |\n|------|------|----------|\n| **性能** | 每帧 10,000+ 实体 Effect 处理 | 0-GC unsafe struct、bitset、SoA 密集数组、System 批量查询 |\n| **内存** | 单实体属性存储可控 | `AttributeBuffer` 固定 64 float，`GameplayTagContainer` 固定 4×ulong |\n| **可扩展性** | Mod 可注册新 Ability/Effect/Attribute/Tag | 加载期 Registry + `ExtensionAttributeRegistry` |\n| **可调试性** | 问题可追踪 | `ResponseChainTelemetryBuffer` 记录预算级别事件；`GasBudget` 统计溢出 |\n| **稳定性** | 异常不扩散 | `EffectRequestQueue` 双缓冲 + overflow 保护；`GasBudget` 上限告警 |\n| **快照/回滚** | 支持世界状态保存恢复 | `GasRuntimeState` 支持快照；`ExchangeRuntime` 原子结算 + 回滚 |\n\n---\n\n## 8. 关键类清单\n\n### 8.1 控制器与状态\n\n| 类 | 路径 | 职责 |\n|----|------|------|\n| `GasController` | `src/Core/Gameplay/GAS/GasController.cs` | GAS 固定帧/回合驱动器 |\n| `GasRuntimeState` | `src/Core/Gameplay/GAS/GasRuntimeState.cs` | 单例 ECS 状态组件（`EffectLoopInSlice`、`ProposalWindowPhase`） |\n| `GasBudget` | `src/Core/Gameplay/GAS/GasBudget.cs` | 每帧预算与溢出统计 |\n| `GasClocks` | `src/Core/Gameplay/GAS/GasClocks.cs` | GAS 时钟域适配器 |\n\n### 8.2 核心 Registry\n\n| 类 | 路径 | 职责 |\n|----|------|------|\n| `AbilityDefinitionRegistry` | `src/Core/Gameplay/GAS/AbilityDefinitionRegistry.cs` | 能力定义注册表（4096 槽，动态扩容） |\n| `EffectTemplateRegistry` | `src/Core/Gameplay/GAS/EffectTemplateRegistry.cs` | 效果模板注册表（4096 槽，bitset 存在性） |\n| `TagRuleRegistry` | `src/Core/Gameplay/GAS/TagRuleRegistry.cs` | 标签规则注册表（256 槽） |\n| `GasConditionRegistry` | `src/Core/Gameplay/GAS/GasConditionRegistry.cs` | 条件句注册表（4096 槽） |\n| `GlobalPhaseListenerRegistry` | `src/Core/Gameplay/GAS/GlobalPhaseListenerRegistry.cs` | 全局阶段监听器（最大 32） |\n| `ExtensionAttributeRegistry` | `src/Core/Gameplay/GAS/ExtensionAttributeRegistry.cs` | 扩展属性 ID 重映射（10001–20000） |\n| `BuiltinHandlerRegistry` | `src/Core/Gameplay/GAS/BuiltinHandlerRegistry.cs` | 内建阶段处理器（64 槽） |\n| `AttributeBindingRegistry` | `src/Core/Gameplay/GAS/Bindings/AttributeBindingRegistry.cs` | 属性绑定注册表 |\n| `AttributeSinkRegistry` | `src/Core/Gameplay/GAS/Bindings/AttributeSinkRegistry.cs` | Sink 注册表 |\n| `TargetDispatchPresetRegistry` | `src/Core/Gameplay/GAS/TargetDispatchPresetRegistry.cs` | 目标分发预设映射 |\n\n### 8.3 核心 ECS 组件\n\n| 组件 | 路径 | 职责 |\n|------|------|------|\n| `GameplayEffect` | `src/Core/Gameplay/GAS/Components/GameplayEffect.cs` | Effect 生命周期状态机 |\n| `EffectContext` | `src/Core/Gameplay/GAS/Components/EffectContext.cs` | `RootId / Source / Target / TargetContext` |\n| `EffectModifiers` | `src/Core/Gameplay/GAS/Components/EffectModifiers.cs` | 固定 8 个 ModifierData |\n| `EffectConfigParams` | `src/Core/Gameplay/GAS/Components/EffectConfigParams.cs` | 效果参数表（最大 32 个键值对） |\n| `AttributeBuffer` | `src/Core/Gameplay/GAS/Components/AttributeBuffer.cs` | 0GC 属性缓冲（64 个 float） |\n| `GameplayTagContainer` | `src/Core/Gameplay/GAS/Components/GameplayTagContainer.cs` | 256 位固定 bitset |\n| `AbilityStateBuffer` | `src/Core/Gameplay/GAS/Components/AbilityStateBuffer.cs` | 基础 8 槽能力槽位 |\n| `AbilityExecSpec` | `src/Core/Gameplay/GAS/Components/AbilityExecComponents.cs` | 能力执行规格（16 个 SoA 条目） |\n| `AbilityExecInstance` | `src/Core/Gameplay/GAS/Components/AbilityExecComponents.cs` | 运行时执行实例（状态机） |\n| `ActiveEffectContainer` | `src/Core/Gameplay/GAS/Components/ActiveEffectContainer.cs` | 实体上最多 32 个活跃 Effect 引用 |\n| `EffectStack` | `src/Core/Gameplay/GAS/Components/EffectStack.cs` | 效果堆叠计数与策略 |\n| `EffectLifetimeMarkers` | `src/Core/Gameplay/GAS/Components/EffectLifetimeMarkers.cs` | 周期 tick / 过期检查标记 |\n| `BlackboardFloatBuffer` | `src/Core/Gameplay/GAS/Components/BlackboardFloatBuffer.cs` | 效果黑板浮点（32 槽） |\n| `BlackboardIntBuffer` | `src/Core/Gameplay/GAS/Components/BlackboardIntBuffer.cs` | 效果黑板整数（32 槽） |\n| `BlackboardEntityBuffer` | `src/Core/Gameplay/GAS/Components/BlackboardEntityBuffer.cs` | 效果黑板实体（32 槽） |\n| `BlackboardSpatialBuffer` | `src/Core/Gameplay/GAS/Components/BlackboardSpatialBuffer.cs` | 效果黑板空间数据（32 槽） |\n\n### 8.4 管线系统\n\n| 系统 | 路径 | 职责 |\n|------|------|------|\n| `EffectRequestQueue` | `src/Core/Gameplay/GAS/EffectRequestQueue.cs` | EffectRequest 双缓冲队列 |\n| `GameplayEventBus` | `src/Core/Gameplay/GAS/GameplayEventBus.cs` | GameplayEvent 双缓冲总线 |\n| `DeferredTriggerQueue` | `src/Core/Gameplay/GAS/DeferredTriggerQueue.cs` | 属性/标签/标签计数延迟触发器 |\n| `TargetResolverFanOutHelper` | `src/Core/Gameplay/GAS/TargetResolverFanOutHelper.cs` | 三层目标解析辅助 |\n| `AttributeMutationOps` | `src/Core/Gameplay/GAS/AttributeMutationOps.cs` | 属性修改 Apply |\n| `ConfigParamsMerger` | `src/Core/Gameplay/GAS/ConfigParamsMerger.cs` | 模板参数与 CallerParams 合并 |\n| `RelationOps` | `src/Core/Gameplay/GAS/RelationOps.cs` | ECS 父子关系操作 |\n| `ResponseChainTelemetryBuffer` | `src/Core/Gameplay/GAS/ResponseChainTelemetryBuffer.cs` | 响应链遥测 |\n| `RootBudgetTable` | `src/Core/Gameplay/GAS/RootBudgetTable.cs` | 根效果预算表 |\n\n### 8.5 Cue 系统\n\n| 类 | 路径 | 职责 |\n|----|------|------|\n| `GameplayCueSystem` | `src/Core/Gameplay/Cue/GameplayCueSystem.cs` | 表现事件系统（ECS 查询驱动） |\n| `CueDescriptor` | `src/Core/Gameplay/Cue/CueDescriptor.cs` | 表现事件描述 |\n| `CueEventBuffer` | `src/Core/Gameplay/Cue/CueEventBuffer.cs` | 表现事件缓冲 |\n\n---\n\n*本 PRD 基于 `report_Gameplay_GAS.md` Stage 1 扫描报告编写。关键未实现项已在文中标注。*\n";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
