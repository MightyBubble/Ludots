const mdContent = "# PRD-11: Map & Spatial（地图与空间系统）\n\n> 版本：基于 Stage 1 扫描报告（`report_Map_Spatial.md`）\n> 关联模块：`src/Core/Map/`、`src/Core/Spatial/`、`src/Core/Physics2D/`、`src/Core/Vision/`、`src/Core/TransportNetwork/`\n\n---\n\n## 1. 功能概述\n\nMap & Spatial 子系统是 Ludots Core 的\"世界空间骨架\"模块，负责从地图配置到运行时空间服务的全链路。它包含五大子域：\n\n1. **Map & Board** — 地图生命周期管理（`MapManager` / `MapSession`）、多 board 并存（`GridBoard` / `HexGridBoard` / `NodeGraphBoard`）、配置合并与继承。\n2. **Spatial Partition & Query** — 基于 `ChunkedGridSpatialPartitionWorld` 的实体空间分区，以及 `SpatialQueryService` 提供的 AABB、半径、锥形、矩形、线段、六角范围/环查询（共 8 种查询模式）。\n3. **Physics2D** — 完全自研的定点数（Fix64）2D 物理引擎，含 13 步仿真管线（`Physics2DPipeline`），支持圆、矩形、凸多边形碰撞，具备 SortAndSweep / UniformGrid 自适应 Broadphase。\n4. **Vision / Fog** — 基于 `ChunkedField2D<CellVisibility>` 的多层战争迷雾系统，支持发射器（Emitter）、占用者（Occupant）、LOS（Line of Sight）、垂直高度、隐蔽度规则。\n5. **TransportNetwork** — 从 `TransportNetworkAsset` 到 `GraphChunkData` + `SurfaceSplineSegment` 的烘焙管线，统一道路/铁路/水路拓扑与表现丝带。\n\n这些子域通过 `WorldSizeSpec`、`ISpatialCoordinateConverter`、`SpatialScaleDefaults` 等共享契约保持尺度一致性。\n\n---\n\n## 2. 目标用户\n\n| 用户角色 | 使用场景 |\n|----------|----------|\n| **Mod 作者** | 配置地图 JSON、定义 Board 参数、注册迷雾层和碰撞层 |\n| **关卡设计师** | 设计地图尺寸、拓扑类型（Grid/Hex）、配置地形高度和阻挡 |\n| **Gameplay 设计师** | 配置视野规则（LOS、隐蔽度、垂直高度）、调整迷雾层策略 |\n| **AI 开发者** | 通过 `SpatialQueryService` 查询范围内实体，利用 `TransportNetwork` 规划道路移动 |\n| **引擎开发者** | 优化空间分区性能、扩展物理 Broadphase 策略、接入新的场数据类型 |\n\n---\n\n## 3. 使用场景\n\n### 场景 A：地图加载与生命周期\nMod 启动 → `MapManager.LoadMap(mapId)` → `ConfigPipeline.CollectFragments` → `JsonSerializer.Deserialize<MapConfig>` → `MergeMapConfig`（深度合并）→ `Apply Definition metadata`（代码优先 boards / tags）→ `Handle ParentId`（递归继承）→ `MapSessionManager.CreateSession` → `BoardFactory.Create`（按 `SpatialType` 路由到 `GridBoard` / `HexGridBoard` / `NodeGraphBoard`）→ `MapSession.AddBoard` → `MapLoader.LoadEntities` → ECS World  populated。\n\n### 场景 B：AOE 技能范围查询\n技能释放 → `SpatialQueryService.QueryRadius(center, radius)` → `ChunkedGridSpatialPartitionBackend.QueryAabb`（粗查）→ `SpatialQueryService` 细过滤（距离检查 / 角度检查）→ `SpatialQueryPostProcessor.SortStableDedup` → 返回 `Span<Entity>`（去重）。\n\n### 场景 C：Physics2D 碰撞与弹射\n单位受击飞效果 → `ForceInput2D` 写入力向量 → `Physics2DSimulationSystem` 固定步长 → `BuildPhysicsWorldSystem2D` 收集动态体 → `AdaptiveSpatialSystem2D` 选择 Broadphase 策略 → `NarrowPhaseSystem2D` SAT 检测 → `SolverSystem2D` 迭代冲量求解 → `IntegrationSystem2D` Euler 积分 → 更新 `Position2D` / `Velocity2D`。\n\n### 场景 D：战争迷雾动态更新\n单位移动 → `VisionSystem.CopyEmitters()` → `VisionSystem.CopyOccupants()` → `VisionResolver.Resolve` 逐层计算可见性 → `FogField.SetVisible` / `SetDenied` → `FogKnowledgeProjector` 检查 concealment / LOS / vertical rules → 写入 `ChunkedField2D<CellVisibility>` → `FogGlobalFieldVisualProjector` 将 dirty 格投影到 `GlobalFieldVisualBuffer` → 适配器渲染迷雾。\n\n---\n\n## 4. 核心能力\n\n### 4.1 地图系统（Map & Board）\n\n`MapManager`（`src/Core/Map/MapManager.cs`）是地图注册与加载中心，维护 `MapId → MapDefinition` 的注册表。关键能力：\n\n- **配置合并**：`MergeMapConfig(target, source)` 执行深度合并，支持 Mod 覆盖基础地图配置。\n- **继承链**：`Handle ParentId` 支持地图配置的递归继承，带循环检测。\n- **Legacy 键拒绝**：`RejectLegacyWorldExtentKeys` 拒绝 `WidthInTiles` / `HeightInTiles` 旧键，fail-fast 引导使用 `widthInMacroTiles` / `heightInMacroTiles`。\n\n`MapSession`（`src/Core/Map/MapSession.cs`）是地图运行时会话，包含 `Board` 集合、触发器列表、实体索引。`MapSessionManager`（`src/Core/Map/MapSessionManager.cs`）管理会话栈（`PushFocused` / `PopFocused` / `UnloadSession` / `CaptureSnapshot`）。`MapContext`（`src/Core/Map/MapContext.cs`）提供层级 KV 存储。\n\n**Board 抽象**：`IBoard`（`src/Core/Map/Board/IBoard.cs`）定义空间域统一接口，包含 `Id` / `Name` / `WorldSize` / `CoordinateConverter` / `SpatialPartition` / `QueryService` / `LoadedChunks`。三种实现：\n\n| Board 类型 | 文件路径 | 实现接口 | 特点 |\n|-----------|----------|----------|------|\n| `GridBoard` | `src/Core/Map/Board/GridBoard.cs` | `ITerrainBoard`, `INavigableBoard` | 正方形网格地形，支持 `VertexMap` 高度图 |\n| `HexGridBoard` | `src/Core/Map/Board/HexGridBoard.cs` | `ITerrainBoard`, `INavigableBoard` | 六边形网格地形，含 `HexGridAOI` |\n| `NodeGraphBoard` | `src/Core/Map/Board/NodeGraphBoard.cs` | `INodeGraphBoard` | 节点图空间域，含 `ChunkedNodeGraphStore` |\n\n`BoardFactory`（`src/Core/Map/Board/BoardFactory.cs`）按 `BoardConfig.SpatialType` 字符串路由创建对应 Board。`BoardIdRegistry`（`src/Core/Map/Board/BoardIdRegistry.cs`）提供线程安全的 string→int interning。\n\n**WorldMap**（`src/Core/Map/WorldMap.cs`）管理宏观 tile 网格：`WidthInMacroTiles` / `HeightInMacroTiles` / `GetOrCreateTile`。`MapTile`（`src/Core/Map/MapTile.cs`）单个 tile 大小为 256（`SpatialScaleDefaults.MacroTileCells`），含高度、阻挡、生物群系数据。\n\n> **注意**：`GridBoard.LoadedChunks` 返回 `null`（`src/Core/Map/Board/GridBoard.cs:20`），而 `HexGridBoard` 返回 `HexGridAOI`、`NodeGraphBoard` 返回 `WorldGridLoadedChunks`。`GridBoard` 不提供加载块追踪，调用方需做 null 检查。\n\n### 4.2 空间分区与查询（Spatial Partition & Query）\n\n**空间分区**：`ISpatialPartitionWorld`（`src/Core/Spatial/ISpatialPartitionWorld.cs`）定义分区接口，`ChunkedGridSpatialPartitionWorld`（`src/Core/Spatial/ChunkedGridSpatialPartitionWorld.cs`）是主力实现——基于 chunk 的稀疏网格，power-of-2 chunk size。`GridSpatialPartitionWorld`（`src/Core/Spatial/GridSpatialPartitionWorld.cs`）是简单字典网格 fallback。\n\n**空间查询服务**：`SpatialQueryService`（`src/Core/Spatial/SpatialQueryService.cs`）实现 `ISpatialQueryService`，支持 **8 种查询模式**：\n\n| 查询方法 | 说明 |\n|----------|------|\n| `QueryAabb` | 轴对齐包围盒查询 |\n| `QueryRadius` | 半径圆查询 |\n| `QueryCone` | 锥形查询（扇区角度） |\n| `QueryRectangle` | 旋转矩形查询（OBB） |\n| `QueryLine` | 线段查询（含投影距离） |\n| `QueryHexRange` | 六角范围查询（中心 + 距离） |\n| `QueryHexRing` | 六角环查询（边界环） |\n\n查询执行 **coarse→fine 两级过滤**：粗查通过 `ISpatialPartitionWorld` 获取覆盖 shape 的 cell 中实体；细查通过定点数/整数几何进行精确距离/角度/投影测试。最终通过 `SpatialQueryPostProcessor.SortStableDedup` 对 `Span<Entity>` 排序去重。\n\n**查询后端**：`SpatialPartitionBackendBase` 将查询委托给 `ISpatialPartitionWorld`。`ChunkedGridSpatialPartitionBackend` 和 `GridSpatialPartitionBackend` 是主实现。`PhysicsWorldSpatialBackend`（`src/Core/Spatial/PhysicsWorldSpatialBackend.cs`）将旧 `PhysicsWorld` 桥接到 `ISpatialQueryBackend`。\n\n**坐标转换**：`ISpatialCoordinateConverter`（`src/Core/Spatial/ISpatialCoordinateConverter.cs`）定义 `GridCellSizeCm` / `GridToWorld` / `WorldToGrid` / `HexToWorld` / `WorldToHex`。`SpatialCoordinateConverter`（`src/Core/Spatial/SpatialCoordinateConverter.cs`）从 `WorldSizeSpec` 构造。\n\n**尺度常量**：`SpatialScaleDefaults`（`src/Core/Spatial/SpatialScaleDefaults.cs`）集中管理尺度：`CellCm=100` / `MacroTileCells=256` / `PartitionChunkCells=64` / `TerrainChunkCells=64`。\n\n> **注意**：`SpatialHashGrid<T>` 和 `LinearQuadTree<T>`（`src/Core/Spatial/`）使用 `float` 和 `Vector2`，不是定点数/整数厘米体系，且未与主 ECS 空间查询集成。`LinearQuadTree<T>` 的 `node.Count` 字段未维护（始终为 0），存在不完整实现。\n\n### 4.3 Physics2D（定点数 2D 物理引擎）\n\nLudots 内置完全自研的 Fix64 定点数 2D 物理引擎，确保跨平台确定性仿真。核心管线为 13 步：\n\n```\nPhysics2DSimulationSystem.Update(fixedDeltaTime)\n  → 1. ForceInputWakeSystem2D\n  → 2. BuildPhysicsWorldSystem2D      — 收集动态体 + 复合体 + 静态体缓存\n  → 3. AdaptiveSpatialSystem2D       — Broadphase（SortAndSweep / UniformGrid / BruteForce）\n  → 4. NarrowPhaseSystem2D           — SAT 碰撞检测（Circle/Box/Polygon）\n  → 5. SolverSystem2D                 — 迭代冲量求解（Warm Start + 摩擦/弹性组合）\n  → 6. ApplyImpulsesSystem2D\n  → 7. PositionCorrectionSystem2D\n  → 8. FieldDetectorSystem\n  → 9. IntegrationSystem2D            — Euler 积分 + 力消费 + 阻尼 + 休眠截断\n  → 10. UpdateMotionSystem\n  → 11. BuildIslandsSystem\n  → 12. SleepingSystem\n  → 13. CleanupSystem2D\n```\n\n**ECS 组件**：\n\n| 组件 | 文件路径 | 说明 |\n|------|----------|------|\n| `Position2D` | `src/Core/Physics2D/Components/TransformComponents2D.cs` | Fix64Vec2 位置 |\n| `Rotation2D` | `src/Core/Physics2D/Components/TransformComponents2D.cs` | Fix64 旋转 |\n| `Velocity2D` | `src/Core/Physics2D/Components/KinematicsComponents2D.cs` | Fix64Vec2 线速度 + Fix64 角速度 |\n| `Mass2D` | `src/Core/Physics2D/Components/KinematicsComponents2D.cs` | 逆质量 / 逆惯量 / 静态标记 |\n| `Collider2D` | `src/Core/Ludots.Physics2D/Components/PhysicsComponents2D.cs` | ColliderType2D + ShapeDataIndex |\n| `PhysicsMaterial2D` | `src/Core/Ludots.Physics2D/Components/PhysicsComponents2D.cs` | 摩擦 / 弹性 / 阻尼 |\n| `ForceInput2D` | `src/Core/Physics/ForceInput2D.cs` | Fix64Vec2 力输入 |\n| `CollisionPair` | `src/Core/Ludots.Physics2D/Components/CollisionPairComponents2D.cs` | 全 Fix64 碰撞对（含冲量累积） |\n| `SleepingTag` | `src/Core/Ludots.Physics2D/Components/SleepingComponents.cs` | 休眠标记 |\n| `MovementSuppressed2D` | `src/Core/Physics2D/Components/MovementAuthority2D.cs` | 移动抑制标记 |\n| `CompoundObstacle2DState` | `src/Core/Ludots.Physics2D/Components/CompoundObstacle2DState.cs` | 多 shape 静态障碍物状态 |\n\n**形状数据**：`ShapeDataStorage2D`（`src/Core/Ludots.Physics2D/ShapeDataStorage2D.cs`）管理形状注册：`CircleShapeData`（Radius + LocalCenter）、`BoxShapeData`（HalfWidth + HalfHeight + LocalCenter）、`PolygonShapeData`（Vertices + VertexCount + LocalCenter）。`CollisionAlgorithms2D`（`src/Core/Ludots.Physics2D/Collision/CollisionAlgorithms2D.cs`）实现全部 SAT 检测组合：CircleCircle / CircleBox / BoxBox / PolygonPolygon / BoxPolygon / PolygonCircle。\n\n**Broadphase 自适应**：`AdaptiveSpatialSystem2D`（`src/Core/Ludots.Physics2D/Systems/AdaptiveSpatialSystem2D.cs`）根据场景动态选择 `SortAndSweepStrategy`（X 轴插入排序 + Y 轴重叠测试）或 `UniformGridStrategy`（字典 cell bucket + HashSet 去重）。`BruteForceStrategy` 作为 fallback。\n\n> **命名空间不一致**：`Ludots.Core.Physics2D` 存放 ECS 组件和系统，`Ludots.Physics.Broadphase` 存放 broadphase 策略和 `Aabb`/`RigidBodyDesc`。两者都依赖 Fix64，但命名空间不统一。\n\n> **旧系统并存**：`PhysicsWorld`（`src/Core/Physics/PhysicsWorld.cs`）是一个旧的 16-cell 粒度 flat array 实体空间索引，与新的 `ChunkedGridSpatialPartitionWorld` 并存。`PhysicsWorldSpatialBackend` 将旧系统桥接到 `ISpatialQueryBackend`，建议逐步淘汰。\n\n### 4.4 视野与战争迷雾（Vision / Fog）\n\n战争迷雾系统基于 `ChunkedField2D<CellVisibility>`（`src/Core/Fields/ChunkedField2D.cs`），支持多层叠加（最多 32 层，由 `FogLayerRegistry` 管理）。\n\n**CellVisibility 状态**：\n\n| 状态 | 值 | 说明 |\n|------|-----|------|\n| `Unseen` | 0 | 从未见过（黑色） |\n| `Explored` | 1 | 曾见过但当前不可见（灰色） |\n| `Visible` | 2 | 当前可见（全亮） |\n| `Denied` | 3 | 被强制遮蔽（如反隐） |\n\n**核心类型**：\n\n| 类型 | 文件路径 | 说明 |\n|------|----------|------|\n| `VisionSystem` | `src/Core/Vision/VisionSystem.cs` | 主系统：收集 Emitter 和 Occupant，驱动解析 |\n| `FogField` | `src/Core/Vision/FogField.cs` | 迷雾场：Get/Set/EnumerateDirtyCells/CopyCells/ApplySnapshot |\n| `FogLayerRegistry` | `src/Core/Vision/FogLayerRegistry.cs` | 迷雾层注册表（string → FogLayerId，1..32） |\n| `FogCellMap` | `src/Core/Vision/FogRules.cs` | 迷雾格地图：高度层/不透明/隐蔽 |\n| `VisionResolver` | `src/Core/Vision/VisionSystem.cs`（内部） | 可见性解析器 |\n| `FogKnowledgeProjector` | `src/Core/Vision/FogKnowledgeProjector.cs` | 将可见性投影到 knowledge 系统 |\n| `FogGlobalFieldVisualProjector` | `src/Core/Vision/FogGlobalFieldVisualProjector.cs` | 视觉投影到 `GlobalFieldVisualBuffer` |\n| `FogFieldStore` | `src/Core/Vision/FogFieldStore.cs` | 管理多个 `FogField` |\n| `FogSnapshotStore` | `src/Core/Vision/FogSnapshotStore.cs` | 快照存储 |\n\n**视野规则**（`src/Core/Vision/FogRules.cs`）：\n- **VerticalVisionRule**：垂直高度检查（`Allows(targetCell, emitterTier, policy)`）\n- **LineOfSightRule**：LOS 检查（Bresenham 直线）\n- **ConcealmentRule**：隐蔽度检查（`Allows(viewerCell, targetCell, trueSightActive, policy)`）\n\n**VisionEmitter / FogOccupant**：\n- `VisionEmitter`（`VisionEmitterCm`）：定义视野发射器（ScopeKeyId / Position / FacingDeg / LayerMask / Polarity / Aperture / AltitudeBand / Priority / DetectionStrength / TrueSightStrength）。\n- `FogOccupant`（`FogOccupantCm`）：定义迷雾占用者（ExposeLayerMask / AltitudeBand / StealthLevel）。\n\n**VisionAperture** 支持 4 种形状：Disk（圆）/ Cone（锥）/ Box（矩形）/ Line（线段）。\n\n**FogRulesPolicy** 配置三大规则开关：VerticalEnabled / LineOfSightEnabled / ConcealmentEnabled，以及 UpTolerance 和 DenyMode（`DenyDominates` / `RevealDominates`）。\n\n### 4.5 运输网络（TransportNetwork）\n\n运输网络子系统统一道路/铁路/水路的拓扑与表现：\n\n**资产定义**：`TransportNetworkAsset`（`src/Core/TransportNetwork/TransportNetworkAsset.cs`）定义网络：Id / SampleStepCm / DefaultVisualWidthMeters / Nodes / Segments。`TransportNetworkNode`（Id / Xcm / Ycm / Kind / Tags）和 `TransportNetworkSegment`（Id / Points / SampleStepCm / Direction / FlowDirection / AreaId / Tags / DepthCm / WidthCm / LaneCount / VisualWidthMeters）组成网络结构。\n\n**烘焙管线**：`TransportNetworkBaker.Bake(asset, chunkSizeCm)`（`src/Core/TransportNetwork/TransportNetworkBaker.cs`）执行：\n1. `BuildAuthoredNodeLookup` — 构建节点查找表\n2. `ResolvePoints` — catmull-rom 样条采样\n3. `SampleSegmentNodes` — 按 `sampleStepCm` 细分\n4. `BuildGraphChunks` — `NodeGraphBuilder` 按 chunk 分块构建图数据\n5. `BuildRibbonChunks` — `SurfaceSplineSegment` 按 chunk 分块生成表现丝带\n\n产物为 `TransportNetworkBakedAsset`（`src/Core/TransportNetwork/TransportNetworkBakedAsset.cs`），含 `GraphChunks`（Dictionary<long, GraphChunkData>）和 `RibbonChunks`（Dictionary<long, SurfaceSplineSegment[]>）。\n\n**运行时同步**：`TransportNetworkRibbonSource.SyncPayloads`（`src/Core/TransportNetwork/TransportNetworkRibbonSource.cs`）将活跃 chunk 的 ribbon 数据同步到 `SurfaceSourcePayloadRegistry.SetSplineRibbon`。\n\n> **注意**：`TransportNetworkBaker` 的 `distanceCm` 和 `cost` 使用 `float`，与 Physics2D 的 Fix64 确定性理念不一致。虽然 TransportNetwork 属于 authoring/图数据，但如果路由成本参与确定性回放，float 距离可能引入非确定性。\n\n### 4.6 场数据（Fields）\n\n`ChunkedField2D<T>`（`src/Core/Fields/ChunkedField2D.cs`）是通用稀疏二维场抽象，被 Fog 和 GlobalField 广泛采用：\n\n| 方法 | 说明 |\n|------|------|\n| `Get` / `Set` / `TryGet` | 读写格值 |\n| `MarkDirty` / `MarkDirtyRegion` | 标记脏格 |\n| `ReplaceValue` | 条件替换 |\n| `EnumerateDirtyCells` | 遍历脏格 |\n| `CopyNonDefaultCells` | 复制非默认值 |\n| `Clear` / `ClearDirty` | 清理 |\n\n`FieldGridSpec2D`（`src/Core/Fields/FieldGridSpec2D.cs`）定义格规格：`CellSizeCm` / `ChunkSizeCells` / `WorldToCell` / `CellCenterToWorld` / `PackChunkKey`。`FieldValueCodec<T>`（`src/Core/Fields/FieldValueCodec.cs`）支持 `Struct` / `Float` / `Float2` / `Float3` / `Float4` 通道编码。\n\n---\n\n## 5. 输入 / 输出\n\n### 5.1 输入\n\n| 输入 | 来源 | 说明 |\n|------|------|------|\n| `MapConfig` JSON | Mod / 资产 | 地图配置（Boards / Tags / Triggers / ParentId） |\n| `TransportNetworkAsset` JSON | Mod / 资产 | 运输网络定义（节点、线段、标签） |\n| ECS 实体位置 | Gameplay / Navigation | `WorldPositionCm` 用于空间分区和查询 |\n| `VisionEmitterCm` / `FogOccupantCm` | Gameplay / GAS | 视野发射器和占用者组件 |\n| `ForceInput2D` | Gameplay / GAS | 物理力输入 |\n| 地形修改 | 关卡编辑 / 运行时 | 触发 NavMesh 增量重建 |\n\n### 5.2 输出\n\n| 输出 | 消费者 | 说明 |\n|------|--------|------|\n| `MapSession` | 引擎 / 其他 Core 模块 | 地图运行时会话（含 Boards、触发器） |\n| `IBoard` / `ISpatialQueryService` | Navigation / AI / Gameplay | 空间查询服务 |\n| `Position2D` / `Velocity2D` | ECS World | 物理更新后的位置和速度 |\n| `CollisionPair` | GAS / 触发器 | 碰撞事件通知 |\n| `FogField` | Vision / Presentation | 迷雾可见性格 |\n| `GlobalFieldVisualBuffer` | Presentation | 迷雾视觉投影 |\n| `TransportNetworkBakedAsset` | Navigation / Presentation | 分块图数据 + 表现丝带 |\n| `Physics2DPerfStats` | 遥测 / 调试 | 性能统计（PotentialPairs / ContactPairs / PhysicsUpdateMs） |\n\n---\n\n## 6. 依赖关系\n\n| 依赖模块 | 依赖类型 | 说明 |\n|----------|----------|------|\n| **Navigation** | 强依赖 | `NodeGraphBoard` 提供图数据；`NavMesh` 依赖地图地形数据 |\n| **Input / Selection** | 弱依赖 | `HexGridAOI` 提供 AOI 服务；选择系统使用空间查询 |\n| **GAS** | 弱依赖 | `VisionEmitterCm` / `FogOccupantCm` 由 GAS 驱动；`CompoundObstacle2DState` 由 Gameplay 设置 |\n| **Presentation** | 弱依赖 | `FogGlobalFieldVisualProjector` 输出到 `GlobalFieldVisualBuffer`；`TransportNetworkRibbonSource` 输出到 `SurfaceSourcePayloadRegistry` |\n| **ConfigPipeline** | 强依赖 | 地图配置、运输网络配置均通过 `ConfigPipeline` 加载 |\n\n---\n\n## 7. 非功能需求\n\n| 需求项 | 目标 | 验证方式 |\n|--------|------|----------|\n| **确定性** | 跨平台物理仿真结果完全一致 | 全 Fix64 运算（Physics2D、Flow、Pathing） |\n| **性能** | 空间查询 O(1) 粗查 + O(n) 细查 | `ChunkedGridSpatialPartitionWorld` 稀疏 chunk + `SpatialQueryPostProcessor` 去重 |\n| **可扩展性** | 支持新 Board 类型、新 Broadphase 策略 | `BoardFactory` 路由 + `ISpatialPartitionStrategy` 接口 |\n| **内存效率** | 大规模地图稀疏存储 | `ChunkedField2D<T>` 只分配非默认 chunk |\n| **配置验证** | 旧键 fail-fast、循环依赖检测 | `MapManager.RejectLegacyWorldExtentKeys` + `MergeMapConfig` 继承链检测 |\n| **层数限制** | 迷雾层 ≤ 32，碰撞层 ≤ 32 | `FogLayerRegistry` 和 `LayerRegistry` 均限制为 32 位 |\n\n> **注意**：`FogLayerRegistry.ToMask` 在 `id.Value > 32` 时抛出异常。若未来需要超过 32 层迷雾，需重构为 `ulong` 或 `BitArray`。\n\n---\n\n## 8. 关键类清单\n\n### 8.1 地图与 Board\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `IMapManager` | `src/Core/Map/IMapManager.cs` | 地图管理接口 |\n| `MapManager` | `src/Core/Map/MapManager.cs` | 地图注册、加载、合并、继承链解析 |\n| `MapId` | `src/Core/Map/MapId.cs` | 地图 ID（大小写不敏感） |\n| `MapDefinition` | `src/Core/Map/MapDefinition.cs` | 地图定义抽象类 |\n| `MapSession` | `src/Core/Map/MapSession.cs` | 地图运行时会话 |\n| `MapSessionManager` | `src/Core/Map/MapSessionManager.cs` | 会话栈管理 |\n| `MapContext` | `src/Core/Map/MapContext.cs` | 层级 KV 存储 |\n| `MapTile` | `src/Core/Map/MapTile.cs` | 地图 tile（Size=256） |\n| `WorldMap` | `src/Core/Map/WorldMap.cs` | 宏观 tile 网格 |\n| `MapFeatureFlags` | `src/Core/Map/MapFeatureFlags.cs` | 地图特性标记（byte 存储） |\n| `IBoard` | `src/Core/Map/Board/IBoard.cs` | 空间域抽象接口 |\n| `ITerrainBoard` | `src/Core/Map/Board/ITerrainBoard.cs` | 含地形数据的 Board 接口 |\n| `INavigableBoard` | `src/Core/Map/Board/INavigableBoard.cs` | 含导航服务的 Board 接口 |\n| `INodeGraphBoard` | `src/Core/Map/Board/INodeGraphBoard.cs` | 含图运行时的 Board 接口 |\n| `GridBoard` | `src/Core/Map/Board/GridBoard.cs` | 正方形网格 Board |\n| `HexGridBoard` | `src/Core/Map/Board/HexGridBoard.cs` | 六边形网格 Board |\n| `NodeGraphBoard` | `src/Core/Map/Board/NodeGraphBoard.cs` | 节点图 Board |\n| `BoardFactory` | `src/Core/Map/Board/BoardFactory.cs` | Board 创建工厂 |\n| `BoardConfig` | `src/Core/Map/Board/BoardConfig.cs` | Board 配置 |\n| `BoardId` | `src/Core/Map/Board/BoardId.cs` | Board ID |\n| `BoardIdRegistry` | `src/Core/Map/Board/BoardIdRegistry.cs` | Board 名字 interning |\n| `HexCoordinates` | `src/Core/Map/Hex/HexCoordinates.cs` | 六角坐标（Q, R） |\n| `HexMetrics` | `src/Core/Map/Hex/HexMetrics.cs` | 六角度量（运行时参数化） |\n| `VertexMap` | `src/Core/Map/Hex/VertexMap.cs` | 顶点地图（高度/生物群系/水体/植被/阻挡） |\n| `MapGenerator` | `src/Core/Map/Generator/MapGenerator.cs` | 地图生成器（SimpleNoise） |\n\n> **注意**：`HexCoordinates` 中仍有硬编码 hex 边长常量（`EdgeLength = 4.0f`、`EdgeLengthCm = 400`），而 `HexMetrics` 是运行时参数化版本。若配置非 400cm 的 hex 边长，`HexCoordinates.ToWorldPosition()` 可能产生错误坐标。\n\n### 8.2 空间分区与查询\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `ISpatialPartitionWorld` | `src/Core/Spatial/ISpatialPartitionWorld.cs` | 空间分区接口 |\n| `ChunkedGridSpatialPartitionWorld` | `src/Core/Spatial/ChunkedGridSpatialPartitionWorld.cs` | 基于 chunk 的稀疏网格（主力） |\n| `GridSpatialParti function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
