<div id="parity-root" class="parity-root">
  <div id="parity-header" class="parity-header">
    <div id="parity-title" class="parity-title">同一张暂停菜单</div>
    <div id="parity-lead" class="parity-lead">浏览器里长什么样，游戏里就长什么样；换分辨率，布局跟着走。</div>
  </div>
  <div id="parity-toolbar" class="parity-toolbar">
    <button id="vp-desktop" class="parity-chip {{desktop_class}}" ui-click="ViewportDesktop">桌面 1280×720</button>
    <button id="vp-tablet" class="parity-chip {{tablet_class}}" ui-click="ViewportTablet">平板 900×700</button>
    <button id="vp-phone" class="parity-chip {{phone_class}}" ui-click="ViewportPhone">手机 390×844</button>
  </div>
  <div id="parity-body" class="parity-body">
    <div id="preview-host" class="preview-host">
      <div id="preview-label" class="preview-label">预览 · {{viewport_label}}</div>
      <div id="stage" class="{{stage_class}}" data-parity-id="stage">
        <div id="backdrop" data-parity-id="backdrop"></div>
        <div id="menu-shell" data-parity-id="menu-shell">
          <div id="menu-card" data-parity-id="menu-card">
            <div id="menu-kicker" data-parity-id="menu-kicker">PAUSE</div>
            <div id="menu-title" data-parity-id="menu-title">先歇一口气</div>
            <div id="menu-subtitle" data-parity-id="menu-subtitle">同一份菜单稿，随屏幕变宽变窄，结构不乱。</div>
            <div id="menu-grid" data-parity-id="menu-grid">
              <div id="btn-resume" class="menu-btn primary" data-parity-id="btn-resume">继续冒险</div>
              <div id="btn-map" class="menu-btn" data-parity-id="btn-map">打开地图</div>
              <div id="btn-settings" class="menu-btn" data-parity-id="btn-settings">设置</div>
              <div id="btn-quit" class="menu-btn danger" data-parity-id="btn-quit">回到标题</div>
            </div>
            <div id="stat-row" data-parity-id="stat-row">
              <div id="stat-hp" class="stat-chip" data-parity-id="stat-hp">
                <div class="stat-label">生命</div>
                <div class="stat-value">128</div>
              </div>
              <div id="stat-mp" class="stat-chip" data-parity-id="stat-mp">
                <div class="stat-label">法力</div>
                <div class="stat-value">64</div>
              </div>
              <div id="stat-gold" class="stat-chip" data-parity-id="stat-gold">
                <div class="stat-label">金币</div>
                <div class="stat-value">902</div>
              </div>
            </div>
          </div>
          <div id="side-rail" data-parity-id="side-rail">
            <div id="rail-card" class="rail-card" data-parity-id="rail-card">
              <div id="rail-title" data-parity-id="rail-title">当前任务</div>
              <div id="rail-body" data-parity-id="rail-body">护送商队穿过雾谷，别让补给掉队。</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="parity-aside" class="parity-aside">
      <div id="parity-badge" class="parity-badge">{{parity_badge}}</div>
      <div id="parity-point-1" class="parity-point">{{point_1}}</div>
      <div id="parity-point-2" class="parity-point">{{point_2}}</div>
      <div id="parity-point-3" class="parity-point">{{point_3}}</div>
      <div id="parity-footnote" class="parity-footnote">证据：Chrome 参考盒模型黄金文件 + UiWebParityTests，三种分辨率全部对齐。</div>
    </div>
  </div>
</div>
