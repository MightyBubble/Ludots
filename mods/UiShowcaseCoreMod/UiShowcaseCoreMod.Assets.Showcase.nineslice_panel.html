<div id="nineslice-root" class="ns-root">
  <div id="ns-header" class="ns-header">
    <div id="ns-brand" class="ns-brand">LUDOTS · ORNATE FRAME</div>
    <div id="ns-title" class="ns-title">打开雕花木匣</div>
    <div id="ns-lead" class="ns-lead">角钉住不动，边和羊皮纸跟着拉长——博德之门那种拟物框，靠九宫格切图。</div>
  </div>
  <div id="ns-toolbar" class="ns-toolbar">
    <button id="size-compact" class="ns-chip {{compact_class}}" ui-click="SizeCompact">窄匣</button>
    <button id="size-wide" class="ns-chip {{wide_class}}" ui-click="SizeWide">宽案</button>
    <button id="size-tall" class="ns-chip {{tall_class}}" ui-click="SizeTall">高柜</button>
  </div>
  <div id="ns-body" class="ns-body">
    <div id="ns-stage" class="ns-stage">
      <div id="sheet" class="sheet {{size_class}}">
        <img id="sheet-frame" class="sheet-frame" src="{{panel_frame_data_uri}}" />
        <div id="sheet-body" class="sheet-body">
          <div id="sheet-kicker" class="sheet-kicker">TRAVELER DOSSIER</div>
          <div id="sheet-name" class="sheet-name">雾谷旅人</div>
          <div id="sheet-blurb" class="sheet-blurb">卷宗裱在雕花木框里。换匣子尺寸时，金角纹样不糊，羊皮纸铺满中间。</div>
          <div id="sheet-stats" class="sheet-stats">
            <div class="stat-line"><span class="stat-key">体质</span><span class="stat-val">14</span></div>
            <div class="stat-line"><span class="stat-key">感知</span><span class="stat-val">16</span></div>
            <div class="stat-line"><span class="stat-key">魅力</span><span class="stat-val">12</span></div>
          </div>
          <div id="sheet-actions" class="sheet-actions">
            <div id="btn-rest" class="ornate-btn">
              <img class="ornate-btn-frame" src="{{button_frame_data_uri}}" />
              <div class="ornate-btn-label">休憩整备</div>
            </div>
            <div id="btn-depart" class="ornate-btn">
              <img class="ornate-btn-frame" src="{{button_frame_data_uri}}" />
              <div class="ornate-btn-label">再次启程</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="ns-aside" class="ns-aside">
      <div id="ns-badge" class="ns-badge">看三件事</div>
      <div id="ns-point-1" class="ns-point">金角固定：切「窄匣 / 宽案 / 高柜」，四角纹样形状不变。</div>
      <div id="ns-point-2" class="ns-point">木边与羊皮纸被拉开：中间区域跟盒子一起变大变小。</div>
      <div id="ns-point-3" class="ns-point">按钮也是同一份九宫格按钮框，标签叠在凹陷中央。</div>
      <div id="ns-footnote" class="ns-footnote">玩法：先看默认窄匣，再点宽案与高柜。角糊了或字压进木框，就是切边不对。</div>
    </div>
  </div>
</div>
