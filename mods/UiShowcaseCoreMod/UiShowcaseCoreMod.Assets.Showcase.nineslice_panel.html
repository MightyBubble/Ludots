<div id="nineslice-root" class="ns-root">
  <div id="ns-header" class="ns-header">
    <div id="ns-brand" class="ns-brand">LUDOTS · 水墨匣</div>
    <div id="ns-title" class="ns-title">墨痕怎么裁、怎么铺</div>
    <div id="ns-lead" class="ns-lead">宣纸卷轴可拉开，墨边角钉住；云纹可一节节接，墙面可四向铺满。</div>
  </div>
  <div id="ns-toolbar" class="ns-toolbar">
    <button id="mode-nine" class="ns-chip {{nine_class}}" ui-click="ModeNine"><div id="mode-nine-label" class="ns-chip-label">九宫格</div></button>
    <button id="mode-three" class="ns-chip {{three_class}}" ui-click="ModeThree"><div id="mode-three-label" class="ns-chip-label">三宫格</div></button>
    <button id="mode-two" class="ns-chip {{two_class}}" ui-click="ModeTwo"><div id="mode-two-label" class="ns-chip-label">二方连续</div></button>
    <button id="mode-four" class="ns-chip {{four_class}}" ui-click="ModeFour"><div id="mode-four-label" class="ns-chip-label">四方连续</div></button>
  </div>
  <div id="ns-body" class="ns-body">
    <div id="ns-stage" class="ns-stage">
      <div id="panel-nine" class="mode-panel {{nine_panel_class}}">
        <div id="sheet" class="sheet size-wide">
          <img id="sheet-frame" class="sheet-frame" src="{{panel_frame_data_uri}}" />
          <div id="sheet-body" class="sheet-body">
            <div class="sheet-kicker">水墨 · 九宫格</div>
            <div class="sheet-name">青岚行卷</div>
            <div class="sheet-blurb">朱印钉在四角，墨边与宣纸被拉开。下面两枚墨钮也是九宫格，角应对称。</div>
            <div class="sheet-actions">
              <div id="btn-rest" class="ornate-btn">
                <img class="ornate-btn-frame" src="{{button_frame_data_uri}}" />
                <div class="ornate-btn-label">小憩烹茶</div>
              </div>
              <div id="btn-depart" class="ornate-btn">
                <img class="ornate-btn-frame" src="{{button_frame_data_uri}}" />
                <div class="ornate-btn-label">继续云游</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="panel-three" class="mode-panel {{three_panel_class}}">
        <div class="three-stack">
          <div id="ribbon-short" class="ribbon ribbon-short">
            <img id="ribbon-short-frame" class="ribbon-frame" src="{{ribbon_frame_data_uri}}" />
            <div class="ribbon-label">短签 · 三宫格</div>
          </div>
          <div id="ribbon-long" class="ribbon ribbon-long">
            <img id="ribbon-long-frame" class="ribbon-frame" src="{{ribbon_frame_data_uri}}" />
            <div class="ribbon-label">长签 · 只拉中间墨痕，两端笔锋不变形</div>
          </div>
          <div class="mode-caption">左右笔锋钉死，中间宣纸被拉长——横向三宫格。</div>
        </div>
      </div>

      <div id="panel-two" class="mode-panel {{two_panel_class}}">
        <div class="two-stack">
          <div id="strip-h" class="strip-h"></div>
          <div id="strip-v-host" class="strip-v-host">
            <div id="strip-v" class="strip-v"></div>
            <div class="mode-caption">上：横向云纹二方连续。左：纵向云纹二方连续。一节节接，不是整图硬拉。</div>
          </div>
        </div>
      </div>

      <div id="panel-four" class="mode-panel {{four_panel_class}}">
        <div id="tile-floor" class="tile-floor">
          <div class="tile-card">
            <div class="sheet-kicker">水墨 · 四方连续</div>
            <div class="sheet-name">竹影墙纸</div>
            <div class="mode-caption">同一幅竹雾花纹，左右上下接缝铺满整面墙。</div>
          </div>
        </div>
      </div>
    </div>
    <div id="ns-aside" class="ns-aside">
      <div id="ns-badge" class="ns-badge">{{aside_badge}}</div>
      <div id="ns-point-1" class="ns-point">{{point_1}}</div>
      <div id="ns-point-2" class="ns-point">{{point_2}}</div>
      <div id="ns-point-3" class="ns-point">{{point_3}}</div>
      <div id="ns-footnote" class="ns-footnote">{{footnote}}</div>
    </div>
  </div>
</div>
