<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="panel workbench" id="workbench-panel" data-ready="false">
    <header class="panel-title">数据结构面板</header>
    <div class="row"><span class="label">名称</span><span class="value" id="name-text">--</span></div>
    <div class="row"><span class="label">分数</span><span class="value" id="score-text">--</span></div>
    <div class="row"><span class="label">坐标</span><span class="value" id="pos-text">--</span></div>
    <div class="row"><span class="label">稀有度</span><span class="value" id="rarity-text">--</span></div>
    <div class="row"><span class="label">标签</span><span class="value" id="tags-text">--</span></div>
    <footer class="hint" id="link-status">link: booting</footer>
  </section>
  <script src="main.js"></script>
</body>
</html>
