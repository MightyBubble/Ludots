const mdContent = "# Ludots API 快速参考\n\n> 基于代码反推生成的核心 API 速查表。  \n> 生成时间：2025-07-02\n\n---\n\n## 1. 注册表（Registry）API\n\n### 1.1 StringIntRegistry\n\n```csharp\n// 基础字符串→整数注册表，所有上层 Registry 的基座\npublic class StringIntRegistry\n{\n    public int Register(string key);           // 注册键，返回紧凑 ID\n    public int GetId(string key);              // 查 ID，不存在时抛异常或返回默认值\n    public bool TryGetId(string key, out int id);\n    public string GetKey(int id);              // 反向查字符串键\n    public int Count { get; }                  // 已注册键数量\n}\n```\n\n**使用位置**：`src/Core/Registry/StringIntRegistry.cs`\n\n### 1.2 SystemFactoryRegistry\n\n```csharp\n// Mod 注册自定义 System 的正式入口\npublic class SystemFactoryRegistry\n{\n    public void Register<T>(string systemName) where T : ISystem;\n    public void Register(string systemName, Type systemType);\n    public ISystem Create(string systemName, World world);\n    public bool Contains(string systemName);\n}\n```\n\n**使用位置**：`src/Core/Engine/SystemFactoryRegistry.cs`\n\n### 1.3 AbilityDefinitionRegistry\n\n```csharp\n// GAS Ability 定义注册表\npublic class AbilityDefinitionRegistry\n{\n    public void Register(AbilityDefinition definition);\n    public AbilityDefinition Get(string abilityId);\n    public bool TryGet(string abilityId, out AbilityDefinition definition);\n    public IEnumerable<string> GetAllIds();\n}\n```\n\n**使用位置**：`src/Core/Gameplay/GAS/AbilityDefinitionRegistry.cs`\n\n### 1.4 PerformerDefinitionRegistry\n\n```csharp\n// 表现层 Performer 定义注册表\npublic class PerformerDefinitionRegistry\n{\n    public void Register(string id, PerformerDefinition definition);\n    public PerformerDefinition Get(string id);\n    public int GetDefinitionId(string id);     // 返回编译时整数 ID\n    public bool TryGetDefinitionId(string id, out int definitionId);\n    public CompiledPerformerBootstrapRegistry CompiledBootstraps { get; }\n}\n```\n\n**使用位置**：`src/Core/Presentation/Performers/PerformerDefinitionRegistry.cs`\n\n### 1.5 FunctionRegistry\n\n```csharp\n// 脚本函数注册表，支持 last-wins 覆盖\npublic class FunctionRegistry\n{\n    public void Register(string name, Delegate function);\n    public void Register<T1, T2, TResult>(string name, Func<T1, T2, TResult> function);\n    public Delegate Get(string name);\n    public bool TryGet(string name, out Delegate function);\n    // 支持参数类型重载匹配\n}\n```\n\n**使用位置**：`src/Core/Scripting/FunctionRegistry.cs`\n\n### 1.6 TriggerDecoratorRegistry\n\n```csharp\n// 触发器修饰器注册表\npublic class TriggerDecoratorRegistry\n{\n    public void Register<T>(string name) where T : ITriggerDecorator, new();\n    public ITriggerDecorator Create(string name);\n    public bool Contains(string name);\n}\n```\n\n**使用位置**：`src/Core/Scripting/TriggerDecoratorRegistry.cs`\n\n### 1.7 GraphProgramRegistry\n\n```csharp\n// 图编译程序注册表\npublic class GraphProgramRegistry\n{\n    public void Register(string programId, GraphProgram program);\n    public GraphProgram Get(string programId);\n    public bool TryGet(string programId, out GraphProgram program);\n    public void RegisterCompiled(byte[] bytecode, string programId);\n    public GraphProgramPackage CreatePackage(IEnumerable<string> programIds);\n}\n```\n\n**使用位置**：`src/Core/GraphRuntime/GraphProgramRegistry.cs`\n\n---\n\n## 2. SystemGroup Phase 执行顺序\n\n```\nPhase 1: SchemaUpdate\n         └─ 组件架构更新，注册新组件类型\n\nPhase 2: InputCollection\n         └─ 收集输入事件，生成 InputCommand\n\nPhase 3: PostMovement\n         └─ 移动后处理，更新空间索引\n\nPhase 4: AbilityActivation\n         └─ GAS Ability 激活判定与触发\n\nPhase 5: EffectProcessing\n         └─ GAS Effect 生命周期处理（Apply/Update/Lifetime/Expire/Cleanup/Publish）\n\nPhase 6: RuntimeEntityBinding\n         └─ 运行时实体绑定，Performer ↔ ECS Entity 关联\n\nPhase 7: AttributeCalculation\n         └─ 属性重计算，AttributeSink 汇出\n\nPhase 8: DeferredTriggerCollection\n         └─ 收集延迟触发的事件\n\nPhase 9: Cleanup\n         └─ 清理标记删除的实体和组件\n\nPhase 10: EventDispatch\n          └─ 分发所有事件到订阅者\n\nPhase 11: ClearPresentationFlags\n          └─ 清除表现层标记，准备下一帧\n```\n\n**关键约束**：\n- `QueryDescription` 必须缓存为字段，禁止在循环体内 `new QueryDescription()`\n- `CommandBuffer` 在 Cleanup phase 前完成所有延迟操作\n- System 必须是无状态的，只读取/写入组件数据\n\n**使用位置**：`src/Core/Engine/GameEngine.cs`\n\n---\n\n## 3. GraphRuntime OpCode 速查\n\n### 3.1 核心限制\n\n```csharp\npublic static class GraphVmLimits\n{\n    public const int HandlerTableSize = 512;   // handler 表最大槽位\n    public const int RegisterCount = 64;       // 通用寄存器数量\n    public const int MaxCallDepth = 128;       // 最大调用深度\n    // 当前已用 opcode: 396 / 512\n}\n```\n\n### 3.2 指令格式\n\n```csharp\npublic struct GraphInstruction\n{\n    public ushort OpCode;      // 操作码（0-511）\n    public ushort Operand1;    // 操作数1：寄存器索引或立即数\n    public ushort Operand2;    // 操作数2\n    public ushort Operand3;    // 操作数3\n}\n```\n\n### 3.3 常用 OpCode 分类\n\n| 类别 | OpCode 范围 | 说明 |\n|------|-------------|------|\n| 常量加载 | 0x00-0x1F | 加载 Fix64/Int/Float/Bool/Entity 到寄存器 |\n| 算术运算 | 0x20-0x4F | Add/Sub/Mul/Div/Mod/Min/Max/Clamp/Neg/Abs |\n| 比较分支 | 0x50-0x6F | Eq/Neq/Lt/Le/Gt/Ge/Jump/JumpIfTrue/JumpIfFalse |\n| 属性访问 | 0x70-0x9F | GetAttribute/SetAttribute/GetTag/SetTag/AddTag/RemoveTag |\n| 效果操作 | 0xA0-0xCF | ApplyEffect/RemoveEffect/CloneEffect/StackEffect |\n| 目标解析 | 0xD0-0xEF | ResolveTarget/FilterTarget/DispatchTarget |\n| 调用返回 | 0xF0-0xFF | Call/Return/CallExternal/Abort |\n| 特殊操作 | 0x100-0x18F | 预留扩展（当前使用至 0x18C） |\n\n**完整 OpCode 定义**：`src/Core/NodeLibraries/GASGraph/GraphOps.cs`（396 个已定义 opcode）\n\n**编译器**：`src/Core/NodeLibraries/GASGraph/GraphCompiler.cs`（60+ case switch）\n\n**执行器**：`src/Core/GraphRuntime/GraphExecutor.cs`（38 行核心解释循环）\n\n---\n\n## 4. 核心接口速查\n\n### 4.1 Mod 扩展接口\n\n```csharp\npublic interface IMod\n{\n    void OnLoad(IModContext context);   // 必须无状态，只注册不执行逻辑\n}\n\npublic interface IModContext\n{\n    StringIntRegistry StringIntRegistry { get; }\n    SystemFactoryRegistry SystemFactoryRegistry { get; }\n    AbilityDefinitionRegistry AbilityDefinitionRegistry { get; }\n    FunctionRegistry FunctionRegistry { get; }\n    TriggerDecoratorRegistry TriggerDecoratorRegistry { get; }\n    PerformerDefinitionRegistry PerformerDefinitionRegistry { get; }\n    DataRegistry DataRegistry { get; }\n    VirtualFileSystem FileSystem { get; }\n    GameContext GameContext { get; }\n    \n    // 服务查找\n    T GetService<T>(ServiceKey<T> key);\n    bool TryGetService<T>(ServiceKey<T> key, out T service);\n}\n```\n\n**使用位置**：`src/Core/Modding/IMod.cs`, `src/Core/Modding/IModContext.cs`\n\n### 4.2 UI 渲染接口\n\n```csharp\npublic interface IUiSystem\n{\n    void Initialize(IUiRenderer renderer);\n    void Update(float deltaTime);\n    void Render();\n    void Shutdown();\n}\n\npublic interface IUiRenderer\n{\n    void DrawElement(UiElement element);\n    void DrawText(string text, Vector2 position, FontStyle style);\n    void DrawTexture(TextureId id, Rect dest, Color tint);\n    Vector2 MeasureText(string text, FontStyle style);\n    void SetClipRect(Rect rect);\n    void ClearClipRect();\n}\n```\n\n**使用位置**：`src/Core/UI/IUiSystem.cs`\n\n### 4.3 服务查找（ServiceKey）\n\n```csharp\n// 类型安全的全局服务查找键\npublic readonly struct ServiceKey<T>\n{\n    public string Name { get; }\n    public static ServiceKey<T> Create(string name);\n}\n\n// 核心预定义键（346 行常量，部分在 CoreServiceKeys，部分在 ContextKeys）\npublic static class CoreServiceKeys\n{\n    public static readonly ServiceKey<IGameEngine> GameEngine = ServiceKey<IGameEngine>.Create(\"engine.game\");\n    public static readonly ServiceKey<IWorldRuntime> WorldRuntime = ServiceKey<IWorldRuntime>.Create(\"world.runtime\");\n    public static readonly ServiceKey<IClockFoundation> ClockFoundation = ServiceKey<IClockFoundation>.Create(\"engine.clock\");\n    public static readonly ServiceKey<SpatialQueryService> SpatialQuery = ServiceKey<SpatialQueryService>.Create(\"spatial.query\");\n    public static readonly ServiceKey<NavQueryService> NavQuery = ServiceKey<NavQueryService>.Create(\"nav.query\");\n    public static readonly ServiceKey<VisionResolver> VisionResolver = ServiceKey<VisionResolver>.Create(\"vision.resolver\");\n    public static readonly ServiceKey<TriggerManager> TriggerManager = ServiceKey<TriggerManager>.Create(\"scripting.triggers\");\n    public static readonly ServiceKey<GraphProgramRegistry> GraphPrograms = ServiceKey<GraphProgramRegistry>.Create(\"graph.programs\");\n    // ... 340+ 更多键\n}\n```\n\n**使用位置**：`src/Core/Scripting/ServiceKey.cs`, `src/Core/Scripting/CoreServiceKeys.cs`\n\n> ⚠️ **注意**：`ContextKeys` 已逐步退场，新代码应使用 `CoreServiceKeys`。\n\n---\n\n## 5. 关键类型速查\n\n### 5.1 坐标与数学\n\n| 类型 | 用途 | 定义位置 |\n|------|------|----------|\n| `Fix64` | 64 位定点数，跨平台确定性 | `src/Core/Math/FixedPoint/` |\n| `Fix64Vec2` | Fix64 二维向量 | `src/Core/Math/FixedPoint/` |\n| `WorldCm` | 世界坐标（厘米） | `src/Core/Math/WorldUnits.cs` |\n| `WorldAabbCm` | 世界坐标 AABB | `src/Core/Math/WorldAabbCm.cs` |\n| `IntRect` | 整数屏幕矩形 | `src/Core/Math/IntRect.cs` |\n| `IntVector2` | 整数二维向量 | `src/Core/Math/IntVector2.cs` |\n| `HexCoordinates` | 六边形网格坐标（硬编码 EdgeLengthCm=400） | `src/Core/Map/Hex/HexCoordinates.cs` |\n\n### 5.2 实体与组件\n\n| 类型 | 用途 | 定义位置 |\n|------|------|----------|\n| `Entity` | Arch ECS 实体标识符 | `src/Core/Components/Components.cs` |\n| `ComponentType<T>` | 组件类型句柄 | `src/Core/Components/Components.cs` |\n| `QueryDescription` | 实体查询条件 | `src/Core/Engine/GameEngine.cs` |\n| `CommandBuffer` | 延迟 ECS 操作 | `src/Core/Engine/GameEngine.cs` |\n| `EntityTemplate` | 声明式实体模板 | `src/Core/Config/EntityTemplate.cs` |\n| `EntityBuilder` | 模板构建器 | `src/Core/Config/EntityBuilder.cs` |\n\n### 5.3 GAS 核心类型\n\n| 类型 | 用途 | 定义位置 |\n|------|------|----------|\n| `AbilityDefinition` | Ability 声明配置 | `src/Core/Gameplay/GAS/` |\n| `EffectDefinition` | Effect 声明配置 | `src/Core/Gameplay/GAS/` |\n| `AttributeDefinition` | Attribute 声明配置 | `src/Core/Gameplay/GAS/` |\n| `GameplayTag` | Tag 标识 | `src/Core/Gameplay/GAS/` |\n| `TargetResolver` | 三层目标解析器 | `src/Core/Gameplay/GAS/` |\n| `EffectPhase` | 效果阶段枚举 | `src/Core/Gameplay/GAS/` |\n| `AttributeSink` | 属性汇接口 | `src/Core/Gameplay/GAS/` |\n| `GameplayCue` | 表现事件 | `src/Core/Gameplay/Cue/` |\n\n### 5.4 表现层核心类型\n\n| 类型 | 用途 | 定义位置 |\n|------|------|----------|\n| `PerformerDefinition` | 视觉实体声明配置 | `src/Core/Presentation/Performers/` |\n| `BehaviorSlot` | 行为组合单元 | `src/Core/Presentation/Performers/BehaviorSlot.cs` |\n| `BehaviorKind` | 行为种类枚举 | `src/Core/Presentation/Performers/BehaviorSlot.cs` |\n| `PerformerCommand` | 命令 DTO | `src/Core/Presentation/Performers/PerformerCommand.cs` |\n| `PerformerCommandKind` | 命令种类枚举 | `src/Core/Presentation/Performers/PerformerCommandKind.cs` |\n| `PerformerCommandBuffer` | 环形命令缓冲 | `src/Core/Presentation/Performers/PerformerCommandBuffer.cs` |\n| `PerformerEntityRuntime` | 核心运行时（759 行） | `src/Core/Presentation/Performers/PerformerEntityRuntime.cs` |\n| `ChildPerformerRef` | 子 performer 引用 | `src/Core/Presentation/Performers/PerformerDefinition.cs` |\n| `ParamDefault` | 参数默认值 | `src/Core/Presentation/Performers/PerformerDefinition.cs` |\n| `ConditionRef` | 规则条件引用 | `src/Core/Presentation/Performers/ConditionRef.cs` |\n\n### 5.5 导航核心类型\n\n| 类型 | 用途 | 定义位置 |\n|------|------|----------|\n| `NavQueryService` | 寻路查询接口 | `src/Core/Navigation/NavQueryServiceRegistry.cs` |\n| `SpatialQueryService` | 空间查询接口（8 种模式） | `src/Core/Spatial/SpatialQueryService.cs` |\n| `MovePlanRuntimeService` | 移动规划运行时 | `src/Core/MovePlanning/MovePlanRuntimeService.cs` |\n| `MassNavigationSimulationRuntime` | 模拟 facade | `src/Core/MassNavigation/Runtime/` |\n| `MassNavigationRuntime` | 高层生命周期（命名混淆） | `src/Core/MassNavigation/Runtime/` |\n| `AutoPathService` | 自动路径规划 | `src/Core/Navigation/Pathing/` |\n\n### 5.6 持久化核心类型\n\n| 类型 | 用途 | 定义位置 |\n|------|------|----------|\n| `ISaveParticipant` | 自定义存档接口 | `src/Core/Persistence/ISaveParticipant.cs` |\n| `SaveParticipantRegistry` | 存档参与者注册表 | `src/Core/Persistence/SaveParticipantRegistry.cs` |\n| `WorldSnapshotService` | 快照创建 | `src/Core/Persistence/WorldSnapshotService.cs` |\n| `WorldRestoreService` | 快照恢复 | `src/Core/Persistence/WorldRestoreService.cs` |\n| `LudotsBinaryWorldSerializer` | 二进制序列化 | `src/Core/Persistence/LudotsBinaryWorldSerializer.cs` |\n| `SaveContainerCodec` | .ldsave 容器编解码 | `src/Core/Persistence/SaveContainerCodec.cs` |\n\n---\n\n## 6. 配置与管道速查\n\n### 6.1 ConfigPipeline 合并策略\n\n```csharp\npublic enum MergeStrategy\n{\n    DeepObject,      // 深度对象合并（递归属性覆盖）\n    ArrayById,       // 按 ID 字段合并数组元素\n    Replace,         // 完全替换\n    Append,          // 数组追加\n    Prepend,         // 数组前置\n    Multiply,        // 数值乘法\n    Add,             // 数值加法\n    Max,             // 取最大值\n    Min              // 取最小值\n}\n```\n\n**使用位置**：`src/Core/Config/ConfigPipeline.cs`\n\n### 6.2 严格 JSON 反序列化\n\n```csharp\npublic static class StrictJsonOptions\n{\n    public static JsonSerializerOptions Default { get; } = new JsonSerializerOptions\n    {\n        PropertyNameCaseInsensitive = false,   // 大小写敏感\n        PropertyNamingPolicy = JsonNamingPolicy.CamelCase,\n        ReadCommentHandling = JsonCommentHandling.Skip,\n        UnknownTypeHandling = JsonUnknownTypeHandling.JsonElement,\n        // 关键：拒绝未知属性\n        UnmappedMemberHandling = JsonUnmappedMemberHandling.Disallow\n    };\n}\n```\n\n**使用位置**：`src/Core/Config/StrictJsonOptions.cs`\n\n---\n\n## 7. 适配器层速查\n\n### 7.1 Raylib 适配器\n\n| 类型 | 职责 | 行数 | 位置 |\n|------|------|------|------|\n| `RaylibGameHost` | 游戏主机入口 | ~200 | `src/Adapters/Raylib/.../RaylibGameHost.cs` |\n| `RaylibHostComposer` | 组合初始化 | ~300 | `src/Adapters/Raylib/.../RaylibHostComposer.cs` |\n| `RaylibHostLoop` | 主循环 | 1996 | `src/Adapters/Raylib/.../RaylibHostLoop.cs` |\n| `DesktopUiSystem` | 桌面 UI 系统 | ~400 | `src/Adapters/Raylib/.../UI/DesktopUiSystem.cs` |\n| `RaylibCameraAdapter` | 相机适配 | ~150 | `src/Adapters/Raylib/.../Services/RaylibCameraAdapter.cs` |\n| `RaylibViewController` | 视图控制 | ~200 | `src/Adapters/Raylib/.../Services/RaylibViewController.cs` |\n| `RaylibBrowserLayerRenderer` | 浏览器层渲染 | ~100 | `src/Adapters/Raylib/.../RaylibBrowserLayerRenderer.cs` |\n| `RaylibOverlayCompositor` | 叠加层合成 | ~150 | `src/Adapters/Raylib/.../RaylibOverlayCompositor.cs` |\n\n### 7.2 Web 适配器\n\n| 类型 | 职责 | 位置 |\n|------|------|------|\n| `WebGameHost` | Web 游戏主机入口 | `src/Adapters/Web/.../WebGameHost.cs` |\n| `WebHostComposer` | 组合初始化 | `src/Adapters/Web/.../WebHostComposer.cs` |\n| `WebHostLoop` | 主循环 | `src/Adapters/Web/.../WebHostLoop.cs` |\n| `WebCameraAdapter` | 相机适配 | `src/Adapters/Web/.../Services/WebCameraAdapter.cs` |\n| `WebInputBackend` | 输入后端（IME 未实现） | `src/Adapters/Web/.../Services/WebInputBackend.cs` |\n| `WebViewController` | 视图控制 | `src/Adapters/Web/.../Services/WebViewController.cs` |\n| `WebTransportLayer` | 帧传输（全量复制广播） | `src/Adapters/Web/.../Streaming/WebTransportLayer.cs` |\n| `FrameProtocol` | 服务器帧协议 | `src/Adapters/Web/.../Protocol/FrameProtocol.cs` |\n| `BinaryFrameEncoder` | 二进制编码 | `src/Adapters/Web/.../Streaming/BinaryFrameEncoder.cs` |\n| `DeltaCompressor` | 增量压缩 | `src/Adapters/Web/.../Streaming/DeltaCompressor.cs` |\n| `PresentationExtractor` | 帧数据提取 | `src/Adapters/Web/.../Streaming/PresentationExtractor.cs` |\n| `WebUiRuntimeBridge` | UI 桥接 | `src/Adapters/Web/.../Services/WebUiRuntimeBridge.cs` |\n\n### 7.3 UE5 适配器\n\n> ⚠️ **空壳**：`src/Adapters/UE5/` 目录下无实际源码，仅有占位文件。\n\n---\n\n## 8. 日志系统速查\n\n```csharp\npublic static class Log\n{\n    public static void Debug(string message);\n    public static void Info(string message);\n    public static void Warning(string message);\n    public static void Error(string message);\n    public static void Fatal(string message);   // 致命错误，触发崩溃\n    \n    // 通道化日志\n    public static ILogChannel Channel(string name);\n    \n    // 插值字符串优化（零分配）\n    public static void Info([InterpolatedStringHandler] LogInterpolatedStringHandler message);\n}\n\npublic enum LogLevel\n{\n    Debug, Info, Warning, Error, Fatal\n}\n\npublic interface ILogBackend\n{\n    void Write(LogLevel level, string channel, string message);\n}\n```\n\n**后端实现**：`ConsoleLogBackend`, `FileLogBackend`, `MultiLogBackend`, `NullLogBackend`\n\n**使用位置**：`src/Core/Diagnostics/Log.cs`\n\n---\n\n## 9. 命令系统速查\n\n```csharp\npublic abstract class GameCommand\n{\n    public abstract void Execute(GameContext context);\n    public virtual bool CanExecute(GameContext context) => true;\n    public virtual void Undo(GameContext context) { }\n}\n\n// 常用命令\npublic class LoadMapCommand : GameCommand        // 加载地图\npublic class SpawnEntityCommand : GameCommand     // 生成实体\npublic class ShowUiCommand : GameCommand          // 显示 UI\npublic class AnchorCommand : GameCommand          // 锚点操作\npublic class WaitCommand : GameCommand            // 等待（协程）\npublic class DelegateCommand : GameCommand        // 委托包装\npublic class EntityCommandPanelCommands : GameCommand // 实体命令面板\n```\n\n**使用位置**：`src/Core/Commands/`\n\n---\n\n## 10. 常用文件路径索引\n\n| 类别 | 关键文件 | 说明 |\n|------|----------|------|\n| 引擎入口 | `src/Core/Engine/GameEngine.cs` | 2967 行，核心引擎主类 |\n| 引擎入口 | `src/Core/Engine/GameContext.cs` | 全局服务容器 |\n| 引擎入口 | `src/Core/Engine/TimeFlow/` | 统一时间域系统 |\n| 引擎入口 | `src/Core/Engine/ClockFoundation.cs` | 5 域离散时钟 |\n| GAS 核心 | `src/Core/Gameplay/GAS/` | 技能-效果-属性系统 |\n| GAS 图 | `src/Core/GraphRuntime/` | 图 VM 执行环境 |\n| GAS 图编译 | `src/Core/NodeLibraries/GASGraph/GraphCompiler.cs` | 图编译器 |\n| 表现层 | `src/Core/Presentation/Performers/` | Performer 系统 |\n| 表现层 | `src/Core/Presentation/Systems/PerformerEmitSystem.cs` | 1887 行大文件 |\n| 表现层 | `src/Core/Presentation/Minimap/` | 66058 行大文件 |\n| 输入 | `src/Core/Input/Orders/` | 指令系统 |\n| 输入 | `src/Core/Input/Selection/` | 选择系统 |\n| 导航 | `src/Core/Navigation/` | 寻路系统 |\n| 导航 | `src/Core/MassNavigation/` | 大规模导航 |\n| 导航 | `src/Core/MovePlanning/` | 移动规划 |\n| 空间 | `src/Core/Spatial/SpatialQueryService.cs` | 8 种查询模式 |\n| 空间 | `src/Core/Spatial/ChunkedGridSpatialPartitionWorld.cs` | Chunk 空间分区 |\n| 物理 | `src/Core/Ludots.Physics2D/` | Fix64 2D 物理引擎 |\n| 视野 | `src/Core/Vision/VisionResolver.cs` | 视野与迷雾 |\n| 视野 | `src/Core/Vision/FogLayerRegistry.cs` | 32 位迷雾层 |\n| 地图 | `src/Core/Map/MapManager.cs` | 地图管理 |\n| 地图 | `src/Cor function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
