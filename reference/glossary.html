.main li { margin: 4px 0; }

.main th, .main td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.main th { background: var(--accent-light); font-weight: 600; }
.main tr:nth-child(even) { background: rgba(0,0,0,0.02); }
.main pre { background: var(--code-bg); padding: 16px; border-radius: 6px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
.main code { font-family: "SF Mono", "Cascadia Mono", Consolas, monospace; background: var(--code-bg); padding: 2px 6px; border-radius: 3px; font-size: 0.92em; }
.main pre code { padding: 0; background: transparent; }
.main blockquote { border-left: 3px solid var(--accent); margin: 16px 0; padding: 8px 16px; background: var(--accent-light); color: var(--muted); }
.main hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
@media (max-width: 900px) { .sidebar { width: 100%; position: relative; height: auto; border-right: none; border-bottom: 1px solid var(--border); } .main { margin-left: 0; } .container { flex-direction: column; } }</style>

const currentPage = "reference/glossary.html";
const mdContent = "# Ludots 术语表\n\n> 基于代码反推生成的全项目术语表。  \n> 生成时间：2025-07-02\n\n---\n\n## ECS\n\n| 中文 | 英文 | 定义 | 首次出现 |\n|------|------|------|----------|\n| ECS | Entity-Component-System | Arch ECS 是 Ludots 的底层实体系统，提供 Chunk-based SoA 存储。 | `src/Core/Engine/GameEngine.cs` |\n| 实体 | Entity | 游戏世界中一切对象的唯一标识符，本身不含数据。 | `src/Core/Components/Components.cs` |\n| 组件 | Component | 附着在 Entity 上的数据片段，必须是 blittable struct。 | `src/Core/Components/Components.cs` |\n| 系统 | System | 按 SystemGroup phase 执行的逻辑处理器，处理满足 Query 条件的 Entity 集合。 | `src/Core/Engine/GameEngine.cs` |\n| 系统组 | SystemGroup | 定义 System 执行顺序的 10+ 个 phase 集合。 | `src/Core/Engine/GameEngine.cs` |\n| 查询描述 | QueryDescription | Arch ECS 的实体查询条件，必须缓存为字段避免循环中新建。 | `src/Core/Engine/GameEngine.cs` |\n| 命令缓冲 | CommandBuffer | 用于安全地修改 ECS 结构的延迟操作队列。 | `src/Core/Engine/GameEngine.cs` |\n| 实体模板 | EntityTemplate | 声明式实体配置模板，用于批量生成同构实体。 | `src/Core/Config/EntityTemplate.cs` |\n| 实体构建器 | EntityBuilder | 从配置模板构建 ECS Entity 的类。 | `src/Core/Config/EntityBuilder.cs` |\n| 批量生成器 | TemplateEntityBatchSpawner | 基于 EntityTemplate 批量生成 Entity 的工具。 | `src/Core/Config/TemplateEntityBatchSpawner.cs` |\n\n## GAS\n\n| 中文 | 英文 | 定义 | 首次出现 |\n|------|------|------|----------|\n| GAS | Gameplay Ability System | 技能-效果-属性系统，Ludots 的核心 gameplay 框架。 | `src/Core/Gameplay/GAS/` |\n| 能力 | Ability | 可由玩家或 AI 激活的技能定义，含 Cost、Cooldown、Target 等。 | `src/Core/Gameplay/GAS/` |\n| 效果 | Effect | Ability 激活后产生的状态修改，如伤害、治疗、增益。 | `src/Core/Gameplay/GAS/` |\n| 属性 | Attribute | Entity 的数值状态，如 HP、MP、攻击力。 | `src/Core/Gameplay/GAS/` |\n| 标签 | Tag | Entity 的布尔标记，用于 Query 和能力条件判断。 | `src/Core/Gameplay/GAS/` |\n| 表现事件 | Cue | Gameplay 中触发表现层响应的事件，如播放音效、粒子。 | `src/Core/Gameplay/Cue/` |\n| 目标解析器 | TargetResolver | 三层目标解析：Query → Filter → Dispatch。 | `src/Core/Gameplay/GAS/` |\n| 效果阶段 | EffectPhase | Effect 执行的 6 个阶段：Apply → Update → Lifetime → Expire → Cleanup → Publish。 | `src/Core/Gameplay/GAS/` |\n| 属性汇 | AttributeSink | Attribute 计算后的数据汇出接口，用于驱动 UI 或其他系统。 | `src/Core/Gameplay/GAS/` |\n| 内置处理器 | BuiltinHandler | GAS 内置的 64 槽效果处理器，如 Damage、Heal、ApplyTag。 | `src/Core/Gameplay/GAS/` |\n\n## Infrastructure\n\n| 中文 | 英文 | 定义 | 首次出现 |\n|------|------|------|----------|\n| 注册表 | Registry | Ludots 的核心扩展机制，用于按字符串键注册和查找类型/定义。 | `src/Core/Registry/` |\n| 系统工厂注册表 | SystemFactoryRegistry | Mod 注册自定义 System 的正式入口。 | `src/Core/Engine/SystemFactoryRegistry.cs` |\n| 字符串-整数注册表 | StringIntRegistry | 基础 Registry，将字符串键映射到紧凑整数 ID。 | `src/Core/Registry/StringIntRegistry.cs` |\n| 数据注册表 | DataRegistry | 泛型数据注册表，按字符串键存储任意类型数据。 | `src/Core/Config/DataRegistry.cs` |\n| 配置管线 | ConfigPipeline | 合并运行时配置的核心管线，支持 DeepObject、ArrayById 等策略。 | `src/Core/Config/ConfigPipeline.cs` |\n| 严格JSON选项 | StrictJsonOptions | JSON 反序列化的严格模式配置，拒绝未知属性。 | `src/Core/Config/StrictJsonOptions.cs` |\n\n## Modding\n\n| 中文 | 英文 | 定义 | 首次出现 |\n|------|------|------|----------|\n| 模组 | Mod | Ludots 的功能扩展单元，通过 IMod.OnLoad 注册能力。 | `src/Core/Modding/IMod.cs` |\n| Mod 上下文 | IModContext | Mod 加载时接收的扩展 API 上下文。 | `src/Core/Modding/IModContext.cs` |\n| Mod 加载器 | ModLoader | 扫描、解析、排序并加载 Mod 的核心类。 | `src/Core/Modding/ModLoader.cs` |\n| Mod 加载上下文 | ModLoadContext | 支持 ALC 隔离的 Mod 程序集加载上下文。 | `src/Core/Modding/ModLoadContext.cs` |\n| 虚拟文件系统 | VFS | 按 ModId:Path 前缀挂载的资源访问层。 | `src/Core/Modding/VirtualFileSystem.cs` |\n| 程序集加载上下文 | ALC | Assembly Load Context，Mod 程序集的隔离加载机制，支持卸载。 | `src/Core/Modding/ModLoadContext.cs` |\n| 依赖解析器 | DependencyResolver | 基于 SemVer 的 Mod 依赖拓扑排序器。 | `src/Core/Modding/DependencyResolver.cs` |\n| Mod 清单 | ModManifest | Mod 的元数据描述（mod.json 的内存表示）。 | `src/Core/Modding/ModManifest.cs` |\n\n## Scripting\n\n| 中文 | 英文 | 定义 | 首次出现 |\n|------|------|------|----------|\n| 触发器 | Trigger | 脚本事件系统中的触发单元，可绑定到 GameEvents。 | `src/Core/Scripting/Trigger.cs` |\n| 触发器管理器 | TriggerManager | 事件分发和触发器调度的核心。 | `src/Core/Scripting/TriggerManager.cs` |\n| 触发器构建器 | TriggerBuilder | 链式构建 Trigger 的 Fluent API。 | `src/Core/Scripting/TriggerBuilder.cs` |\n| 触发器修饰器 | TriggerDecorator | 对触发器行为进行 AOP 修饰的扩展点。 | `src/Core/Scripting/TriggerDecoratorRegistry.cs` |\n| 函数注册表 | FunctionRegistry | 脚本函数注册表，支持 last-wins 覆盖。 | `src/Core/Scripting/FunctionRegistry.cs` |\n| 脚本上下文 | ScriptContext | 触发器/函数执行时的上下文环境，提供服务查找。 | `src/Core/Scripting/ScriptContext.cs` |\n| 服务键 | ServiceKey | 类型安全的全局服务查找键。 | `src/Core/Scripting/ServiceKey.cs` |\n| 核心服务键 | CoreServiceKeys | 346 行 typed key 常量集合。 | `src/Core/Scripting/CoreServiceKeys.cs` |\n| 游戏事件 | GameEvents | 预定义的游戏生命周期事件枚举。 | `src/Core/Scripting/GameEvents.cs` |\n| 上下文键 | ContextKeys | 已逐步退场的旧版上下文键，由 CoreServiceKeys 替代。 | `src/Core/Scripting/ContextKeys.cs` |\n\n## GraphRuntime\n\n| 中文 | 英文 | 定义 | 首次出现 |\n|------|------|------|----------|\n| 图运行时 | GraphRuntime | GAS 的图虚拟机执行环境，含 133+ opcodes。 | `src/Core/GraphRuntime/` |\n| 图执行器 | GraphExecutor | 图 VM 的解释执行器，38 行核心循环。 | `src/Core/GraphRuntime/GraphExecutor.cs` |\n| 图编译器 | GraphCompiler | 将图节点编译为 VM opcode 的编译器，60+ case switch。 | `src/Core/NodeLibraries/GASGraph/GraphCompiler.cs` |\n| 图程序注册表 | GraphProgramRegistry | 存储编译后图程序的字节码注册表。 | `src/Core/GraphRuntime/GraphProgramRegistry.cs` |\n| 图程序包 | GraphProgramPackage | 图程序的序列化包格式。 | `src/Core/GraphRuntime/GraphProgramPackage.cs` |\n| 图指令 | GraphInstruction | VM 单条指令，含 opcode 和 3 个操作数。 | `src/Core/GraphRuntime/GraphInstruction.cs` |\n| 图虚拟机限制 | GraphVmLimits | VM 的 handler 表大小（512）、寄存器数量等限制。 | `src/Core/NodeLibraries/GASGraph/GraphVmLimits.cs` |\n| 图节点操作 | GraphNodeOp | 图节点操作枚举，当前用到 396 个 opcode。 | `src/Core/NodeLibraries/GASGraph/GraphOps.cs` |\n| 图诊断码 | GraphDiagnosticCodes | 图编译和执行的诊断错误码集合。 | `src/Core/NodeLibraries/GASGraph/GraphDiagnostics.cs` |\n| GAS 图运行时 API | GasGraphRuntimeApi | GAS 图节点与 GraphRuntime 的桥接 API。 | `src/Core/NodeLibraries/GASGraph/` |\n\n## Math\n\n| 中文 | 英文 | 定义 | 首次出现 |\n|------|------|------|----------|\n| 64位定点数 | Fix64 | 跨平台确定性数值类型，用于 gameplay 数值计算。 | `src/Core/Math/FixedPoint/` |\n| 64位定点数二维向量 | Fix64Vec2 | Fix64 的二维向量形式。 | `src/Core/Math/FixedPoint/` |\n| 世界坐标 | WorldCm | 以厘米为单位的世界坐标系统。 | `src/Core/Math/WorldUnits.cs` function buildNav() {
  let html = '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      html += '<a href="' + href + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
