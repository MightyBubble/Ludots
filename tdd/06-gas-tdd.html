const mdContent = "# GAS 子系统技术设计文档（TDD）\n\n> 文档编号：TDD-06  \n> 对应模块：`src/Core/Gameplay/GAS/` 及关联子域（Items、Exchange、Teams、Cue、AI、Relationships、Progression、Spawning、Narrative）  \n> 依据 Stage 1 扫描报告：`report_Gameplay_GAS.md`  \n> 版本：基于分支 `codex/issue437-graph-config`\n\n---\n\n## 1. 设计目标\n\nGameplay Ability System（GAS）是 Ludots 引擎的 **Gameplay 语义核心**，负责将能力（Ability）、效果（Effect）、属性（Attribute）、标签（Tag）等概念转化为基于 Arch ECS 的确定性仿真管线。其设计目标如下：\n\n| 目标 | 约束 |\n|------|------|\n| **0-GC 热路径** | 所有高频数据结构使用 `unsafe struct`、固定数组、bitset、SoA 布局，运行时无堆分配 |\n| **加载期编译、运行时只读** | 配置数据通过 Registry 在加载期编译为密集数组，运行时仅执行索引查询 |\n| **分层管线严格** | Ability → EffectRequest → EffectProcessing → AttributeCalculation → Sink → DeferredTrigger，禁止跨层直接写状态 |\n| **Mod 可扩展** | 通过 `BuiltinHandlerRegistry`、`AttributeSinkRegistry`、`ExtensionAttributeRegistry`、`PhaseHandler` 支持 Mod 运行时扩展 |\n| **确定性回放** | 固定帧/回合驱动，所有输入走 `OrderBufferSystem`，状态变更通过 `GasRuntimeState` 单例统一协调 |\n\n---\n\n## 2. 数据模型与核心接口\n\n### 2.1 EffectPhase 生命周期\n\nEffect 从创建到销毁经历 **6 个严格顺序的 Phase**，由 `EffectPhaseExecutor` 驱动。每个 Phase 对应一组 `BuiltinHandler` 或 `PhaseHandler(GraphProgram)` 的调用。\n\n| Phase | 职责 | 调用时机 | 关键 Handler |\n|-------|------|----------|-------------|\n| **Apply** | 初始化 Effect 组件，打开 Proposal 窗口 | `EffectRequest` 被消费时 | `OnPropose` → `ResponseChain` → `OnCalculate` → `OnApply` / `OnCommit` |\n| **Update** | 更新 Effect 状态（堆叠、Duration、Period） | 每固定帧 | `EffectStack`、`EffectLifetimeMarkers` 更新 |\n| **Lifetime** | 周期性 Tick 与过期检查 | 每固定帧 | `EffectPeriodicTickSystem`、`EffectExpirationSystem` |\n| **Expire** | 标记 Effect 为过期，触发 Remove 事件 | Duration/Period 耗尽时 | `OnExpire` listener |\n| **Cleanup** | 撤销属性修改、移除 Granted Tags | Expire 后立即执行 | `AttributeMutationOps` 回滚、`EffectTagContributionHelper` 清理 |\n| **Publish** | 向 `DeferredTriggerQueue` 和 `GameplayEventBus` 发布变更事件 | Cleanup 后 | `DeferredTriggerDispatchSystem` 收集 |\n\n> **Phase 绑定机制**：`EffectPhaseGraphBindings` 组件支持最大 **16 步** 的 Phase 图绑定，`EffectPhaseListenerBuffer` 支持每个 Effect 最多 **8 个** 阶段监听器。全局阶段监听由 `GlobalPhaseListenerRegistry` 提供（最大 **32 个**）。\n\n### 2.2 AttributeCalc：属性计算与 Sink 落地\n\n属性计算采用 **Source → Aggregation → Sink** 三层模型：\n\n```\n[Base Value] + [Effect Modifiers] → AttributeAggregationSystem → AttributeBuffer.Current\n                                                             ↓\n                                                    AttributeBindingSystem\n                                                             ↓\n                                                    [AttributeSinkRegistry] → Physics2D / UI / Nav / ...\n```\n\n| 组件/类型 | 路径 | 说明 |\n|----------|------|------|\n| `AttributeBuffer` | `Components/AttributeBuffer.cs` | 0GC 属性缓冲，**64 个 float**，每个属性含 Base/Cap/Current 三值 |\n| `AttributeAggregateDirty` | `Components/AttributeAggregateDirty.cs` | 聚合脏标记，触发重新计算 |\n| `AttributeDerivedGraphBinding` | `Components/AttributeDerivedGraphBinding.cs` | 派生属性图绑定（公式驱动的 Secondary Attribute） |\n| `AttributeBindingRegistry` | `Bindings/AttributeBindingRegistry.cs` | 属性绑定注册表（Source → Target 映射），`Freeze()` 后不可变 |\n| `AttributeSinkRegistry` | `Bindings/AttributeSinkRegistry.cs` | Sink 注册表，支持跨层属性落地 |\n| `GasAttributeSinks` | `Bindings/GasAttributeSinks.cs` | 内建 Sink 注册入口（`RegisterAll(AttributeSinkRegistry)`） |\n| `ForceInput2DSink` | `Bindings/ForceInput2DSink.cs` | 物理力输入 Sink（跨层边界示例） |\n| `AttributeSchemaUpdateQueue` | `AttributeSchemaUpdateQueue.cs` | 属性 Schema 热更新队列 |\n\n### 2.3 TargetResolver：三层目标解析\n\nEffect 模板的目标解析遵循 **Query → Filter → Dispatch** 三层模型：\n\n```\nEffectTemplateData.TargetQuery      (BuiltinSpatial / GraphProgram)\n        ↓\nTargetResolverFanOutHelper.ResolveTargets(...)  → 候选实体数组\n        ↓\nEffectTemplateData.TargetFilter      (RelationshipFilter / LayerMask / MaxTargets)\n        ↓\nTargetResolverFanOutHelper.ValidateAndCollect(...)  → 有效目标\n        ↓\nEffectTemplateData.TargetDispatch    (PayloadEffectTemplateId + ContextMapping)\n        ↓\n为每个 resolved target 创建新的 EffectRequest\n```\n\n支持的 `TargetResolverKind`：`None`（1:1）、`BuiltinSpatial`（圆/锥/矩形/线/环）、`GraphProgram`（图 VM 逻辑）。\n\n支持的 `ContextSlot`：`OriginalSource`、`OriginalTarget`、`OriginalTargetContext`、`ResolvedEntity`。\n\n### 2.4 BuiltinHandler：64 槽内置处理器\n\n`BuiltinHandlerRegistry` 提供 **64 个固定槽位** 的处理器注册表，引擎在启动期通过 `BuiltinHandlers.RegisterAll` 注册 **11 个默认 handler**。处理器委托签名：\n\n```csharp\ndelegate void BuiltinHandlerFn(\n    World world, Entity entity, \n    ref EffectContext context, \n    in EffectConfigParams configParams, \n    in EffectTemplateData templateData\n);\n```\n\n`BuiltinHandlerRuntimeScope` 提供运行时上下文：`SpatialQueries`、`FanOutBudget`、`SpawnRequests`、`Exchange`、`ProgressionEvaluator` 等。\n\n已注册的 Preset 类型 handler 覆盖：`Search`、`PeriodicSearch`、`LaunchProjectile`、`CreateUnit`、`Displacement`、`Relation`、`Exchange`、`CompleteProgression` 等。\n\n### 2.5 Cue：表现事件系统\n\n`GameplayCueSystem` 是 ECS 查询驱动的表现事件系统，每帧扫描 `GameplayEvent` 组件并生成 `CueDescriptor`。\n\n| 类型 | 路径 | 说明 |\n|------|------|------|\n| `GameplayCueSystem` | `Cue/GameplayCueSystem.cs` | 核心系统：`Update(float)` 查询 GameplayEvent → 生成 CueDescriptor |\n| `CueDescriptor` | `Cue/CueDescriptor.cs` | 表现事件描述：`CueTagId`、`Position`、`Rotation`、`Scale`、`Source`、`Target`、`AssetId` |\n| `CueEventBuffer` | `Cue/CueEventBuffer.cs` | 表现事件环形缓冲：`TryAdd(...)`、`Clear()` |\n\n> **当前限制**：`GameplayCueSystem` 硬编码了 `EventTagId == CueTagId` 的假设（Primitive 阶段残留）；Loop Cue 处理尚未实现。\n\n---\n\n## 3. 关键算法与流程\n\n### 3.1 GAS 主循环数据流\n\n```\n[Input / OrderQueue / AbilityActivation]\n    ↓\nAbilitySystem / AbilityExecSystem\n    ↓ (发布 EffectRequest)\nEffectRequestQueue (双缓冲 + overflow)\n    ↓\nEffectProcessingLoopSystem\n    ├── ProposalAndApply 阶段\n    │   ├── EffectProposalProcessingSystem\n    │   │   ├── OnPropose (打开响应链窗口)\n    │   │   ├── ResponseChain (TagRule + 预算控制)\n    │   │   ├── OnCalculate (Resolve 后修正)\n    │   │   └── OnApply / OnCommit (ApplyModifiers + 结构变更)\n    │   └── EffectApplicationSystem (分 stage 执行，含 listener 延迟回放)\n    ├── Lifetime 阶段\n    │   └── 周期 tick / 过期检查 / 移除\n    └── PostLifetimeProposalAndApply (Duration 结束后的收尾)\n    ↓\nAttributeCalculation (SystemGroup phase)\n    ├── AttributeAggregationSystem\n    └── AttributeBindingSystem (Sink 落地：Physics2D / UI / Nav ...)\n    ↓\nDeferredTriggerCollection (SystemGroup phase)\n    └── DeferredTriggerQueue → 触发下一帧的 GameplayEvent / EffectRequest\n```\n\n### 3.2 能力激活到效果执行\n\n```\n玩家输入 / AI OrderIntent\n    ↓\nOrderBufferSystem (校验 + 排队)\n    ↓\nAbilitySystem 或 AbilityExecSystem\n    ├── 校验 ActivationBlockTags / ActivationPrecondition / Cooldown\n    ├── 解析 Target (ContextGroup / TargetResolver)\n    └── 按 AbilityExecSpec 时间线逐 tick 发射 EffectClip / EffectSignal / TagClip / EventSignal / GraphSignal\n        ↓\nEffectRequestQueue.Publish(new EffectRequest { Source, Target, TemplateId, ... })\n        ↓\nEffectProcessingLoopSystem 消费 Request\n```\n\n### 3.3 Exchange 原子结算管线\n\n```\n调用方：ExchangeRuntime.TryExecute(operationId, context)\n    ↓\n1. 解析 operation (先查 scoped，再查 static)\n    ↓\n2. Validate\n    ├── 校验每个 Input (ItemStack / AttributeCost)\n    ├── 校验 RelationshipRequirements\n    └── 校验每个 Output (CreateItem / MoveItem / EffectRequest) 并累计 reservation\n    ↓\n3. Apply Inputs\n    ├── InventoryRuntimeService.ConsumeStackUnits(...) 或 AttributeBuffer 扣值\n    └── 失败 → Rollback (恢复已扣属性/已消费物品)\n    ↓\n4. Apply Item Outputs\n    ├── InventoryRuntimeService.TryCreateAndPlaceItem(...) (CreateItem)\n    ├── InventoryRuntimeService.TryTransferItem(...) (MoveItem)\n    └── 失败 → Rollback (销毁已创建、恢复已移动/已消费)\n    ↓\n5. Publish Effects (EffectRequestQueue)\n    └── 对 EffectRequest 类型的 output 发布 EffectRequest\n```\n\n### 3.4 AI 决策到 Order 提交\n\n```\nUtilityAiThinkScheduleSystem\n    ↓ (按 profile 的 DecisionIntervalSteps 调度)\nUtilityAiDecisionSystem\n    ├── UtilityAiRuntimeEvaluator.TryEvaluate(...)\n    │   ├── 按 profile 遍历 decisions\n    │   ├── 预过滤 (TargetFilter / PreconditionGraph / CombatMemory)\n    │   ├── 考虑项打分 (Consideration → Normalization → Curve)\n    │   └── 选出最佳候选\n    └── UtilityAiRuntimeEvaluator.TrySubmitTasks(...)\n        └── 提交 Order 到 OrderQueue (或 ability 意图)\n    ↓\nOrderBufferSystem (消费 Order，驱动 GAS / Navigation / ...)\n```\n\n---\n\n## 4. 性能约束\n\n| 约束项 | 数值/规则 | 说明 |\n|--------|-----------|------|\n| EffectModifiers 上限 | **8 个** | `EffectModifiers` 组件固定 8 个 `ModifierData`（attrId + op + value） |\n| ActiveEffect 上限 | **32 个** | `ActiveEffectContainer` 每个实体最多 32 个活跃 Effect 引用 |\n| 能力槽位 | **8 基础 + 8 临时 + 8 形态** | `AbilityStateBuffer`、`GrantedSlotBuffer`、`AbilityFormSlotBuffer` |\n| GameplayTag bitset | **256 位（4×ulong）** | `GameplayTagContainer` 固定 bitset，不支持动态扩展 |\n| TagRule 容量 | **256 个（MaxCoreTags）** | `TagRuleRegistry` 固定容量 |\n| Effect 模板 | **4096 个** | `EffectTemplateRegistry` 固定 4096，ulong bitset 存在性 |\n| 能力定义 | **4096 起，动态扩容** | `AbilityDefinitionRegistry` 动态数组，2 倍扩容 |\n| 扩展属性 | **10001–20000（1000 上限）** | `ExtensionAttributeRegistry` 供 Mod 注册扩展属性 |\n| 全局阶段监听 | **32 个** | `GlobalPhaseListenerRegistry` 固定容量 |\n| 内建 Handler | **64 个** | `BuiltinHandlerRegistry` 固定槽位 |\n| 属性黑板 | **32 槽/类型** | `BlackboardFloatBuffer`、`BlackboardIntBuffer`、`BlackboardEntityBuffer`、`BlackboardSpatialBuffer` 各 32 槽 |\n| 效果参数 | **最大 32 键值对** | `EffectConfigParams` 最大 32 个键值对 |\n| Phase 图绑定 | **最大 16 步** | `EffectPhaseGraphBindings` 最大 16 步 |\n| Phase 监听器 | **最大 8 个** | `EffectPhaseListenerBuffer` 最大 8 个 |\n| 0-GC 要求 | **全部 System 热路径** | `EffectRequestQueue`、`EffectProcessingLoopSystem`、`AttributeAggregationSystem`、`AttributeBindingSystem` 等均禁止堆分配 |\n\n---\n\n## 5. 扩展契约\n\n| 扩展点 | 接口/委托 | 注册时机 | 约束 |\n|--------|----------|----------|------|\n| **自定义 Handler** | `BuiltinHandlerFn` | 启动期 `BuiltinHandlerRegistry.Register` | 必须线程安全，不可修改 World 结构（仅可通过 EffectContext 写） |\n| **自定义 Sink** | `AttributeSink` | 加载期 `AttributeSinkRegistry.Register` | `Apply(World, Entity, AttributeBuffer)` 签名，禁止堆分配 |\n| **扩展属性** | `ExtensionAttributeRegistry.Register(string fullName)` | Mod 运行时 | 范围 10001–20000，最多 1000 个 |\n| **自定义 AI 任务节点** | `ITaskNode` | 加载期 `TaskNodeRegistry.Register` | `Execute()` / `Abort()` 签名 |\n| **自定义图遍历策略** | `INodeGraphTraversalPolicy` | 加载期 | `IsNodeAllowed`、`IsEdgeAllowed`、`GetEdgeCost`、`GetHeuristic` |\n| **自定义 Exchange 操作** | `ExchangeOperationRegistry.Register` | 加载期 | 原子结算，失败自动回滚 |\n| **Mod 能力定义** | `AbilityDefinitionRegistry.RegisterFromEntity` | Mod 加载期 | 从模板实体读取定义 |\n\n---\n\n## 6. 关键类清单（带文件路径）\n\n### 6.1 GAS 核心\n\n| 类/接口 | 文件路径 | 职责 |\n|---------|----------|------|\n| `GasController` | `src/Core/Gameplay/GAS/GasController.cs` | GAS 固定帧/回合驱动器 |\n| `GasRuntimeState` | `src/Core/Gameplay/GAS/GasRuntimeState.cs` | 单例 ECS 状态组件 |\n| `GameplayEffectFactory` | `src/Core/Gameplay/GAS/GameplayEffectFactory.cs` | Effect 实体工厂 |\n| `EffectRequestQueue` | `src/Core/Gameplay/GAS/EffectRequestQueue.cs` | EffectRequest 双缓冲队列 |\n| `GameplayEventBus` | `src/Core/Gameplay/GAS/GameplayEventBus.cs` | GameplayEvent 双缓冲总线 |\n| `DeferredTriggerQueue` | `src/Core/Gameplay/GAS/DeferredTriggerQueue.cs` | 延迟触发器队列 |\n| `GasBudget` | `src/Core/Gameplay/GAS/GasBudget.cs` | 每帧预算与溢出统计 |\n| `GasClocks` | `src/Core/Gameplay/GAS/GasClocks.cs` | GAS 时钟域适配器 |\n| `AttributeMutationOps` | `src/Core/Gameplay/GAS/AttributeMutationOps.cs` | 属性修改 Apply |\n| `TargetResolverFanOutHelper` | `src/Core/Gameplay/GAS/TargetResolverFanOutHelper.cs` | 三层目标解析辅助 |\n| `ConfigParamsMerger` | `src/Core/Gameplay/GAS/ConfigParamsMerger.cs` | 模板参数与 CallerParams 合并 |\n\n### 6.2 Registry 与定义层\n\n| 类/接口 | 文件路径 | 职责 |\n|---------|----------|------|\n| `AbilityDefinitionRegistry` | `src/Core/Gameplay/GAS/AbilityDefinitionRegistry.cs` | 能力定义注册表（4096 槽，动态扩容） |\n| `EffectTemplateRegistry` | `src/Core/Gameplay/GAS/EffectTemplateRegistry.cs` | 效果模板注册表（4096 槽，bitset） |\n| `TagRuleRegistry` | `src/Core/Gameplay/GAS/TagRuleRegistry.cs` | 标签规则注册表（256 槽） |\n| `GasConditionRegistry` | `src/Core/Gameplay/GAS/GasConditionRegistry.cs` | 条件句注册表（4096 槽） |\n| `GlobalPhaseListenerRegistry` | `src/Core/Gameplay/GAS/GlobalPhaseListenerRegistry.cs` | 全局阶段监听器（32 槽） |\n| `ExtensionAttributeRegistry` | `src/Core/Gameplay/GAS/ExtensionAttributeRegistry.cs` | 扩展属性 ID 重映射 |\n| `BuiltinHandlerRegistry` | `src/Core/Gameplay/GAS/BuiltinHandlerRegistry.cs` | 内建阶段处理器（64 槽） |\n| `AttributeBindingRegistry` | `src/Core/Gameplay/GAS/Bindings/AttributeBindingRegistry.cs` | 属性绑定注册表 |\n| `AttributeSinkRegistry` | `src/Core/Gameplay/GAS/Bindings/AttributeSinkRegistry.cs` | Sink 注册表 |\n| `GasAttributeSinks` | `src/Core/Gameplay/GAS/Bindings/GasAttributeSinks.cs` | 内建 Sink 注册入口 |\n| `ForceInput2DSink` | `src/Core/Gameplay/GAS/Bindings/ForceInput2DSink.cs` | 物理力输入 Sink |\n| `RootBudgetTable` | `src/Core/Gameplay/GAS/RootBudgetTable.cs` | 根效果预算表 |\n\n### 6.3 System 层\n\n| 类 | 文件路径 | SystemGroup |\n|----|----------|-------------|\n| `AbilitySystem` | `src/Core/Gameplay/GAS/` | AbilityActivation |\n| `AbilityExecSystem` | `src/Core/Gameplay/GAS/` | AbilityActivation |\n| `OrderBufferSystem` | `src/Core/Gameplay/GAS/Orders/` | AbilityActivation |\n| `EffectProposalProcessingSystem` | `src/Core/Gameplay/GAS/` | EffectProcessing |\n| `EffectApplicationSystem` | `src/Core/Gameplay/GAS/` | EffectProcessing |\n| `EffectLifetimeSystem` | `src/Core/Gameplay/GAS/` | EffectProcessing |\n| `EffectPeriodicTickSystem` | `src/Core/Gameplay/GAS/` | EffectProcessing |\n| `EffectExpirationSystem` | `src/Core/Gameplay/GAS/` | EffectProcessing |\n| `ResponseChainSystem` | `src/Core/Gameplay/GAS/` | EffectProcessing |\n| `AttributeAggregationSystem` | `src/Core/Gameplay/GAS/` | AttributeCalculation |\n| `AttributeBindingSystem` | `src/Core/Gameplay/GAS/` | AttributeCalculation |\n| `DeferredTriggerDispatchSystem` | `src/Core/Gameplay/GAS/` | DeferredTriggerCollection |\n| `GameplayCueSystem` | `src/Core/Gameplay/GAS/Cue/GameplayCueSystem.cs` | 独立 |\n| `InventoryEquipmentGrantSyncSystem` | `src/Core/Gameplay/GAS/Items/` | 独立 |\n| `RelationshipProcessingSystem` | `src/Core/Gameplay/GAS/Relationships/` | 独立 |\n| `NarrativeRuntimeSystem` | `src/Core/Gameplay/GAS/Narrative/` | 独立 |\n| `UtilityAiThinkScheduleSystem` | `src/Core/Gameplay/GAS/AI/` | 独立 |\n| `UtilityAiDecisionSystem` | `src/Core/Gameplay/GAS/AI/` | 独立 |\n| `GoapPlanningSystem` | `src/Core/Gameplay/GAS/AI/` | 独立 |\n| `HtnPlanningSystem` | `src/Core/Gameplay/GAS/AI/` | 独立 |\n| `AIPlanExecutionSystem` | `src/Core/Gameplay/GAS/AI/` | 独立 |\n| `RuntimeEntitySpawnSystem` | `src/Core/Gameplay/GAS/Spawning/` | 独立 |\n| `ProgressionScopeBindingSystem` | `src/Core/Gameplay/GAS/Progression/` | 独立 |\n\n### 6.4 ECS 核心组件\n\n| 组件 | 路径 | 说明 |\n|------|------|------|\n| `GameplayEffect` | `src/Core/Gameplay/GAS/Components/GameplayEffect.cs` | Effect 生命周期状态 |\n| `EffectContext` | `src/Core/Gameplay/GAS/Components/EffectContext.cs` | `RootId / Source / Target / TargetContext` |\n| `EffectModifiers` | `src/Core/Gameplay/GAS/Components/EffectModifiers.cs` | 固定 8 个 ModifierData |\n| `EffectConfigParams` | `src/Core/Gameplay/GAS/Components/EffectConfigParams.cs` | 最大 32 键值对 |\n| `AttributeBuffer` | `src/Core/Gameplay/GAS/Components/AttributeBuffer.cs` | 0GC 属性缓冲（64 float） |\n| `GameplayTagContainer` | `src/Core/Gameplay/GAS/Components/GameplayTagContainer.cs` | 256 位固定 bitset |\n| `GameplayTagEffectiveCache` | `src/Core/Gameplay/GAS/Components/GameplayTagEffectiveCache.cs` | 标签有效缓存 |\n| `AbilityStateBuffer` | `src/Core/Gameplay/GAS/Components/AbilityStateBuffer.cs` | 基础 8 槽能力槽位 |\n| `AbilityExecSpec` | `src/Core/Gameplay/GAS/Components/AbilityExecComponents.cs` | 16 个 SoA 条目 |\n| `AbilityExecInstance` | `src/Core/Gameplay/GAS/Components/AbilityExecComponents.cs` | 运行时执行实例 |\n| `ActiveEffectContainer` | `src/Core/Gameplay/GAS/Components/ActiveEffectContainer.cs` | 最多 32 个活跃 Effect |\n| `EffectStack` | `src/Core/Gameplay/GAS/Components/EffectStack.cs` | 堆叠计数与策略 |\n| `EffectLifetimeMarkers` | `src/Core/Gameplay/GAS/Components/EffectLifetimeMarkers.cs` | 周期与过期标记 |\n| `EffectPhaseGraphBindings` | `src/Core/Gameplay/GAS/Components/EffectPhaseGraphBindings.cs` | 最大 16 步绑定 |\n| `EffectPhaseListenerBuffer` | `src/Core/Gameplay/GAS/Components/EffectPhaseListenerBuffer.cs` | 最大 8 个监听器 |\n| `BlackboardFloatBuffer` | `src/Core/Gameplay/GAS/Components/BlackboardFloatBuffer.cs` | 32 槽浮点 |\n| `BlackboardIntBuffer` | `src/Core/Gameplay/GAS/Components/BlackboardIntBuffer.cs` | 32 槽整数 |\n| `BlackboardEntityBuffer` | `src/Core/Gameplay/GAS/Components/BlackboardEntityBuffer.cs` | 32 槽实体 |\n| `BlackboardSpatialBuffer` | `src/Core/Gameplay/GAS/Components/BlackboardSpatialBuffer.cs` | 32 槽空间数据 |\n| `GameplayAttributeChangedBits` | `src/Core/Gameplay/GAS/Components/GameplayAttributeChangedBits.cs` | 属性变更位图 |\n| `AttributeLastSnapshot` | `src/Core/Gameplay/GAS/Components/AttributeLastSnapshot.cs` | 属性最后快照（差分触发） |\n\n---\n\n*本文档基于 Stage 1 扫描报告生成，具体实现细节以源码为准。*\n";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
