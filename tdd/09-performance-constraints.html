const mdContent = "# 性能约束总览（TDD）\n\n> 文档编号：TDD-09  \n> 对应模块：全引擎（GAS / Navigation / Presentation / Physics2D / Spatial / Exchange）  \n> 依据 Stage 1 扫描报告：`report_Gameplay_GAS.md`、`report_Input_Nav.md`、`report_Presentation_UI.md` 综合  \n> 版本：基于分支 `codex/issue437-graph-config`\n\n---\n\n## 1. 设计目标\n\n性能约束总览是 Ludots 引擎的 **\"性能契约\"** 文档，定义了各子系统在高频热路径上的不可违反规则。其目标是：\n\n| 目标 | 约束 |\n|------|------|\n| **0-GC 热路径全覆盖** | 明确哪些 System 在固定步长和视觉帧中禁止堆分配 |\n| **Fix64 使用规则清晰化** | 定义哪些数值必须使用定点数，避免浮点漂移导致确定性破坏 |\n| **QueryCache 策略统一** | 统一 `QueryDescription` 缓存策略，避免 ECS 查询构造开销 |\n| **Spatial 查询预算可控** | 定义查询模式与性能特征，防止高开销查询在热路径中滥用 |\n| **内存上限硬约束** | 明确 Entity 数量上限、Component 大小限制，防止内存失控 |\n| **串流预算可控** | 定义 Web 帧编码和 DeltaCompressor 的带宽/计算预算 |\n\n---\n\n## 2. 0-GC 热路径\n\n以下 System 在 **每一固定步长或每一视觉帧** 中被调用，必须实现 **零堆分配（0-GC）**：\n\n| 子系统 | System | 文件路径 | 0-GC 约束说明 |\n|--------|--------|----------|---------------|\n| **GAS** | `EffectRequestQueue` | `src/Core/Gameplay/GAS/EffectRequestQueue.cs` | 双缓冲队列，使用 `unsafe struct` 固定数组，禁止 `List<T>` 动态扩容 |\n| **GAS** | `EffectProcessingLoopSystem` | `src/Core/Gameplay/GAS/` | Effect 处理管线核心，所有中间数据使用栈分配或对象池 |\n| **GAS** | `AttributeAggregationSystem` | `src/Core/Gameplay/GAS/` | 属性聚合计算，禁止 LINQ/委托分配 |\n| **GAS** | `AttributeBindingSystem` | `src/Core/Gameplay/GAS/` | Sink 落地，禁止在 Sink 中创建引用类型 |\n| **GAS** | `DeferredTriggerDispatchSystem` | `src/Core/Gameplay/GAS/` | 延迟触发器分发，使用预分配队列 |\n| **GAS** | `GameplayCueSystem` | `src/Core/Gameplay/GAS/Cue/GameplayCueSystem.cs` | 表现事件系统，使用 `CueEventBuffer` 环形缓冲 |\n| **Navigation** | `MassNavigationFlowSolverState` | `src/Core/MassNavigation/Runtime/MassNavigationFlowSolverState.cs` | 核心求解器，使用 `unsafe fixed` 数组，禁止堆分配 |\n| **Navigation** | `MassNavigationFormationSystem` | `src/Core/MassNavigation/Systems/MassNavigationFormationSystem.cs` | 队形 + Flow 步进，13 步管线全部 0-GC |\n| **Navigation** | `MassNavigationOrderIngestionSystem` | `src/Core/MassNavigation/Systems/MassNavigationOrderIngestionSystem.cs` | Order 摄取，使用预分配 bucket 数组 |\n| **Navigation** | `NodeGraphPathService` | `src/Core/Navigation/GraphCore/NodeGraphPathService.cs` | A* 寻路，使用 `NodeGraphPathScratch` 栈分配 |\n| **Presentation** | `PresentationFrameSetupSystem` | `src/Core/Presentation/Systems/PresentationFrameSetupSystem.cs` | 帧状态计算，单例组件，无分配 |\n| **Presentation** | `WorldToVisualSyncSystem` | `src/Core/Presentation/Systems/WorldToVisualSyncSystem.cs` | 位置插值，批量 0GC 转换 |\n| **Presentation** | `PerformerRuleSystem` | `src/Core/Presentation/Systems/PerformerRuleSystem.cs` | 规则匹配，使用倒排索引和固定容量缓冲 |\n| **Presentation** | `PerformerRuntimeSystem` | `src/Core/Presentation/Systems/PerformerRuntimeSystem.cs` | 命令消费，使用 `PerformerCommandBuffer` 环形缓冲 |\n| **Presentation** | `PerformerEmitSystem` | `src/Core/Presentation/Systems/PerformerEmitSystem.cs` | 资产发射，使用 `PresentationVisualProxy` 池 |\n| **Presentation** | `WorldHudToScreenSystem` | `src/Core/Presentation/Systems/WorldHudToScreenSystem.cs` | HUD 投影，支持 retained 增量 |\n| **Presentation** | `PresentationRequestFlushSystem` | `src/Core/Presentation/Requests/PresentationRequestFlushSystem.cs` | 请求缓冲刷新，固定容量 SoA |\n| **Physics2D** | `Physics2D` 全部 System | `src/Core/Physics2D/`（推断） | 物理仿真固定步长，全部使用 struct/数组 |\n| **Spatial** | `SpatialQuerySystem` | `src/Core/Spatial/`（推断） | 空间查询，使用预分配结果数组 |\n\n> **违反后果**：任何 0-GC 热路径中的堆分配将导致：1）GC 停顿破坏固定步长确定性；2）RTS 场景下大规模单位卡顿；3）Web 目标上的内存膨胀和帧率下降。\n\n---\n\n## 3. Fix64 使用规则\n\nLudots 使用 **定点数（Fix64）** 保证跨平台确定性。以下数值 **必须** 使用 Fix64：\n\n| 数值类型 | 使用 Fix64 的字段 | 说明 |\n|----------|------------------|------|\n| **世界坐标** | `WorldPositionCm` / `PreviousWorldPositionCm` | 逻辑层全部使用厘米级 Fix64，避免浮点漂移 |\n| **方向/角度** | `FacingDirection` | 2D 朝向角度，使用 Fix64 弧度或角度 |\n| **速度** | `VelocityCmPerStep` / `MaxSpeed` | 移动速度，厘米/步 |\n| **距离/范围** | `RangeCm` / `RadiusCm` / `StopRadius` | 技能范围、碰撞半径、到达半径 |\n| **属性值** | `AttributeBuffer.Base` / `Cap` / `Current` | 所有 gameplay 属性（64 float 以 Fix64 语义存储） |\n| **持续时间** | `EffectLifetimeMarkers.Duration` / `Period` | Effect 持续时间、周期 tick |\n| **冷却时间** | `AbilityCooldown.StepCount` | 能力冷却步数（整数步，但相关时间用 Fix64） |\n| **地形高度** | `TerrainHeight` / `GroundY` | 地形采样高度（厘米级 Fix64） |\n| **路径点** | `PathXcm` / `PathYcm` | 路径存储使用 Fix64（`PathStore` 池化） |\n| **交换数值** | `Exchange` 的 `AttributeCost` / `ItemStack` 数量 | 交易系统的数值计算 |\n\n> **转换规则**：\n> - 逻辑层 → 表现层：`Fix64Vec2.Lerp(Previous, Current, alpha)` → `VisualTransform`（float 米，XZ 平面）\n> - 表现层 → 逻辑层：不允许反向转换，表现层只读逻辑层数据\n> - 序列化：网络传输时 Fix64 序列化为 `long`（原始位模式），接收端反序列化为 Fix64\n\n---\n\n## 4. QueryCache：QueryDescription 缓存策略\n\nArch ECS 的查询构造是热路径上的潜在开销源。Ludots 采用以下缓存策略：\n\n| 策略 | 实现 | 说明 |\n|------|------|------|\n| **静态 Query 预定义** | 在 System 构造函数中预构造 `QueryDescription` | 所有 `BaseSystem<World, T>` 子类在 `Initialize()` 中缓存 `QueryDescription` |\n| **按类型缓存** | `QueryDescription` 实例作为 System 的 `readonly` 字段 | 避免每帧重新构造 `QueryDescription` 对象 |\n| **Chunk 迭代优先** | 使用 `foreach (var chunk in chunks)` 而不是 `foreach (var entity in query)` | Chunk 迭代减少虚拟调用开销，是 0-GC 的关键 |\n| **查询结果池化** | 对于需要返回实体数组的查询（如 `TargetResolver`），使用预分配 `Span<Entity>` 或 `Entity[]` 池 | 避免 `List<Entity>` 动态扩容 |\n\n> **关键代码模式**：`GasController.ReadRuntimeState` 使用 `foreach (var chunk in chunks)` 并立即 `return states[i]`。虽然只读取第一个匹配的 `GasRuntimeState`，但 Chunk 迭代模式保证了 0-GC。\n\n---\n\n## 5. Spatial 查询预算\n\n空间查询在 GAS 和 Navigation 中大量使用，必须控制预算以防止高开销查询拖垮帧率。\n\n| 查询模式 | 性能特征 | 使用场景 | 预算限制 |\n|----------|----------|----------|----------|\n| **BuiltinSpatial（圆/锥/矩形/线/环）** | O(n) 空间扫描，n 为区域内实体数 | Effect 目标解析（`TargetResolver`） | 单次查询最多扫描 **256 个** 候选实体 |\n| **GraphProgram 目标查询** | 取决于图 VM 程序复杂度 | 复杂条件目标选择 | 图 VM 执行步数限制 **1024 步** |\n| **UniformGrid 空间索引** | O(1) 查询，O(n) 构建 | NodeGraph 大规模查询 | 单元格大小由 `UniformGridNodeGraphSpatialIndex` 自适应 |\n| **LinearScan 空间索引** | O(n) 查询，无构建开销 | NodeGraph 小图（< 256 节点）fallback | 节点数阈值 **256** |\n| **HexGridAOI** | O(1) 邻域查询 | 避障和人群密度查询 | 六边形网格尺寸由 `HexGridAOI` 配置 |\n| **SpatialHash（FlowSolver）** | O(1) 邻域查询，O(n) 重建 | MassNavigation 避障/分离 | 哈希桶大小由 `MassNavigationFlowSolverConfig.SeparationHash` / `HardResolveHash` 配置 |\n| **MassNavigation 障碍物投影** | O(1) 查询，预计算 | 流场障碍物 | `MassNavigationFlowObstacleProjection` 使用 `unsafe fixed` 数组，最多 **MaxPieces** 个 |\n\n> **预算控制机制**：`TargetResolverFanOutHelper` 的 `FanOutBudget` 在 `BuiltinHandlerRuntimeScope` 中提供，限制单次 Effect 的目标解析数量。\n\n---\n\n## 6. 内存约束\n\n### 6.1 Entity 数量上限\n\n| 约束项 | 数值 | 说明 |\n|--------|------|------|\n| ECS World 总实体数 | **由 Arch ECS 的 `World` 容量决定** | Arch 使用 `Entity` 的 `Id` 为 `int`，理论上限约 2^30，实际由内存和池配置限制 |\n| MassNavigation Agent 数 | **由 `MassNavigationRuntimeCapacityConfig` 控制** | Group/Member/Order/Chunk 上限 |\n| 选择容器成员数 | **由 `SelectionRuntimeConfig` 控制** | 默认无硬性上限，但 MutationBudget 限制每帧变更数 |\n| 活跃 Effect 数 | **每实体 32 个** | `ActiveEffectContainer` 固定 32 槽 |\n| 全局路径池 | **maxPaths × maxPoints** | `PathStore` 池化，预分配 |\n| Performer 实例数 | **由 `PresentationRuntimeConfig` 控制** | performer、HUD、minimap 容量配置 |\n\n### 6.2 Component 大小限制\n\n| 约束项 | 数值 | 说明 |\n|--------|------|------|\n| `AttributeBuffer` | **64 个 float（256 字节）** | 固定数组，不支持动态扩展 |\n| `GameplayTagContainer` | **256 位（32 字节）** | 4×ulong 固定 bitset |\n| `EffectModifiers` | **8 个 ModifierData（~96 字节）** | 固定数组 |\n| `ActiveEffectContainer` | **32 个 Effect 引用（~128 字节）** | 固定数组 |\n| `Blackboard*Buffer` | **32 槽/类型** | 浮点/整数/实体/空间各 32 槽 |\n| `AbilityStateBuffer` | **8 基础 + 8 临时 + 8 形态 槽** | 固定数组 |\n| `MassNavigationFlowObstacleProjection` | **unsafe fixed byte[]，MaxPieces** | 障碍物形状投影 |\n| `PerformerCommandBuffer` | **固定容量（配置决定）** | 环形缓冲 |\n| `PresentationEventStream` | **固定容量（配置决定）** | 事件流缓冲 |\n| `WorldHudBatchBuffer` | **固定容量（配置决定）** | SoA 缓冲 |\n| `ScreenHudBatchBuffer` | **固定容量（配置决定）** | 双通道缓冲 |\n\n> **大组件警告**：任何新增 ECS Component 的大小应控制在 **256 字节以内**。超过此大小的组件应考虑拆分为多个小组件或使用引用类型（但引用类型会引入 GC 风险）。\n\n---\n\n## 7. 串流预算\n\n### 7.1 Web 帧编码\n\n当 Ludots 以 Web 目标运行时，表现层数据需要序列化传输到浏览器。\n\n| 约束项 | 数值/规则 | 说明 |\n|--------|-----------|------|\n| **帧编码格式** | 二进制协议（推断） | 避免 JSON 解析开销 |\n| **增量编码** | 仅传输变化（dirty-only） | `PresentationVisualSnapshotBuffer` 支持增量投影 |\n| **StableId 复用** | 使用 `StableId` 作为跨帧标识 | 减少每帧传输的实体描述数据 |\n| **LOD 裁剪** | 按距离裁剪低优先级实体 | `CameraCullingRuntimeConfig` 配置 High/Medium/Low 距离 |\n| **HUD 密度控制** | `WorldHudToScreenSystem` 支持密度跳过 | 高密度区域跳过非选中项 HUD |\n\n### 7.2 DeltaCompressor\n\n| 约束项 | 数值/规则 | 说明 |\n|--------|-----------|------|\n| **Delta 范围** | 只压缩 `WorldPositionCm` / `VisualTransform` 变化 | 静止实体不传输位置 |\n| **量化精度** | Fix64 → 压缩整数（推断） | 厘米级精度足够，减少带宽 |\n| **帧率适配** | 视觉帧与逻辑帧分离 | 逻辑帧固定步长，视觉帧可变，但插值数据在表现层本地计算 |\n| **Surface 脏标记** | `UIRoot.IsDirty` 控制 UI 传输 | UI 场景仅在 dirty 时序列化推送给浏览器 |\n\n---\n\n## 8. 扩展契约\n\n| 扩展点 | 约束 | 说明 |\n|--------|------|------|\n| **自定义 System 加入热路径** | 必须通过 0-GC 审核 | 任何新增 `ISystem` 如果在 `SystemGroup` 的前几个 phase 中执行，必须保证无堆分配 |\n| **自定义 Sink** | 禁止堆分配 | `AttributeSink.Apply(World, Entity, AttributeBuffer)` 必须 0-GC |\n| **自定义 Handler** | 禁止修改 World 结构 | `BuiltinHandlerFn` 只能读写 `EffectContext` 和已分配组件，不能添加/移除组件或实体 |\n| **自定义寻路策略** | 必须提供 `NodeGraphPathScratch` 兼容的临时存储 | 避免在 A* 中分配临时数组 |\n| **自定义空间索引** | 必须支持 `TryQuery` 和 `TryQueryNearest` 的 0-GC 签名 | 返回 `Span<T>` 或预分配数组 |\n| **Mod 新增 Component** | 大小建议 ≤ 256 字节 | 大组件会拖慢 ECS 迭代速度 |\n| **Mod 新增 Registry** | 加载期注册，运行时只读 | 运行时修改 Registry 会导致缓存不一致和竞争 |\n\n---\n\n## 9. 关键类清单（带文件路径）\n\n### 9.1 性能控制类\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `GasBudget` | `src/Core/Gameplay/GAS/GasBudget.cs` | GAS 每帧预算与溢出统计 |\n| `EffectRequestQueue` | `src/Core/Gameplay/GAS/EffectRequestQueue.cs` | EffectRequest 双缓冲队列（0-GC） |\n| `DeferredTriggerQueue` | `src/Core/Gameplay/GAS/DeferredTriggerQueue.cs` | 延迟触发器队列（0-GC） |\n| `NodeGraphPathScratch` | `src/Core/Navigation/GraphCore/NodeGraphPathScratch.cs` | A* 临时数据结构（栈分配） |\n| `MassNavigationFlowSolverConfig` | `src/Core/MassNavigation/Runtime/MassNavigationConfig.cs` | 求解器性能配置 |\n| `MassNavigationRuntimeCapacityConfig` | `src/Core/MassNavigation/Runtime/MassNavigationConfig.cs` | 运行时容量配置 |\n| `MassNavigationCadenceConfig` | `src/Core/MassNavigation/Runtime/MassNavigationCadenceConfig.cs` | 仿真节奏配置 |\n| `MassNavigationTelemetry` | `src/Core/MassNavigation/Runtime/MassNavigationTelemetry.cs` | 性能遥测（计时、计数） |\n| `PresentationRuntimeConfig` | `src/Core/Presentation/PresentationRuntimeConfig.cs` | 表现层容量总控 |\n| `PerformerCommandBuffer` | `src/Core/Presentation/Performers/PerformerCommandBuffer.cs` | 固定容量环形命令缓冲 |\n| `PresentationEventStream` | `src/Core/Presentation/Events/PresentationEventStream.cs` | 固定容量事件流缓冲 |\n| `WorldHudBatchBuffer` | `src/Core/Presentation/Hud/WorldHudBatchBuffer.cs` | 固定容量 HUD 缓冲 |\n| `ScreenHudBatchBuffer` | `src/Core/Presentation/Hud/ScreenHudBatchBuffer.cs` | 固定容量屏幕 HUD 缓冲 |\n| `StableDrawCache` | `src/Core/Presentation/Rendering/StableDrawCache.cs` | Retained 静态缓存 |\n| `CameraCullingRuntimeConfig` | `src/Core/Presentation/PresentationRuntimeConfig.cs` | 相机裁剪 LOD 配置 |\n| `MinimapRuntimeConfig` | `src/Core/Presentation/PresentationRuntimeConfig.cs` | 小地图运行时配置 |\n| `PresentationTargetGeneration` | `src/Core/Presentation/Rendering/PresentationTargetGeneration.cs` | Adapter target 生命周期信号 |\n\n### 9.2 Fix64 核心类\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `Fix64` | `src/Core/Fix64/`（推断） | 定点数类型 |\n| `Fix64Vec2` | `src/Core/Fix64/`（推断） | 2D 定点数向量 |\n| `WorldPositionCm` | `src/Core/Components/`（推断） | 世界坐标（Fix64 厘米） |\n| `AttributeBuffer` | `src/Core/Gameplay/GAS/Components/AttributeBuffer.cs` | 属性缓冲（Fix64 语义） |\n| `PathStore` | `src/Core/Navigation/Pathing/PathStore.cs` | 路径存储（Fix64 厘米） |\n| `MovePlanExecutionIntent` | `src/Core/MovePlanning/MovePlanTypes.cs` | 执行意图（Fix64 距离/速度） |\n\n### 9.3 缓存与池化类\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `PathStore` | `src/Core/Navigation/Pathing/PathStore.cs` | 路径池化存储 |\n| `GraphTagSetRegistry` | `src/Core/Navigation/GraphSemantics/GAS/GraphTagSetRegistry.cs` | TagBits256 去重池（避免重复比较） |\n| `CueEventBuffer` | `src/Core/Gameplay/GAS/Cue/CueEventBuffer.cs` | Cue 事件环形缓冲 |\n| `PresentationOwnerChangeBuffer` | `src/Core/Presentation/Events/PresentationOwnerChangeBuffer.cs` | Owner 变化位投影索引 |\n| `GlobalPresentationEventBuffer` | `src/Core/Presentation/Events/GlobalPresentationEventBuffer.cs` | 全局事件缓冲 |\n\n---\n\n*本文档基于 Stage 1 扫描报告综合生成，具体实现细节以源码为准。各子系统的详细性能约束请同时参考对应的 TDD 子章节。*\n";

function buildNav() {
  let html = '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      html += '<a href="' + href + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
