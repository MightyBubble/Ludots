const mdContent = "# 架构与基础设施 — Pipeline 设计\n\n## 设计目标\n\nPipeline 是 Ludots 引擎的**数据流骨架**，负责将原始输入（配置、输入、Effect 请求）转换为运行时状态（ECS World、表现 Buffer、事件响应）。设计目标如下：\n\n1. **阶段隔离**：每个 Pipeline 由明确的阶段组成，阶段之间通过不可变/只读数据结构传递。\n2. **可组合**：Pipeline 阶段可独立测试、独立替换。\n3. **预算可控**：Simulation 相关的 Pipeline 受 `IPacemaker` 预算约束。\n4. **失败显式**：任何阶段失败都产生可诊断的错误信息，不静默回退。\n\n---\n\n## 1. Launcher Runtime Pipeline\n\n### 职责\n\n从应用程序入口到引擎就绪的完整启动流程。\n\n### 数据流\n\n```\nApp 入口 (Raylib / Web)\n  ↓\nProgram.cs → 解析命令行参数\n  ↓\nGameBootstrapper.InitializeFromBaseDirectory(baseDir, gameConfigFile)\n  ↓\n读取 launcher.runtime.json\n  ↓\nLauncherGraphDocument 解析 launcher graph\n  ↓\nResolvedModLoadPlan (orderedModIds + rootPaths)\n  ↓\nWorldRuntime.Create(config, assetsRoot)\n  ↓\nGameEngine.InitializeWithConfigPipeline(modPlan, assetsRoot)\n  ├── 1. 初始化 VFS, FunctionRegistry, TriggerManager, SystemFactoryRegistry, ModLoader\n  ├── 2. ModLoader.LoadResolvedPlan(orderedMods) → ALC 加载 → IMod.OnLoad\n  ├── 3. ConfigPipeline.MergeGameConfig() → 合并 Core + Mods 的 game.json\n  ├── 4. InitializeWorld() → Arch World + PhysicsWorld + JobScheduler\n  ├── 5. InitializeCoreSystems(MergedConfig) → 构建所有 GAS/Presentation/Spatial 系统\n  ├── 6. RegisterSystem() / RegisterPresentationSystem() → 按 SystemGroup 分组\n  └── 7. 打印 ConflictReport 摘要\n  ↓\nGameEngine.Start() → TriggerManager.FireEvent(GameEvents.GameStart)\n```\n\n### 关键类型\n\n| 类型 | 文件路径 | 职责 |\n|------|----------|------|\n| `GameBootstrapper` | `src/Core/Engine/` | 启动入口：从目录初始化引擎 |\n| `LauncherGraphDocument` | `src/Core/Engine/` | launcher.runtime.json 的序列化模型 |\n| `ResolvedModLoadPlan` | `src/Core/Engine/` | 拓扑排序后的 Mod 加载计划 |\n| `WorldRuntime` | `src/Core/Engine/WorldRuntime.cs` | 工厂包装器 |\n| `GameEngine` | `src/Core/Engine/GameEngine.cs` | 初始化主循环 |\n\n### 性能约束\n\n- 启动时 `ModLoader.LoadResolvedPlan` 是 CPU 密集型操作（ALC 加载、反射扫描），但只执行一次。\n- `ConfigPipeline.MergeGameConfig` 在启动时执行一次，运行时通过 `ReloadConfigs` 重新执行（支持热重载）。\n- `InitializeCoreSystems` 中构造数百个 System 对象，应避免在运行时重复调用。\n\n---\n\n## 2. ConfigPipeline（配置合并管线）\n\n### 职责\n\n从 Core 和多个 Mod 的 JSON 配置片段中按策略合并出最终运行时配置。\n\n### 数据流\n\n```\n[Core:Configs/game.json]\n     ↓\n[Mod1:assets/game.json] → [Mod1:assets/Configs/game.json]\n     ↓\n[Mod2:assets/game.json] → [Mod2:assets/Configs/game.json]\n     ↓\nConfigPipeline.CollectFragments(\"game.json\")\n     ↓\nConfigPipeline.DeepMerge(target, source)\n     ├── 标量：source 覆盖 target\n     ├── 数组：source 覆盖 target（非追加）\n     └── 对象：递归合并\n     ↓\nJsonSerializer.Deserialize<GameConfig>(mergedJson)\n     ↓\nGameConfig (运行时唯一配置)\n```\n\n对于目录驱动配置（`config_catalog.json`）：\n\n```\nconfig_catalog.json\n     ↓\nConfigCatalogLoader.Load(pipeline)\n     ↓\nConfigCatalog (路径 → ConfigCatalogEntry)\n     ↓\nConfigPipeline.MergeFromCatalog(entry, [report])\n     ↓\nConfigMerger.MergeArrayByIdToEntriesCore\n     ├── 按 idField 匹配条目\n     ├── __delete 或 Disabled 删除条目\n     ├── 同名对象递归合并\n     └── ArrayAppendFields 指定数组追加（非覆盖）\n     ↓\nMergedConfigEntry[] (或 JsonObject / JsonArray)\n     ↓\nDataRegistry<T>.Load → Dictionary<string, T>\n```\n\n### 合并策略（ConfigMergePolicy）\n\n| 策略 | 行为 | 适用场景 |\n|------|------|----------|\n| `Replace` | 完全替换 | 单值配置（如窗口标题、FPS 上限） |\n| `DeepObject` | 对象递归合并 | 复杂配置对象（如 `Physics2DConfig`） |\n| `ArrayReplace` | 数组完全替换 | 简单数组（如 `ModPaths`） |\n| `ArrayAppend` | 数组追加 | 需要累积的数组（如 `AutoLoadMods`） |\n| `ArrayById` | 按 ID 匹配合并数组元素 | 数据目录（如 `abilities.json`, `items.json`） |\n\n### 关键类型\n\n| 类型 | 文件路径 | 职责 |\n|------|----------|------|\n| `ConfigPipeline` | `src/Core/Config/ConfigPipeline.cs`（218 行） | 配置片段收集与合并入口 |\n| `ConfigMerger` | `src/Core/Config/ConfigMerger.cs` | 静态合并器：五种策略的实现 |\n| `ConfigCatalog` | `src/Core/Config/ConfigCatalog.cs` | 配置目录注册表 |\n| `ConfigCatalogEntry` | `src/Core/Config/ConfigCatalogEntry.cs` | 只读 struct：RelativePath, MergePolicy, IdField, ArrayAppendFields |\n| `ConfigMergePolicy` | `src/Core/Config/ConfigMergePolicy.cs` | enum：五种策略 |\n| `ConfigFragment` | `src/Core/Config/ConfigFragment.cs` | 只读 struct：JSON 节点 + 来源 URI |\n| `MergedConfigEntry` | `src/Core/Config/MergedConfigEntry.cs` | 合并结果条目：ID + JsonObject |\n| `ConfigConflictReport` | `src/Core/Config/ConfigConflictReport.cs` | 记录 fragment 来源、winner 来源、deleted 条目 |\n| `ConfigSourcePaths` | `src/Core/Config/ConfigSourcePaths.cs` | 生成 `Core:Configs/`、`modId:assets/`、`modId:assets/Configs/` URI |\n| `StrictJsonOptions` | `src/Core/Config/StrictJsonOptions.cs` | 严格 JSON 选项：大小写敏感、拒绝未知字段 |\n\n### 性能约束\n\n- 合并操作在启动时执行一次，运行时通过 `ReloadConfigs` 触发（支持热重载）。\n- `ArrayById` 合并使用字典索引，O(n) 遍历 + O(1) 查找。\n- `ConfigConflictReport` 在 DEBUG 构建下完整记录，Release 构建下可精简。\n\n### 扩展契约\n\n| 扩展点 | 方式 | 约束 |\n|--------|------|------|\n| 新增配置片段 | 在 Mod 的 `assets/Configs/` 或 `assets/` 下放同名 JSON | 自动被 `ConfigPipeline` 收集；优先级按 Mod 顺序 |\n| 自定义合并策略 | 修改 `ConfigMerger` | 需修改 Core 代码；策略在 `ConfigCatalogEntry` 中声明 |\n| 配置热重载 | `ReloadConfigTrigger` 触发 `GameEngine.ReloadConfigs` | 重载后 `RebuildAiRuntime` 被调用；部分系统需手动重启 |\n\n---\n\n## 3. Mod Loading Pipeline（Mod 加载管线）\n\n### 职责\n\n扫描、解析、加载、隔离 Mod 程序集，并调用 `IMod.OnLoad` 完成注册。\n\n### 数据流\n\n```\nMod 发现（mod.json 扫描）\n  ↓\nModDiscovery 递归扫描 Mod 目录，跳过 bin/obj\n  ↓\nDependencyResolver.Resolve(modNodes)\n  ├── 拓扑排序\n  └── SemVer 解析：支持 ^, ~, >=, <=, >, <, = 运算符\n  ↓\nResolvedModLoadPlan (orderedModIds)\n  ↓\nModLoader.LoadResolvedPlan(orderedPlan)\n  ├── 校验 manifest、版本、依赖顺序\n  ├── VFS.Mount(modId, rootPath)              // 虚拟文件系统挂载\n  ├── ConfigureProcessSharedAssemblies\n  ├── ModLoadContext(ResolveSharedAssembly, processSharedAssemblyNames)\n  │   └── ALC 三层解析：\n  │       ├── ProcessShared → 进程共享 Assembly\n  │       ├── HostShared → 宿主共享 Assembly\n  │       ├── Default → 默认 ALC\n  │       ├── SharedMod → 共享 Mod Assembly\n  │       └── Resolver → 自定义解析器\n  └── 逐 Mod LoadModAssembly\n           ↓\n      TryResolveMainAssemblyPath → DLL\n           ↓\n      ModLoadContext.LoadMainAssembly\n           ↓\n      Assembly.GetTypes → 扫描 IMod / MapDefinition\n           ↓\n      Activator.CreateInstance<IMod>() → OnLoad(ModContext)\n           ↓\n      Mod 注册：\n           ├── context.RegisterSystemFactory(...)    → SystemFactoryRegistry\n           ├── context.RegisterFunction(...)         → FunctionRegistry\n           ├── context.OnEvent(...)                  → TriggerManager\n           └── context.RegisterTriggerDecorator(...) → TriggerDecoratorRegistry\n  ↓\nSystemFactoryRegistry.TryActivate(name, context, engine) → 实例化 System\n```\n\n### 关键类型\n\n| 类型 | 文件路径 | 职责 |\n|------|----------|------|\n| `ModLoader` | `src/Core/Modding/ModLoader.cs`（599 行） | Mod 扫描、依赖解析、程序集加载、VFS 挂载、OnLoad 调用 |\n| `ModLoadContext` | `src/Core/Modding/ModLoadContext.cs`（290 行） | ALC 实现：三层 Assembly 解析策略 |\n| `ModManifest` | `src/Core/Modding/ModManifest.cs` | `mod.json` 序列化对象 |\n| `ModManifestJson` | `src/Core/Modding/ModManifestJson.cs` | 严格 JSON 解析 `mod.json` |\n| `IMod` | `src/Core/Modding/IMod.cs` | Mod 入口接口：`OnLoad(IModContext)`, `OnUnload()` |\n| `IModContext` | `src/Core/Modding/IModContext.cs` | Mod 扩展 API 合约 |\n| `ModContext` | `src/Core/Modding/ModContext.cs` | `IModContext` 实现 |\n| `ModDiscovery` | `src/Core/Modding/ModDiscovery.cs` | 递归扫描 Mod 目录 |\n| `DependencyResolver` | `src/Core/Modding/DependencyResolver.cs` | 拓扑排序 + SemVer 解析 |\n| `VirtualFileSystem` | `src/Core/Modding/VirtualFileSystem.cs` | VFS：`Mount`, `GetStream`, `ModId:` URI 支持 |\n| `RegistrationConflictReport` | `src/Core/Modding/RegistrationConflictReport.cs` | 记录 ComponentRegistry / FunctionRegistry 等冲突 |\n\n### ALC 隔离策略\n\n| 层级 | 行为 | 说明 |\n|------|------|------|\n| ProcessShared | 走 Default ALC | 由 `processSharedAssemblies` 声明的程序集 |\n| HostShared | 走 Host ALC | 宿主共享程序集（如 `Arch.Core`） |\n| ModPrivate | `ModLoadContext` 独立加载 | `LoadFromStream` 避免文件锁；`isCollectible: true` |\n| SharedMod | 跨 Mod 共享 | 通过 `ResolveSharedAssembly` 解析 |\n\n### 性能约束\n\n- Mod 加载只发生在启动和 `ReloadConfigs` 时，不在 `Tick` 中执行。\n- `Assembly.GetTypes` 是反射密集型操作，但只执行一次。\n- `ModLoadContext` 对非 process-shared 程序集使用 `LoadFromStream`，避免文件锁。\n\n### 扩展契约\n\n| 扩展点 | 方式 | 约束 |\n|--------|------|------|\n| 新增 Mod | 在 `mods/` 目录下创建目录，放置 `mod.json` + DLL | `mod.json` 必须包含 `name`, `version`, `main`, `priority` |\n| 声明依赖 | `mod.json` 的 `dependencies` 字段 | SemVer 格式；`DependencyResolver` 拓扑排序 |\n| 声明共享程序集 | `mod.json` 的 `processSharedAssemblies` | 这些程序集走 Default ALC，不隔离 |\n| 自定义 ALC 解析 | 继承 `ModLoadContext` | 需修改 Core；不推荐 |\n\n---\n\n## 4. GAS Effect Pipeline（GAS Effect 管线）\n\n### 职责\n\n从输入/交互到 Effect 执行、属性计算、延迟触发、事件分发的完整 gameplay 效果管线。\n\n### 数据流\n\n```\n玩家输入 / AI 决策 / 交互触发\n  ↓\nInputRequestQueue / OrderQueue\n  ↓\nAbilityActivation Phase → AbilityActivationSystem\n  ├── 解析 Ability 定义（AbilityDefinitionRegistry）\n  ├── 验证条件（Tag、属性、冷却）\n  └── 生成 EffectRequest → 写入 EffectRequestQueue\n  ↓\nEffectProcessing Phase → EffectPhaseExecutor\n  ├── 读取 EffectTemplateData（EffectTemplateRegistry）\n  ├── 按 phase 顺序执行：\n  │   ├── OnCast\n  │   │   ├── GraphExecutor.Execute(ref state, program, handlerTable)\n  │   │   └── BuiltinHandlerRegistry.Invoke(handlerId, ...)\n  │   ├── OnCommit\n  │   │   ├── GraphExecutor.Execute(ref state, program, handlerTable)\n  │   │   └── BuiltinHandlerRegistry.Invoke(handlerId, ...)\n  │   ├── OnImpact\n  │   │   ├── GraphExecutor.Execute(ref state, program, handlerTable)\n  │   │   └── BuiltinHandlerRegistry.Invoke(handlerId, ...)\n  │   └── OnExpire\n  │       ├── GraphExecutor.Execute(ref state, program, handlerTable)\n  │       └── BuiltinHandlerRegistry.Invoke(handlerId, ...)\n  └── 每个 phase 可产生：modifier、位移、创建实体、关系变更、交易等\n  ↓\nRuntimeEntityBinding Phase → RuntimeEntityBindingSystem\n  └── 新实体绑定 PerformerEntityRuntime，生成 PresentationStableId\n  ↓\nAttributeCalculation Phase → AttributeBindingSystem / AttributeCalculationSystem\n  ├── AttributeSinkRegistry 收集属性变更\n  └── 属性缓冲落地为最终值\n  ↓\nDeferredTriggerCollection Phase → DeferredTriggerCollectionSystem / DeferredTriggerProcessSystem\n  ├── 收集 Effect 执行中标记的延迟触发器\n  └── 生成延迟事件（如\"3 秒后爆炸\"）\n  ↓\nEventDispatch Phase → EventDispatchSystem / GameplayCueSystem\n  ├── GameplayEventBus 分发事件\n  ├── CueEventBuffer 写入表现 cue\n  └── TriggerManager.FireEvent 触发全局/Map Trigger\n  ↓\nClearPresentationFlags Phase → ClearPresentationFlagsSystem\n  └── 清除本帧临时标记\n```\n\n### 关键类型\n\n| 类型 | 文件路径 | 职责 |\n|------|----------|------|\n| `AbilityActivationSystem` | `src/Core/Gameplay/GAS/` | 能力激活：验证 → 生成 EffectRequest |\n| `EffectPhaseExecutor` | `src/Core/Gameplay/GAS/` | Effect phase 执行器 |\n| `EffectRequestQueue` | `src/Core/Gameplay/GAS/` | Effect 请求队列 |\n| `EffectLifetimeSystem` | `src/Core/Gameplay/GAS/` | Effect 持续时间管理 |\n| `EffectApplicationSystem` | `src/Core/Gameplay/GAS/` | Effect 应用逻辑 |\n| `AttributeBindingSystem` | `src/Core/Gameplay/GAS/` | 属性 modifier 绑定 |\n| `AttributeCalculationSystem` | `src/Core/Gameplay/GAS/` | 属性公式计算 |\n| `AttributeSinkRegistry` | `src/Core/Gameplay/GAS/` | 属性 Sink 注册 |\n| `DeferredTriggerCollectionSystem` | `src/Core/Gameplay/GAS/` | 延迟触发器收集 |\n| `DeferredTriggerProcessSystem` | `src/Core/Gameplay/GAS/` | 延迟触发器处理 |\n| `GameplayCueSystem` | `src/Core/Gameplay/Cue/` | Cue 事件生成 |\n| `CueEventBuffer` | `src/Core/Gameplay/Cue/` | Cue 事件缓冲 |\n| `CueDescriptor` | `src/Core/Gameplay/Cue/` | Cue 描述符 |\n| `GameplayEventBus` | `src/Core/Gameplay/GAS/` | 游戏事件总线 |\n| `GraphExecutor` | `src/Core/GraphRuntime/GraphExecutor.cs`（38 行） | 图 VM 执行器：PC 驱动循环 |\n| `GraphProgramRegistry` | `src/Core/GraphRuntime/GraphProgramRegistry.cs` | 图程序注册表 |\n| `BuiltinHandlerRegistry` | `src/Core/Gameplay/GAS/BuiltinHandlerRegistry.cs` | 64 槽内置 Handler 表 |\n| `BuiltinHandlers` | `src/Core/Gameplay/GAS/BuiltinHandlers.cs` | 11 个内置 Handler 注册 |\n| `GasController` | `src/Core/Gameplay/GAS/` | GAS 总控制器 |\n\n### Graph VM 执行细节\n\n```\nGraphConfig (JSON)\n  ↓\nGraphValidator.Validate → List<GraphDiagnostic>\n  ↓\nGraphCompiler.CompileWithOutputs\n  ├── 拓扑排序（Entry → Next 链）\n  ├── 寄存器分配（Float/Int/Bool/Entity 各 32）\n  ├── 符号表 intern（attribute/tag/effect 等 name→index）\n  └── GraphInstruction[] 生成\n  ↓\nGraphProgramPackage (GraphName, Symbols, Program)\n  ↓\nGraphProgramRegistry.Register(graphId, program)\n  ↓\n运行时：GasGraphOpHandlerTable\n  ↓\nGraphExecutor.Execute(ref GraphExecutionState, program, handlerTable)\n  ├── GraphExecutionState.Api = GasGraphRuntimeApi\n  ├── 寄存器 span：F/I/B/E 各 32\n  ├── 目标列表：MaxTargets = 256\n  └── 指令上限：MaxInstructionsPerExecution = 4096\n```\n\n### 性能约束\n\n- `EffectPhaseExecutor` 在 Simulation Loop 中执行，受 Pacemaker 预算约束。\n- `GraphExecutor` 每次执行最多 4096 条指令（`GraphVmLimits.MaxInstructionsPerExecution`）。\n- `BuiltinHandlerRegistry` 使用 64 槽固定数组，O(1) 索引调用。\n- `EffectRequestQueue` 在每帧开始时清空，不产生跨帧累积。\n\n### 扩展契约\n\n| 扩展点 | 方式 | 约束 |\n|--------|------|------|\n| 自定义 Ability | `ConfigPipeline` 加载 `abilities.json` | 必须被 `AbilityDefinitionRegistry` 索引 |\n| 自定义 Effect | `ConfigPipeline` 加载 `effects.json` | 必须被 `EffectTemplateRegistry` 索引 |\n| 自定义 Graph | `GraphCompiler` 编译后注册到 `GraphProgramRegistry` | 指令数 ≤ 4096；寄存器 ≤ 32/32/32/32 |\n| 自定义 BuiltinHandler | 不可扩展（64 槽固定） | 如需新增，修改 Core 代码 |\n| 自定义 Attribute | `AttributeSchemaUpdateSystem` 注册 | 必须在 `SchemaUpdate` phase 完成 |\n\n---\n\n## 5. Presentation Pipeline（表现管线）\n\n### 职责\n\n将 ECS  gameplay 状态转换为渲染器可消费的视觉数据（Performer 命令、Instanced 批量请求、地面覆盖、路网、HUD）。\n\n### 数据流\n\n```\n[Simulation Loop 结束] → ECS World 状态为\"本帧最终\"\n  ↓\nUpdate(dt) — 不受 Pacemaker 预算限制\n  ├── 清空各表现 Buffer：\n  │   ├── PerformerCommandBuffer\n  │   ├── SoundRequestBuffer\n  │   ├── InstancedBatchRequestBuffer\n  │   ├── GroundOverlayBuffer\n  │   ├── RoadSplineBuffer\n  │   └── WorldHudBatchBuffer\n  │\n  ├── BeginPresentationCameraSnapshotScope()\n  │   └── 捕获当前相机状态（位置、朝向、视锥）\n  │\n  ├── for each _presentationSystems → Update(dt)\n  │   ├── PerformerRuntimeSystem\n  │   │   └── 更新 Performer 状态机 → 写入 PerformerCommandBuffer\n  │   ├── PerformerBehaviorSystem\n  │   │   └── 评估行为规则 → 触发动画/状态切换\n  │   ├── PerformerRuleSystem\n  │   │   └── 评估 Performer 规则 → 写入命令\n  │   ├── CameraRuntimeSystem\n  │   │   └── 更新相机位置 → 供视锥剔除使用\n  │   ├── CameraCullingSystem\n  │   │   └── 视锥剔除 → 标记可见实体\n  │   ├── GridVisualSyncSystem\n  │   │   └── 网格坐标 → 视觉坐标同步\n  │   ├── VisionSystem\n  │   │   └── 更新战争迷雾 → 写入 FogField\n  │   ├── MinimapRenderSystem\n  │   │   └── 生成小地图渲染数据\n  │   └── HudRenderSystem\n  │       └── 生成 HUD 批量数据 → 写入 WorldHudBatchBuffer\n  │\n  ├── EndPresentationCameraSnapshotScope()\n  ├── InstancedBatchCapabilityValidator.Validate()\n  │   └── 校验 Instanced 批量请求合法性\n  └── _gasPresentationEvents.Clear()\n      └── 清空 GAS 表现事件\n  ↓\n[Adapter 渲染] — RaylibHostLoop 中执行\n  ├── RaylibTerrainRenderer → 地形渲染\n  ├── RaylibIsmRenderBridge → ISM 批量渲染\n  ├── RaylibSkiaRenderer → UI 叠加\n  └── RaylibOverlayCompositor → 合成输出\n```\n\n### 关键类型\n\n| 类型 | 文件路径 | 职责 |\n|------|----------|------|\n| `PerformerEntityRuntime` | `src/Core/Presentation/` | Performer 运行时绑定：Entity ↔ 视觉表现 |\n| `PerformerDefinitionRegistry` | `src/Core/Presentation/` | Performer 定义注册表 |\n| `PerformerRuntimeSystem` | `src/Core/Presentation/` | Performer 运行时更新 |\n| `PerformerBehaviorSystem` | `src/Core/Presentation/` | Performer 行为状态机 |\n| `PerformerRuleSystem` | `src/Core/Presentation/` | Performer 规则评估 |\n| `PresentationEventStream` | `src/Core/Presentation/` | 表现事件流 |\n| `GlobalPresentationEventBuffer` | `src/Core/Presentation/` | 全局表现事件缓冲 |\n| `GasPresentationEventBuffer` | `src/Core/Presentation/` | GAS 表现事件缓冲 |\n| `PrimitiveDrawBuffer` | `src/Core/Presentation/` | 原始绘制缓冲 |\n| `PresentationVisualProxyBuffer` | `src/Core/Presentation/` | 视觉代理缓冲 |\n| `SkinnedVisualBatchBuffer` | `src/Core/Presentation/` | 蒙皮视觉批量缓冲 |\n| `InstancedBatchRequestBuffer` | `src/Core/Presentation/` | Instanced 批量请求 |\n| `InstancedBatchOperationBuffer` | `src/Core/Presentation/` | Instanced 批量操作 |\n| `GroundOverlayBuffer` | `src/Core/Presentation/` | 地面覆盖缓冲 |\n| `RoadSplineBuffer` | `src/Core/Presentation/` | 路网样条缓冲 |\n| `WorldHudBatchBuffer` | `src/Core/Presentation/` | 世界 HUD 批量缓冲 |\n| `PresentationStableIdAllocator` | `src/Core/Presentation/` | 稳定 ID 分配器 |\n| `PerformerVisualStableIdTable` | `src/Core/Presentation/` | Performer 视觉稳定 ID 表 |\n| `PresentationEntityLifecycle` | `src/Core/Presentation/PresentationEntityLifecycle.cs` | 表现层安全销毁 |\n\n### 性能约束\n\n- Presentation Pipeline 不受 `SimulationBudgetMsPerFrame` 限制，但受帧率约束（目标 60 FPS）。\n- `InstancedBatchCapabilityValidator` 校验每帧执行，防止非法批量请求导致 GPU 错误。\n- `CameraCullingSystem` 使用视锥剔除，减少不可见实体的渲染数据生成。\n- Performer 命令 Buffer 在每帧开始时清空，不产生累积。\n\n### 扩展契约\n\n| 扩展点 | 方式 | 约束 |\n|--------|------|------|\n| 自定义 Presentation System | `IModContext.RegisterSystemFactory(name, null, factory)` | 无 `SystemGroup` 分组；在 `Update` 中执行 |\n| 自定义 Performer | `ConfigPipeline` 加载 `performers.json` | 必须被 `PerformerDefinitionRegistry` 索引 |\n| 自定义 Instanced 资产 | `ConfigPipeline` 加载 `instanced_batch_assets.json` | 必须被 `InstancedBatchAssetRegistry` 索引 |\n| 自定义 UI 渲染 | 实现 `IUiSystem` + `IUiRenderer` | 当前 Raylib 适配器使用 `MarkupUiSystem` + `SkiaUiRenderer` |\n\n---\n\n## 6. Trigger Pipeline（事件触发管线）\n\n### 职责\n\n将 gameplay 事件（全局或 Map-scoped）分发到注册的 Trigger 和 EventHandler。\n\n### 数据流\n\n```\nGameplay 事件源：\n  ├── GameEngine.Start() → GameEvents.GameStart\n  ├── GameEngine.LoadMap() → GameEvents.MapLoaded\n  ├── GameEngine.UnloadMap() → GameEvents.MapUnloaded\n  ├── GameEngine.Tick() → GameEvents.Tick\n  ├── EffectProcessing → GameEvents.Gas*\n  ├── Physics → GameEvents.Physics2D*\n  └── SimulationBudgetFuseEvent\n  ↓\nTriggerManager.FireEvent(eventKey, ctx) / FireMapEvent(mapId, eventKey, ctx)\n  ├── FireEventHandlers (所有 Mod 注册的 EventHandler 回调)\n  │   └── 按注册顺序调用；无优先级控制\n  └── 全局 Trigger（Priority 升序）\n      ├── 按 Priority 排序 Trigger 列表\n      ├── 评估 Conditions\n      ├── 执行 Actions（命令序列）\n      └── OnMapEnter / OnMapExit 生命周期（MapLoaded 事件特殊处理）\n  ↓\nMap-scoped Trigger（仅该 mapId 名下）\n  └── 同上逻辑，但作用域限定\n  ↓\nTriggerDecoratorRegistry 修饰\n  └── 对匹配的 Trigger 注入额外命令（AOP 风格）\n```\n\n### 触发器生命周期\n\n```\nMapLoaded 事件触发\n  ↓\nTrigger.OnMapEnter()  // 初始化 Trigger 状态\n  ↓\n... 每帧事件触发 ...\n  ↓\nMapUnloaded 事件触发\n  ↓\nTriggerManager.UnregisterMapTriggers(mapId, ctx)\n  ↓\nTrigger.OnMapExit()   // 清理 Trigger 状态\n```\n\n### 关键类型\n\n| 类型 | 文件路径 | 职责 |\n|------|----------|------|\n| `TriggerManager` | `src/Core/Scripting/TriggerManager.cs`（376 行） | 全局 + Map-scoped 触发器注册与分发 |\n| `Trigger` | `src/Core/Scripting/Trigger.cs` | 事件处理单元：Name, EventKey, Priority, Conditions, Actions |\n| `TriggerBuilder` | `src/Core/Scripting/TriggerBuilder.cs` | Fluent API：Do(command), Do(asyncAction), Anchor(key) |\n| `TriggerDecoratorRegistry` | `src/Core/Scripting/TriggerDecoratorRegistry.cs` | Mod 扩展点：按类型/名称/锚点注入命令 |\n| `FunctionRegistry` | `src/Core/Scripting/FunctionRegistry.cs` | 脚本函数注册表 |\n| `ScriptContext` | `src/Core/Scripting/ScriptContext.cs` | 基于 `TypedServiceScope` 的轻量 KV 上下文 |\n| `EventKey` | `src/Core/Scripting/EventKey.cs` | 事件键封装：忽略大小写比较 |\n| `GameEvents` | `src/Core/Scripting/GameEvents.cs` | 内置 EventKey 常量 |\n| `CoreServiceKeys` | `src/Core/Scripting/CoreServiceKeys.cs`（346 行） | Typed service key 常量 |\n\n### 性能约束\n\n- `TriggerManager` 在每帧 `EventDispatch` phase 中执行，受 Simulation 预算约束。\n- Trigger 列表按 Priority 排序后顺序执行，高 Priority Trigger 先执行。\n- `FireEventHandlers` 是简单回调，无优先级控制，按注册顺序调用。\n- Map-scoped Trigger 在 Map 卸载时统一注销，不产生泄漏。\n\n### 扩展契约\n\n| 扩展点 | 方式 | 约束 |\n|--------|------|------|\n| 注册 EventHandler | `IModContext.OnEvent(eventKey, handler)` | 全局回调；无优先级；按注册顺序 |\n| 注册 Trigger 修饰器 | `IModContext.RegisterTriggerDecorator(...)` | 只能修饰已有 Trigger，不能创建新 Trigger |\n| 注册脚本函数 | `IModContext.RegisterFunction(name, delegate)` | last-wins 覆盖；DEBUG 下记录冲突 |\n| 自定义 EventKey | 创建 `EventKey` 实例 | 忽略大小写；建议前缀 `ModId:` 避免冲突 |\n| Map 声明 Trigger | `MapConfig.TriggerTypes` 中声明 | 通过 `ConfigPipeline` 加载；Map 加载时激活 |\n\n---\n\n## 性能约束汇总\n\n| Pipeline | 执行时机 | 预算约束 | 关键瓶颈 |\n|----------|----------|----------|----------|\n| Launcher Runtime | 启动时 | 无（一次性的） | ALC 加载、反射扫描 |\n| ConfigPipeline | 启动时 / ReloadConfigs | 无（一次性的） | JSON 合并、反序列化 |\n| Mod Loading | 启动时 / ReloadConfigs | 无（一次性的） | ALC 解析、类型扫描 |\n| GAS Effect | 每帧 Simulation Loop | `SimulationBudgetMsPerFrame` | Graph VM 执行、BuiltinHandler 调用 |\n| Presentation | 每帧 Update | 帧率（60 FPS） | 视锥剔除、Buffer 填充 |\n| Trigger | 每帧 EventDispatch phase | `SimulationBudgetMsPerFrame` | Trigger 条件评估、Action 执行 |\n\n---\n\n> 参考文件\n> - `src/Core/Engine/GameEngine.cs`（主循环与 Pipeline 编排）\n> - `src/Core/Engine/GameBootstrapper.cs`（启动入口）\n> - `src/Core/Config/ConfigPipeline.cs`（配置合并）\n> - `src/Core/Modding/ModLoader.cs`（Mod 加载）\n> - `src/Core/Gameplay/GAS/EffectPhaseExecutor.cs`（Effect 执行）\n> - `src/Core/GraphRuntime/GraphExecutor.cs`（图 VM）\n> - `src/Core/NodeLibraries/GASGraph/GraphCompiler.cs`（图编译）\n> - `src/Core/Presentation/`（表现层 Buffer 和 System）\n> - `src/Core/Scripting/TriggerManager.cs`（事件分发）\n";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
