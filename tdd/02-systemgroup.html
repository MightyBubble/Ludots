const mdContent = "# 架构与基础设施 — SystemGroup Phase\n\n## 设计目标\n\n`SystemGroup` 是 Ludots 引擎仿真循环的**时序骨架**，将 ECS System 按严格顺序归入 11 个 phase。设计目标如下：\n\n1. **确定性执行**：同一输入在任何平台上产生相同的仿真结果（对 RTS 回滚、存档回放至关重要）。\n2. **阶段隔离**：每个 phase 有明确的职责边界，System 不得跨越 phase 读写状态。\n3. **可扩展挂靠**：新增 System 必须归属到已有 phase，不允许创建新 phase。\n4. **预算可控**：Simulation Loop 受 `IPacemaker` 控制，Presentation Loop 不受限制。\n\n---\n\n## 11 个 Phase 的完整定义与顺序\n\nPhase 顺序在 `GameEngine.cs` 第 97–134 行中定义，由 `SystemGroup` 枚举表示。以下按执行顺序逐一说明：\n\n```\nTick(platformDeltaTime)\n└── [Simulation Loop] — Pacemaker 控制，受预算限制\n    ├── Phase 0: SchemaUpdate\n    ├── Phase 1: InputCollection\n    ├── Phase 2: PostMovement\n    ├── Phase 3: AbilityActivation\n    ├── Phase 4: EffectProcessing\n    ├── Phase 5: RuntimeEntityBinding\n    ├── Phase 6: AttributeCalculation\n    ├── Phase 7: DeferredTriggerCollection\n    ├── Phase 8: Cleanup\n    ├── Phase 9: EventDispatch\n    └── Phase 10: ClearPresentationFlags\n```\n\n> 注：报告中原始列为 11 个 phase，其中 `RuntimeEntityBinding` 是 phase 5（位于 `EffectProcessing` 和 `AttributeCalculation` 之间）。用户要求中列了 10 个 phase（不含 `RuntimeEntityBinding`），但代码中实际存在。本 TDD 按代码实际包含全部 11 个 phase 描述。\n\n### Phase 0: SchemaUpdate\n\n**职责**：运行时 schema 变更——注册新的属性、图程序、Tag 规则等。\n\n| 典型 System | 文件路径 | 说明 |\n|-------------|----------|------|\n| `AttributeSchemaUpdateSystem` | `src/Core/Systems/` 或 `src/Core/Gameplay/GAS/` | 处理属性 schema 的增删改，如新增 `AttributeDefinition` 到 `AttributeSchema` |\n| `GraphProgramRegistry` 更新 | `src/Core/GraphRuntime/GraphProgramRegistry.cs` | 运行时加载新的 graph program |\n\n**挂靠规则**：只在需要动态修改属性/图 schema 的场景使用。大部分 gameplay Mod 不需要在此 phase 注册 System。\n\n### Phase 1: InputCollection\n\n**职责**：收集并分发玩家输入——选择、指令、交互、导航。\n\n| 典型 System | 文件路径 | 说明 |\n|-------------|----------|------|\n| `InputCollectionSystem` | `src/Core/Input/` | 收集原始输入请求（键盘、鼠标、触摸） |\n| `SelectionInputSystem` | `src/Core/Input/` | 处理选择框、点选、框选逻辑 |\n| `InteractionSystem` | `src/Core/Input/` | 处理交互动作（点击单位、使用物品等） |\n| `OrderProcessingSystem` | `src/Core/Input/` | 将输入转换为游戏指令（移动、攻击、技能） |\n\n**挂靠规则**：所有与输入采集和初步转换相关的 System 归属此 phase。输入在此 phase 被写入 `InputRequestQueue` / `OrderQueue`，后续 phase 消费。\n\n### Phase 2: PostMovement\n\n**职责**：移动后的空间同步与分区更新。\n\n| 典型 System | 文件路径 | 说明 |\n|-------------|----------|------|\n| `WorldToGridSyncSystem` | `src/Core/Systems/` | 将世界坐标同步到网格坐标 |\n| `SpatialPartitionUpdateSystem` | `src/Core/Spatial/` | 更新空间分区结构（AABB 树、网格哈希等） |\n| `SavePreviousWorldPositionSystem` | `src/Core/Systems/` | 保存上一帧位置，用于插值和碰撞检测 |\n| `ChunkedGridSpatialPartitionWorld` | `src/Core/Spatial/` | 分块网格空间分区的实际更新逻辑 |\n\n**挂靠规则**：所有在实体位置发生变化后需要执行的\"后处理\" System 归属此 phase。包括空间分区更新、网格同步、速度/位置校验等。\n\n### Phase 3: AbilityActivation\n\n**职责**：能力激活与指令处理——将输入或 AI 决策转换为具体的 Effect 请求。\n\n| 典型 System | 文件路径 | 说明 |\n|-------------|----------|------|\n| `AbilityActivationSystem` | `src/Core/Gameplay/GAS/` | 根据输入/AI 决策激活 Ability，生成 `EffectRequest` 并入队 |\n| `OrderProcessingSystem` | `src/Core/Input/` | 指令处理（跨 phase 消费 order queue） |\n| `ResponseChainSystem` | `src/Core/Input/` | 响应链处理（指令响应和连锁反应） |\n\n**挂靠规则**：\n- 将输入/决策转换为 gameplay 动作的系统归属此 phase。\n- 生成 `EffectRequest` 并写入 `EffectRequestQueue`。\n- 不直接修改属性或执行效果——只生成请求。\n\n### Phase 4: EffectProcessing\n\n**职责**：Effect 的完整生命周期执行——从 `EffectRequestQueue` 取出请求，按 phase 执行 graph program 和 builtin handler。\n\n| 典型 System | 文件路径 | 说明 |\n|-------------|----------|------|\n| `EffectPhaseExecutor` | `src/Core/Gameplay/GAS/` | 核心 Effect 执行器：按 `OnCast` → `OnCommit` → `OnImpact` → `OnExpire` 顺序执行各 phase |\n| `EffectLifetimeSystem` | `src/Core/Gameplay/GAS/` | 管理 Effect 的持续时间、tick 和过期判定 |\n| `EffectApplicationSystem` | `src/Core/Gameplay/GAS/` | Effect 应用逻辑（如 modifier 的附加与移除） |\n| `GasController` | `src/Core/Gameplay/GAS/` | GAS 总控制器，协调各子系统 |\n\n**执行流程**：\n\n```\nEffectRequestQueue 弹出请求\n  ↓\nEffectPhaseExecutor 读取 EffectTemplateData\n  ↓\n按 phase 顺序执行：\n  ├── OnCast   → GraphExecutor 或 BuiltinHandlerRegistry.Invoke\n  ├── OnCommit → GraphExecutor 或 BuiltinHandlerRegistry.Invoke\n  ├── OnImpact → GraphExecutor 或 BuiltinHandlerRegistry.Invoke\n  └── OnExpire → GraphExecutor 或 BuiltinHandlerRegistry.Invoke\n  ↓\n每个 phase 内：\n  ├── GraphProgram → GraphExecutor.Execute(ref state, program, handlerTable)\n  └── BuiltinHandler → BuiltinHandlerRegistry.Invoke(handlerId, ...)\n```\n\n**内置 Handler 列表**（`BuiltinHandlers`，`src/Core/Gameplay/GAS/BuiltinHandlers.cs`）：\n\n| Handler | 作用 |\n|---------|------|\n| `ApplyModifiers` | 应用属性 modifier |\n| `ApplyForce` | 施加物理力 |\n| `SpatialQuery` | 空间查询（AABB、Radius、Cone 等） |\n| `DispatchPayload` | 分发 payload 到目标集合 |\n| `ReResolveAndDispatch` | 重新解析并分发 |\n| `CreateProjectile` | 创建投射物实体 |\n| `CreateUnit` | 创建单位实体 |\n| `ApplyDisplacement` | 应用位移（击退、传送等） |\n| `ApplyRelation` | 应用关系变更 |\n| `ExecuteExchange` | 执行交易/交换操作 |\n| `CompleteProgression` | 完成进度/成就 |\n\n**挂靠规则**：所有实际执行 gameplay 效果（伤害、治疗、位移、创建实体、修改属性）的 System 归属此 phase。\n\n### Phase 5: RuntimeEntityBinding\n\n**职责**：运行时实体创建后的绑定——将新生成的实体与 `PerformerEntityRuntime`、AI 运行时、关系图等关联。\n\n| 典型 System | 文件路径 | 说明 |\n|-------------|----------|------|\n| `RuntimeEntityBindingSystem` | `src/Core/Gameplay/Spawning/` | 绑定 `PerformerEntityRuntime`，生成 `PresentationStableId` |\n| `RuntimeEntitySpawnSystem` | `src/Core/Gameplay/Spawning/` | 消费 `RuntimeEntitySpawnQueue`，批量生成实体 |\n\n**挂靠规则**：在 `EffectProcessing` 中创建的新实体（如 `CreateUnit`、`CreateProjectile`）在此 phase 完成与表现层和 AI 的绑定。确保实体在 `AttributeCalculation` 前已具备完整属性结构。\n\n### Phase 6: AttributeCalculation\n\n**职责**：属性计算与落地——将 Effect 阶段产生的属性变更缓冲落地为最终值。\n\n| 典型 System | 文件路径 | 说明 |\n|-------------|----------|------|\n| `AttributeBindingSystem` | `src/Core/Gameplay/GAS/` | 将 Effect 产生的属性 modifier 绑定到目标实体的 `AttributeBuffer` |\n| `AttributeCalculationSystem` | `src/Core/Gameplay/GAS/` | 执行属性公式计算（基础值 + modifier 总和） |\n| `AttributeSinkRegistry` | `src/Core/Gameplay/GAS/` | 属性 sink 注册表：属性变更的接收端 |\n\n**挂靠规则**：所有属性计算和 modifier 落地方相关的 System 归属此 phase。此 phase 完成后，所有实体的属性值为\"本帧最终值\"。\n\n### Phase 7: DeferredTriggerCollection\n\n**职责**：收集延迟触发器——将 Effect 执行和属性变更中标记的延迟触发器统一收集。\n\n| 典型 System | 文件路径 | 说明 |\n|-------------|----------|------|\n| `DeferredTriggerCollectionSystem` | `src/Core/Gameplay/GAS/` | 收集延迟触发器到 `DeferredTriggerQueue` |\n| `DeferredTriggerProcessSystem` | `src/Core/Gameplay/GAS/` | 处理延迟触发器队列，生成实际事件 |\n\n**挂靠规则**：需要跨帧或延迟触发的事件（如\"3 秒后爆炸\"、\"击杀后触发\"）在此 phase 统一收集和处理。\n\n### Phase 8: Cleanup\n\n**职责**：清理过期/标记实体和效果——安全地销毁实体、移除过期 Effect、回收资源。\n\n| 典型 System | 文件路径 | 说明 |\n|-------------|----------|------|\n| `EffectCleanupSystem` | `src/Core/Gameplay/GAS/` | 移除已过期的 Effect 实例 |\n| `EntityCleanupSystem` | `src/Core/Systems/` | 清理标记为销毁的实体 |\n| `PresentationEntityFinalizeDestroySystem` | `src/Core/Presentation/` | 执行 `PresentationDestroyPending` 标签实体的实际销毁 |\n\n**挂靠规则**：所有\"收尾\"操作——实体销毁、效果清理、资源回收——归属此 phase。此 phase 后 ECS World 结构稳定，不再有实体创建/销毁。\n\n### Phase 9: EventDispatch\n\n**职责**：事件分发——将 gameplay 事件广播到 Trigger 系统、表现层和外部监听者。\n\n| 典型 System | 文件路径 | 说明 |\n|-------------|----------|------|\n| `EventDispatchSystem` | `src/Core/Systems/` | 将 ECS 事件分发到 `TriggerManager` |\n| `GameplayPresentationProjectionSystem` | `src/Core/Presentation/` | 将 gameplay 事件投影到表现层事件流 |\n| `GlobalPresentationEventProjectionSystem` | `src/Core/Presentation/` | 全局表现事件的投影 |\n| `GameplayCueSystem` | `src/Core/Gameplay/Cue/` | 基于 `GameplayEvent` 查询生成 `CueDescriptor`，写入 `CueEventBuffer` |\n\n**挂靠规则**：所有事件广播和跨系统通知归属此 phase。Trigger 在此 phase 被触发，表现层事件在此 phase 被写入 Buffer。\n\n### Phase 10: ClearPresentationFlags\n\n**职责**：清除表现层的临时标记——为下一帧的表现计算做准备。\n\n| 典型 System | 文件路径 | 说明 |\n|-------------|----------|------|\n| `ClearPresentationFlagsSystem` | `src/Core/Presentation/` | 清除本帧表现计算中使用的临时标记和状态 |\n\n**挂靠规则**：只包含标记清理 System，确保下一帧的表现计算从干净状态开始。\n\n---\n\n## Presentation Loop（独立于 Simulation Loop）\n\n`GameEngine.Update(float)` 在 Simulation Loop 之后执行，不受 Pacemaker 预算限制：\n\n```\nUpdate(dt)\n  ├── 清空各表现 Buffer（Request, Sound, InstancedBatch, GroundOverlay, RoadSpline, WorldHUD）\n  ├── BeginPresentationCameraSnapshotScope()\n  ├── for each _presentationSystems → Update(dt)\n  ├── EndPresentationCameraSnapshotScope()\n  ├── InstancedBatchCapabilityValidator.Validate()\n  └── _gasPresentationEvents.Clear()\n```\n\n**Presentation System 列表**（`SystemGroup` 枚举外，无 phase 分组）：\n\n| System | 文件路径 | 说明 |\n|--------|----------|------|\n| `PerformerRuntimeSystem` | `src/Core/Presentation/` | Performer 运行时更新 |\n| `PerformerBehaviorSystem` | `src/Core/Presentation/` | Performer 行为状态机 |\n| `PerformerRuleSystem` | `src/Core/Presentation/` | Performer 规则评估 |\n| `CameraRuntimeSystem` | `src/Core/Systems/` | 相机运行时更新 |\n| `CameraCullingSystem` | `src/Core/Systems/` | 视锥剔除 |\n| `MinimapRenderSystem` | `src/Core/Presentation/` | 小地图渲染 |\n| `HudRenderSystem` | `src/Core/Presentation/` | HUD 渲染 |\n| `VisionSystem` | `src/Core/Vision/` | 视野与战争迷雾更新 |\n| `GridVisualSyncSystem` | `src/Core/Systems/` | 网格视觉同步 |\n\n---\n\n## 新增 System 的归属决策树\n\n```\n新增 System？\n├── 是否涉及渲染/视觉/音频/UI？\n│   └── 是 → 注册为 Presentation System（SystemGroup 外）\n│\n├── 是否修改属性 schema / 注册新图程序？\n│   └── 是 → SchemaUpdate phase\n│\n├── 是否收集/处理玩家输入？\n│   └── 是 → InputCollection phase\n│\n├── 是否在移动后更新空间结构？\n│   └── 是 → PostMovement phase\n│\n├── 是否将输入/决策转换为 Effect 请求？\n│   └── 是 → AbilityActivation phase\n│\n├── 是否执行实际效果（伤害、位移、创建实体）？\n│   └── 是 → EffectProcessing phase\n│\n├── 是否处理新实体生成后的绑定？\n│   └── 是 → RuntimeEntityBinding phase\n│\n├── 是否计算属性最终值？\n│   └── 是 → AttributeCalculation phase\n│\n├── 是否收集/处理延迟触发器？\n│   └── 是 → DeferredTriggerCollection phase\n│\n├── 是否销毁实体/清理效果？\n│   └── 是 → Cleanup phase\n│\n├── 是否分发事件到 Trigger/表现层？\n│   └── 是 → EventDispatch phase\n│\n├── 是否清除表现标记？\n│   └── 是 → ClearPresentationFlags phase\n│\n└── 无法归属 → 禁止创建。必须拆分为多个 System 分别归属。\n```\n\n---\n\n## 性能约束\n\n| 约束项 | 要求 | 机制 |\n|--------|------|------|\n| Phase 内 System 顺序 | 注册顺序 = 执行顺序 | `SystemFactoryRegistry` 按注册顺序返回 |\n| Phase 间顺序 | 固定，不可变更 | `SystemGroup` 枚举值硬编码 |\n| Simulation 预算 | 每帧 ≤ `SimulationBudgetMsPerFrame` | `IPacemaker` 控制；超预算则 `SimulationBudgetFuseEvent` |\n| 单 phase 内无 yield | 同步顺序执行 | 无 async/await 在 Simulation Loop 中 |\n| Presentation 不阻塞 | 即使 Simulation 熔断也继续渲染 | `Update` 独立于 `Tick` |\n\n---\n\n## 扩展契约\n\n| 扩展点 | 方式 | 约束 |\n|--------|------|------|\n| 注册 Simulation System | `IModContext.RegisterSystemFactory(name, SystemGroup, factory)` | `SystemGroup` 必须是已有枚举值之一；禁止新增 phase |\n| 注册 Presentation System | `IModContext.RegisterSystemFactory(name, null, factory)` | 无 phase 分组，在 `Update` 中执行 |\n| 动态启用/禁用 | `SystemFactoryRegistry.TryActivate` / `TryDeactivate` | 在 Map 加载/卸载时切换 |\n| System 依赖注入 | 通过 `GameContext.GetService<T>(ServiceKey<T>)` | 在 System 构造函数中解析服务 |\n\n---\n\n> 参考文件\n> - `src/Core/Engine/GameEngine.cs` 第 97–134 行（SystemGroup 枚举与 phase 顺序）\n> - `src/Core/Engine/SystemFactoryRegistry.cs`（System 注册与激活）\n> - `src/Core/Gameplay/GAS/EffectPhaseExecutor.cs`（Effect phase 执行）\n> - `src/Core/Gameplay/GAS/BuiltinHandlerRegistry.cs`（内置 Handler 表）\n> - `src/Core/Gameplay/GAS/BuiltinHandlers.cs`（11 个内置 Handler）\n> - `src/Core/Gameplay/GAS/DeferredTriggerCollectionSystem.cs`（延迟触发器）\n> - `src/Core/Gameplay/Spawning/RuntimeEntitySpawnSystem.cs`（运行时实体生成）\n> - `src/Core/Presentation/PresentationEntityLifecycle.cs`（表现层生命周期）\n> - `src/Core/Gameplay/Cue/GameplayCueSystem.cs`（Cue 事件生成）\n";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
</body>
</html>
