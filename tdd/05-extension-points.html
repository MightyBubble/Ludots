const currentPage = "tdd/05-extension-points.html";
const mdContent = "# 架构与基础设施 — 扩展点\n\n## 设计目标\n\nLudots 引擎的所有扩展均通过 `IModContext` 提供的 API 完成。设计目标如下：\n\n1. **唯一入口**：Mod 只能通过 `IMod.OnLoad(IModContext)` 注册能力，无其他扩展途径。\n2. **显式契约**：每个扩展点有明确的注册方式、查询方式和生命周期约束。\n3. **可卸载**：Mod 卸载时，其注册的内容应能被追踪和清理（部分 Registry 支持 `UnregisterSource`）。\n4. **不破坏 Core**：扩展不能修改 Core 的静态状态或私有实现。\n\n---\n\n## IModContext 扩展 API 完整列表\n\n`IModContext`（`src/Core/Modding/IModContext.cs`）是 Mod 与引擎交互的唯一接口。以下列出所有公开 API：\n\n### 1. 基础信息\n\n| 属性 | 类型 | 说明 |\n|------|------|------|\n| `ModId` | `string` | 当前 Mod 的唯一标识 |\n| `Log` | `ILog` | 日志记录器 |\n| `LogChannel` | `string` | 日志通道标识（用于过滤日志来源） |\n\n### 2. 资源访问\n\n| 属性 | 类型 | 说明 |\n|------|------|------|\n| `VFS` | `IVirtualFileSystem` | 虚拟文件系统：`GetStream(modId:path)` |\n| `GetResource<T>` | `T` | 获取类型化资源（泛型方法） |\n\n### 3. Registry 扩展\n\n| 属性 | 类型 | 说明 |\n|------|------|------|\n| `SystemFactoryRegistry` | `SystemFactoryRegistry` | 注册 System 工厂 |\n| `FunctionRegistry` | `FunctionRegistry` | 注册脚本函数 |\n| `TriggerDecorators` | `TriggerDecoratorRegistry` | 注册 Trigger 修饰器 |\n\n### 4. 事件订阅\n\n| 方法 | 签名 | 说明 |\n|------|------|------|\n| `OnEvent` | `OnEvent(string eventKey, Action<ScriptContext> handler)` | 注册全局事件处理器 |\n| `OnEvent` | `OnEvent(EventKey eventKey, Action<ScriptContext> handler)` | 类型安全版本 |\n\n### 5. 配置访问\n\n| 方法 | 签名 | 说明 |\n|------|------|------|\n| `GetConfig` | `GetConfig<T>()` | 获取合并后的配置对象 |\n\n---\n\n## SystemFactoryRegistry：注册 System 的 phase、工厂、依赖\n\n### 接口定义\n\n`SystemFactoryRegistry`（`src/Core/Engine/SystemFactoryRegistry.cs`）提供以下注册方法：\n\n```csharp\npublic sealed class SystemFactoryRegistry\n{\n    // 注册 Simulation System\n    public void Register(string name, SystemGroup systemGroup, Func<GameContext, ISystem> factory);\n    \n    // 注册 Presentation System（无 SystemGroup 分组）\n    public void RegisterPresentation(string name, Func<GameContext, ISystem> factory);\n    \n    // 尝试激活 System\n    public bool TryActivate(string name, GameContext context, GameEngine engine);\n    \n    // 尝试停用 System\n    public bool TryDeactivate(string name, GameEngine engine);\n}\n```\n\n### 使用示例\n\n```csharp\npublic void OnLoad(IModContext context)\n{\n    // 注册 Simulation System 到 InputCollection phase\n    context.SystemFactoryRegistry.Register(\n        \"MyMod.CustomInputSystem\",\n        SystemGroup.InputCollection,\n        ctx => new CustomInputSystem(ctx)\n    );\n    \n    // 注册 Presentation System\n    context.SystemFactoryRegistry.RegisterPresentation(\n        \"MyMod.CustomVisualSystem\",\n        ctx => new CustomVisualSystem(ctx)\n    );\n}\n```\n\n### 生命周期\n\n- **注册**：在 `IMod.OnLoad` 中调用 `Register` / `RegisterPresentation`。\n- **激活**：`GameEngine.InitializeCoreSystems` 中调用 `TryActivate`，按 `SystemGroup` 分组实例化。\n- **停用**：Map 卸载时可通过 `TryDeactivate` 禁用不需要的 System。\n- **清理**：Mod 卸载时，`SystemFactoryRegistry` 不自动清理工厂注册记录（当前设计）。\n\n### 约束\n\n| 约束 | 说明 |\n|------|------|\n| 名称唯一 | `name` 全局唯一；重复注册的行为未定义（应避免） |\n| SystemGroup 必须有效 | 必须是 `SystemGroup` 枚举中的已有值；禁止新增 phase |\n| Presentation System 无 phase | `RegisterPresentation` 的 System 在 `Update` 中执行，不受 Pacemaker 约束 |\n| 工厂委托 | 必须返回 `ISystem` 实例；构造函数中通过 `GameContext` 解析依赖 |\n\n---\n\n## TriggerDecoratorRegistry：事件触发修饰器\n\n### 接口定义\n\n`TriggerDecoratorRegistry`（`src/Core/Scripting/TriggerDecoratorRegistry.cs`）允许 Mod 在不直接创建 Trigger 的情况下，对 Map 声明的 Trigger 进行 AOP 风格修饰：\n\n```csharp\npublic sealed class TriggerDecoratorRegistry\n{\n    // 按类型修饰\n    public void Register(Type triggerType, Action<Trigger> decorator);\n    \n    // 按名称修饰\n    public void Register(string triggerName, Action<Trigger> decorator);\n    \n    // 按锚点修饰\n    public void RegisterAnchor(string anchorKey, Action<Trigger> decorator);\n}\n```\n\n### 使用示例\n\n```csharp\npublic void OnLoad(IModContext context)\n{\n    // 为所有名为 \"OnDeathLoot\" 的 Trigger 添加额外掉落命令\n    context.TriggerDecorators.Register(\"OnDeathLoot\", trigger =>\n    {\n        trigger.Do(ctx => {\n            // 额外掉落逻辑\n        });\n    });\n    \n    // 为所有带 \"difficulty_scaling\" 锚点的 Trigger 添加难度缩放\n    context.TriggerDecorators.RegisterAnchor(\"difficulty_scaling\", trigger =>\n    {\n        trigger.Do(ctx => {\n            var difficulty = ctx.Get<int>(GameDifficultyKey);\n            // 根据难度调整 Trigger 效果\n        });\n    });\n}\n```\n\n### 修饰时机\n\n1. Map 加载时，`MapConfig` 中声明的 Trigger 被解析为 `Trigger` 对象。\n2. `TriggerDecoratorRegistry` 中匹配的修饰器按注册顺序应用。\n3. 修饰后的 Trigger 被注册到 `TriggerManager`。\n\n### 约束\n\n| 约束 | 说明 |\n|------|------|\n| 只能修饰已有 Trigger | 不能创建新 Trigger；只能修改 Map 声明的 Trigger |\n| 修饰顺序 | 按注册顺序依次应用；后注册的修饰器可覆盖先注册的 |\n| 全局作用域 | 修饰器全局生效，作用于所有 Map 中匹配的 Trigger |\n| 不可撤销 | 当前无 `Unregister` 方法；Mod 卸载时修饰器不会自动移除 |\n\n---\n\n## FunctionRegistry：脚本函数注册\n\n### 接口定义\n\n`FunctionRegistry`（`src/Core/Scripting/FunctionRegistry.cs`）提供全局可调用函数的注册：\n\n```csharp\npublic sealed class FunctionRegistry\n{\n    // 注册函数（last-wins 覆盖）\n    public void Register(string name, ScriptFunctionDelegate function);\n    \n    // 调用函数\n    public bool TryInvoke(string name, ScriptContext context, out object result);\n    \n    // 检查函数是否存在\n    public bool Contains(string name);\n}\n\npublic delegate object ScriptFunctionDelegate(ScriptContext context);\n```\n\n### 使用示例\n\n```csharp\npublic void OnLoad(IModContext context)\n{\n    // 注册自定义函数\n    context.FunctionRegistry.Register(\"MyMod.CalculateDamage\", ctx =>\n    {\n        var attacker = ctx.Get<Entity>(CoreServiceKeys.Attacker);\n        var defender = ctx.Get<Entity>(CoreServiceKeys.Defender);\n        // 计算伤害...\n        return damage;\n    });\n}\n```\n\n### 覆盖策略\n\n- **last-wins**：同名函数后注册者覆盖先注册者。\n- **冲突记录**：DEBUG 构建下记录冲突到 `_conflictReport`；Release 构建下静默覆盖。\n- **全局可见**：注册后所有 Trigger、Graph VM 和其他脚本均可调用。\n\n### 约束\n\n| 约束 | 说明 |\n|------|------|\n| 名称唯一（全局） | 建议前缀 `ModId:` 避免命名冲突 |\n| 参数签名 | 统一为 `ScriptContext`；参数通过 `ctx.Get<T>(key)` 获取 |\n| 返回值 | `object`；调用方需自行转换类型 |\n| 线程安全 | 注册和调用在单线程（游戏线程）中进行，无需同步 |\n\n---\n\n## 自定义 Registry 的接入方式\n\n### 1. 组合 StringIntRegistry\n\n`StringIntRegistry`（`src/Core/Registry/StringIntRegistry.cs`）是通用 string→int 映射基础设施。子系统可持有私有 `StringIntRegistry` 实例：\n\n```csharp\npublic class MyCustomRegistry\n{\n    private readonly StringIntRegistry _idRegistry = new();\n    private readonly Dictionary<int, MyData> _dataById = new();\n    \n    public void Register(string name, MyData data)\n    {\n        int id = _idRegistry.Register(name);\n        _dataById[id] = data;\n    }\n    \n    public bool TryGet(string name, out MyData data)\n    {\n        if (_idRegistry.TryGetId(name, out int id))\n        {\n            return _dataById.TryGetValue(id, out data);\n        }\n        data = default;\n        return false;\n    }\n    \n    public void Freeze()\n    {\n        _idRegistry.Freeze();\n    }\n}\n```\n\n### 2. 使用 DataRegistry<T>\n\n`DataRegistry<T>`（`src/Core/Config/DataRegistry.cs`）是泛型数据注册表，从合并后的配置自动加载：\n\n```csharp\n// 定义数据类型\npublic class MyConfigData : IIdentifiable\n{\n    public string Id { get; set; }\n    public int Value { get; set; }\n}\n\n// 在 System 或 Service 中使用\npublic class MySystem\n{\n    private readonly DataRegistry<MyConfigData> _registry;\n    \n    public MySystem(GameContext context)\n    {\n        _registry = context.GetService<DataRegistry<MyConfigData>>(CoreServiceKeys.MyConfigRegistry);\n    }\n    \n    public MyConfigData GetData(string id) => _registry.Get(id);\n}\n```\n\n### 3. 实现 ISaveParticipant\n\n非 ECS 状态需要存档时，实现 `ISaveParticipant` 并注册到 `SaveParticipantRegistry`：\n\n```csharp\npublic class MyDomainParticipant : ISaveParticipant\n{\n    public string DomainKey => \"MyMod.MyDomain\";\n    \n    public JsonNode CaptureState()\n    {\n        // 将状态序列化为 JSON\n        return JsonSerializer.SerializeToNode(_myState);\n    }\n    \n    public void RestoreState(JsonNode state)\n    {\n        // 从 JSON 恢复状态\n        _myState = JsonSerializer.Deserialize<MyState>(state);\n    }\n}\n\n// 在 Mod OnLoad 中注册\npublic void OnLoad(IModContext context)\n{\n    // 注意：SaveParticipantRegistry 不在 IModContext 直接暴露，\n    // 需通过 GameContext 或引擎初始化时注册\n}\n```\n\n### 4. 自定义 Component 注册\n\nMod 可注册自定义 ECS 组件（必须是 `unmanaged struct`）：\n\n```csharp\npublic void OnLoad(IModContext context)\n{\n    // 通过 ModContext 内部调用 ComponentRegistry.Register\n    // 实际 API 可能通过 IModContext 的扩展方法提供\n}\n```\n\n**注意**：`ComponentRegistry` 的注册在 `IModContext` 中未直接暴露，但 `ModContext` 内部会调用 `ComponentRegistry.Register`。Mod 作者通常通过 `EntityTemplate` 的 JSON 声明组件，由 `ComponentRegistry` 自动解析。\n\n---\n\n## 扩展点汇总表\n\n| 扩展点 | 注册方式 | 读取方式 | 生命周期 | 卸载清理 |\n|--------|----------|----------|----------|----------|\n| `SystemFactoryRegistry` | `IModContext.RegisterSystemFactory` | `SystemFactoryRegistry.TryActivate` | Map 生命周期 | `TryDeactivate` |\n| `FunctionRegistry` | `IModContext.RegisterFunction` | `FunctionRegistry.TryInvoke` | 全局 | 无自动清理 |\n| `TriggerDecoratorRegistry` | `IModContext.RegisterTriggerDecorator` | 内部应用 | 全局 | 无自动清理 |\n| `TriggerManager` | `IModContext.OnEvent` | `TriggerManager.FireEvent` | 全局/Map | `UnregisterMapTriggers` |\n| `ComponentRegistry` | 内部（通过 JSON authoring） | `ComponentRegistry.Apply` | 全局 | `UnregisterSource(modId)` |\n| `StringIntRegistry` | 组合使用 | `TryGetId` / `GetName` | 子系统决定 | `Unregister` / `Clear` |\n| `DataRegistry<T>` | `ConfigPipeline` 自动加载 | `Get(id)` | 全局 | 随配置重载更新 |\n| `SaveParticipantRegistry` | 引擎初始化时注册 | `CaptureDomains` / `RestoreDomains` | 存档周期 | 持久参与 |\n| `ConfigPipeline` | 约定目录（自动） | `MergeGameConfig` / `MergeFromCatalog` | 全局 | 随 Mod 卸载移除片段 |\n| `VFS` | `ModLoader` 自动挂载 | `GetStream` / `TryResolveFullPath` | Mod 生命周期 | `ModLoader.UnloadAll` 卸载 |\n\n---\n\n## 扩展最佳实践\n\n1. **命名前缀**：所有自定义名称（函数、System、Trigger 锚点）使用 `ModId:` 前缀，避免全局冲突。\n2. **依赖注入**：System 通过 `GameContext.GetService<T>(ServiceKey<T>)` 解析服务，而非直接 `new` 或静态访问。\n3. **Frozen Registry**：在 `OnLoad` 结束时对 `StringIntRegistry` 调用 `Freeze`，防止运行时 ID 漂移。\n4. **避免静态状态**：不在 Mod 中使用静态字段存储运行时状态；所有状态存入 ECS World 或 `GameContext`。\n5. **配置驱动**：数据定义（Ability、Item、Effect 等）通过 JSON 配置驱动，避免硬编码在代码中。\n\n---\n\n> 参考文件\n> - `src/Core/Modding/IModContext.cs`（Mod 扩展 API 合约）\n> - `src/Core/Modding/IMod.cs`（Mod 入口接口）\n> - `src/Core/Engine/SystemFactoryRegistry.cs`（System 工厂注册）\n> - `src/Core/Scripting/FunctionRegistry.cs`（脚本函数注册）\n> - `src/Core/Scripting/TriggerDecoratorRegistry.cs`（Trigger 修饰器）\n> - `src/Core/Scripting/TriggerManager.cs`（事件分发）\n> - `src/Core/Config/ComponentRegistry.cs`（组件注册）\n> - `src/Core/Config/DataRegistry.cs`（泛型数据注册）\n> - `src/Core/Registry/StringIntRegistry.cs`（通用 ID 映射）\n> - `src/Core/Persistence/ISaveParticipant.cs`（存档参与者接口）\n> - `src/Core/Persistence/SaveParticipantRegistry.cs`（存档参与者注册）\n> - `src/Core/Modding/VirtualFileSystem.cs`（虚拟文件系统）\n";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
