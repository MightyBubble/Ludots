name: pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'gitbook/**'
      - 'artifacts/**'
      - 'showcase.registry.json'
      - 'launcher.config.json'
      - 'scripts/build-site.py'
      - 'scripts/validate-registry.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

# 同一时刻只允许一次 Pages 部署，防止并发重复部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate showcase registry
        run: python scripts/validate-registry.py

      - name: Build site
        run: python scripts/build-site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
