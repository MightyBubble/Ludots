name: Deploy selection-order dataflow to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/reference/ludots-selection-order-dataflow.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Sync interactive page
        run: |
          cp docs/reference/ludots-selection-order-dataflow.html gh-pages/reference/ludots-selection-order-dataflow.html
          sed -i 's|docs/reference/ludots-selection-order-dataflow.html|https://mightybubble.github.io/Ludots/reference/ludots-selection-order-dataflow.html|g' gh-pages/reference/ludots-selection-order-dataflow.html

      - name: Commit and push gh-pages
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/ludots-selection-order-dataflow.html
          if git diff --staged --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "docs(pages): sync selection-order dataflow from main"
          git push
