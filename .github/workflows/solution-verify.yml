name: solution-verify

on:
  pull_request:
    paths:
      - '.github/workflows/mass-navigation-10k-evidence.yml'
      - '.github/workflows/solution-verify.yml'
      - '.gitattributes'
      - 'assets/**'
      - 'global.json'
      - 'launcher.config.json'
      - 'launcher.presets.json'
      - 'mods/**'
      - 'NuGet.config'
      - 'scripts/acceptance/MassNavigationEvidencePortability.psm1'
      - 'scripts/acceptance/assert-portable-evidence.ps1'
      - 'scripts/acceptance/run-mass-navigation-large-world-uat.ps1'
      - 'scripts/generate-graph-op-node-galleries.py'
      - 'scripts/graph_op_coverage_index.py'
      - 'showcase.registry.json'
      - 'src/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mass-navigation-10k-evidence.yml'
      - '.github/workflows/solution-verify.yml'
      - '.gitattributes'
      - 'assets/**'
      - 'global.json'
      - 'launcher.config.json'
      - 'launcher.presets.json'
      - 'mods/**'
      - 'NuGet.config'
      - 'scripts/acceptance/MassNavigationEvidencePortability.psm1'
      - 'scripts/acceptance/assert-portable-evidence.ps1'
      - 'scripts/acceptance/run-mass-navigation-large-world-uat.ps1'
      - 'scripts/generate-graph-op-node-galleries.py'
      - 'scripts/graph_op_coverage_index.py'
      - 'showcase.registry.json'
      - 'src/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check graph-op gallery generator has no drift
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          python scripts/generate-graph-op-node-galleries.py --strict
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Graph-op gallery generator drifted. Run scripts/generate-graph-op-node-galleries.py --strict and commit the result."
            exit 1
          }
          $porcelain = git status --porcelain
          if ($porcelain) {
            Write-Host "Graph-op gallery generator produced untracked or unstaged files:"
            Write-Host $porcelain
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build maintained test project graphs
        shell: pwsh
        run: |
          $projects = Get-ChildItem src/Tests -Recurse -Filter *.csproj | Sort-Object FullName

          foreach ($project in $projects) {
            Write-Host "Building $($project.FullName)..."
            dotnet build $project.FullName -c Debug -v minimal
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          # ModdingSmoke is a manual smoke tool (OutputType=Exe) that lives outside src/Tests.
          dotnet build src/Tools/ModdingSmoke/ModdingTest.csproj -c Debug -v minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run architecture guard tests
        shell: pwsh
        run: |
          $guardFilter = @(
            'FullyQualifiedName~ArchitectureGuardTests',
            'FullyQualifiedName~GasRuntimeStateContractTests',
            'FullyQualifiedName~GraphRuntimeArchitectureGuardTests'
          ) -join '|'

          dotnet test src/Tests/ArchitectureTests/ArchitectureTests.csproj -c Debug --no-build --filter $guardFilter -v minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          dotnet test src/Tests/GasTests/GasTests.csproj -c Debug --no-build --filter "TestCategory=arch-guard" -v minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run MassNavigation PR acceptance contracts
        shell: pwsh
        run: |
          $architectureFilter = @(
            'FullyQualifiedName~Launcher_ResolvesCapabilityStandardShowcases_AsOnlyAcceptanceRoots',
            'FullyQualifiedName~MassNavigationEvidenceContractTests',
            'FullyQualifiedName~MassNavigationIssue671ArchitectureTests',
            'FullyQualifiedName~FormationOwnershipContractTests'
          ) -join '|'

          dotnet test src/Tests/ArchitectureTests/ArchitectureTests.csproj -c Debug --no-build --filter $architectureFilter -v minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $presentationFilter = @(
            'FullyQualifiedName~AuthoredAgentBindingSystem_UnchangedRelationshipRevisionDoesNotResolveDomainsAgain',
            'FullyQualifiedName~AuthoredAgentBindingSystem_MissingCommittedAgentIndexRebuildsInsteadOfRepeatedlyResolving',
            'FullyQualifiedName~Showcase_UnchangedRelationshipRevisionDoesNotRepeat10kDomainResolution',
            'FullyQualifiedName~FormationCapabilityExecution_InvalidSoldierAgentIndexFailsBeforeAnyAnchorStateChanges',
            'FullyQualifiedName~FormationCapabilityExecution_StableTargetStillRejectsInvalidSoldierBindingBeforeAnyCommit',
            'FullyQualifiedName~FormationCapabilityExecution_SoldierAgentIndexAtCapacityFailsBeforeAnyCommit',
            'FullyQualifiedName~FormationCapabilityExecution_DuplicateSoldierSlotFailsBeforeAnyCommit',
            'FullyQualifiedName~FormationCapabilityExecution_SuspendedSoldierFailsWholeBatchBeforeAnchorCommit',
            'FullyQualifiedName~FormationCapabilityExecution_SuspendedAnchorFailsExplicitlyWithoutMemberCommit',
            'FullyQualifiedName~MassNavigationOrderCommand_MemberChangeUsesExactComparisonForFormerHashCollision',
            'FullyQualifiedName~FormationCapabilityExecutionHotPath_AfterWarmupAllocatesZeroBytes',
            'FullyQualifiedName~MassNavigationIssue671RuntimeTests',
            'FullyQualifiedName~RuntimeTemplateSpawn_BatchTemplateAuthoredTeamLinksMembershipForEveryEntity',
            'FullyQualifiedName~RuntimeTemplateSpawn_BatchTemplateAuthoredTeamMissingRepresentativeFailsBeforeCreation',
            'FullyQualifiedName~RuntimeTemplateBatchSpawn_AppliesExplicitMembershipRelationshipsForEveryEntity',
            'FullyQualifiedName~FormationCapabilityMoveBatch_DifferentOrderIdsAtSameTargetRemainIndependent',
            'FullyQualifiedName~FormationCapabilityMoveBatch_SharedOrderIdPreservesRelativeLayout',
            'FullyQualifiedName~FormationCapabilityOrderBatch_',
            'FullyQualifiedName~OrderIngestion_RouteEnabledWithoutConfiguredAgentType',
            'FullyQualifiedName~FormationCapabilityOrders_RejectRetiredOrCrossOrderPayloadFields'
          ) -join '|'

          dotnet test src/Tests/PresentationTests/PresentationTests.csproj -c Debug --no-build --filter $presentationFilter -v minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Full GasTests and full PresentationTests are already red on origin/main.
      # Keep this workflow honest by gating the AAC slice that currently passes on main.
      # The slice membership lives in the test sources as [Category("ci-gate")];
      # arch-guard classes also carry ci-gate but run in their own step above.
      - name: Run association core GasTests slice
        shell: pwsh
        run: |
          dotnet test src/Tests/GasTests/GasTests.csproj -c Debug --no-build --filter "TestCategory=ci-gate" -v minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run Raylib field rendering tests
        shell: pwsh
        run: |
          dotnet test src/Tests/RaylibAdapterTests/RaylibAdapterTests.csproj -c Debug --no-build --filter "TestCategory=raylib-field" -v minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
