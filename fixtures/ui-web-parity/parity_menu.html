<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星港休整舱 · Ludots Web Parity</title>
  <link rel="stylesheet" href="parity_menu.css" />
</head>
<body>
  <div id="stage" data-parity-id="stage">
    <div id="backdrop" data-parity-id="backdrop"></div>
    <div id="orb-a" class="nebula-orb orb-a" data-parity-id="orb-a"></div>
    <div id="orb-b" class="nebula-orb orb-b" data-parity-id="orb-b"></div>
    <div id="orb-c" class="nebula-orb orb-c" data-parity-id="orb-c"></div>
    <div id="menu-shell" data-parity-id="menu-shell">
      <div id="menu-card" data-parity-id="menu-card">
        <div id="hero-strip" class="hero-strip" data-parity-id="hero-strip">
          <div id="hero-crest" class="hero-crest" data-parity-id="hero-crest">★</div>
          <div id="hero-copy" class="hero-copy" data-parity-id="hero-copy">
            <div id="menu-kicker" data-parity-id="menu-kicker">STARPORT LOUNGE · 暂停中</div>
            <div id="menu-title" data-parity-id="menu-title">星港休整舱</div>
            <div id="menu-subtitle" data-parity-id="menu-subtitle">灯还亮着，换屏也不乱。</div>
          </div>
          <div id="hero-badge" class="hero-badge" data-parity-id="hero-badge">
            <div class="hero-badge-label">航线</div>
            <div class="hero-badge-value">雾谷-03</div>
          </div>
        </div>
        <div id="menu-grid" data-parity-id="menu-grid">
          <div id="btn-resume" class="menu-btn primary" data-parity-id="btn-resume">继续冒险</div>
          <div id="btn-map" class="menu-btn" data-parity-id="btn-map">打开星图</div>
          <div id="btn-settings" class="menu-btn" data-parity-id="btn-settings">舰桥设置</div>
          <div id="btn-quit" class="menu-btn danger" data-parity-id="btn-quit">回到标题</div>
        </div>
        <div id="stat-row" data-parity-id="stat-row">
          <div id="stat-hp" class="stat-chip hp" data-parity-id="stat-hp">
            <div class="stat-top">
              <div class="stat-label">船体护盾</div>
              <div class="stat-value">128</div>
            </div>
            <div class="stat-meter">
              <div class="stat-meter-fill hp-fill"></div>
            </div>
          </div>
          <div id="stat-mp" class="stat-chip mp" data-parity-id="stat-mp">
            <div class="stat-top">
              <div class="stat-label">反应堆</div>
              <div class="stat-value">64</div>
            </div>
            <div class="stat-meter">
              <div class="stat-meter-fill mp-fill"></div>
            </div>
          </div>
          <div id="stat-gold" class="stat-chip gold" data-parity-id="stat-gold">
            <div class="stat-top">
              <div class="stat-label">星币</div>
              <div class="stat-value">902</div>
            </div>
            <div class="stat-meter">
              <div class="stat-meter-fill gold-fill"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="side-rail" data-parity-id="side-rail">
        <div id="rail-card" class="rail-card" data-parity-id="rail-card">
          <div id="rail-kicker" class="rail-kicker" data-parity-id="rail-kicker">LIVE BRIEF</div>
          <div id="rail-title" data-parity-id="rail-title">当前任务</div>
          <div id="rail-body" data-parity-id="rail-body">护送商队穿过雾谷，别让补给掉队。</div>
          <div id="rail-progress" class="rail-progress" data-parity-id="rail-progress">
            <div class="rail-progress-label">航程</div>
            <div class="rail-progress-track">
              <div class="rail-progress-fill"></div>
            </div>
            <div class="rail-progress-value">62%</div>
          </div>
        </div>
        <div id="tip-card" class="tip-card" data-parity-id="tip-card">
          <div id="tip-kicker" class="tip-kicker" data-parity-id="tip-kicker">舱室提示</div>
          <div id="tip-body" class="tip-body" data-parity-id="tip-body">点上方芯片，看舱门跟着变形。</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
