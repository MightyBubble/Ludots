const mdContent = "# 表现子系统技术设计文档（TDD）\n\n> 文档编号：TDD-08  \n> 对应模块：`src/Core/Presentation/`、`src/Core/UI/`、`src/Core/Tweening/`  \n> 依据 Stage 1 扫描报告：`report_Presentation_UI.md`  \n> 版本：基于分支 `codex/issue437-graph-config`\n\n---\n\n## 1. 设计目标\n\n表现子系统（Presentation_UI）是 Ludots 引擎的 **视听输出层**，负责将逻辑层（Gameplay/GAS/Navigation）的纯数据状态转化为可渲染、可交互的视听输出，同时保证逻辑层与平台适配层的严格解耦。\n\n| 目标 | 约束 |\n|------|------|\n| **逻辑层零平台依赖** | Core 不引用任何图形 API、窗口系统或浏览器引擎，只输出平台无关的 \"渲染意图\"（draw buffers、proxy、event stream） |\n| **Performer-as-Actor** | 以 `PerformerDefinition` + `BehaviorSlot` 组合模型取代旧的扁平 `VisualTemplate`/`Prefab` 系统，实现树形层级、行为驱动、参数黑板继承 |\n| **三层 UI 体系** | 高性能批量 HUD → 原生 Retained UI（Skia） → 真 Web App（CEF/Ultralight 嵌入） |\n| **Surface 所有权唯一化** | `UiSurfaceHost` 是唯一能写 `UIRoot.Scene` 的组件，杜绝多控制器堆叠场景的混乱 |\n| **0-GC 热路径** | `PresentationEventStream`、`WorldHudBatchBuffer`、`PerformerCommandBuffer` 等高频缓冲均使用固定容量、无堆分配结构 |\n\n---\n\n## 2. 数据模型与核心接口\n\n![Performer 生命周期](diagrams/performer-lifecycle.svg)\n\n### 2.1 Performer 编译车道\n\n![BehaviorSlot 激活](diagrams/behavior-activation.svg)\n\nPerformer 系统采用 **\"声明式定义 + 编译时规则索引 + 运行时事件驱动\"** 的三层架构。`CompiledPerformerBootstrapRegistry` 在加载期将 `PerformerDefinition` 编译为快速查找索引。\n\n| 类型 | 文件路径 | 说明 |\n|------|----------|------|\n| `PerformerDefinition` | `Performers/PerformerDefinition.cs` | 声明式 performer 定义：children、behaviors、rules、bindings、paramDefaults、visibility condition |\n| `BehaviorSlot` | `Performers/BehaviorSlot.cs` | 行为组合单元：AssetBinding、Animator、Sound、Material、Spline、Grounding、MinimapMarker 等 |\n| `BehaviorKind` | `Performers/BehaviorSlot.cs` | 行为种类枚举（1=AssetBinding, 4=Animator, 6=Sound, 7=Material, 8=Spline, 9=Grounding, 10=MinimapMarker） |\n| `AssetBindingConfig` | `Performers/BehaviorSlot.cs` | 资产绑定配置：AssetKind、AssetId、MaterialId、RenderPath、LocalOffset/Rotation/Scale、param-driven swap/visibility/color |\n| `CompiledPerformerBootstrapRegistry` | `Performers/CompiledPerformerBootstrapRegistry.cs` | 编译时 bootstrap 规则索引：`EntitySpawned` / `EntityDestroyed` → `Create` / `Destroy` 规则 |\n| `PerformerDefinitionRegistry` | `Performers/PerformerDefinitionRegistry.cs` | String→Int 注册表，含 `CompiledPerformerBootstrapRegistry` 自动重建 |\n| `ChildPerformerRef` | `Performers/PerformerDefinition.cs` | 子 performer 引用：DefinitionId + ScopeTag + ParamOverrides |\n| `ParamDefault` | `Performers/PerformerDefinition.cs` | 参数默认值：ParamKey + Lane + Float/Int/Vector 值 |\n| `ConditionRef` | `Performers/ConditionRef.cs` | 规则条件引用（GraphProgramId / InlineConditionKind） |\n\n> **编译规则**：`PerformerDefinitionRegistry` 在注册定义时自动触发 `CompiledPerformerBootstrapRegistry` 重建，将 `EntitySpawned` / `EntityDestroyed` 事件映射到 `CreatePerformer` / `DestroyPerformer` 命令，避免运行时解释定义。\n\n### 2.2 CommandBuffer：PerformerCommandBuffer 环形缓冲\n\n![PerformerCommand 流](diagrams/performer-command-flow.svg)\n\n所有 Performer 生命周期操作（Create/Destroy/SetParam/ActivateBehavior/DeactivateBehavior）通过命令缓冲提交，实现 **0-GC 批量处理**。\n\n| 类型 | 文件路径 | 说明 |\n|------|----------|------|\n| `PerformerCommand` | `Performers/PerformerCommand.cs` | 命令 DTO：Create/Destroy/SetParam/ActivateBehavior/DeactivateBehavior/InitializeTransform |\n| `PerformerCommandKind` | `Performers/PerformerCommandKind.cs` | 命令种类枚举（含 DestroyScopedPerformer） |\n| `PerformerCommandBuffer` | `Performers/PerformerCommandBuffer.cs` | **固定容量环形命令缓冲**，溢出时丢弃并计数 |\n| `PerformerEntityRuntime` | `Performers/PerformerEntityRuntime.cs` | **核心运行时**：performer 实例树管理、StableId 分配、行为激活位、参数传播、父子层级索引 |\n\n> **溢出策略**：`PerformerCommandBuffer` 为固定容量环形缓冲。当写入超过容量时，新命令被丢弃并递增溢出计数。溢出计数通过遥测上报，供开发者诊断。\n\n### 2.3 Surface 所有权模型\n\nUI Surface 采用 **\"Host 唯一写者 + 贡献者租约\"** 模型，杜绝多控制器同时修改 UI 场景导致的竞争和混乱。\n\n```\n[Mod / 控制器 / Showcase / Markup / 浏览器面板]  — 贡献者\n    │  Acquire 租约 → Publish(UiSurfaceContribution)\n    ▼\nUiSurfaceHost  — 唯一写 UIRoot.Scene 的人\n    │  按 Segment / Priority / Exclusive 合成 1 棵 UiScene\n    │  内部 MountSceneFromHost / ClearSceneFromHost + UIRoot.IsDirty = true\n    ▼\nUIRoot  — 渲染 + 输入端口\n    │  ├─ 渲染：IUiRenderer (SkiaUiRenderer) → 画 UiScene\n    │  └─ 输入：HandleInput(PointerEvent/KeyboardEvent) → 命中测试 → 节点派发 / Canvas sink\n    ▼\n适配器\n    ├─ Raylib: RaylibOverlayCompositor 按 IsDirty 重绘 Skia UI 层\n    └─ Web: WebUiRuntimeBridge.TryConsumeScene 按 IsDirty 序列化推给浏览器\n```\n\n| 接口 | 位置 | 说明 |\n|------|------|------|\n| `IUiSurfaceHost` | `Libraries/Ludots.UI/Surface/`（Core 外） | UI Surface 租约与合成（贡献者扩展点） |\n| `IUiRenderer` | `Libraries/Ludots.UI/Runtime/`（Core 外） | UI 渲染策略接口（Skia/其他后端） |\n| `IBrowserRuntime` | `Libraries/Ludots.UI.Browser/`（Core 外） | 浏览器运行时契约 |\n| `IBrowserMessageBridge` | `Libraries/Ludots.UI.Browser/`（Core 外） | 浏览器消息桥接 |\n| `IWebUiDataTransport` | `Libraries/Ludots.WebUI.DataPlane/`（Core 外） | WebUI DataPlane 传输契约 |\n\n### 2.4 渲染管线：从 PrimitiveDrawBuffer 到 Instancing\n\n![Presentation 渲染管线](diagrams/presentation-pipeline.svg)\n\n表现层渲染输出采用 **多缓冲流水线**，最终由平台适配器消费。\n\n| 缓冲类型 | 文件路径 | 说明 |\n|----------|----------|------|\n| `PrimitiveDrawBuffer` | `Rendering/PrimitiveDrawBuffer.cs` | 调试图元输出（线、圆、框） |\n| `GroundOverlayBuffer` | `Rendering/GroundOverlayBuffer.cs` | 地面叠加绘制输出 |\n| `WorldHudBatchBuffer` | `Hud/WorldHudBatchBuffer.cs` | 世界空间 HUD 批量缓冲（SoA，retained index by StableId，owner group） |\n| `ScreenHudBatchBuffer` | `Hud/ScreenHudBatchBuffer.cs` | 屏幕空间 HUD 缓冲：bar + text 双通道，支持增量投影、position-only delta |\n| `SkinnedVisualBatchBuffer` | `Rendering/SkinnedVisualBatchBuffer.cs` | 蒙皮网格批次缓冲 |\n| `PresentationVisualProxy` | `Rendering/PresentationVisualProxy.cs` | 表现视觉代理：Payload + ProxyKind + Mobility + Flags + LOD，adapter 消费的核心单位 |\n| `VisualRenderPayload` | `Rendering/VisualRenderPayload.cs` | 13 字段公共渲染载荷：MeshAssetId/Position/Rotation/Scale/Color/StableId/MaterialId/TemplateId/AnimationProfileId/RenderPath/Animator/AnimationOverlay/Visibility |\n| `VisualRenderPath` | `Components/VisualRenderPath.cs` | 渲染通道枚举：StaticMesh/InstancedStaticMesh/HierarchicalInstancedStaticMesh/SkinnedMesh/GpuSkinnedInstance/Surface |\n| `StableDrawCache` | `Rendering/StableDrawCache.cs` | Retained 静态内容缓存，支持增量投影 |\n| `InstancedBatchOperationBuffer` | `Instancing/InstancedBatchOperationBuffer.cs` | 实例化批次操作缓冲（add/remove/update） |\n| `InstancedBatchSubmissionRuntime` | `Instancing/InstancedBatchSubmissionRuntime.cs` | 实例化批次提交运行时 |\n\n> **渲染路径语义**：`VisualRenderPathSemantics` 提供扩展方法判断路径类型：`IsStaticInstanceLane()`、`IsSkinnedLane()`、`SupportsAnimatorPackedState()`、`IsSurfaceLane()`。\n\n---\n\n## 3. 关键算法与流程\n\n### 3.1 表现层主循环数据流\n\n```\n[FixedUpdate 逻辑层]\n    │\n    ├─ GameplayEventBus (GAS 事件)\n    ├─ GameplayTagEffectiveChangedBits / GameplayAttributeChangedBits\n    ├─ WorldPositionCm / PreviousWorldPositionCm (定点数厘米)\n    │\n    ▼\n[Presentation 系统组 — 按 phase 顺序执行]\n    │\n    ├─ PresentationFrameSetupSystem\n    │   └─ 计算 InterpolationAlpha (pacemaker)，写入 PresentationFrameState 单例\n    │\n    ├─ WorldToVisualSyncSystem\n    │   └─ Fix64Vec2.Lerp(Previous, Current, alpha) → VisualTransform (浮点米, XZ平面)\n    │   └─ 带 FacingDirection 的实体同步 Rotation\n    │\n    ├─ TerrainHeightSyncSystem\n    │   └─ 从 IVisualHeightmap 采样 Y 高度，贴附地形\n    │\n    ├─ GameplayPresentationProjectionSystem\n    │   └─ GameplayEventBus → PresentationEventStream\n    │   └─ GasPresentationEventBuffer → PresentationEventStream (EffectApplied/CastCommitted...)\n    │   └─ Owner tag/attribute dirty bits → PresentationOwnerChangeBuffer\n    │\n    ├─ SelectionPresentationEventSystem\n    │   └─ SelectionRuntime 变化 → SelectionMemberAdded/SelectionMemberRemoved 事件\n    │\n    ├─ GlobalPresentationEventProjectionSystem\n    │   └─ 全局事件（日/夜/区域/天气）→ PresentationEventStream\n    │\n    ├─ PerformerRuleSystem\n    │   └─ 事件 × 规则 → PerformerCommandBuffer（倒排索引 O(E×matched)）\n    │   └─ Graph VM 条件求值（float/int/bool/entity registers）\n    │\n    ├─ PerformerRuntimeSystem\n    │   └─ 消费命令：CreatePerformer / DestroyPerformer / DestroyPerformerScope\n    │   └─ SetParam（写入 ECS 组件 PerformerFloatParams/IntParams/VectorParams，父→子继承）\n    │   └─ ActivateBehavior / DeactivateBehavior（翻转 behavior mask）\n    │   └─ SyncCullVisibility（owner entity CullState → performer cull state）\n    │\n    ├─ PerformerBehaviorSystem\n    │   └─ BootstrapPending 处理（子树自动展开）\n    │   └─ OwnerChanges 处理（attribute→param / tag→param）\n    │   └─ Tick-driven behaviors：Spline/Grounding/Attachment/Sound/OwnerFacing\n    │   └─ Material dirty 处理（param→material swap）\n    │   └─ 写入 AnimatorPackedState（128-bit compact payload）\n    │\n    ├─ PerformerEmitSystem\n    │   └─ 遍历 AssetBinding behavior → PresentationVisualProxy\n    │   └─ 遍历 StaticStableVisual → dirty-only emit（fast path）\n    │   └─ RetainedPresentationRequest → 生命周期 tick + replay cache\n    │   └─ WorldHud behavior → WorldHudBatchBuffer\n    │   └─ Sound behavior → SoundRequestBuffer\n    │   └─ Skinned visual → SkinnedVisualBatchBuffer\n    │\n    ├─ PerformerMinimapMarkerSystem\n    │   └─ MinimapMarker behavior → MinimapMarkerBuffer → MinimapScreenMarkerBuffer\n    │\n    ├─ PerformerEntityTransformSyncSystem\n    │   └─ Owner entity VisualTransform → performer WorldPosition/Rotation/Scale/Facing\n    │   └─ 快速子节点传播（FastAttachedChildren）\n    │\n    ├─ AnimatorRuntimeSystem\n    │   └─ 读取 AnimatorPackedState + blackboard param → 动画状态机推进\n    │   └─ 反馈事件写回 blackboard\n    │\n    ├─ PresentationRequestFlushSystem\n    │   └─ 消费 PresentationRequestBuffer：VisualProxy / Prefab / GroundOverlay / WorldHud / RoadSpline\n    │   └─ StableDrawCache.BeginFrame → 增量投影到 PrimitiveDrawBuffer / snapshotBuffer\n    │   └─ 处理 target generation 变化时的 retained content 重投影\n    │\n    ├─ WorldHudToScreenSystem\n    │   └─ WorldHudBatchBuffer → ScreenHudBatchBuffer（投影 + 视锥裁剪 + 密度控制）\n    │   └─ 支持 retained 投影：content revision 不变时只投影位置变化\n    │\n    ├─ MinimapPresentationSystem\n    │   └─ MinimapMarkerBuffer → MinimapScreenMarkerBuffer → ScreenOverlayBuffer\n    │   └─ 输入消费：toggle/zoom/pan/center/click-to-world\n    │\n    └─ SurfaceSourceFlushSystem / SurfaceSourceLifecycleSystem\n        └─ Surface payload 刷新与生命周期管理\n```\n\n### 3.2 UI 数据流（Surface 所有权模型）\n\n```\n[Mod / 控制器 / Showcase / Markup / 浏览器面板]  — 贡献者\n    │  Acquire 租约 → Publish(UiSurfaceContribution)\n    ▼\nUiSurfaceHost  — 唯一写 UIRoot.Scene 的人\n    │  按 Segment / Priority / Exclusive 合成 1 棵 UiScene\n    │  内部 MountSceneFromHost / ClearSceneFromHost + UIRoot.IsDirty = true\n    ▼\nUIRoot  — 渲染 + 输入端口\n    │  ├─ 渲染：IUiRenderer (SkiaUiRenderer) → 画 UiScene\n    │  └─ 输入：HandleInput(PointerEvent/KeyboardEvent) → 命中测试 → 节点派发 / Canvas sink\n    ▼\n适配器\n    ├─ Raylib: RaylibOverlayCompositor 按 IsDirty 重绘 Skia UI 层\n    └─ Web: WebUiRuntimeBridge.TryConsumeScene 按 IsDirty 序列化推给浏览器\n```\n\n### 3.3 请求与缓冲 Pipeline\n\n```\nGameplay / Mod / Trigger / Ability / Cue\n    │\n    ▼\nPresentationRequestBuffer (SoA, 固定容量)\n    │  VisualProxy / Prefab / GroundOverlay / WorldHud / RoadSpline / Sound\n    ▼\nPresentationRequestFlushSystem\n    │  ├─ VisualProxy → PrimitiveDrawBuffer + PresentationVisualSnapshotBuffer\n    │  ├─ Prefab → PrefabRegistry 解析 → 最终叶子写入 draw buffer\n    │  ├─ GroundOverlay → GroundOverlayBuffer\n    │  ├─ WorldHud → WorldHudBatchBuffer\n    │  └─ RoadSpline → RoadSplineBuffer\n    ▼\nAdapter (Raylib/UE5/Web)\n    │  读取 draw buffers → 平台绘制调用\n    │  读取 snapshot buffer → persistent manager 对齐（create/update/destroy/reuse）\n    └─ 读取 ScreenHudBatchBuffer → 直接绘制 bar/text\n```\n\n---\n\n## 4. 性能约束\n\n| 约束项 | 数值/规则 | 说明 |\n|--------|-----------|------|\n| PerformerCommandBuffer | **固定容量环形缓冲** | 溢出时丢弃并计数 |\n| PresentationEventStream | **固定容量事件流** | 规则系统消费后清空，0-GC |\n| WorldHudBatchBuffer | **SoA 布局，retained index by StableId** | 支持增量投影，position-only delta 时避免重构建 |\n| ScreenHudBatchBuffer | **bar + text 双通道** | 支持增量投影、视锥裁剪、密度跳过 |\n| StableDrawCache | **增量投影** | content revision 不变时只投影位置变化 |\n| 动画状态机 | **128-bit AnimatorPackedState** | 紧凑 payload，减少带宽 |\n| 插值计算 | **Fix64Vec2.Lerp → 浮点 VisualTransform** | 逻辑层使用 Fix64，表现层使用 float 米 |\n| 0-GC 要求 | **PresentationFrameSetupSystem → PerformerEmitSystem 热路径** | 禁止堆分配 |\n\n---\n\n## 5. 扩展契约\n\n| 扩展点 | 接口 | 位置 | 约束 |\n|--------|------|------|------|\n| **平台相机适配** | `ICameraAdapter` | `Camera/ICameraAdapter.cs` | 接收 `CameraRenderState3D` 更新平台相机 |\n| **视图控制器** | `IViewController` | `Camera/IViewController.cs` | 查询 Resolution/Fov/AspectRatio |\n| **坐标映射** | `ICoordinateMapper` | `ICoordinateMapper.cs` | 逻辑网格坐标 ↔ 视觉 3D 坐标，批量 0GC 转换 |\n| **视觉高度图** | `IVisualHeightmap` | `Terrain/IVisualHeightmap.cs` | 地形高度采样 |\n| **骨骼变换回传** | `IBoneTransformProvider` | `Performers/IBoneTransformProvider.cs` | 适配器实现骨骼变换回传 |\n| **UI 系统** | `IUiSystem` | `UI/IUiSystem.cs` | 极简 HTML/CSS 设置接口（`SetHtml`） |\n| **实体命令面板数据源** | `IEntityCommandPanelSource` | `UI/EntityCommandPanels/EntityCommandPanelContracts.cs` | 可扩展：GAS/Collection/Custom |\n| **实体命令面板动作源** | `IEntityCommandPanelActionSource` | `UI/EntityCommandPanels/EntityCommandPanelContracts.cs` | 槽位激活 |\n| **Surface 贡献者** | `IUiSurfaceHost` | `Libraries/Ludots.UI/Surface/` | 租约与合成 |\n| **UI 渲染器** | `IUiRenderer` | `Libraries/Ludots.UI/Runtime/` | Skia 或其他后端 |\n\n---\n\n## 6. 关键类清单（带文件路径）\n\n### 6.1 Performer 核心\n\n| 类/接口 | 文件路径 | 职责 |\n|---------|----------|------|\n| `PerformerDefinition` | `src/Core/Presentation/Performers/PerformerDefinition.cs` | 声明式 performer 定义 |\n| `BehaviorSlot` | `src/Core/Presentation/Performers/BehaviorSlot.cs` | 行为组合单元 |\n| `AssetBindingConfig` | `src/Core/Presentation/Performers/BehaviorSlot.cs` | 资产绑定配置 |\n| `PerformerCommand` | `src/Core/Presentation/Performers/PerformerCommand.cs` | 命令 DTO |\n| `PerformerCommandKind` | `src/Core/Presentation/Performers/PerformerCommandKind.cs` | 命令种类枚举 |\n| `PerformerCommandBuffer` | `src/Core/Presentation/Performers/PerformerCommandBuffer.cs` | 固定容量环形命令缓冲 |\n| `PerformerEntityRuntime` | `src/Core/Presentation/Performers/PerformerEntityRuntime.cs` | 核心运行时（实例树管理） |\n| `PerformerDefinitionRegistry` | `src/Core/Presentation/Performers/PerformerDefinitionRegistry.cs` | 定义注册表 |\n| `CompiledPerformerBootstrapRegistry` | `src/Core/Presentation/Performers/CompiledPerformerBootstrapRegistry.cs` | 编译时 bootstrap 规则索引 |\n| `ChildPerformerRef` | `src/Core/Presentation/Performers/PerformerDefinition.cs` | 子 performer 引用 |\n| `ParamDefault` | `src/Core/Presentation/Performers/PerformerDefinition.cs` | 参数默认值 |\n| `ConditionRef` | `src/Core/Presentation/Performers/ConditionRef.cs` | 规则条件引用 |\n\n### 6.2 事件流\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `PresentationEvent` | `src/Core/Presentation/Events/PresentationEvent.cs` | 事件 DTO |\n| `PresentationEventKind` | `src/Core/Presentation/Events/PresentationEventKind.cs` | 事件种类枚举 |\n| `PresentationEventStream` | `src/Core/Presentation/Events/PresentationEventStream.cs` | 固定容量事件流缓冲 |\n| `PresentationOwnerChangeBuffer` | `src/Core/Presentation/Events/PresentationOwnerChangeBuffer.cs` | 每帧 owner tag/attribute 变化位投影索引 |\n| `GlobalPresentationEventBuffer` | `src/Core/Presentation/Events/GlobalPresentationEventBuffer.cs` | 全局事件缓冲 |\n\n### 6.3 渲染输出\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `PresentationVisualProxy` | `src/Core/Presentation/Rendering/PresentationVisualProxy.cs` | 表现视觉代理 |\n| `VisualRenderPayload` | `src/Core/Presentation/Rendering/VisualRenderPayload.cs` | 13 字段公共渲染载荷 |\n| `VisualRenderPath` | `src/Core/Presentation/Components/VisualRenderPath.cs` | 渲染通道枚举 |\n| `PrimitiveDrawBuffer` | `src/Core/Presentation/Rendering/PrimitiveDrawBuffer.cs` | 调试图元输出 |\n| `GroundOverlayBuffer` | `src/Core/Presentation/Rendering/GroundOverlayBuffer.cs` | 地面叠加绘制输出 |\n| `SkinnedVisualBatchBuffer` | `src/Core/Presentation/Rendering/SkinnedVisualBatchBuffer.cs` | 蒙皮网格批次缓冲 |\n| `StableDrawCache` | `src/Core/Presentation/Rendering/StableDrawCache.cs` | Retained 静态内容缓存 |\n| `PresentationTargetGeneration` | `src/Core/Presentation/Rendering/PresentationTargetGeneration.cs` | Adapter target 生命周期 generation 信号 |\n\n### 6.4 HUD / Minimap / Camera\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `WorldHudBatchBuffer` | `src/Core/Presentation/Hud/WorldHudBatchBuffer.cs` | 世界空间 HUD 批量缓冲 |\n| `ScreenHudBatchBuffer` | `src/Core/Presentation/Hud/ScreenHudBatchBuffer.cs` | 屏幕空间 HUD 缓冲 |\n| `WorldHudToScreenSystem` | `src/Core/Presentation/Systems/WorldHudToScreenSystem.cs` | WorldHud → Screen HUD 投影 |\n| `MinimapPresentationSystem` | `src/Core/Presentation/Minimap/MinimapPresentationSystem.cs` | 小地图系统 |\n| `MinimapRuntime` | `src/Core/Presentation/Minimap/MinimapRuntime.cs` | 小地图运行时 |\n| `MinimapMarkerBuffer` | `src/Core/Presentation/Minimap/MinimapMarkerBuffer.cs` | 小地图 marker SoA 缓冲 |\n| `MinimapScreenMarkerBuffer` | `src/Core/Presentation/Minimap/MinimapScreenMarkerBuffer.cs` | 屏幕 marker 缓冲 |\n| `CameraPresenter` | `src/Core/Presentation/Camera/CameraPresenter.cs` | 逻辑相机 → 渲染相机插值 |\n| `ICameraAdapter` | `src/Core/Presentation/Camera/ICameraAdapter.cs` | 平台相机适配接口 |\n| `IViewController` | `src/Core/Presentation/Camera/IViewController.cs` | 视图控制器接口 |\n| `CoreScreenProjector` | `src/Core/Presentation/Camera/CoreScreenProjector.cs` | 核心屏幕投影器 |\n\n### 6.5 Surface 与 Instancing\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `SurfaceSourcePayloadRegistry` | `src/Core/Presentation/Surfaces/SurfaceSourcePayloadRegistry.cs` | Surface 载荷注册表 |\n| `SurfaceSourceRuntimeRegistry` | `src/Core/Presentation/Surfaces/SurfaceSourceRuntimeRegistry.cs` | Surface 运行时注册表 |\n| `InstancedBatchAssetRegistry` | `src/Core/Presentation/Instancing/InstancedBatchAssetRegistry.cs` | 实例化批次资产注册表 |\n| `InstancedBatchAsset` | `src/Core/Presentation/Instancing/InstancedBatchAsset.cs` | 实例化批次资产定义 |\n| `InstancedBatchOperationBuffer` | `src/Core/Presentation/Instancing/InstancedBatchOperationBuffer.cs` | 实例化批次操作缓冲 |\n| `InstancedBatchSubmissionRuntime` | `src/Core/Presentation/Instancing/InstancedBatchSubmissionRuntime.cs` | 实例化批次提交运行时 |\n\n### 6.6 资产注册表\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `PrefabRegistry` | `src/Core/Presentation/Assets/PrefabRegistry.cs` | 预制体注册表（legacy） |\n| `MeshAssetRegistry` | `src/Core/Presentation/Assets/MeshAssetRegistry.cs` | 网格资产注册表 |\n| `PresentationMaterialRegistry` | `src/Core/Presentation/Assets/PresentationMaterialRegistry.cs` | 材质注册表 |\n| `AnimatorControllerRegistry` | `src/Core/Presentation/Assets/AnimatorControllerRegistry.cs` | 动画控制器注册表 |\n| `AnimationProfileRegistry` | `src/Core/Presentation/Assets/AnimationProfileRegistry.cs` | 动画剪辑绑定注册表 |\n| `PresentationBehaviorRegistry` | `src/Core/Presentation/Assets/PresentationBehaviorRegistry.cs` | 行为定义注册表（legacy） |\n\n### 6.7 System 层（Presentation Phase）\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `PresentationFrameSetupSystem` | `src/Core/Presentation/Systems/PresentationFrameSetupSystem.cs` | 插值 alpha 计算，帧状态单例 |\n| `PresentationEntityLifecycleSystem` | `src/Core/Presentation/Systems/PresentationEntityLifecycleSystem.cs` | 实体 spawn/destroy → 事件流 + bootstrap |\n| `WorldToVisualSyncSystem` | `src/Core/Presentation/Systems/WorldToVisualSyncSystem.cs` | 逻辑位置插值到 VisualTransform |\n| `TerrainHeightSyncSystem` | `src/Core/Presentation/Systems/TerrainHeightSyncSystem.cs` | 地形高度贴附 |\n| `GameplayPresentationProjectionSystem` | `src/Core/Presentation/Systems/GameplayPresentationProjectionSystem.cs` | Gameplay/GAS 事件 → PresentationEventStream |\n| `SelectionPresentationEventSystem` | `src/Core/Presentation/Systems/SelectionPresentationEventSystem.cs` | 选择集变化 → 事件流 |\n| `GlobalPresentationEventProjectionSystem` | `src/Core/Presentation/Systems/GlobalPresentationEventProjectionSystem.cs` | 全局事件 → 事件流 |\n| `PerformerRuleSystem` | `src/Core/Presentation/Systems/PerformerRuleSystem.cs` | 事件 × 规则 → 命令缓冲 |\n| `PerformerRuntimeSystem` | `src/Core/Presentation/Systems/PerformerRuntimeSystem.cs` | 命令消费、实例生命周期、参数写入 |\n| `PerformerBehaviorSystem` | `src/Core/Presentation/Systems/PerformerBehaviorSystem.cs` | 行为驱动（AttributeBinding/TagBinding/Material/Animator/Sound/Spline/Grounding/Attachment） |\n| `PerformerEmitSystem` | `src/Core/Presentation/Systems/PerformerEmitSystem.cs` | 资产发射 → draw buffers / proxy / snapshot |\n| `PerformerMinimapMarkerSystem` | `src/Core/Presentation/Systems/PerformerMinimapMarkerSystem.cs` | MinimapMarker → marker buffer |\n| `PerformerEntityTransformSyncSystem` | `src/Core/Presentation/Systems/PerformerEntityTransformSyncSystem.cs` | Owner entity transform → performer transform |\n| `AnimatorRuntimeSystem` | `src/Core/Presentation/Systems/AnimatorRuntimeSystem.cs` | 动画状态机推进 |\n| `PresentationRequestFlushSystem` | `src/Core/Presentation/Requests/PresentationRequestFlushSystem.cs` | 请求缓冲刷新 → 各类 draw buffer |\n| `WorldHudToScreenSystem` | `src/Core/Presentation/Systems/WorldHudToScreenSystem.cs` | World HUD → Screen HUD 投影 |\n| `MinimapPresentationSystem` | `src/Core/Presentation/Minimap/MinimapPresentationSystem.cs` | 小地图刷新与渲染 |\n| `SurfaceSourceFlushSystem` | `src/Core/Presentation/Systems/SurfaceSourceFlushSystem.cs` | Surface 载荷刷新 |\n| `SurfaceSourceLifecycleSystem` | `src/Core/Presentation/Systems/SurfaceSourceLifecycleSystem.cs` | Surface 运行时生命周期 |\n\n### 6.8 Tweening\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `TweenTrack<T>` | `src/Core/Tweening/TweenTrack.cs` | 泛型补间轨道 |\n| `TweenEasing` | `src/Core/Tweening/TweenEasing.cs` | 缓动枚举 |\n| `TweenEasingUtil` | `src/Core/Tweening/TweenEasing.cs` | 缓动求值工具 |\n| `TweenProgress` | `src/Core/Tweening/TweenEasing.cs` | 补间进度结构体 |\n\n---\n\n*本文档基于 Stage 1 扫描报告生成，具体实现细节以源码为准。*\n";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
