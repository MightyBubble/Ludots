const currentPage = "tdd/03-registry-design.html";
const mdContent = "# 架构与基础设施 — Registry 设计\n\n## 设计目标\n\nRegistry 是 Ludots 引擎的**标识与索引中枢**，负责将字符串名称、配置定义、运行时类型映射为高效的整数 ID 或工厂委托。设计目标如下：\n\n1. **统一 ID 映射**：所有字符串标识（Ability、Effect、Tag、EntityTemplate、Performer 等）通过 `StringIntRegistry` 统一映射为 `int` ID，避免运行时字符串比较。\n2. **静态注册为主**：大部分 Registry 在初始化阶段（`GameEngine.InitializeWithConfigPipeline`）完成注册，运行时只读（Frozen）。\n3. **Mod 可扩展**：核心 Registry 提供 `Register`/`Unregister` 接口，允许 Mod 在 `OnLoad` 中注册自定义内容。\n4. **零 GC 查询**：运行时查询走固定大小数组或字典，不产生临时对象。\n\n---\n\n## Registry 分类体系\n\n![Registry 依赖网络](diagrams/registry-dependency.svg)\n\nLudots 代码库中存在 20+ 个 Registry，按功能分为四类：定义型、运行型、数据型、服务型。\n\n---\n\n### 一、定义型 Registry（Gameplay 定义）\n\n负责存储 gameplay 的静态定义——模板、配置、规则等。\n\n| Registry | 文件路径 | 用途 | 容量 | 索引方式 | 扩展方式 |\n|----------|----------|------|------|----------|----------|\n| `AbilityDefinitionRegistry` | `src/Core/Gameplay/GAS/` | Ability 定义：`AbilityPresentationConfig`, `AbilityIndicatorConfig`, `AbilityToggleSpec` | 无固定上限 | `string abilityId` → `AbilityDefinition` | Mod 在 `OnLoad` 中通过 `ConfigPipeline` 加载 |\n| `EffectTemplateRegistry` | `src/Core/Gameplay/GAS/` | Effect 模板定义：`EffectTemplateData` | 无固定上限 | `string effectId` → `EffectTemplateData` | 通过 `ConfigPipeline` 加载 |\n| `PerformerDefinitionRegistry` | `src/Core/Presentation/` | Performer 定义：视觉模型、动画、状态机 | 无固定上限 | `string performerId` → `PerformerDefinition` | 通过 `ConfigPipeline` 加载 |\n| `ItemShapeRegistry` | `src/Core/Gameplay/Items/` | 物品形状定义（旋转掩码） | 无固定上限 | `string shapeId` → `ItemShapeDefinition` | 通过 `ConfigPipeline` 加载 |\n| `ItemLayoutRegistry` | `src/Core/Gameplay/Items/` | 物品布局定义（8 种 purpose：背包/装备/stash 等） | 无固定上限 | `string layoutId` → `ItemLayoutDefinition` | 通过 `ConfigPipeline` 加载 |\n| `ItemDefinitionRegistry` | `src/Core/Gameplay/Items/` | 物品定义：属性、图标、堆叠规则 | 无固定上限 | `string itemId` → `ItemDefinition` | 通过 `ConfigPipeline` 加载 |\n| `ExchangeOperationRegistry` | `src/Core/Gameplay/Exchange/` | 交易操作定义：输入、输出、条件 | 无固定上限 | `string operationId` → `ExchangeOperation` | 通过 `ConfigPipeline` 加载 |\n| `ProgressionDefinitionRegistry` | `src/Core/Gameplay/Progression/` | 进度定义：阶段、奖励、条件 | 无固定上限 | `string progressionId` → `ProgressionDefinition` | 通过 `ConfigPipeline` 加载 |\n| `ProgressionRequirementRegistry` | `src/Core/Gameplay/Progression/` | 进度需求定义：8 种 `ProgressionRequirementNodeKind` | 无固定上限 | `string requirementId` → `ProgressionRequirementNode` | 通过 `ConfigPipeline` 加载 |\n| `RelationshipTypeRegistry` | `src/Core/Gameplay/Relationships/` | 关系类型定义 | 无固定上限 | `string typeId` → `RelationshipType` | Mod 注册 |\n| `RelationshipMetricRegistry` | `src/Core/Gameplay/Relationships/` | 关系指标定义 | 无固定上限 | `string metricId` → `RelationshipMetric` | Mod 注册 |\n| `RelationshipFlagRegistry` | `src/Core/Gameplay/Relationships/` | 关系标志定义 | 无固定上限 | `string flagId` → `RelationshipFlag` | Mod 注册 |\n| `RelationshipBandRegistry` | `src/Core/Gameplay/Relationships/` | 关系频段定义 | 无固定上限 | `string bandId` → `RelationshipBand` | Mod 注册 |\n| `RelationshipReasonRegistry` | `src/Core/Gameplay/Relationships/` | 关系原因定义 | 无固定上限 | `string reasonId` → `RelationshipReason` | Mod 注册 |\n| `EntityTemplateKeyRegistry` | `src/Core/Gameplay/Spawning/` | 实体模板键映射 | 无固定上限 | `string templateKey` → `EntityTemplate` | 通过 `ConfigPipeline` 加载 |\n| `PresetTypeRegistry` | `src/Core/Gameplay/GAS/` | Preset 类型定义 | 无固定上限 | `string presetId` → `PresetType` | Mod 注册 |\n\n---\n\n### 二、运行型 Registry（System 与运行时）\n\n负责 System 工厂、属性 Sink、Tag 规则等运行时绑定。\n\n| Registry | 文件路径 | 用途 | 容量 | 索引方式 | 扩展方式 |\n|----------|----------|------|------|----------|----------|\n| `SystemFactoryRegistry` | `src/Core/Engine/SystemFactoryRegistry.cs` | System 工厂注册：`name` → `(SystemGroup, factory)` | 无固定上限 | `string systemName` → `SystemFactoryEntry` | Mod 通过 `IModContext.RegisterSystemFactory` |\n| `AttributeSinkRegistry` | `src/Core/Gameplay/GAS/` | 属性 Sink 注册：属性变更的接收端 | 无固定上限 | `AttributeId` → `IAttributeSink` | 引擎内部注册 |\n| `TagRegistry` / `TagRuleRegistry` | `src/Core/Gameplay/GAS/` | Tag 规则注册：Tag 的匹配、继承、冲突规则 | 无固定上限 | `TagId` → `TagRule` | 通过 `ConfigPipeline` 加载 |\n| `BuiltinHandlerRegistry` | `src/Core/Gameplay/GAS/BuiltinHandlerRegistry.cs` | 内置 Handler 注册：64 槽固定数组 | **64 槽** | `BuiltinHandlerId` (byte) → `delegate` | 引擎初始化时注册；Mod 不可扩展 |\n| `ComponentRegistry` | `src/Core/Config/ComponentRegistry.cs` | 组件名 → `ComponentSetterWithContext` + `ComponentType` | 60+ 已注册 | `string componentName` → `ComponentSetterEntry` | Mod 通过 `IModContext` 注册；支持 `UnregisterSource` |\n| `GraphProgramRegistry` | `src/Core/GraphRuntime/GraphProgramRegistry.cs` | Graph 程序注册：`graphId` → `GraphInstruction[]` | 无固定上限 | `int graphId` → `GraphProgramPackage` | 编译后注册；运行时只读 |\n| `GraphIdRegistry` | `src/Core/NodeLibraries/GASGraph/Host/GraphIdRegistry.cs` | Graph name → int id | **MaxGraphs=4095** | `string graphName` → `int graphId` | 静态注册；`Freeze` 后不可写 |\n| `NavQueryServiceRegistry` | `src/Core/Navigation/` | 导航查询服务注册 | 无固定上限 | `string serviceId` → `INavQueryService` | 引擎注册 |\n| `AgentProfileRegistry` | `src/Core/Navigation/` | Agent 配置注册 | 无固定上限 | `string profileId` → `AgentProfile` | 通过 `ConfigPipeline` 加载 |\n| `SelectionRuleRegistry` | `src/Core/Input/` | 选择规则注册 | 无固定上限 | `string ruleId` → `SelectionRule` | 通过 `ConfigPipeline` 加载 |\n| `SelectionSetKeyRegistry` | `src/Core/Input/` | 选择集键注册 | 无固定上限 | `string key` → `SelectionSetKey` | 通过 `ConfigPipeline` 加载 |\n| `OrderTypeRegistry` | `src/Core/Input/` | 指令类型注册 | 无固定上限 | `string orderTypeId` → `OrderType` | 通过 `ConfigPipeline` 加载 |\n| `OrderBlackboardKeyRegistry` | `src/Core/Input/` | 指令黑板键注册 | 无固定上限 | `string key` → `BlackboardKey` | 引擎注册 |\n| `LayerRegistry` | `src/Core/Layers/` | 碰撞/渲染层注册 | 无固定上限 | `string layerName` → `LayerMask` | 引擎注册 |\n| `BoardIdRegistry` | `src/Core/Map/Board/` | Board ID 注册 | 无固定上限 | `string boardId` → `Board` | 引擎注册 |\n| `FogLayerRegistry` | `src/Core/Vision/` | 迷雾层注册 | 无固定上限 | `string fogLayerId` → `FogLayer` | 引擎注册 |\n| `ScopeKeyRegistry` | `src/Core/Association/ScopeKey.cs` | Scope 键注册：支持多种 membership source | 无固定上限 | `string scopeName` → `ScopeKeyEntry` | Mod 注册 |\n| `AnimatorControllerRegistry` | `src/Core/Presentation/` | 动画控制器注册 | 无固定上限 | `string controllerId` → `AnimatorController` | 通过 `ConfigPipeline` 加载 |\n| `AnimationClipRegistry` | `src/Core/Presentation/` | 动画片段注册 | 无固定上限 | `string clipId` → `AnimationClip` | 通过 `ConfigPipeline` 加载 |\n| `AnimationProfileRegistry` | `src/Core/Presentation/` | 动画配置文件注册 | 无固定上限 | `string profileId` → `AnimationProfile` | 通过 `ConfigPipeline` 加载 |\n| `TransportNetworkAssetLoader` | `src/Core/TransportNetwork/` | 运输网络资产加载 | 无固定上限 | `string assetId` → `TransportNetworkAsset` | 通过 `ConfigPipeline` 加载 |\n\n---\n\n### 三、数据型 Registry（通用数据索引）\n\n负责通用数据存储和配置索引。\n\n| Registry | 文件路径 | 用途 | 容量 | 索引方式 | 扩展方式 |\n|----------|----------|------|------|----------|----------|\n| `StringIntRegistry` | `src/Core/Registry/StringIntRegistry.cs` | 通用 string→int ID 映射基础设施 | 无固定上限（但 `Unregister` 不回收 ID） | `string name` → `int id` | 各子系统组合使用：AbilityIdRegistry、AttributeRegistry、EffectTemplateIdRegistry、TagRegistry、MeshAssetRegistry 等 |\n| `DataRegistry<T>` | `src/Core/Config/DataRegistry.cs` | 泛型数据注册表：从合并配置加载 `IIdentifiable` 条目 | 无固定上限 | `string id` → `T` | 通过 `ConfigPipeline` 合并后自动加载 |\n| `ConfigCatalog` | `src/Core/Config/ConfigCatalog.cs` | 配置目录：路径 → `ConfigCatalogEntry` | 无固定上限 | `string relativePath` → `ConfigCatalogEntry` | 从 `config_catalog.json` 加载 |\n| `MeshAssetRegistry` | `src/Core/Presentation/` | Mesh 资产注册 | 无固定上限 | `string meshId` → `MeshAsset` | 通过 `ConfigPipeline` 加载 |\n| `PresentationMaterialRegistry` | `src/Core/Presentation/` | 表现材质注册 | 无固定上限 | `string materialId` → `PresentationMaterial` | 通过 `ConfigPipeline` 加载 |\n| `PrefabRegistry` | `src/Core/Presentation/` | Prefab 注册 | 无固定上限 | `string prefabId` → `Prefab` | 通过 `ConfigPipeline` 加载 |\n| `InstancedBatchAssetRegistry` | `src/Core/Presentation/` | Instanced 批量资产注册 | 无固定上限 | `string assetId` → `InstancedBatchAsset` | 通过 `ConfigPipeline` 加载 |\n| `SurfaceSourcePayloadRegistry` | `src/Core/Presentation/` | Surface 源 payload 注册 | 无固定上限 | `string payloadId` → `SurfaceSourcePayload` | 引擎注册 |\n| `SurfaceSourceRuntimeRegistry` | `src/Core/Presentation/` | Surface 源运行时注册 | 无固定上限 | `string sourceId` → `SurfaceSourceRuntime` | 引擎注册 |\n\n---\n\n### 四、服务型 Registry（功能注册与扩展）\n\n负责提供脚本、事件、存档等扩展能力。\n\n| Registry | 文件路径 | 用途 | 容量 | 索引方式 | 扩展方式 |\n|----------|----------|------|------|----------|----------|\n| `FunctionRegistry` | `src/Core/Scripting/FunctionRegistry.cs` | 脚本函数注册：`string` → `ScriptFunctionDelegate` | 无固定上限 | `string functionName` → `ScriptFunctionDelegate` | Mod 通过 `IModContext.RegisterFunction`；last-wins 覆盖 |\n| `TriggerDecoratorRegistry` | `src/Core/Scripting/TriggerDecoratorRegistry.cs` | Trigger 修饰器注册：按类型/名称/锚点注入命令 | 无固定上限 | `Type` / `string name` / `string anchor` → `Action<Trigger>` | Mod 通过 `IModContext.RegisterTriggerDecorator` |\n| `SaveParticipantRegistry` | `src/Core/Persistence/SaveParticipantRegistry.cs` | 存档参与者注册：`domainKey` → `ISaveParticipant` | 8+ 内置 | `string domainKey` → `ISaveParticipant` | 引擎初始化时注册；`CoreSaveParticipants` 提供 8 个内置域 |\n| `TeamManager` | `src/Core/Gameplay/Teams/TeamManager.cs` | 团队关系注册：静态全局字典（⚠️ 反模式注意） | 无固定上限 | `TeamId` → `TeamRelationship` | 硬编码；通过 `TeamConfig` 配置 |\n| `SaveParticipantRegistry` | `src/Core/Persistence/SaveParticipantRegistry.cs` | 非 ECS 存档域注册表 | 无固定上限 | `string domainKey` → `ISaveParticipant` | 实现 `ISaveParticipant` 并注册 |\n\n---\n\n## 静态 vs 动态 Registry 的设计取舍\n\n### 1. 静态 Registry（初始化时 Frozen）\n\n| Registry | Frozen 时机 | 说明 |\n|----------|-------------|------|\n| `StringIntRegistry` | `Freeze()` 调用后 | 各子系统通常在 `OnLoad` 结束时调用 `Freeze`，防止运行时新增 ID 导致缓存失效 |\n| `GraphIdRegistry` | `Freeze()` 调用后 | 图编译完成后冻结，运行时只读 |\n| `BuiltinHandlerRegistry` | 引擎初始化完成 | 64 槽固定，运行时不可扩展 |\n| `ComponentRegistry` | 无全局 Freeze，但按 `modId` 卸载 | 支持 `UnregisterSource(string modId)`，但 core 组件不可注销 |\n\n**设计理由**：\n- Frozen 后数据结构可被 unsafe 代码直接按索引访问，无需字典查找。\n- 防止运行时竞争条件——Mod 加载完毕后再无注册变更。\n- 存档/回放时 ID 稳定性保证。\n\n### 2. 动态 Registry（运行时读写）\n\n| Registry | 动态特性 | 说明 |\n|----------|----------|------|\n| `SystemFactoryRegistry` | `TryActivate` / `TryDeactivate` | Map 加载/卸载时动态启用禁用 System |\n| `TriggerManager` | `FireEvent` / `FireMapEvent` | 每帧触发事件，动态执行 Trigger 列表 |\n| `FunctionRegistry` | last-wins 覆盖 | 运行时函数可被新 Mod 覆盖 |\n| `DataRegistry<T>` | `Load` 重载 | 配置重载时更新 |\n| `SaveParticipantRegistry` | 捕获/恢复时遍历 | 运行时只读，但捕获/恢复时全量遍历 |\n\n**设计理由**：\n- System 的启用/禁用需要与 Map 生命周期绑定（如某些 Map 不需要 RTS 指令系统）。\n- Trigger 和 Function 的覆盖机制支持 Mod 之间的能力扩展和补丁。\n\n### 3. 设计取舍对比\n\n| 维度 | 静态 Registry | 动态 Registry |\n|------|--------------|---------------|\n| 查询性能 | O(1) 数组索引，零 GC | O(1) 字典查找，可能有轻微分配 |\n| 线程安全 | 无需同步（只读） | 需要读取锁或无锁结构 |\n| 可扩展性 | 低（需重启/重新加载） | 高（运行时注册/覆盖） |\n| 存档友好性 | 高（ID 稳定） | 中（需捕获注册表状态） |\n| 典型用途 | ID 映射、组件定义、图程序 | System 工厂、事件触发、函数调用 |\n\n---\n\n## 性能约束\n\n| 约束项 | 目标 | 实现 |\n|--------|------|------|\n| `StringIntRegistry` 查询 | O(1) 字典 + O(1) 反向字典 | 双向字典缓存 |\n| `BuiltinHandlerRegistry` 调用 | O(1) 数组索引 | 固定 64 槽数组，`Invoke(handlerId, ...)` 直接索引 |\n| `GraphIdRegistry` 查询 | O(1) 静态字典 | 冻结后不再变更 |\n| `ComponentRegistry` 冲突检测 | 初始化时报告 | `ConfigConflictReport` 记录冲突来源 |\n| `DataRegistry<T>` 加载 | 从 `JsonNode` 批量反序列化 | 一次遍历构建字典 |\n| 存档时 Registry 遍历 | 线性遍历所有参与者 | `SaveParticipantRegistry` 按注册顺序捕获 |\n\n---\n\n## 扩展契约\n\n![Registry 扩展时序](diagrams/registry-extension.svg)\n\n| 扩展点 | 方式 | 约束 |\n|--------|------|------|\n| 自定义 `StringIntRegistry` 实例 | 组合 `StringIntRegistry` 到子系统 | 子系统持有私有 `StringIntRegistry` 实例，不共享 |\n| 自定义 `DataRegistry<T>` | 从 `ConfigPipeline` 加载并实例化 | `T` 必须实现 `IIdentifiable` |\n| 自定义 `SaveParticipant` | 实现 `ISaveParticipant` → 注册到 `SaveParticipantRegistry` | `DomainKey` 全局唯一；`CaptureState()` 返回 `JsonNode` |\n| 自定义 `BuiltinHandler` | 不可扩展（引擎内部） | 如需新增 handler，修改 Core 代码 |\n| 覆盖 `FunctionRegistry` 条目 | `Register` 同名函数 | last-wins；DEBUG 下记录冲突 |\n| 修饰 `Trigger` | `TriggerDecoratorRegistry.Register` / `RegisterAnchor` | 只能修改已有 Trigger，不能创建新 Trigger |\n\n---\n\n> 参考文件\n> - `src/Core/Registry/StringIntRegistry.cs`（150 行，通用 ID 映射）\n> - `src/Core/Engine/SystemFactoryRegistry.cs`（System 工厂注册）\n> - `src/Core/Gameplay/GAS/AbilityDefinitionRegistry.cs`（能力定义注册）\n> - `src/Core/Gameplay/GAS/BuiltinHandlerRegistry.cs`（64 槽固定 Handler 表）\n> - `src/Core/Gameplay/GAS/BuiltinHandlers.cs`（11 个内置 Handler）\n> - `src/Core/Config/DataRegistry.cs`（泛型数据注册表）\n> - `src/Core/Config/ComponentRegistry.cs`（组件注册表，60+ 组件）\n> - `src/Core/Config/ConfigCatalog.cs`（配置目录）\n> - `src/Core/Scripting/FunctionRegistry.cs`（脚本函数注册）\n> - `src/Core/Scripting/TriggerDecoratorRegistry.cs`（Trigger 修饰器）\n> - `src/Core/Persistence/SaveParticipantRegistry.cs`（存档参与者）\n> - `src/Core/GraphRuntime/GraphProgramRegistry.cs`（图程序注册）\n> - `src/Core/NodeLibraries/GASGraph/Host/GraphIdRegistry.cs`（图 ID 注册）\n> - `src/Core/Association/ScopeKey.cs`（Scope 键注册体系）\n> - `src/Core/Gameplay/Relationships/`（五层关系注册表）\n";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
