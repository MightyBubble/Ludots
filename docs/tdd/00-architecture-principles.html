const navData = {"PRD": [["prd/00-executive-summary.html", "Executive Summary"], ["prd/01-product-overview.html", "Product Overview"], ["prd/02-feature-architecture.html", "Feature Architecture"], ["prd/03-core-engine.html", "Core Engine"], ["prd/04-gas-combat.html", "Gas Combat"], ["prd/05-items-inventory.html", "Items Inventory"], ["prd/06-narrative.html", "Narrative"], ["prd/07-relationships-teams.html", "Relationships Teams"], ["prd/08-input-orders.html", "Input Orders"], ["prd/09-navigation-movement.html", "Navigation Movement"], ["prd/10-presentation-rendering.html", "Presentation Rendering"], ["prd/11-map-spatial.html", "Map Spatial"], ["prd/12-config-scripting.html", "Config Scripting"], ["prd/13-modding.html", "Modding"], ["prd/14-persistence.html", "Persistence"], ["prd/15-platform-adapters.html", "Platform Adapters"], ["prd/16-feature-matrix.html", "Feature Matrix"]], "TDD": [["tdd/00-architecture-principles.html", "Architecture Principles"], ["tdd/01-data-model.html", "Data Model"], ["tdd/02-systemgroup.html", "Systemgroup"], ["tdd/03-registry-design.html", "Registry Design"], ["tdd/04-pipeline-design.html", "Pipeline Design"], ["tdd/05-extension-points.html", "Extension Points"], ["tdd/06-gas-tdd.html", "Gas Tdd"], ["tdd/07-navigation-tdd.html", "Navigation Tdd"], ["tdd/08-presentation-tdd.html", "Presentation Tdd"], ["tdd/09-performance-constraints.html", "Performance Constraints"]], "Reference": [["reference/glossary.html", "Glossary"], ["reference/api-quickref.html", "Api Quickref"]], "Other": [["index.html", "Index"], ["issues.html", "Issues"], ["diagrams.html", "Diagrams"]]};
const currentPage = "tdd/00-architecture-principles.html";
const mdContent = "# 架构与基础设施 — 架构原则\n\n## 设计目标\n\nLudots 引擎采用**六边形架构（Hexagonal Architecture）**，以 Arch ECS 作为核心计算平面，所有 gameplay 能力、表现层、平台适配层均以独立 Mod 形式通过 `IMod.OnLoad` 注册到引擎。设计目标可归纳为以下三项：\n\n1. **Core 不依赖平台 API**：`GameEngine`（`src/Core/Engine/GameEngine.cs`）仅操作 ECS World、SystemGroup 和 Registry，不直接引用任何渲染、输入或网络库。平台 specifics 由 `src/Adapters/` 下的 Adapter Mod（如 `RaylibHostLoop`）提供。\n2. **Gameplay 可无头测试**：System 在 `SystemGroup` 中按固定 phase 顺序执行，不依赖 `PresentationSystem` 或渲染管线。`GameEngine.Tick(float)` 与 `Update(float)` 分离，使得 gameplay 逻辑可在纯命令行/CI 环境下以 `Tick` 模式运行。\n3. **一切皆 Mod**：`LudotsCoreMod`（priority -1000）本身也是 Mod，通过 `IMod.OnLoad` 注册 Core System、Function 和 Trigger。所有业务 Mod（RTS、MOBA、ARPG 等）在 Core 之上以同等机制注册能力。\n\n---\n\n## 六边形架构的边界\n\n![六边形架构](diagrams/hexagonal-architecture.svg)\n\n### 1. 内层：ECS Core（不可变）\n\n| 层级 | 类型 | 职责 | 关键文件 |\n|------|------|------|----------|\n| 内核 | `GameEngine` | 主循环、Pacemaker 调度、System 分组 | `src/Core/Engine/GameEngine.cs` |\n| 内核 | `WorldRuntime` | 工厂包装器：`Create(GameConfig, assetsRoot)` → 构造 `GameEngine` | `src/Core/Engine/WorldRuntime.cs` |\n| 内核 | `SystemGroup` | 11 个 phase 枚举，System 的归属锚点 | `src/Core/Engine/GameEngine.cs` 第 97–134 行 |\n| 内核 | `Time` / `ClockFoundation` | 全局时间状态：`TotalTime`, `DeltaTime`, `FixedDeltaTime`（默认 50Hz） | `src/Core/Engine/Time.cs`, `ClockFoundation.cs` |\n\n### 2. 中间层：Gameplay 域（Mod 扩展）\n\nGameplay 功能由 Core Mod 和上层 Mod 共同填充，包括但不限于：\n\n- **GAS**：`AbilityDefinitionRegistry`, `EffectPhaseExecutor`, `GasController`（`src/Core/Gameplay/GAS/`）\n- **Items**：`InventoryRuntimeService`, `ItemConfigLoader`（`src/Core/Gameplay/Items/`）\n- **Exchange**：`ExchangeRuntime`, `ExchangeOperationRegistry`（`src/Core/Gameplay/Exchange/`）\n- **Relationships**：`RelationshipRuntime`, `RelationshipProcessingSystem`（`src/Core/Gameplay/Relationships/`）\n- **Narrative**：`NarrativeDirector`, `NarrativeRuntimeSystem`（`src/Core/Gameplay/Narrative/`）\n\n### 3. 外层：适配层与平台宿主（Mod 扩展）\n\n| 类型 | 职责 | 关键文件 |\n|------|------|----------|\n| `RaylibHostLoop` | Raylib 平台主循环：窗口管理 → 输入收集 → `engine.Tick` → 渲染 | `src/Adapters/RaylibHostLoop.cs` |\n| `RaylibHostComposer` | 组装宿主：`GameBootstrapper.InitializeFromBaseDirectory` → `SkiaUiRenderer` → `UIRoot` | `src/Adapters/RaylibHostComposer.cs` |\n| `RaylibInputBackend` | 输入后端适配 | `src/Adapters/RaylibInputBackend.cs` |\n| `RaylibTerrainRenderer` / `RaylibIsmRenderBridge` | 地形与 ISM 渲染桥 | `src/Adapters/RaylibTerrainRenderer.cs` |\n\n---\n\n## 一切皆 Mod：注册契约\n\n### 1. IMod.OnLoad 为唯一入口\n\n```\nIMod.OnLoad(IModContext context)\n  ├── context.RegisterSystemFactory(...)    → SystemFactoryRegistry\n  ├── context.RegisterFunction(...)         → FunctionRegistry\n  ├── context.OnEvent(...)                  → TriggerManager\n  ├── context.RegisterTriggerDecorator(...) → TriggerDecoratorRegistry\n  └── context.VFS 自动挂载（无需显式调用）\n```\n\n所有 Mod 的 `OnLoad` 按 `ResolvedModLoadPlan` 的拓扑排序顺序调用。`LudotsCoreMod` 以 priority -1000 最先加载，为后续 Mod 提供 `StringIntRegistry`、`ComponentRegistry` 等基础设施。\n\n### 2. System 正式注册\n\nSystem 通过 `SystemFactoryRegistry.Register(name, SystemGroup, factory)` 或 `RegisterPresentation(name, factory)` 注册。`SystemFactoryRegistry.TryActivate(name, context, engine)` 在 `GameEngine.InitializeCoreSystems` 中按 `SystemGroup` 分组实例化。详见 `src/Core/Engine/SystemFactoryRegistry.cs`。\n\n### 3. ConfigPipeline 自动合并\n\nMod 无需显式注册配置。`ConfigPipeline` 自动从 `Core:Configs/` 和各 Mod 的 `assets/Configs/` 或 `assets/` 目录收集同名 JSON 文件，按 `ConfigMergePolicy` 合并。详见 `src/Core/Config/ConfigPipeline.cs`（218 行）。\n\n---\n\n## 四个禁止（架构铁律）\n\nLudots 遵循 AGENTS.md 中声明的**四个禁止**铁律：\n\n| 铁律 | 含义 | 代码体现 |\n|------|------|----------|\n| **禁止 fallback** | 不存在\"如果 A 失败则回退到 B\"的隐藏分支。每个配置项必须有单一来源（SSOT），缺失即抛异常。 | `ConfigPipeline` 合并冲突时写入 `ConfigConflictReport`，不静默回退。`SaveContextValidator` 校验 header 不匹配时直接拒绝读档。 |\n| **禁止向后兼容** | 不维护旧版本配置或接口的兼容层。schema 变更时，所有 Mod 和配置必须同步更新。 | `StrictJsonOptions` 拒绝未知字段；`ComponentRegistry` 硬编码 60+ 组件，不存在旧组件名的别名。 |\n| **禁止重复造轮子** | 同一能力只存在一个实现。 | `StringIntRegistry` 统一所有 string→int 映射；`VirtualFileSystem` 统一资源访问。 |\n| **禁止跨越职责** | System 只做一件事，Registry 只管理一类数据。 | `EffectPhaseExecutor` 只执行 effect phase，不处理属性计算；`AttributeBindingSystem` 只负责属性落地。 |\n\n---\n\n## ECS 硬性约束\n\n### 1. blittable struct 组件\n\n所有 ECS 组件必须是**非托管 struct（unmanaged struct）**，以支持 Arch ECS 的 chunk 连续内存布局。典型约束：\n\n- 组件类型中不得包含 `string`、`class` 或托管集合。\n- 标识类数据使用 `StringIntRegistry` 将 string 预解析为 `int` ID 后存储。\n- 变长数据通过 `EntityKeyedSoaTable<TPayload>`（`src/Core/Association/EntityKeyedSoaTable.cs`，759 行）或 `CommandBuffer` 模式处理。\n\n### 2. 热路径零 GC\n\n在 `GameEngine.Tick` 的 Simulation Loop（Pacemaker 控制）中：\n\n- 不使用 `List<T>.Add` 或 `Dictionary<K,V>` 查询。\n- `BuiltinHandlerRegistry` 使用固定大小数组（64 槽），`Invoke` 直接索引调用。\n- `GraphProgramBuffer` 使用 `unsafe fixed buffer`（CAPACITY=128），避免堆分配。\n- `ScopeRefBuffer` 使用 `unsafe fixed buffer`（Capacity=8），存储 scopeKeyId→Entity 映射。\n\n### 3. QueryDescription 缓存\n\n所有 ECS 查询的 `QueryDescription` 在初始化阶段构造并缓存，运行时只执行 `Query`/`World.Query` 的已有描述对象。禁止在每帧 `Tick` 中动态构造 `QueryDescription`。\n\n### 4. CommandBuffer 结构变更\n\n对 ECS World 的结构变更（添加/删除组件、创建/销毁实体）通过 `CommandBuffer` 批量执行，避免在 System 迭代中直接修改 World 结构。典型场景：\n\n- `RuntimeEntitySpawnSystem` 通过 `RuntimeEntitySpawnQueue` 缓冲生成请求，在 `RuntimeEntityBinding` phase 统一处理。\n- `PresentationEntityLifecycle.RequestDestroy` 通过 `PresentationDestroyPending` 标签标记，在 `Cleanup` phase 统一销毁。\n\n### 5. Fix64 数值系统\n\nGameplay 数值使用 `Fix64` 定点数（及 `Fix64Vec2`），避免浮点精度不一致问题。属性计算、伤害公式、位置插值均在 `Fix64` 空间完成，仅在表现层（Presentation System）转换为 `float` 供渲染使用。\n\n---\n\n## 性能约束\n\n| 约束项 | 目标值 | 实现机制 |\n|--------|--------|----------|\n| Simulation 预算 | 每帧 ≤ `SimulationBudgetMsPerFrame` | `IPacemaker` 控制 `SimulationMaxSlicesPerLogicFrame` |\n| Fixed 更新频率 | 默认 50Hz（可配置） | `Time.FixedDeltaTime = 1f / EngineClockConfig.FixedHz` |\n| 图 VM 指令上限 | 每次执行 ≤ 4096 条 | `GraphVmLimits.MaxInstructionsPerExecution` |\n| 图 VM 寄存器 | Float/Int/Bool/Entity 各 32 个 | `GraphVmLimits.MaxFloat/Int/Bool/EntityRegisters` |\n| 内置 Handler 槽 | 64 个（固定数组） | `BuiltinHandlerRegistry.MaxHandlers = 64` |\n| 批量实体生成 | 通过 chunk span 直接填充 | `TemplateEntityBatchSpawner` 绕过逐 entity `ComponentRegistry` |\n\n---\n\n## 扩展契约\n\n| 扩展点 | 类型 | 注册方式 | 约束 |\n|--------|------|----------|------|\n| `SystemFactoryRegistry` | Registry | `IModContext.RegisterSystemFactory` | 必须指定 `SystemGroup`；Presentation System 走 `RegisterPresentation` |\n| `TriggerDecoratorRegistry` | Registry | `IModContext.RegisterTriggerDecorator` | 只能修饰 Map 声明的 Trigger，不能创建新 Trigger |\n| `FunctionRegistry` | Registry | `IModContext.RegisterFunction` | last-wins 覆盖；DEBUG 下记录冲突 |\n| `ComponentRegistry` | Registry | `IModContext` 内部调用 | 组件名全局唯一；卸载时按 `modId` 注销 |\n| `ConfigPipeline` | 服务 | 自动收集（约定目录） | 合并策略由 `ConfigCatalogEntry` 声明 |\n| `SaveParticipantRegistry` | Registry | 引擎初始化时注册 | 实现 `ISaveParticipant`，提供 `DomainKey` |\n\n---\n\n> 参考文件\n> - `src/Core/Engine/GameEngine.cs`（2967 行，主循环与 SystemGroup 定义）\n> - `src/Core/Engine/WorldRuntime.cs`（工厂入口）\n> - `src/Core/Engine/SystemFactoryRegistry.cs`（System 注册）\n> - `src/Core/Config/ConfigPipeline.cs`（配置合并）\n> - `src/Core/Modding/IModContext.cs`（Mod 扩展 API）\n> - `src/Core/Registry/StringIntRegistry.cs`（统一 ID 映射）\n> - `src/Core/Gameplay/GAS/BuiltinHandlerRegistry.cs`（零 GC handler 表）\n> - `src/Core/NodeLibraries/GASGraph/GraphVmLimits.cs`（VM 资源上限）\n> - `src/Core/Association/EntityKeyedSoaTable.cs`（SOA 关联存储）\n";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
