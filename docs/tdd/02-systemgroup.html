const mdContent = "# 架构与基础设施 — SystemGroup Phase

## 设计目标

`SystemGroup` 是 Ludots 引擎仿真循环的**时序骨架**，将 ECS System 按严格顺序归入 11 个 phase。设计目标如下：

1. **确定性执行**：同一输入在任何平台上产生相同的仿真结果（对 RTS 回滚、存档回放至关重要）。
2. **阶段隔离**：每个 phase 有明确的职责边界，System 不得跨越 phase 读写状态。
3. **可扩展挂靠**：新增 System 必须归属到已有 phase，不允许创建新 phase。
4. **预算可控**：Simulation Loop 受 `IPacemaker` 控制，Presentation Loop 不受限制。

---

## 11 个 Phase 的完整定义与顺序

![SystemGroup 流水线](diagrams/systemgroup-pipeline.svg)

Phase 顺序在 `GameEngine.cs` 第 97–134 行中定义，由 `SystemGroup` 枚举表示。以下按执行顺序逐一说明：

```
Tick(platformDeltaTime)
└── [Simulation Loop] — Pacemaker 控制，受预算限制
    ├── Phase 0: SchemaUpdate
    ├── Phase 1: InputCollection
    ├── Phase 2: PostMovement
    ├── Phase 3: AbilityActivation
    ├── Phase 4: EffectProcessing
    ├── Phase 5: RuntimeEntityBinding
    ├── Phase 6: AttributeCalculation
    ├── Phase 7: DeferredTriggerCollection
    ├── Phase 8: Cleanup
    ├── Phase 9: EventDispatch
    └── Phase 10: ClearPresentationFlags
```

> 注：报告中原始列为 11 个 phase，其中 `RuntimeEntityBinding` 是 phase 5（位于 `EffectProcessing` 和 `AttributeCalculation` 之间）。用户要求中列了 10 个 phase（不含 `RuntimeEntityBinding`），但代码中实际存在。本 TDD 按代码实际包含全部 11 个 phase 描述。

### Phase 0: SchemaUpdate

**职责**：运行时 schema 变更——注册新的属性、图程序、Tag 规则等。

| 典型 System | 文件路径 | 说明 |
|-------------|----------|------|
| `AttributeSchemaUpdateSystem` | `src/Core/Systems/` 或 `src/Core/Gameplay/GAS/` | 处理属性 schema 的增删改，如新增 `AttributeDefinition` 到 `AttributeSchema` |
| `GraphProgramRegistry` 更新 | `src/Core/GraphRuntime/GraphProgramRegistry.cs` | 运行时加载新的 graph program |

**挂靠规则**：只在需要动态修改属性/图 schema 的场景使用。大部分 gameplay Mod 不需要在此 phase 注册 System。

### Phase 1: InputCollection

**职责**：收集并分发玩家输入——选择、指令、交互、导航。

| 典型 System | 文件路径 | 说明 |
|-------------|----------|------|
| `InputCollectionSystem` | `src/Core/Input/` | 收集原始输入请求（键盘、鼠标、触摸） |
| `SelectionInputSystem` | `src/Core/Input/` | 处理选择框、点选、框选逻辑 |
| `InteractionSystem` | `src/Core/Input/` | 处理交互动作（点击单位、使用物品等） |
| `OrderProcessingSystem` | `src/Core/Input/` | 将输入转换为游戏指令（移动、攻击、技能） |

**挂靠规则**：所有与输入采集和初步转换相关的 System 归属此 phase。输入在此 phase 被写入 `InputRequestQueue` / `OrderQueue`，后续 phase 消费。

### Phase 2: PostMovement

**职责**：移动后的空间同步与分区更新。

| 典型 System | 文件路径 | 说明 |
|-------------|----------|------|
| `WorldToGridSyncSystem` | `src/Core/Systems/` | 将世界坐标同步到网格坐标 |
| `SpatialPartitionUpdateSystem` | `src/Core/Spatial/` | 更新空间分区结构（AABB 树、网格哈希等） |
| `SavePreviousWorldPositionSystem` | `src/Core/Systems/` | 保存上一帧位置，用于插值和碰撞检测 |
| `ChunkedGridSpatialPartitionWorld` | `src/Core/Spatial/` | 分块网格空间分区的实际更新逻辑 |

**挂靠规则**：所有在实体位置发生变化后需要执行的\"后处理\" System 归属此 phase。包括空间分区更新、网格同步、速度/位置校验等。

### Phase 3: AbilityActivation

**职责**：能力激活与指令处理——将输入或 AI 决策转换为具体的 Effect 请求。

| 典型 System | 文件路径 | 说明 |
|-------------|----------|------|
| `AbilityActivationSystem` | `src/Core/Gameplay/GAS/` | 根据输入/AI 决策激活 Ability，生成 `EffectRequest` 并入队 |
| `OrderProcessingSystem` | `src/Core/Input/` | 指令处理（跨 phase 消费 order queue） |
| `ResponseChainSystem` | `src/Core/Input/` | 响应链处理（指令响应和连锁反应） |

**挂靠规则**：
- 将输入/决策转换为 gameplay 动作的系统归属此 phase。
- 生成 `EffectRequest` 并写入 `EffectRequestQueue`。
- 不直接修改属性或执行效果——只生成请求。

### Phase 4: EffectProcessing

**职责**：Effect 的完整生命周期执行——从 `EffectRequestQueue` 取出请求，按 phase 执行 graph program 和 builtin handler。

| 典型 System | 文件路径 | 说明 |
|-------------|----------|------|
| `EffectPhaseExecutor` | `src/Core/Gameplay/GAS/` | 核心 Effect 执行器：按 `OnCast` → `OnCommit` → `OnImpact` → `OnExpire` 顺序执行各 phase |
| `EffectLifetimeSystem` | `src/Core/Gameplay/GAS/` | 管理 Effect 的持续时间、tick 和过期判定 |
| `EffectApplicationSystem` | `src/Core/Gameplay/GAS/` | Effect 应用逻辑（如 modifier 的附加与移除） |
| `GasController` | `src/Core/Gameplay/GAS/` | GAS 总控制器，协调各子系统 |

**执行流程**：

```
EffectRequestQueue 弹出请求
  ↓
EffectPhaseExecutor 读取 EffectTemplateData
  ↓
按 phase 顺序执行：
  ├── OnCast   → GraphExecutor 或 BuiltinHandlerRegistry.Invoke
  ├── OnCommit → GraphExecutor 或 BuiltinHandlerRegistry.Invoke
  ├── OnImpact → GraphExecutor 或 BuiltinHandlerRegistry.Invoke
  └── OnExpire → GraphExecutor 或 BuiltinHandlerRegistry.Invoke
  ↓
每个 phase 内：
  ├── GraphProgram → GraphExecutor.Execute(ref state, program, handlerTable)
  └── BuiltinHandler → BuiltinHandlerRegistry.Invoke(handlerId, ...)
```

**内置 Handler 列表**（`BuiltinHandlers`，`src/Core/Gameplay/GAS/BuiltinHandlers.cs`）：

| Handler | 作用 |
|---------|------|
| `ApplyModifiers` | 应用属性 modifier |
| `ApplyForce` | 施加物理力 |
| `SpatialQuery` | 空间查询（AABB、Radius、Cone 等） |
| `DispatchPayload` | 分发 payload 到目标集合 |
| `ReResolveAndDispatch` | 重新解析并分发 |
| `CreateProjectile` | 创建投射物实体 |
| `CreateUnit` | 创建单位实体 |
| `ApplyDisplacement` | 应用位移（击退、传送等） |
| `ApplyRelation` | 应用关系变更 |
| `ExecuteExchange` | 执行交易/交换操作 |
| `CompleteProgression` | 完成进度/成就 |

**挂靠规则**：所有实际执行 gameplay 效果（伤害、治疗、位移、创建实体、修改属性）的 System 归属此 phase。

### Phase 5: RuntimeEntityBinding

**职责**：运行时实体创建后的绑定——将新生成的实体与 `PerformerEntityRuntime`、AI 运行时、关系图等关联。

| 典型 System | 文件路径 | 说明 |
|-------------|----------|------|
| `RuntimeEntityBindingSystem` | `src/Core/Gameplay/Spawning/` | 绑定 `PerformerEntityRuntime`，生成 `PresentationStableId` |
| `RuntimeEntitySpawnSystem` | `src/Core/Gameplay/Spawning/` | 消费 `RuntimeEntitySpawnQueue`，批量生成实体 |

**挂靠规则**：在 `EffectProcessing` 中创建的新实体（如 `CreateUnit`、`CreateProjectile`）在此 phase 完成与表现层和 AI 的绑定。确保实体在 `AttributeCalculation` 前已具备完整属性结构。

### Phase 6: AttributeCalculation

**职责**：属性计算与落地——将 Effect 阶段产生的属性变更缓冲落地为最终值。

| 典型 System | 文件路径 | 说明 |
|-------------|----------|------|
| `AttributeBindingSystem` | `src/Core/Gameplay/GAS/` | 将 Effect 产生的属性 modifier 绑定到目标实体的 `AttributeBuffer` |
| `AttributeCalculationSystem` | `src/Core/Gameplay/GAS/` | 执行属性公式计算（基础值 + modifier 总和） |
| `AttributeSinkRegistry` | `src/Core/Gameplay/GAS/` | 属性 sink 注册表：属性变更的接收端 |

**挂靠规则**：所有属性计算和 modifier 落地方相关的 System 归属此 phase。此 phase 完成后，所有实体的属性值为\"本帧最终值\"。

### Phase 7: DeferredTriggerCollection

**职责**：收集延迟触发器——将 Effect 执行和属性变更中标记的延迟触发器统一收集。

| 典型 System | 文件路径 | 说明 |
|-------------|----------|------|
| `DeferredTriggerCollectionSystem` | `src/Core/Gameplay/GAS/` | 收集延迟触发器到 `DeferredTriggerQueue` |
| `DeferredTriggerProcessSystem` | `src/Core/Gameplay/GAS/` | 处理延迟触发器队列，生成实际事件 |

**挂靠规则**：需要跨帧或延迟触发的事件（如\"3 秒后爆炸\"、\"击杀后触发\"）在此 phase 统一收集和处理。

### Phase 8: Cleanup

**职责**：清理过期/标记实体和效果——安全地销毁实体、移除过期 Effect、回收资源。

| 典型 System | 文件路径 | 说明 |
|-------------|----------|------|
| `EffectCleanupSystem` | `src/Core/Gameplay/GAS/` | 移除已过期的 Effect 实例 |
| `EntityCleanupSystem` | `src/Core/Systems/` | 清理标记为销毁的实体 |
| `PresentationEntityFinalizeDestroySystem` | `src/Core/Presentation/` | 执行 `PresentationDestroyPending` 标签实体的实际销毁 |

**挂靠规则**：所有\"收尾\"操作——实体销毁、效果清理、资源回收——归属此 phase。此 phase 后 ECS World 结构稳定，不再有实体创建/销毁。

### Phase 9: EventDispatch

**职责**：事件分发——将 gameplay 事件广播到 Trigger 系统、表现层和外部监听者。

| 典型 System | 文件路径 | 说明 |
|-------------|----------|------|
| `EventDispatchSystem` | `src/Core/Systems/` | 将 ECS 事件分发到 `TriggerManager` |
| `GameplayPresentationProjectionSystem` | `src/Core/Presentation/` | 将 gameplay 事件投影到表现层事件流 |
| `GlobalPresentationEventProjectionSystem` | `src/Core/Presentation/` | 全局表现事件的投影 |
| `GameplayCueSystem` | `src/Core/Gameplay/Cue/` | 基于 `GameplayEvent` 查询生成 `CueDescriptor`，写入 `CueEventBuffer` |

**挂靠规则**：所有事件广播和跨系统通知归属此 phase。Trigger 在此 phase 被触发，表现层事件在此 phase 被写入 Buffer。

### Phase 10: ClearPresentationFlags

**职责**：清除表现层的临时标记——为下一帧的表现计算做准备。

| 典型 System | 文件路径 | 说明 |
|-------------|----------|------|
| `ClearPresentationFlagsSystem` | `src/Core/Presentation/` | 清除本帧表现计算中使用的临时标记和状态 |

**挂靠规则**：只包含标记清理 System，确保下一帧的表现计算从干净状态开始。

## Presentation Loop（独立于 Simulation Loop）

![Game Tick 循环](diagrams/tick-loop.svg)

`GameEngine.Update(float)` 在 Simulation Loop 之后执行，不受 Pacemaker 预算限制：

```
Update(dt)
  ├── 清空各表现 Buffer（Request, Sound, InstancedBatch, GroundOverlay, RoadSpline, WorldHUD）
  ├── BeginPresentationCameraSnapshotScope()
  ├── for each _presentationSystems → Update(dt)
  ├── EndPresentationCameraSnapshotScope()
  ├── InstancedBatchCapabilityValidator.Validate()
  └── _gasPresentationEvents.Clear()
```

**Presentation System 列表**（`SystemGroup` 枚举外，无 phase 分组）：

| System | 文件路径 | 说明 |
|--------|----------|------|
| `PerformerRuntimeSystem` | `src/Core/Presentation/` | Performer 运行时更新 |
| `PerformerBehaviorSystem` | `src/Core/Presentation/` | Performer 行为状态机 |
| `PerformerRuleSystem` | `src/Core/Presentation/` | Performer 规则评估 |
| `CameraRuntimeSystem` | `src/Core/Systems/` | 相机运行时更新 |
| `CameraCullingSystem` | `src/Core/Systems/` | 视锥剔除 |
| `MinimapRenderSystem` | `src/Core/Presentation/` | 小地图渲染 |
| `HudRenderSystem` | `src/Core/Presentation/` | HUD 渲染 |
| `VisionSystem` | `src/Core/Vision/` | 视野与战争迷雾更新 |
| `GridVisualSyncSystem` | `src/Core/Systems/` | 网格视觉同步 |

## 新增 System 的归属决策树

```
新增 System？
├── 是否涉及渲染/视觉/音频/UI？
│   └── 是 → 注册为 Presentation System（SystemGroup 外）
│
├── 是否修改属性 schema / 注册新图程序？
│   └── 是 → SchemaUpdate phase
│
├── 是否收集/处理玩家输入？
│   └── 是 → InputCollection phase
│
├── 是否在移动后更新空间结构？
│   └── 是 → PostMovement phase
│
├── 是否将输入/决策转换为 Effect 请求？
│   └── 是 → AbilityActivation phase
│
├── 是否执行实际效果（伤害、位移、创建实体）？
│   └── 是 → EffectProcessing phase
│
├── 是否处理新实体生成后的绑定？
│   └── 是 → RuntimeEntityBinding phase
│
├── 是否计算属性最终值？
│   └── 是 → AttributeCalculation phase
│
├── 是否收集/处理延迟触发器？
│   └── 是 → DeferredTriggerCollection phase
│
├── 是否销毁实体/清理效果？
│   └── 是 → Cleanup phase
│
├── 是否分发事件到 Trigger/表现层？
│   └── 是 → EventDispatch phase
│
├── 是否清除表现标记？
│   └── 是 → ClearPresentationFlags phase
│
└── 无法归属 → 禁止创建。必须拆分为多个 System 分别归属。
```

---

## 性能约束

| 约束项 | 要求 | 机制 |
|--------|------|------|
| Phase 内 System 顺序 | 注册顺序 = 执行顺序 | `SystemFactoryRegistry` 按注册顺序返回 |
| Phase 间顺序 | 固定，不可变更 | `SystemGroup` 枚举值硬编码 |
| Simulation 预算 | 每帧 ≤ `SimulationBudgetMsPerFrame` | `IPacemaker` 控制；超预算则 `SimulationBudgetFuseEvent` |
| 单 phase 内无 yield | 同步顺序执行 | 无 async/await 在 Simulation Loop 中 |
| Presentation 不阻塞 | 即使 Simulation 熔断也继续渲染 | `Update` 独立于 `Tick` |

---

## 扩展契约

| 扩展点 | 方式 | 约束 |
|--------|------|------|
| 注册 Simulation System | `IModContext.RegisterSystemFactory(name, SystemGroup, factory)` | `SystemGroup` 必须是已有枚举值之一；禁止新增 phase |
| 注册 Presentation System | `IModContext.RegisterSystemFactory(name, null, factory)` | 无 phase 分组，在 `Update` 中执行 |
| 动态启用/禁用 | `SystemFactoryRegistry.TryActivate` / `TryDeactivate` | 在 Map 加载/卸载时切换 |
| System 依赖注入 | 通过 `GameContext.GetService<T>(ServiceKey<T>)` | 在 System 构造函数中解析服务 |

  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
</body>
</html>
