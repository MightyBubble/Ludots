<script>
const mdContent = "# 架构与基础设施 — 数据模型\n\n## 设计目标\n\nLudots 的数据模型以 **Arch ECS** 为核心，所有 gameplay 状态表达为 **Entity / Component / System** 三元组。设计目标如下：\n\n1. **连续内存布局**：通过 SoA（Structure of Arrays）实现 CPU 缓存友好型遍历。\n2. **零托管引用**：ECS 组件均为 `unmanaged struct`，排除 GC 干扰。\n3. **定点数一致性**：Gameplay 数值在 `Fix64` 空间运算，消除跨平台浮点差异。\n4. **模板化生成**：`EntityTemplate` + `ComponentRegistry` + `EntityBuilder` 构成声明式实体配置管线。\n\n---\n\n## Entity / Component / System 三元组\n\n![ECS 层级结构](../diagrams/ecs-datamodel-ecs-hierarchy.svg)\n\n### 1. Entity\n\n![Entity 生命周期](../diagrams/ecs-datamodel-entity-lifecycle.svg)\n\nEntity 在 Arch ECS 中是轻量句柄（`Entity` struct），仅包含 `Id` 和 `WorldId`。Ludots 中 Entity 通过以下方式生成：\n\n- **批量模板生成**：`TemplateEntityBatchSpawner`（`src/Core/Config/TemplateEntityBatchSpawner.cs`）从 `EntityTemplate` 直接通过 Arch chunk span 填充组件，绕过逐 entity `ComponentRegistry` 调用。\n- **运行时生成**：`RuntimeEntitySpawnSystem`（`src/Core/Gameplay/Spawning/RuntimeEntitySpawnSystem.cs`，1246 行）处理 `RuntimeEntitySpawnQueue` 中的动态生成请求，在 `RuntimeEntityBinding` phase 统一绑定 `PresenterEntityRuntime`。\n- **表现层安全销毁**：`PresentationEntityLifecycle.RequestDestroy`（`src/Core/Presentation/PresentationEntityLifecycle.cs`）通过 `PresentationDestroyPending` 标签标记，在 `Cleanup` phase 由 `PresentationEntityFinalizeDestroySystem` 执行实际销毁。\n\n### 2. Component\n\nComponent 是 ECS 中的数据载体。Ludots 的组件分为三类：\n\n| 后缀 | 含义 | 示例 |\n|------|------|------|\n| **Cm** | 普通数据组件（Component） | `WorldPositionCm`, `FacingDirection`, `AttributeBuffer` |\n| **Tag** | 空结构标签（Empty Struct Tag） | `PresentationDestroyPending`, `SpatialPartitionExcluded`, `ScopeMemberTag` |\n| **Event** | 一次性事件组件（One-frame Event） | `GameplayEvent`, `SimulationBudgetFuseEvent` |\n\n组件约束：\n- 必须是 `unmanaged struct`（不含 `string`、托管引用）。\n- 标识类数据使用 `StringIntRegistry` 预解析为 `int` 后存储（如 `AbilityId`, `EffectTemplateId`, `TagId`）。\n- 变长数据通过 `EntityKeyedSoaTable<TPayload>` 或外部 Buffer 存储，不直接放在组件内。\n\n### 3. System\n\nSystem 是 ECS 中的逻辑处理器。Ludots 中 System 按 `SystemGroup` 分 phase 执行，详见 `02-systemgroup.md`。System 分为两类：\n\n- **Simulation System**：在 `GameEngine.Tick` 的 Pacemaker 控制下执行，受 `SimulationBudgetMsPerFrame` 约束。\n- **Presentation System**：在 `GameEngine.Update` 中执行，不受预算限制，负责填充各表现 Buffer（`PresenterCommandBuffer`, `InstancedBatchRequestBuffer`, `GroundOverlayBuffer` 等）。\n\n---\n\n## SoA（Structure of Arrays）布局\n\n![Chunk SoA 存储](../diagrams/ecs-datamodel-chunk-storage.svg)\n\n### 1. Arch ECS 的 Chunk 布局\n\nArch ECS 将具有相同组件签名的 Entity 放入同一 **Archetype** 的 **Chunk** 中。每个 Chunk 是一块连续内存，组件按 SoA 排列：\n\n```\nChunk (16KB)\n├── Entity[capacity]           // 实体句柄数组\n├── ComponentA[capacity]       // 组件 A 的数组\n├── ComponentB[capacity]       // 组件 B 的数组\n└── ComponentC[capacity]       // 组件 C 的数组\n```\n\n这种布局使得 `Query` 遍历同一组件类型的所有 Entity 时具有极佳的缓存局部性。\n\n![Query 执行流程](../diagrams/ecs-datamodel-query-execution.svg)\n\n### 2. EntityKeyedSoaTable：ECS 外部的 SoA 关联表\n\n对于无法放入 ECS chunk 的变长或关联数据，Ludots 提供 `EntityKeyedSoaTable<TPayload>`（`src/Core/Association/EntityKeyedSoaTable.cs`，759 行）：\n\n- **键模式**：支持 `Pair`（Primary + Secondary Entity）和 `Entity+Discriminator` 两种键模式（`EntityKeyedSoaKey`）。\n- **容量管理**：哈希桶 + 主实体索引；load factor 0.72；支持 `Upsert`, `Remove`, `Expire`, `Compact`。\n- **过期机制**：支持行级过期，通过 `Expire` 标记后由 `Compact` 回收。\n\n### 3. 存档序列化的 SoA 友好性\n\n`LudotsBinaryWorldSerializer`（`src/Core/Persistence/LudotsBinaryWorldSerializer.cs`）基于 `Arch.Persistence` 对 ECS World 进行二进制快照。SoA 布局使得 chunk 数据可直接 bulk 序列化，无需逐 entity 反射。\n\n---\n\n## blittable struct 约束与示例\n\n### 1. 约束定义\n\nblittable struct 在 Ludots 中的含义是：\n\n- 类型是 C# `unmanaged`（即只包含 `unmanaged` 字段，无 `class`、`string`、托管数组、接口、事件）。\n- 可被 `unsafe` 代码直接按字节复制（`sizeof(T)` 确定）。\n- 可被 `Arch.Persistence` 的 binary formatter 直接序列化。\n\n### 2. 典型组件示例\n\n```csharp\n// 位置组件（Fix64 定点数）\npublic struct WorldPositionCm\n{\n    public Fix64 X;\n    public Fix64 Y;\n    public Fix64 Z;\n}\n\n// 朝向组件（Fix64 角度）\npublic struct FacingDirection\n{\n    public Fix64 Angle; // 弧度，0 ~ 2π\n}\n\n// 属性缓冲组件（引用外部 SoA 表）\npublic struct AttributeBuffer\n{\n    public int BufferId; // StringIntRegistry 预解析的 ID\n}\n\n// 游戏标签容器（引用外部 Tag 存储）\npublic struct GameplayTagContainer\n{\n    public int TagSetId; // StringIntRegistry 预解析的 ID\n}\n```\n\n### 3. 非 blittable 数据的处理策略\n\n| 数据类型 | 处理策略 | 关键类型 |\n|----------|----------|----------|\n| `string` 名称 | `StringIntRegistry` 预解析为 `int` ID | `StringIntRegistry`（`src/Core/Registry/StringIntRegistry.cs`） |\n| 变长集合 | `EntityKeyedSoaTable<TPayload>` | `EntityKeyedSoaTable<TPayload>`（`src/Core/Association/EntityKeyedSoaTable.cs`） |\n| 实体引用 | `Entity` struct（Arch 句柄） | `Entity`（Arch.Core） |\n| 关系图 | `Relationship<RelationshipEdgeSet>` | `RelationshipRuntime`（`src/Core/Gameplay/Relationships/RelationshipRuntime.cs`） |\n| 作用域成员 | `ScopeRefBuffer`（unsafe fixed） | `ScopeRefBuffer`（`src/Core/Association/ScopeKey.cs`） |\n\n---\n\n## Fix64 / Fix64Vec2 定点数系统\n\n### 1. Fix64 概述\n\n`Fix64` 是 64 位定点数，通常使用 16.48 或 32.32 格式（具体精度由实现定义）。在 Ludots 中，所有 gameplay 数值计算（属性、伤害、位置、速度）均使用 `Fix64`，仅在表现层转换为 `float`。\n\n### 2. 使用场景\n\n| 场景 | 类型 | 说明 |\n|------|------|------|\n| 世界坐标 | `Fix64Vec2` / `Fix64Vec3` | 单位：厘米（cm） |\n| 属性值 | `Fix64` | 生命值、攻击力、护甲值等 |\n| 角度 | `Fix64` | 弧度表示 |\n| 时间 | `Fix64` | 持续时间、冷却时间 |\n| 插值 | `Fix64` | 线性/缓动插值在 Fix64 空间完成 |\n\n### 3. 与表现层的边界\n\n`Fix64` 到 `float` 的转换只发生在 **Presentation System** 中：\n\n- `PresenterRuntimeSystem` 将 `WorldPositionCm`（Fix64）转换为 `VisualTransform`（float）供渲染器使用。\n- `GridVisualSyncSystem` 将网格坐标同步为视觉坐标。\n- `CameraRuntimeSystem` 将相机逻辑位置（Fix64）转换为视图矩阵（float）。\n\nSimulation System 中严禁使用 `float` 进行 gameplay 计算。\n\n---\n\n## 组件命名约定\n\n### 1. 命名规则\n\n| 模式 | 约定 | 示例 |\n|------|------|------|\n| 数据组件 | 以 `Cm` 结尾或功能名词 | `WorldPositionCm`, `AttributeBuffer`, `InventoryCapacity` |\n| 标签组件 | 以 `Tag` 结尾 | `SpatialPartitionExcluded`, `SaveExcludedTag`, `ScopeMemberTag`, `PresentationDestroyPending` |\n| 事件组件 | 以 `Event` 结尾 | `GameplayEvent`, `SimulationBudgetFuseEvent`, `PresentationEvent` |\n| 状态组件 | 名词 + 状态描述 | `SelectionSelectableState`, `OrderBuffer` |\n| 关系组件 | 使用 Arch `Relationship<T>` | `Relationship<RelationshipEdgeSet>` |\n\n### 2. 命名空间与目录约定\n\n组件定义通常与其 gameplay 域放在一起：\n\n- `src/Core/Gameplay/GAS/`：GAS 相关组件（`AttributeBuffer`, `GameplayTagContainer` 等）\n- `src/Core/Gameplay/Items/`：物品相关组件（`InventoryCapacity` 等）\n- `src/Core/Gameplay/Spawning/`：生成相关组件（`PresentationStableId` 等）\n- `src/Core/Map/`：地图相关组件（`MapEntityTag` 等）\n- `src/Core/Presentation/`：表现相关组件（`VisualTransform`, `PresentationStaticTransform` 等）\n\n---\n\n## 实体模板与批量生成\n\n![EntityTemplate 继承](../diagrams/ecs-datamodel-template-inheritance.svg)\n\n### 1. EntityTemplate\n\n`EntityTemplate`（`src/Core/Config/EntityTemplate.cs`）是声明式实体配置：\n\n```csharp\npublic class EntityTemplate\n{\n    public string Id { get; set; }\n    public string OnSpawnEffect { get; set; } // 生成时触发的 EffectTemplate ID\n    public Dictionary<string, JsonNode> Components { get; set; } // 组件名 → JSON 配置\n}\n```\n\n### 2. EntityBuilder\n\n`EntityBuilder`（`src/Core/Config/EntityBuilder.cs`）提供 Fluent API：\n\n```\nUseTemplate(templateId) → WithOverride(componentName, jsonValue) → Build(world)\n```\n\n构建时调用 `ComponentRegistry.Apply` 将 JSON 解析为组件值并附加到实体。\n\n### 3. TemplateEntityBatchSpawner（高性能路径）\n\n`TemplateEntityBatchSpawner`（`src/Core/Config/TemplateEntityBatchSpawner.cs`）是 `EntityBuilder` 的高性能替代方案：\n\n- 直接通过 Arch chunk span 填充组件，绕过逐 entity `ComponentRegistry` 调用。\n- 仅支持有限内置组件（`Name`, `WorldPositionCm`, `FacingDirection`, `AttributeBuffer`, `GameplayTagContainer`, `TagCountContainer`, `OrderBuffer`, `SelectionSelectableState`, `EntityLayer`, `Team`, `PlayerOwner`, `PresentationStaticTransform`, `SpatialPartitionExcluded` 等）。\n- 任何其他组件必须通过 `EntityBuilder` 走慢路径。\n\n性能约束：批量生成场景（如 RTS 单位生成、ARPG 怪物刷怪）必须优先使用 `TemplateEntityBatchSpawner`。\n\n---\n\n## 性能约束\n\n| 约束项 | 要求 | 实现 |\n|--------|------|------|\n| 组件大小 | ≤ 64 字节（推荐） | 大字段通过 `EntityKeyedSoaTable` 外置 |\n| 组件对齐 | 自然对齐 | `unmanaged struct` 自动满足 |\n| 查询缓存 | 初始化阶段构造 `QueryDescription` | 运行时只复用已有描述对象 |\n| 批量生成 | 优先使用 `TemplateEntityBatchSpawner` | 直接写 chunk span |\n| 定点数运算 | 全部 gameplay 逻辑使用 `Fix64` | 仅在 Presentation System 转 float |\n\n---\n\n## 扩展契约\n\n| 扩展点 | 方式 | 约束 |\n|--------|------|------|\n| 自定义组件 | `ComponentRegistry.Register<T>(name, modId)` | 必须是 `unmanaged struct`；组件名全局唯一 |\n| 自定义模板 | `MapConfig.Entities` 中声明 | 使用 `EntityTemplate` 格式 |\n| 自定义 SoA 表 | 继承 `EntityKeyedSoaTable<TPayload>` | `TPayload` 必须是 `unmanaged struct` |\n| 批量生成组件扩展 | 修改 `TemplateEntityBatchSpawner.IsBatchCandidate` | 需修改 Core 代码，Mod 无法直接扩展 |\n\n---\n\n> 参考文件\n> - `src/Core/Config/EntityTemplate.cs`（模板定义）\n> - `src/Core/Config/EntityBuilder.cs`（实体构建器）\n> - `src/Core/Config/TemplateEntityBatchSpawner.cs`（批量生成器）\n> - `src/Core/Config/ComponentRegistry.cs`（组件注册表，60+ 组件）\n> - `src/Core/Association/EntityKeyedSoaTable.cs`（SoA 关联表）\n> - `src/Core/Registry/StringIntRegistry.cs`（统一 ID 映射）\n> - `src/Core/Gameplay/Spawning/RuntimeEntitySpawnSystem.cs`（运行时实体生成）\n> - `src/Core/Presentation/PresentationEntityLifecycle.cs`（表现层生命周期）\n";
document.getElementById('content').innerHTML = marked.parse(mdContent);
</script>
