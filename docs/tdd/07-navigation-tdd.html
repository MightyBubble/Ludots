const mdContent = "# 导航子系统技术设计文档（TDD）\n\n> 文档编号：TDD-07  \n> 对应模块：`src/Core/Input/`、`src/Core/Navigation/`、`src/Core/MovePlanning/`、`src/Core/MassNavigation/`  \n> 依据 Stage 1 扫描报告：`report_Input_Nav.md`  \n> 版本：基于分支 `codex/issue437-graph-config`\n\n---\n\n## 1. 设计目标\n\n导航子系统负责 Ludots 引擎中 **\"意图 → 选择 → 指令 → 寻路 → 移动执行\"** 的全链路仿真。其设计目标如下：\n\n| 目标 | 约束 |\n|------|------|\n| **多域寻路统一** | 支持 NodeGraph（A* / RouteTable）、NavMesh（Detour）、Direct（直线）三种域，按策略自动路由 |\n| **大规模 RTS/战场仿真** | `MassNavigation` 支持数千单位同时寻路、避障、执行，固定步长调度 |\n| **0-GC 热路径** | `MassNavigationFlowSolverState` 使用 `unsafe fixed` 数组，求解器核心无堆分配 |\n| **增量式 NavMesh 烘焙** | 支持运行时增量重建，基于 CDT 的 tile 化烘焙管线 |\n| **确定性回放** | 所有寻路和移动执行基于固定帧，输入通过 `OrderBufferSystem` 排队 |\n\n---\n\n## 2. 数据模型与核心接口\n\n![导航技术栈](diagrams/nav-navigation-stack.svg)\n\n### 2.1 NavMesh：CDT 与烘焙管线\n\nNavMesh 基于 **Constrained Delaunay Triangulation（CDT）** 构建，采用 tile 化组织方式。烘焙管线将输入地形/障碍几何转化为可行走导航网格。\n\n| 类型 | 文件路径 | 说明 |\n|------|----------|------|\n| `BakePipeline` | `src/Core/Navigation/NavMesh/Bake/BakePipeline.cs` | 烘焙管线主控 |\n| `NavBakeService` | `src/Core/Navigation/NavMesh/Bake/NavBakeService.cs` | 烘焙服务入口 |\n| `NavBakeContext` | `src/Core/Navigation/NavMesh/Bake/NavBakeContext.cs` | 烘焙上下文（输入几何、配置参数） |\n| `NavBakeEstimator` | `src/Core/Navigation/NavMesh/Bake/NavBakeEstimator.cs` | 烘焙预算估计器（防止过度消耗） |\n| `NavBakeTerrainLoader` | `src/Core/Navigation/NavMesh/Bake/NavBakeTerrainLoader.cs` | 地形数据加载 |\n| `WalkMaskBuilder` | `src/Core/Navigation/NavMesh/Bake/WalkMaskBuilder.cs` | 行走区域掩码构建 |\n| `ContourExtractor` | `src/Core/Navigation/NavMesh/Bake/ContourExtractor.cs` | 轮廓提取（从体素/网格到多边形） |\n| `Triangulator` | `src/Core/Navigation/NavMesh/Bake/Triangulator.cs` | 三角化器 |\n| `CdtTriangulator` | `src/Core/Navigation/NavMesh/Bake/CdtTriangulator.cs` | **CDT 三角化器**（核心） |\n| `GridMeshBuilder` | `src/Core/Navigation/NavMesh/Bake/GridMeshBuilder.cs` | 网格网格构建器 |\n| `PolygonProcessor` | `src/Core/Navigation/NavMesh/Bake/PolygonProcessor.cs` | 多边形后处理（简化、凸化） |\n| `FunnelAlgorithm` | `src/Core/Navigation/NavMesh/Bake/FunnelAlgorithm.cs` | 漏斗算法（路径优化） |\n| `BakeArtifactBuilder` | `src/Core/Navigation/NavMesh/Bake/BakeArtifactBuilder.cs` | 烘焙产物构建器 |\n| `NavObstacleGeometry` | `src/Core/Navigation/NavMesh/Bake/NavObstacleGeometry.cs` | 障碍几何描述 |\n| `RuntimeIncrementalNavMeshRebuildQueue` | `src/Core/Navigation/NavMesh/Bake/RuntimeIncrementalNavMeshRebuildQueue.cs` | 运行时增量重建队列 |\n| `NavTileStore` | `src/Core/Navigation/NavMesh/NavTileStore.cs` | Tile 存储（加载/缓存） |\n| `NavTileBuilder` | `src/Core/Navigation/NavMesh/NavTileBuilder.cs` | Tile 构建器 |\n| `NavTileBinary` | `src/Core/Navigation/NavMesh/NavTileBinary.cs` | Tile 二进制序列化 |\n| `NavTileModels` | `src/Core/Navigation/NavMesh/NavTileModels.cs` | Tile 数据模型 |\n| `NavMeshBakeConfig` | `src/Core/Navigation/NavMesh/Config/NavMeshBakeConfig.cs` | 烘焙配置 |\n| `NavMeshProfileRegistry` | `src/Core/Navigation/NavMesh/NavMeshProfileRegistry.cs` | Profile 注册表 |\n| `NavQueryService` | `src/Core/Navigation/NavMesh/NavQueryService.cs` | NavMesh 查询服务（Project/FindPath） |\n| `DetourNavQueryEngine` | `src/Core/Navigation/NavMesh/DetourNavQueryEngine.cs` | Detour 查询引擎封装 |\n\n> **烘焙流程**：`BakePipeline` → `NavBakeTerrainLoader`（加载地形） → `WalkMaskBuilder`（构建行走掩码） → `ContourExtractor`（提取轮廓） → `CdtTriangulator`（CDT 三角化） → `PolygonProcessor`（多边形处理） → `FunnelAlgorithm`（路径优化） → `BakeArtifactBuilder`（产出 Tile 数据） → `NavTileStore`（存储）。\n\n### 2.2 HPA：Hierarchical Pathfinding A* 与分层抽象图\n\nHPA 在大尺度地图中通过**簇（Cluster）抽象**降低寻路复杂度。\n\n| 类型 | 文件路径 | 说明 |\n|------|----------|------|\n| `HierarchicalPathService` | `src/Core/Navigation/MultiLayerGraph/HierarchicalPathService.cs` | 分层路径服务（HPA） |\n| `ClusterGraph` | `src/Core/Navigation/HPA/ClusterGraph.cs` | HPA 簇图 |\n| `MultiLayerGraph` | `src/Core/Navigation/MultiLayerGraph/MultiLayerGraph.cs` | 多层级图（细粒度 + 粗粒度） |\n| `InterLayerMapping` | `src/Core/Navigation/MultiLayerGraph/InterLayerMapping.cs` | 层间映射 |\n| `InterLayerMappingBuilder` | `src/Core/Navigation/MultiLayerGraph/InterLayerMappingBuilder.cs` | 层间映射构建器 |\n| `GraphRouteTable` | `src/Core/Navigation/GraphCore/GraphRouteTable.cs` | 预计算路由表（快速重建路径） |\n| `GraphRouteTableBuilder` | `src/Core/Navigation/GraphCore/GraphRouteTableBuilder.cs` | 路由表构建器 |\n\n### 2.3 Flow：MassNavigationFlowSolver 与流场求解\n\n`MassNavigationFlowSolverState` 是 MassNavigation 的核心求解器（约 2700 行 `partial class`），集成了 Flow Field、避障、穿透校正、到达恢复等算法。\n\n| 类型 | 文件路径 | 说明 |\n|------|----------|------|\n| `MassNavigationFlowSolverState` | `src/Core/MassNavigation/Runtime/MassNavigationFlowSolverState.cs` | 核心流求解器（Flow + Separation + ORCA/Sonar + Hard Resolve + Arrival） |\n| `MassNavigationFlowSolverSpatialHash` | `src/Core/MassNavigation/Runtime/MassNavigationFlowSolverSpatialHash.cs` | 求解器空间哈希辅助 |\n| `MassNavigationFlowSolverArrivalRecovery` | `src/Core/MassNavigation/Runtime/MassNavigationFlowSolverArrivalRecovery.cs` | 到达恢复辅助 |\n| `MassNavigationFlowSolverEntitySync` | `src/Core/MassNavigation/Runtime/MassNavigationFlowSolverEntitySync.cs` | 实体同步辅助 |\n| `MassNavigationFlowTuning` | `src/Core/MassNavigation/Runtime/MassNavigationFlowTuning.cs` | Flow 调参 |\n| `MassNavigationFlowArrivalTuning` | `src/Core/MassNavigation/Runtime/MassNavigationFlowArrivalTuning.cs` | 到达调参 |\n| `MassNavigationFlowAvoidanceTuning` | `src/Core/MassNavigation/Runtime/MassNavigationFlowAvoidanceTuning.cs` | 避障调参 |\n| `MassNavigationCrowdSemantics` | `src/Core/MassNavigation/Runtime/MassNavigationCrowdSemantics.cs` | 人群语义 |\n\n### 2.4 Avoidance：RVO / ORCA 变体与 Sonar 避障\n\n![ORCA 避障](diagrams/nav-avoidance-orca.svg)\n\n避障层提供两种局部避障算法：\n\n| 类型 | 文件路径 | 说明 |\n|------|----------|------|\n| `OrcaSolver2D` | `src/Core/Navigation/Avoidance/OrcaSolver2D.cs` | **ORCA 2D 避障核心**（纯数学，无状态） |\n| `SonarSolver2D` | `src/Core/Navigation/Avoidance/SonarSolver2D.cs` | **Sonar 2D 避障核心**（扇区扫描） |\n| `HexGridAOI` | `src/Core/Navigation/AOI/HexGridAOI.cs` | 六边形网格 AOI |\n| `IAOIInterfaces` | `src/Core/Navigation/AOI/IAOIInterfaces.cs` | AOI 接口定义 |\n\n### 2.5 MassExecution：MassNavigationRuntime 与 Step 执行\n\n![MassNavigation 架构](diagrams/nav-mass-navigation.svg)\n\nMassNavigation 采用 **固定步长调度**，通过 `MassNavigationCadenceScheduler` 控制仿真节奏。\n\n| 类型 | 文件路径 | 说明 |\n|------|----------|------|\n| `MassNavigationRuntime` | `src/Core/MassNavigation/Runtime/MassNavigationRuntime.cs` | 高层运行时：生命周期 + 系统安装 |\n| `MassNavigationSimulationRuntime` | `src/Core/MassNavigation/Runtime/MassNavigationSimulationRuntime.cs` | 模拟运行时 facade：选择同步、命令焦点、求解器窗口、遥测 |\n| `MassNavigationConfig` | `src/Core/MassNavigation/Runtime/MassNavigationConfig.cs` | 配置根（20+ 必填字段） |\n| `MassNavigationCadenceConfig` | `src/Core/MassNavigation/Runtime/MassNavigationCadenceConfig.cs` | 节奏配置：SimulationHz/TargetUpdateHz/FlowStepHz |\n| `MassNavigationCadenceScheduler` | `src/Core/MassNavigation/Runtime/MassNavigationCadenceConfig.cs` | 固定步长调度器 |\n| `MassNavigationAgentState` | `src/Core/MassNavigation/Runtime/MassNavigationAgentState.cs` | Agent 状态管理 |\n| `MassNavigationFormationRuntime` | `src/Core/MassNavigation/Runtime/MassNavigationFormationRuntime.cs` | 队形运行时 |\n| `MassNavigationGroupRuntime` | `src/Core/MassNavigation/Runtime/MassNavigationGroupRuntime.cs` | 导航组运行时 |\n| `MassNavigationRouteExecutionSink` | `src/Core/MassNavigation/Runtime/MassNavigationRouteExecutionSink.cs` | 路由执行 Sink |\n| `MassNavigationMovePlanExecutionSink` | `src/Core/MassNavigation/Runtime/MassNavigationMovePlanExecutionSink.cs` | MovePlan 执行 Sink |\n| `MassNavigationTelemetry` | `src/Core/MassNavigation/Runtime/MassNavigationTelemetry.cs` | 遥测（计时、计数、频率） |\n\n### 2.6 输入与选择模型\n\n| 类型 | 文件路径 | 说明 |\n|------|----------|------|\n| `PlayerInputHandler` | `src/Core/Input/Runtime/PlayerInputHandler.cs` | 核心输入处理器：Context 压栈、Binding 编译、Action 状态更新 |\n| `InputOrderMappingSystem` | `src/Core/Input/Orders/InputOrderMappingSystem.cs` | 核心系统：将 InputAction 触发转换为 Order 提交（支持 6 种交互模式） |\n| `AuthoritativeInputAccumulator` | `src/Core/Input/Runtime/AuthoritativeInputAccumulator.cs` | 视觉帧输入累加器，为固定步长提供权威快照 |\n| `SelectionRuntime` | `src/Core/Input/Selection/SelectionRuntime.cs` | 核心选择运行时：管理容器、成员关系、View 绑定 |\n| `CurrentSelectionApplySystem` | `src/Core/Input/Selection/CurrentSelectionApplySystem.cs` | 将正式选择应用到 MassNavigation 选择快照 |\n| `GasSelectionResponseSystem` | `src/Core/Input/Selection/GasSelectionResponseSystem.cs` | GAS 选择请求响应 |\n\n---\n\n## 3. 关键算法与流程\n\n### 3.1 输入 → 指令 Pipeline\n\n```\nIInputBackend (device)\n  → PlayerInputHandler.Update() (compile bindings, state machine)\n    → InputRuntimeSystem (UI capture suppression, authoritative snapshot)\n      → IInputFrameConsumer.Consume() (MassNavigationControlSystem, etc.)\n        → InputOrderMappingSystem (per mapping: action → order)\n          → OrderTypeRegistry.Resolve(orderTypeKey) → orderTypeId\n          → GroundPositionProvider / SelectedEntityProvider / HoveredEntityProvider\n          → OrderSubmitHandler (GAS OrderBufferSystem)\n```\n\n### 3.2 寻路 Pipeline（多域路由）\n\n![寻路流程](diagrams/nav-pathfinding-flow.svg)\n\n```\nPathRequest (Actor, Domain, Start, Goal, Budget)\n  → PathServiceRouter\n    → PathDomain.NodeGraph → NodeGraphPathServiceAdapter → NodeGraphPathService.FindPathAStar<TPolicy>()\n    → PathDomain.NavMesh   → NavMeshPathServiceAdapter → NavQueryService.TryFindPath() → DetourNavQueryEngine\n    → PathDomain.Auto      → AutoPathService (选择 cheapest domain)\n  → PathResult → PathHandle → PathStore (pool)\n```\n\n### 3.3 Order → 执行 Pipeline（MassNavigation）\n\n```\nOrderBuffer (massNavigationMove order)\n  → MassNavigationOrderIngestionSystem.Update()\n    → Resolve MoveOrderTypeId from OrderTypeRegistry\n    → Bucket 化（按 OrderId token 分组）\n    → NavGroupRuntime.UpsertOrderMoveCommand() → MassNavigationFlowSolverState.SetTeamTarget()\n    → (optional) MassNavigationRouteExecutionSink.TrackRouteTarget() → IPathService → waypoints\n    → MassNavigationFormationSystem (fixed tick cadence)\n      → UpdateTargets() (Group + Route)\n      → AdvanceFlowPipeline() (Flow Field rebuild if dirty)\n      → Step() (per-agent: local steering + avoidance + hard resolve)\n      → SyncEntities() → WorldPositionCm / FacingDirection / VisualTransform\n```\n\n### 3.4 MovePlan → 执行 Pipeline\n\n```\nOrder (with Spatial points)\n  → MovePlanRuntimeService.TryBindActiveOrder()\n    → MovePlanStore.TryBindFromOrder() (copy route points)\n    → MovePlanRuntime (CurrentWaypointIndex = 0)\n      → (showcase-specific) RoadMovePlanSelectionSystem / Generic plan sampler\n        → MovePlanExecutionIntent (TargetWorldCm/Speed/StopRadius)\n          → IMovePlanExecutionSink.TryApply()\n            → MassNavigationMovePlanExecutionSink → MassNavigationSimulationRuntime.SetAgentNavigationTargetWorldCm()\n              → MassNavigationFlowSolverState.SetUnitTarget()\n```\n\n### 3.5 13 步 Physics2D 仿真管线详细设计\n\nMassNavigation 的底层移动仿真遵循以下 **13 步固定步长管线**，每步在 `MassNavigationFormationSystem.Step()` 中按顺序执行：\n\n| 步骤 | 名称 | 职责 | 关键类型/文件 |\n|------|------|------|--------------|\n| 1 | **Group Target Update** | 更新编队目标位置（TeamTarget / RouteTarget） | `MassNavigationGroupRuntime` |\n| 2 | **Formation Slot Update** | 计算队形 Slot 目标偏移 | `MassNavigationFormationRuntime` |\n| 3 | **Flow Field Rebuild** | 若目标 dirty，重建流场（Flow Field） | `MassNavigationFlowSolverState.AdvanceFlowPipeline()` |\n| 4 | **Local Steering** | 基于 Flow Field 计算每单位期望速度 | `MassNavigationFlowSolverState` |\n| 5 | **Separation** | 邻近排斥（避免重叠） | `MassNavigationFlowSolverSpatialHash` |\n| 6 | **ORCA Avoidance** | 速度障碍避障（选优速度） | `OrcaSolver2D` |\n| 7 | **Sonar Avoidance** | 扇区扫描避障（补充 ORCA） | `SonarSolver2D` |\n| 8 | **Dominant Mass Resolution** | 主导质量单位优先通道 | `MassNavigationCrowdSemantics` |\n| 9 | **Hard Resolve** | 穿透校正（强制分离已穿透单位） | `MassNavigationFlowSolverState` |\n| 10 | **Arrival Check** | 检查到达目标（距离 + 时间窗口） | `MassNavigationFlowSolverArrivalRecovery` |\n| 11 | **Arrival Recovery** | 到达失败时的恢复策略（重推/重寻路） | `MassNavigationFlowSolverArrivalRecovery` |\n| 12 | **Entity Sync** | 将求解结果写回 ECS 组件 | `MassNavigationFlowSolverEntitySync` |\n| 13 | **Telemetry Capture** | 捕获求解器诊断数据 | `MassNavigationTelemetry` |\n\n> **注意**：步骤 6（ORCA）和步骤 7（Sonar）根据 `MassNavigationFlowAvoidanceTuning.Mode` 配置选择其一或组合使用。`DominantMassRatio` 控制主导质量单位的行为优先度。\n\n---\n\n## 4. 性能约束\n\n| 约束项 | 数值/规则 | 说明 |\n|--------|-----------|------|\n| NodeGraph 空间索引 | **UniformGrid / LinearScan 自适应** | 小图使用 LinearScan，大图使用 UniformGrid |\n| GraphTagSet | **TagBits256 → ushort id** | `GraphTagSetRegistry` 去重池，避免重复比较 256 位 |\n| 路径存储池 | **maxPaths × maxPoints** | `PathStore` 池化存储 Xcm/Ycm 数组 |\n| MassNavigation Agent 容量 | **由 `MassNavigationRuntimeCapacityConfig` 控制** | Group/Member/Order/Chunk 上限 |\n| Flow Field 分辨率 | **FieldWidth × FieldHeight × FlowCellSize** | 由 `MassNavigationFlowSolverConfig` 配置 |\n| 避障空间哈希 | **SeparationHash / HardResolveHash** | 由 `MassNavigationFlowSolverConfig` 配置 |\n| 并行工作器 | **ParallelWorker** | `MassNavigationFlowSolverConfig` 指定流场重建并行度 |\n| 0-GC 要求 | **MassNavigationFlowSolverState 热路径** | `unsafe fixed` 数组，禁止堆分配 |\n| 流式窗口 | **StreamingChunkSize / RetainSeconds** | `MassNavigationStreamingConfig` 控制动态加载 |\n| 命令焦点保持 | **CommandFocusHoldTicks** | `MassNavigationWorldConfig` 控制选择焦点保持时间 |\n\n---\n\n## 5. 扩展契约\n\n| 扩展点 | 接口/类型 | 注册时机 | 约束 |\n|--------|----------|----------|------|\n| **自定义寻路域** | `IPathService` | 加载期 | `TrySolve` / `TryCopyPath` 签名 |\n| **自定义图遍历策略** | `INodeGraphTraversalPolicy` | 加载期 | `IsNodeAllowed` / `IsEdgeAllowed` / `GetEdgeCost` / `GetHeuristic` |\n| **自定义 Plan 存储** | `IMovePlanStore` | 加载期 | `TryBindFromOrder` / `TryGetView` 签名 |\n| **自定义 Plan 执行 Sink** | `IMovePlanExecutionSink` | 加载期 | `TryApply` / `Clear` 签名 |\n| **自定义选择输入处理器** | `ISelectionInputHandler` | 加载期 | 框选/单选/圆形选择等 |\n| **自定义 AOI** | `IAOIInterfaces` | 加载期 | 六边形/网格/KDTree 等 |\n| **自定义空间索引** | `INodeGraphSpatialIndex` | 加载期 | KDTree、RTree 等 |\n| **Agent Profile** | `AgentProfileConfig` | 配置加载期 | 半径/速度/高度等 |\n| **NavMesh Profile** | `NavMeshProfileRegistry` | 配置加载期 | id → index 映射 |\n| **Formation 模式** | `MassNavigationFormationMode` | 运行时 | Grid/Wedge/Line/Square/Circle |\n\n---\n\n## 6. 关键类清单（带文件路径）\n\n### 6.1 寻路核心\n\n| 类/接口 | 文件路径 | 职责 |\n|---------|----------|------|\n| `IPathService` | `src/Core/Navigation/Pathing/IPathService.cs` | 路径服务接口 |\n| `PathServiceRouter` | `src/Core/Navigation/Pathing/PathServiceRouter.cs` | 按 PathDomain 路由 |\n| `PathStore` | `src/Core/Navigation/Pathing/PathStore.cs` | 池化路径存储 |\n| `NodeGraph` | `src/Core/Navigation/GraphCore/NodeGraph.cs` | 紧凑节点图（SoA） |\n| `NodeGraphPathService` | `src/Core/Navigation/GraphCore/NodeGraphPathService.cs` | A* 寻路静态方法 |\n| `INodeGraphTraversalPolicy` | `src/Core/Navigation/GraphCore/NodeGraphTraversalPolicy.cs` | 图遍历策略接口 |\n| `GraphPathfindingSystem` | `src/Core/Navigation/GraphEcs/GraphPathfindingSystem.cs` | ECS 图寻路系统 |\n| `GraphRouteTable` | `src/Core/Navigation/GraphCore/GraphRouteTable.cs` | 预计算路由表 |\n| `LoadedGraphRuntime` | `src/Core/Navigation/GraphWorld/LoadedGraphRuntime.cs` | Chunk 加载图运行时 |\n| `ChunkedNodeGraphStore` | `src/Core/Navigation/GraphWorld/ChunkedNodeGraphStore.cs` | 分块节点图存储 |\n| `AutoPathService` | `src/Core/Navigation/Pathing/AutoPathService.cs` | 自动路径服务 |\n| `DirectPathService` | `src/Core/Navigation/Pathing/DirectPathService.cs` | 直线路径服务 |\n| `NavQueryService` | `src/Core/Navigation/NavMesh/NavQueryService.cs` | NavMesh 查询服务 |\n| `DetourNavQueryEngine` | `src/Core/Navigation/NavMesh/DetourNavQueryEngine.cs` | Detour 查询引擎 |\n| `HierarchicalPathService` | `src/Core/Navigation/MultiLayerGraph/HierarchicalPathService.cs` | 分层路径服务 |\n| `ClusterGraph` | `src/Core/Navigation/HPA/ClusterGraph.cs` | HPA 簇图 |\n| `MultiLayerGraph` | `src/Core/Navigation/MultiLayerGraph/MultiLayerGraph.cs` | 多层级图 |\n\n### 6.2 NavMesh 烘焙\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `BakePipeline` | `src/Core/Navigation/NavMesh/Bake/BakePipeline.cs` | 烘焙管线主控 |\n| `NavBakeService` | `src/Core/Navigation/NavMesh/Bake/NavBakeService.cs` | 烘焙服务入口 |\n| `NavBakeContext` | `src/Core/Navigation/NavMesh/Bake/NavBakeContext.cs` | 烘焙上下文 |\n| `NavBakeEstimator` | `src/Core/Navigation/NavMesh/Bake/NavBakeEstimator.cs` | 烘焙预算估计器 |\n| `CdtTriangulator` | `src/Core/Navigation/NavMesh/Bake/CdtTriangulator.cs` | CDT 三角化器 |\n| `FunnelAlgorithm` | `src/Core/Navigation/NavMesh/Bake/FunnelAlgorithm.cs` | 漏斗算法（路径优化） |\n| `RuntimeIncrementalNavMeshRebuildQueue` | `src/Core/Navigation/NavMesh/Bake/RuntimeIncrementalNavMeshRebuildQueue.cs` | 运行时增量重建队列 |\n| `NavTileStore` | `src/Core/Navigation/NavMesh/NavTileStore.cs` | Tile 存储 |\n| `NavTileBuilder` | `src/Core/Navigation/NavMesh/NavTileBuilder.cs` | Tile 构建器 |\n\n### 6.3 MassNavigation 执行\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `MassNavigationRuntime` | `src/Core/MassNavigation/Runtime/MassNavigationRuntime.cs` | 高层运行时（生命周期 + 系统安装） |\n| `MassNavigationSimulationRuntime` | `src/Core/MassNavigation/Runtime/MassNavigationSimulationRuntime.cs` | 模拟运行时 facade |\n| `MassNavigationFlowSolverState` | `src/Core/MassNavigation/Runtime/MassNavigationFlowSolverState.cs` | 核心流求解器（~2700 行 partial class） |\n| `MassNavigationFormationSystem` | `src/Core/MassNavigation/Systems/MassNavigationFormationSystem.cs` | 队形 + Flow 步进 |\n| `MassNavigationOrderIngestionSystem` | `src/Core/MassNavigation/Systems/MassNavigationOrderIngestionSystem.cs` | Order 摄取系统 |\n| `MassNavigationFormationRuntime` | `src/Core/MassNavigation/Runtime/MassNavigationFormationRuntime.cs` | 队形运行时 |\n| `MassNavigationGroupRuntime` | `src/Core/MassNavigation/Runtime/MassNavigationGroupRuntime.cs` | 导航组运行时 |\n| `MassNavigationRouteExecutionSink` | `src/Core/MassNavigation/Runtime/MassNavigationRouteExecutionSink.cs` | 路由执行 Sink |\n| `MassNavigationMovePlanExecutionSink` | `src/Core/MassNavigation/Runtime/MassNavigationMovePlanExecutionSink.cs` | MovePlan 执行 Sink |\n| `MassNavigationCadenceScheduler` | `src/Core/MassNavigation/Runtime/MassNavigationCadenceConfig.cs` | 固定步长调度器 |\n| `MassNavigationTelemetry` | `src/Core/MassNavigation/Runtime/MassNavigationTelemetry.cs` | 遥测 |\n\n### 6.4 避障与 AOI\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `OrcaSolver2D` | `src/Core/Navigation/Avoidance/OrcaSolver2D.cs` | ORCA 2D 避障核心 |\n| `SonarSolver2D` | `src/Core/Navigation/Avoidance/SonarSolver2D.cs` | Sonar 2D 避障核心 |\n| `HexGridAOI` | `src/Core/Navigation/AOI/HexGridAOI.cs` | 六边形网格 AOI |\n| `TerrainAnalyzer` | `src/Core/Navigation/Analysis/TerrainAnalyzer.cs` | 地形分析器 |\n| `LogicTerrainField` | `src/Core/Navigation/Terrain/LogicTerrainField.cs` | 逻辑地形场 |\n\n### 6.5 输入与选择\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `PlayerInputHandler` | `src/Core/Input/Runtime/PlayerInputHandler.cs` | 核心输入处理器 |\n| `InputOrderMappingSystem` | `src/Core/Input/Orders/InputOrderMappingSystem.cs` | 输入 → Order 映射 |\n| `InputOrderMapping` | `src/Core/Input/Orders/InputOrderMapping.cs` | 映射定义（6 种交互模式） |\n| `AuthoritativeInputAccumulator` | `src/Core/Input/Runtime/AuthoritativeInputAccumulator.cs` | 权威输入快照 |\n| `SelectionRuntime` | `src/Core/Input/Selection/SelectionRuntime.cs` | 选择运行时 |\n| `CurrentSelectionApplySystem` | `src/Core/Input/Selection/CurrentSelectionApplySystem.cs` | 选择应用到 MassNavigation |\n| `MovePlanRuntimeService` | `src/Core/MovePlanning/MovePlanRuntimeService.cs` | MovePlan 运行时服务 |\n| `MovePlanStore` | `src/Core/MovePlanning/MovePlanStore.cs` | Plan 存储 |\n\n### 6.6 配置与注册表\n\n| 类 | 文件路径 | 职责 |\n|----|----------|------|\n| `AgentProfileRegistry` | `src/Core/Navigation/AgentProfiles/AgentProfileRegistry.cs` | Agent 配置注册表 |\n| `NavMeshProfileRegistry` | `src/Core/Navigation/NavMesh/NavMeshProfileRegistry.cs` | NavMesh Profile 注册表 |\n| `GraphTagSetRegistry` | `src/Core/Navigation/GraphSemantics/GAS/GraphTagSetRegistry.cs` | TagBits256 去重池 |\n| `MassNavigationProfileRegistry` | `src/Core/MassNavigation/Runtime/MassNavigationProfileRegistry.cs` | MassNavigation Profile 注册表 |\n| `MassNavigationFormationRegistry` | `src/Core/MassNavigation/Runtime/MassNavigationFormationRegistry.cs` | 队形注册表 |\n| `OrderTypeRegistry` | `src/Core/Gameplay/GAS/Orders/OrderTypeRegistry.cs` | OrderTypeKey → OrderTypeId |\n| `SelectionRuleRegistry` | `src/Core/Input/Selection/SelectionRuleRegistry.cs` | 选择规则注册表 |\n| `PathingConfig` | `src/Core/Navigation/Pathing/Config/PathingConfig.cs` | 寻路配置根 |\n| `NavMeshBakeConfig` | `src/Core/Navigation/NavMesh/Config/NavMeshBakeConfig.cs` | 烘焙配置 |\n| `MassNavigationConfig` | `src/Core/MassNavigation/Runtime/MassNavigationConfig.cs` | MassNavigation 配置根 |\n| `MassNavigationCadenceConfig` | `src/Core/MassNavigation/Runtime/MassNavigationCadenceConfig.cs` | 节奏配置 |\n\n---\n\n*本文档基于 Stage 1 扫描报告生成，具体实现细节以源码为准。*\n";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
