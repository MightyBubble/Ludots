<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>架构图库 — Ludots</title>
<meta name="description" content="Ludots 架构图库：57 组架构图、流程图、依赖图与数据模型图，覆盖全部子系统，支持全屏查看。">
<link rel="stylesheet" href="site-assets/site.css">
<style>
  /* ===== 图库专属样式 ===== */
  .category { margin-bottom: 56px; }
  .category-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .category-icon {
    width: 40px; height: 40px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .category-header h3 { margin: 0; font-size: 20px; }
  .category-header .count { color: var(--faint); font-size: 13px; }

  .diagram-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; }
  .diagram-card { padding: 18px; cursor: pointer;
    transition: box-shadow 0.18s, transform 0.18s; }
  .diagram-card:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }
  .diagram-card .title { font-weight: 600; font-size: 14.5px; margin-bottom: 6px; }
  .diagram-card .desc { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; line-height: 1.55; }
  .diagram-card .preview {
    width: 100%; height: 180px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); overflow: hidden; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .diagram-card .preview img { max-width: 100%; max-height: 100%; }
  .diagram-card .tags { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .diagram-card .tag {
    font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
    background: var(--accent-light); color: var(--accent);
  }
  .hidden-by-filter { display: none !important; }
</style>
</head>
<body data-page="diagrams">
<header id="topbar"></header>

<main class="page">
  <div class="section-head" style="margin-top: 8px;">
    <div class="kicker">DIAGRAM LIBRARY</div>
    <h2>架构图库</h2>
    <p>57 组专业架构图、流程图、依赖图与数据模型图（SVG + PNG 双格式，共 114 个文件），覆盖全部子系统。点击任意卡片全屏查看。</p>
  </div>

  <div class="filterbar">
    <div class="search">
      <span style="color: var(--faint);">🔍</span>
      <input id="q" type="search" placeholder="搜索图名或描述…">
    </div>
    <div class="chip-group" id="cat-chips"></div>
  </div>

  <div id="content"></div>
</main>

<!-- 全屏浮层 -->
<div class="overlay" id="overlay">
  <span class="close-btn" id="overlay-close">&times;</span>
  <img id="overlay-img" alt="架构图全屏查看">
</div>

<footer class="site-footer">
  <div class="inner">
    <span>Ludots 架构图库 · 图纸源文件 docs/diagrams/</span>
    <span>SVG 矢量格式可直接嵌入文档</span>
  </div>
</footer>

<script src="site-assets/site.js"></script>
<script>
(function () {
  "use strict";
  var esc = LudotsSite.esc;

  /* ============ 图纸数据（迁移自旧版 diagrams.html，13 大分类 / 57 组 SVG） ============ */
  var categories = [
    {
      name: "Engine & Architecture", icon: "⚙️", color: "#c45c3e",
      diagrams: [
        { file: "engine-architecture.svg", title: "整体引擎架构", desc: "以 GameEngine 为核心，放射状展示 8 大子系统与平台适配器" },
        { file: "systemgroup-pipeline.svg", title: "SystemGroup 流水线", desc: "10 个 Phase 的完整执行顺序，每个 Phase 展开注册的实际系统" },
        { file: "hexagonal-architecture.svg", title: "六边形架构", desc: "Core Domain → Ports → Adapters 三层，实线/虚线区分依赖与插件" },
        { file: "tick-loop.svg", title: "Game Tick 循环", desc: "从 Tick 入口到 Render 输出的 5 大阶段完整流程" },
        { file: "feature-mind-map.svg", title: "全功能拓扑脑图", desc: "以 Engine 为中心放射状展开 10 大能力域" },
        { file: "business-game-tick-e2e.svg", title: "端到端 Tick 流程", desc: "Input → ECS → GAS → Navigation → Physics → Presentation → Render" }
      ]
    },
    {
      name: "GAS & Combat", icon: "⚔️", color: "#6b8e6b",
      diagrams: [
        { file: "gas-component-relation.svg", title: "GAS 组件关系", desc: "Ability / Effect / Attribute / Tag / Cue 围绕 GasRuntimeState 的协调关系" },
        { file: "ability-activation-flow.svg", title: "Ability 激活流程", desc: "Input → Order → 校验 → 时间线执行 → Effect → Attribute → Cue" },
        { file: "effect-lifecycle.svg", title: "Effect 生命周期", desc: "Apply → Update → Lifetime → Expire → Cleanup → Publish 六阶段" },
        { file: "attribute-calculation.svg", title: "Attribute 计算链路", desc: "Mod → Calc → Sink → UI 的完整计算与汇出路径" },
        { file: "target-resolver.svg", title: "Target 解析器", desc: "Query → Filter → Dispatch 三层目标解析架构" }
      ]
    },
    {
      name: "ECS & Data Model", icon: "📦", color: "#5c7a8e",
      diagrams: [
        { file: "ecs-datamodel-ecs-hierarchy.svg", title: "ECS 层级结构", desc: "World → Entity → Component → System → Archetype 的完整层级" },
        { file: "ecs-datamodel-chunk-storage.svg", title: "Chunk SoA 存储", desc: "Chunk Header + ComponentArray 的内存布局细节" },
        { file: "ecs-datamodel-entity-lifecycle.svg", title: "Entity 生命周期", desc: "Create → Active → Destroy 的完整流程与分支判断" },
        { file: "ecs-datamodel-query-execution.svg", title: "Query 执行流程", desc: "System.Update → EntityQuery → Filter → Iterator 五步链" },
        { file: "ecs-datamodel-template-inheritance.svg", title: "EntityTemplate 继承", desc: "Base → Category → Concrete 三层继承与批量生成" }
      ]
    },
    {
      name: "Navigation & Movement", icon: "🧭", color: "#5c7a8e",
      diagrams: [
        { file: "nav-navigation-stack.svg", title: "导航技术栈", desc: "CDT → NavMesh → HPA → MassNav → ORCA/Sonar 五层架构" },
        { file: "nav-navmesh-baking.svg", title: "NavMesh 烘焙", desc: "Geometry → CDT → Polygon → Graph 的完整烘焙管线" },
        { file: "nav-pathfinding-flow.svg", title: "寻路流程", desc: "Query → HPA → Path → Smooth → Execute 的完整链路" },
        { file: "nav-avoidance-orca.svg", title: "ORCA 避障", desc: "Agent → Neighbor → VO → LP → New Velocity 的避障流程" },
        { file: "nav-mass-navigation.svg", title: "MassNavigation 架构", desc: "Runtime → 13 步仿真管线 → WorldPosition 的完整系统" },
        { file: "spatial-query-modes.svg", title: "空间查询模式", desc: "8 种查询模式（AABB/Radius/Cone/Rectangle/Line/Segment/Hex/Point）对比" },
        { file: "chunk-spatial-partition.svg", title: "Chunk 空间分区", desc: "World → Chunk → Cell → Entity 四级层级与查询执行" },
        { file: "hex-grid-coordinates.svg", title: "六边形坐标系", desc: "Axial/Cube/Pixel 转换与 Ring/Disk/Spiral 查询" }
      ]
    },
    {
      name: "Presentation & Rendering", icon: "🎨", color: "#8e6b5c",
      diagrams: [
        { file: "performer-lifecycle.svg", title: "Performer 生命周期", desc: "Definition → Compile → Bootstrap → Create → Update → Destroy" },
        { file: "performer-command-flow.svg", title: "PerformerCommand 流", desc: "Event → CommandBuffer → EmitSystem → EntityRuntime 的完整流" },
        { file: "behavior-activation.svg", title: "BehaviorSlot 激活", desc: "7 种行为（AssetBinding/Animator/Sound/Material/Spline/Grounding/MinimapMarker）" },
        { file: "presentation-pipeline.svg", title: "Presentation 渲染管线", desc: "Logic → 10 Phase → 8 Buffer → Platform → Screen" },
        { file: "minimap-architecture.svg", title: "Minimap 架构", desc: "Data → MarkerBuffer → Presentation → ScreenOverlay 的完整链路" },
        { file: "raylib-render-loop.svg", title: "Raylib 渲染循环", desc: "Input → Update → Draw → Swap 的环形管线" }
      ]
    },
    {
      name: "Modding & Configuration", icon: "🔧", color: "#8e7a5c",
      diagrams: [
        { file: "mod-loading-flow.svg", title: "Mod 加载流程", desc: "Discover → Resolve → Sort → Load → OnLoad 四阶段" },
        { file: "alc-isolation.svg", title: "ALC 隔离", desc: "Host App → ALC → 三层解析 → Mod Assembly Types" },
        { file: "vfs-hierarchy.svg", title: "VFS 层级", desc: "VirtualFileSystem → Mod → Path → Physical File 的挂载层级" },
        { file: "dependency-resolver.svg", title: "依赖解析", desc: "mod.json → DependencyResolver → 拓扑排序 → SemVer 匹配" },
        { file: "mod-extension-points.svg", title: "扩展点时序", desc: "IMod → OnLoad → 6 个扩展点的注册链路" }
      ]
    },
    {
      name: "GraphRuntime & Scripting", icon: "📜", color: "#8e6b8e",
      diagrams: [
        { file: "graph-vm-structure.svg", title: "GraphVM 结构", desc: "Instruction → Executor → Handler Table → Register 的 VM 架构" },
        { file: "graph-compiler-flow.svg", title: "GraphCompiler 编译", desc: "JSON → Validator → Compiler → Bytecode → Program 的完整流程" },
        { file: "opcode-taxonomy.svg", title: "OpCode 分类", desc: "133 个 OpCode 按 9 大类别网格展开" },
        { file: "graph-execution-loop.svg", title: "执行循环", desc: "GraphExecutor 38 行核心循环的展开流程图" }
      ]
    },
    {
      name: "Input & Interaction", icon: "🎮", color: "#7a6b8e",
      diagrams: [
        { file: "input-order-flow.svg", title: "Input → Order → Command", desc: "Raw Input → Adapter → Order → Command → GAS 的完整链路" },
        { file: "selection-state-machine.svg", title: "Selection 状态机", desc: "Empty/Single/Multi/Group/View/Formation 六状态与 13 条转换边" },
        { file: "interaction-modes.svg", title: "交互模式对比", desc: "SmartCast/AimCast/ContextScored/PressReleaseAimCast 四种模式" },
        { file: "input-systemgroup.svg", title: "Input 在 SystemGroup 中", desc: "Input Phase 在 10 个 Phase 中的位置与 8 步详细执行" }
      ]
    },
    {
      name: "Adapter & Platform", icon: "🔌", color: "#6b8e8e",
      diagrams: [
        { file: "adapter-comparison.svg", title: "三平台对比", desc: "Raylib / Web / UE5 的架构对比与 IAdapter 接口层" },
        { file: "web-streaming.svg", title: "Web 串流", desc: "Server → FrameProtocol → DeltaCompressor → WebSocket → Client" },
        { file: "adapter-sync.svg", title: "AdapterSync", desc: "Simulation → Presentation → Adapter 的同步机制与帧时间轴" }
      ]
    },
    {
      name: "Business Process", icon: "📋", color: "#5c6b8e",
      diagrams: [
        { file: "business-map-load-flow.svg", title: "地图加载", desc: "Launcher → Bootstrap → Mod → Map → Entity 的加载流程" },
        { file: "business-save-restore-flow.svg", title: "存档/读档", desc: "Save 与 Restore 的双流程对比与 .ldsave 格式" },
        { file: "business-web-client-flow.svg", title: "Web 客户端帧", desc: "Connect → Receive → Decode → Render → Input → Send" }
      ]
    },
    {
      name: "Registry & Dependencies", icon: "🔗", color: "#5c6b8e",
      diagrams: [
        { file: "registry-dependency.svg", title: "Registry 依赖网络", desc: "30+ 个注册表按 8 大子系统分类的依赖关系图" },
        { file: "registry-extension.svg", title: "Registry 扩展时序", desc: "ModLoader → ALC → IMod → Registry → GameEngine 的时序" },
        { file: "system-dependency-matrix.svg", title: "系统依赖矩阵", desc: "14×14 矩阵热力图，颜色深浅表示耦合强度" },
        { file: "module-coupling.svg", title: "模块耦合网络", desc: "14 个模块的力导向耦合图，粗线/暖色=高耦合" },
        { file: "call-graph.svg", title: "核心调用图", desc: "GameEngine.Tick() 经 7 个 Phase 到 20+ 子系统的调用链" }
      ]
    },
    {
      name: "Spatial & Vision", icon: "👁️", color: "#5c7a8e",
      diagrams: [
        { file: "vision-fog-flow.svg", title: "视野与迷雾", desc: "VisionEmitter → ChunkedField → FogLayer → Visual 的 6 阶段计算" }
      ]
    },
    {
      name: "Capability & Showcase", icon: "🏆", color: "#c45c3e",
      diagrams: [
        { file: "capability-matrix.svg", title: "Capability 矩阵", desc: "8 模块 × 4 成熟度等级的热力图" },
        { file: "showcase-topology.svg", title: "Showcase 拓扑", desc: "5 个演示套件与底层引擎能力的映射关系" }
      ]
    }
  ];

  /* ============ 渲染 ============ */
  function render() {
    var html = "";
    categories.forEach(function (cat, ci) {
      html += '<section class="category" data-cat="' + ci + '">';
      html += '<div class="category-header">' +
        '<div class="category-icon" style="background: ' + cat.color + '15; color: ' + cat.color + ';">' + cat.icon + "</div>" +
        "<h3>" + esc(cat.name) + "</h3>" +
        '<span class="count">' + cat.diagrams.length + " 张</span></div>";
      html += '<div class="diagram-grid">';
      cat.diagrams.forEach(function (d) {
        html += '<div class="card diagram-card" data-file="' + esc(d.file) + '" data-cat="' + ci + '">' +
          '<div class="title">' + esc(d.title) + "</div>" +
          '<div class="desc">' + esc(d.desc) + "</div>" +
          '<div class="preview"><img loading="lazy" src="diagrams/' + esc(d.file) + '" alt="' + esc(d.title) + '"></div>' +
          '<div class="tags"><span class="tag">' + esc(cat.name.split(" ")[0]) + "</span></div></div>";
      });
      html += "</div></section>";
    });
    document.getElementById("content").innerHTML = html;
  }

  /* ============ 全屏浮层 ============ */
  var overlay = document.getElementById("overlay");
  var overlayImg = document.getElementById("overlay-img");
  function openDiagram(file) {
    overlayImg.src = "diagrams/" + file;
    overlay.classList.add("active");
  }
  function closeOverlay() { overlay.classList.remove("active"); overlayImg.src = ""; }

  /* ============ 筛选 ============ */
  var state = { q: "", cat: null };
  function applyFilter() {
    var q = state.q.toLowerCase();
    document.querySelectorAll(".diagram-card").forEach(function (card) {
      var hitCat = state.cat === null || card.getAttribute("data-cat") === String(state.cat);
      var hitQ = !q || card.textContent.toLowerCase().indexOf(q) >= 0;
      card.classList.toggle("hidden-by-filter", !(hitCat && hitQ));
    });
    document.querySelectorAll(".category").forEach(function (sec) {
      var any = sec.querySelectorAll(".diagram-card:not(.hidden-by-filter)").length > 0;
      sec.classList.toggle("hidden-by-filter", !any);
    });
  }
  function buildCatChips() {
    var host = document.getElementById("cat-chips");
    host.innerHTML = categories.map(function (c, i) {
      return '<button class="chip" data-v="' + i + '">' + esc(c.name.split(" ")[0]) + "</button>";
    }).join("");
    host.addEventListener("click", function (e) {
      var chip = e.target.closest(".chip");
      if (!chip) return;
      var v = +chip.getAttribute("data-v");
      if (state.cat === v) {
        state.cat = null;
        chip.classList.remove("on");
      } else {
        state.cat = v;
        host.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("on"); });
        chip.classList.add("on");
      }
      applyFilter();
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    render();
    buildCatChips();

    document.getElementById("content").addEventListener("click", function (e) {
      var card = e.target.closest(".diagram-card");
      if (card) openDiagram(card.getAttribute("data-file"));
    });
    document.getElementById("overlay-close").addEventListener("click", closeOverlay);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) closeOverlay(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeOverlay(); });

    var q = document.getElementById("q");
    q.addEventListener("input", function () {
      state.q = q.value.trim();
      applyFilter();
    });
  });
})();
</script>
</body>
</html>
