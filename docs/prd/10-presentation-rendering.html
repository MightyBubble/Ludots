const mdContent = "# PRD-10: Presentation & Rendering（表现与渲染系统）\n\n> 版本：基于 Stage 1 扫描报告（`report_Presentation_UI.md`）\n> 关联模块：`src/Core/Presentation/`、`src/Core/UI/`、`src/Core/Tweening/`\n\n---\n\n## 1. 功能概述\n\nPresentation & Rendering 子系统是 Ludots 引擎的**表现层与 UI 层**，负责将逻辑层（Gameplay / GAS / Navigation）的纯数据状态转化为可渲染、可交互的视听输出。该子系统的核心设计哲学是：\n\n1. **逻辑层零平台依赖**：Core 不引用任何图形 API、窗口系统或浏览器引擎，只输出平台无关的\"渲染意图\"（draw buffers、proxy、event stream）。\n2. **Performer-as-Actor**：以 `PerformerDefinition` + `BehaviorSlot` 组合模型取代旧的扁平 `VisualTemplate`/`Prefab` 系统，实现树形层级、行为驱动、参数黑板继承。\n3. **三层 UI 体系**：高性能批量 HUD（Core Presentation batch buffer）→ 原生 Retained UI（`Ludots.UI` Skia 渲染）→ 真 Web App（`Ludots.UI.Browser` CEF/Ultralight 嵌入）。\n4. **Surface 所有权唯一化**：`UiSurfaceHost` 是唯一能写 `UIRoot.Scene` 的组件，杜绝多控制器堆叠场景的混乱。\n\n该模块文件量庞大（`src/Core/Presentation/` 下超过 100 个 `.cs` 文件），核心脉络为：**事件流 → 规则系统 → 命令缓冲 → 运行时系统 → 发射系统 → 请求刷新 → 平台适配器消费**。\n\n---\n\n## 2. 目标用户\n\n| 用户角色 | 使用场景 |\n|----------|----------|\n| **Mod 作者** | 定义 `PerformerDefinition` JSON、配置 BehaviorSlot、绑定资产与动画 |\n| **表现层开发者** | 实现平台适配器（Raylib / UE5 / Web），消费 draw buffers 和 visual proxies |\n| **UI 开发者** | 通过 `IUiSurfaceHost` 贡献 UI 片段，实现 `IEntityCommandPanelSource` 自定义面板数据源 |\n| **特效设计师** | 配置 Spline Ribbon、Ground Overlay、Minimap Marker 等视觉元素 |\n| **Gameplay 设计师** | 通过黑板参数驱动 Performer 行为切换（如技能释放时的材质变化） |\n\n---\n\n## 3. 使用场景\n\n### 场景 A：单位生成与视觉表现\nECS 实体生成事件 → `PresentationEntityLifecycleSystem` → `CompiledPerformerBootstrapRegistry` 匹配规则 → `PerformerRuleSystem` 创建 `PerformerCommand` → `PerformerRuntimeSystem` 实例化 performer 树 → `PerformerBehaviorSystem` 激活 `AssetBinding` + `Animator` behavior → `PerformerEmitSystem` 输出 `PresentationVisualProxy` → 平台适配器消费 proxy 创建 mesh / skinned mesh / surface。\n\n### 场景 B：选择高亮与 HUD\n玩家框选单位 → `SelectionRuntime` 变更 → `SelectionPresentationEventSystem` 生成 `SelectionMemberAdded` / `SelectionMemberRemoved` 事件 → `PerformerRuleSystem` 匹配规则 → `PerformerRuntimeSystem` 设置 `SelectionHighlight` 参数 → `PerformerBehaviorSystem` 切换 Material behavior → `PerformerEmitSystem` 输出带颜色变化的 visual proxy。\n\n同时，`WorldHudBatchBuffer` 接收选中单位的生命条数据 → `WorldHudToScreenSystem` 投影到屏幕空间 → `ScreenHudBatchBuffer` 输出 bar + text → 适配器绘制。\n\n### 场景 C：Surface 与 UI 渲染\nMod 控制器通过 `Acquire` 租约向 `UiSurfaceHost` 贡献 `UiSurfaceContribution` → `UiSurfaceHost` 按 Segment / Priority / Exclusive 合成一棵 `UiScene` → `UIRoot` 标记 `IsDirty` → 适配器（Raylib: `RaylibOverlayCompositor` / Web: `WebUiRuntimeBridge`）检测到脏标记后消费 `UiScene` → 渲染 UI 层。\n\n---\n\n![Performer 生命周期](diagrams/performer-lifecycle.svg)\n\n## 4. 核心能力\n\n### 4.1 Performer 表现系统（Performer-as-Actor）\n\n![PerformerCommand 流](diagrams/performer-command-flow.svg)\n\n`PerformerDefinition`（`src/Core/Presentation/Performers/PerformerDefinition.cs`）是声明式 performer 定义，包含 children、behaviors、rules、bindings、paramDefaults、visibility condition。取代旧的 `Prefab` / `VisualTemplate` 系统。\n\n**BehaviorSlot**（`src/Core/Presentation/Performers/BehaviorSlot.cs`）定义行为组合单元，支持以下行为种类：\n\n| `BehaviorKind` | 值 | 说明 |\n|---------------|-----|------|\n| `AssetBinding` | 1 | 资产绑定（Mesh / Billboard / Procedural） |\n| `Animator` | 4 | 动画状态机驱动 |\n| `Sound` | 6 | 音效触发 |\n| `Material` | 7 | 材质参数驱动 / swap |\n| `Spline` | 8 | 样条曲线（Ribbon / 轨迹） |\n| `Grounding` | 9 | 地形贴附（Y 高度采样） |\n| `MinimapMarker` | 10 | 小地图标记 |\n\n**AssetBindingConfig** 定义资产绑定的完整参数：AssetKind、AssetId、MaterialId、RenderPath、LocalOffset/Rotation/Scale，以及参数驱动的 swap/visibility/color 变化。\n\n**Performer 命令缓冲**：`PerformerCommand`（`src/Core/Presentation/Performers/PerformerCommand.cs`）定义 6 种命令：\n- `Create` / `Destroy` / `DestroyScopedPerformer`\n- `SetParam`（写入 `PerformerFloatParams` / `IntParams` / `VectorParams` ECS 组件，父→子继承）\n- `ActivateBehavior` / `DeactivateBehavior`（翻转 behavior mask）\n\n`PerformerCommandBuffer`（`src/Core/Presentation/Performers/PerformerCommandBuffer.cs`）是固定容量环形缓冲，溢出时丢弃并计数。\n\n**Performer 运行时**：`PerformerEntityRuntime`（`src/Core/Presentation/Performers/PerformerEntityRuntime.cs`）是核心运行时，管理 performer 实例树、StableId 分配、行为激活位、参数传播、父子层级索引。\n\n**注册表**：`PerformerDefinitionRegistry`（String→Int）含 `CompiledPerformerBootstrapRegistry` 自动重建规则索引（`EntitySpawned` / `EntityDestroyed` → `Create` / `Destroy` 规则）。\n\n### 4.2 命令缓冲与事件流\n\n![BehaviorSlot 激活](diagrams/behavior-activation.svg)\n\n**事件流**：`PresentationEventStream`（`src/Core/Presentation/Events/PresentationEventStream.cs`）是固定容量事件流缓冲，规则系统消费后清空。`PresentationEventKind`（`src/Core/Presentation/Events/PresentationEventKind.cs`）定义事件种类：\n\n| 事件种类 | 说明 |\n|----------|------|\n| `GameplayEvent` | Gameplay 层通用事件 |\n| `TagEffectiveChanged` | Gameplay Tag 生效状态变化 |\n| `EntitySpawned` / `EntityDestroyed` | 实体生命周期 |\n| `PerformerCreated` / `PerformerDestroyed` | Performer 生命周期 |\n| `EffectApplied` / `CastCommitted` | GAS 效果/施法 |\n| `GlobalDayNight` / `GlobalRegionChanged` / `GlobalWeather` | 全局环境变化 |\n| `AttributeValueChanged` | 属性值变化 |\n| `SelectionMemberAdded` / `SelectionMemberRemoved` | 选择变化 |\n\n**Owner 变化缓冲**：`PresentationOwnerChangeBuffer` 每帧投影 owner tag/attribute 变化位索引。`GlobalPresentationEventBuffer` 缓存全局事件（日/夜/区域/天气）。\n\n### 4.3 Surface 与 UI 体系\n\n![Presentation 渲染管线](diagrams/presentation-pipeline.svg)\n\nLudots 采用三层 UI 体系，Core 只暴露最小接口：\n\n| 层级 | 技术 | 核心接口 | 用途 |\n|------|------|----------|------|\n| 批量 HUD | Core Presentation SoA buffer | `WorldHudBatchBuffer` / `ScreenHudBatchBuffer` | 高性能血条、伤害数字、状态图标 |\n| Retained UI | Skia | `IUiRenderer` / `IUiSystem` | 原生命令面板、对话框、血条框架 |\n| Web App | CEF / Ultralight | `IBrowserRuntime` / `IBrowserMessageBridge` | 复杂 UI（背包、商店、技能树） |\n\n**Surface 所有权模型**：`UiSurfaceHost` 是唯一能写 `UIRoot.Scene` 的组件。Mod / 控制器 / Showcase 通过 `Acquire` 租约贡献 `UiSurfaceContribution`，`UiSurfaceHost` 按 Segment / Priority / Exclusive 合成一棵 `UiScene`。`UIRoot` 作为渲染 + 输入端口，通过 `IUiRenderer`（Skia 实现）绘制 `UiScene`，并通过 `HandleInput` 处理 PointerEvent / KeyboardEvent。\n\n> **注意**：`IUiSystem`（`src/Core/UI/IUiSystem.cs`）仅定义 `SetHtml(string html, string css)`，是 Core 暴露的最小 UI 接口。完整的 Markup 写法 UI 系统在 `Ludots.UI.HtmlEngine` 中，不在 Core。\n\n**EntityCommandPanel**：`IEntityCommandPanelService`（`src/Core/UI/EntityCommandPanels/EntityCommandPanelContracts.cs`）定义实体命令面板服务：Open / Close / SetVisible / RebindTarget / SetGroupIndex / CycleGroup / SetAnchor / SetSize / TryGetState。`IEntityCommandPanelSource` 提供数据源（TryGetRevision / GetGroupCount / TryGetGroup / CopySlots），`IEntityCommandPanelActionSource` 处理槽位激活（ActivateSlot）。`EntityCommandPanelSlotView` 定义槽位视图：SlotIndex / AbilityId / StateFlags / Cooldown / Charges / DisplayLabel / DetailLabel / ActionId。\n\n### 4.4 渲染输出\n\n![Minimap 架构](diagrams/minimap-architecture.svg)\n\n**Visual Proxy**：`PresentationVisualProxy`（`src/Core/Presentation/Rendering/PresentationVisualProxy.cs`）是适配器消费的核心单位，包含 Payload + ProxyKind + Mobility + Flags + LOD。`VisualRenderPath`（`src/Core/Presentation/Components/VisualRenderPath.cs`）定义渲染通道：\n\n| 渲染通道 | 说明 |\n|----------|------|\n| `StaticMesh` | 静态网格 |\n| `InstancedStaticMesh` | 实例化静态网格 |\n| `HierarchicalInstancedStaticMesh` | 层级实例化静态网格 |\n| `SkinnedMesh` | 蒙皮网格 |\n| `GpuSkinnedInstance` | GPU 蒙皮实例 |\n| `Surface` | Surface 渲染 |\n\n`VisualRenderPayload`（`src/Core/Presentation/Rendering/VisualRenderPayload.cs`）是 13 字段公共渲染载荷：MeshAssetId / Position / Rotation / Scale / Color / StableId / MaterialId / TemplateId / AnimationProfileId / RenderPath / Animator / AnimationOverlay / Visibility。\n\n**Draw Buffers**：\n- `PrimitiveDrawBuffer`：调试图元输出（线、圆、框）。\n- `GroundOverlayBuffer`：地面叠加绘制输出。\n- `SkinnedVisualBatchBuffer`：蒙皮网格批次缓冲。\n- `StableDrawCache`：Retained 静态内容缓存，支持增量投影。\n\n### 4.5 HUD / Minimap / Camera\n\n**World HUD**：`WorldHudBatchBuffer`（`src/Core/Presentation/Hud/WorldHudBatchBuffer.cs`）是世界空间 HUD 批量缓冲（SoA，retained index by StableId，owner group）。`ScreenHudBatchBuffer`（`src/Core/Presentation/Hud/ScreenHudBatchBuffer.cs`）是屏幕空间 HUD 缓冲：bar + text 双通道，支持增量投影、position-only delta。\n\n`WorldHudToScreenSystem`（`src/Core/Presentation/Systems/WorldHudToScreenSystem.cs`）将 WorldHud 投影到屏幕空间，含相机视锥裁剪、选中项优化、密度跳过。支持 retained 投影：content revision 不变时只投影位置变化。\n\n**Minimap**：`MinimapPresentationSystem`（`src/Core/Presentation/Minimap/MinimapPresentationSystem.cs`）刷新 marker buffer 并渲染到 ScreenOverlayBuffer。`MinimapRuntime`（`src/Core/Presentation/Minimap/MinimapRuntime.cs`）管理缩放/平移/旋转/预设跟随相机/点击跳转。`MinimapMarkerBuffer`（SoA）和 `MinimapScreenMarkerBuffer`（含 bucket key 分组）是核心缓冲。`MinimapInputConsumer` 处理 toggle / zoom / pan / center / click-to-world。\n\n**Camera**：`CameraPresenter`（`src/Core/Presentation/Camera/CameraPresenter.cs`）将逻辑相机插值到渲染相机，输出 `CameraRenderState3D`。`ICameraAdapter`（`src/Core/Presentation/Camera/ICameraAdapter.cs`）是平台相机适配接口：`UpdateCamera(in CameraRenderState3D)`。`CoreScreenProjector`（`src/Core/Presentation/Camera/CoreScreenProjector.cs`）提供世界→屏幕投影，含 VP 矩阵缓存和 revision 追踪。\n\n### 4.6 Instancing 与 Surface\n\n**Instancing**：`InstancedBatchAssetRegistry`（String→Int）管理实例化批次资产。`InstancedBatchOperationBuffer`（add/remove/update）和 `InstancedBatchSubmissionRuntime` 完成批次提交。\n\n**Surface**：`SurfaceSourcePayloadRegistry`（`src/Core/Presentation/Surfaces/SurfaceSourcePayloadRegistry.cs`）按 scopeId 存储 Surface 载荷（SplineRibbon / ClosedArea / RawProceduralMesh）。`SurfaceSourceRuntimeRegistry` 管理运行时状态。`SurfaceSourceFlushSystem` / `SurfaceSourceLifecycleSystem` 负责刷新与生命周期管理。\n\n### 4.7 Tweening（补间动画）\n\n`TweenTrack<T>`（`src/Core/Tweening/TweenTrack.cs`）是泛型补间轨道，提供 `Snap` / `Start` / `Retarget` / `Tick` 操作，支持委托插值器。`TweenEasing`（`src/Core/Tweening/TweenEasing.cs`）定义缓动枚举：`Cut` / `Linear` / `SmoothStep`。`TweenEasingUtil` 提供缓动求值工具。`TweenProgress` 是补间进度结构体（Start / Tick / Complete）。\n\n> **注意**：`Tweening` 模块极轻量（仅 3 个文件），无 ECS 集成、无 System，文档中未提及该模块。当前可能作为工具库使用，未纳入主循环。\n\n---\n\n## 5. 输入 / 输出\n\n### 5.1 输入\n\n| 输入 | 来源 | 说明 |\n|------|------|------|\n| `GameplayEventBus` / `GameplayTagEffectiveChangedBits` / `GameplayAttributeChangedBits` | GAS / Gameplay | 逻辑层事件与状态变化 |\n| `WorldPositionCm` / `PreviousWorldPositionCm` | ECS World | 逻辑位置（定点数厘米） |\n| `SelectionRuntime` 变化 | 输入系统 | 选择集变化 |\n| 全局事件（日/夜/区域/天气） | 环境系统 | `GlobalPresentationEventBuffer` |\n| `PerformerDefinition` JSON | Mod / 配置 | 声明式 performer 定义 |\n| 相机状态 | Camera 系统 | 分辨率 / FOV / AspectRatio |\n\n### 5.2 输出\n\n| 输出 | 消费者 | 说明 |\n|------|--------|------|\n| `PresentationVisualProxy` | 平台适配器 | 视觉代理（Payload + ProxyKind + LOD） |\n| `PrimitiveDrawBuffer` | 平台适配器 | 调试图元 |\n| `GroundOverlayBuffer` | 平台适配器 | 地面叠加 |\n| `WorldHudBatchBuffer` / `ScreenHudBatchBuffer` | 平台适配器 | HUD 批量绘制数据 |\n| `MinimapScreenMarkerBuffer` | 平台适配器 | 小地图屏幕标记 |\n| `SoundRequestBuffer` | 音频系统 | 音效请求 |\n| `UiScene` | `IUiRenderer` | UI 场景树 |\n| `CameraRenderState3D` | `ICameraAdapter` | 渲染相机状态 |\n\n---\n\n## 6. 依赖关系\n\n| 依赖模块 | 依赖类型 | 说明 |\n|----------|----------|------|\n| **GAS / Gameplay** | 强依赖 | `GameplayPresentationProjectionSystem` 消费 GAS 事件；`PerformerBehaviorSystem` 读取 tag/attribute 驱动 behavior |\n| **Input / Selection** | 强依赖 | `SelectionPresentationEventSystem` 消费选择变化；`ResponseChain*` 系列处理输入→UI→命令链路 |\n| **Navigation / MassNavigation** | 强依赖 | `WorldToVisualSyncSystem` 读取 `WorldPositionCm`；`TerrainHeightSyncSystem` 从 `IVisualHeightmap` 采样 |\n| **Map / Board** | 弱依赖 | `IVisualHeightmap` 提供地形高度；`TerrainHeightSyncSystem` 贴附地形 |\n| **Platform Adapter** | 消费端 | Raylib / UE5 / Web 适配器消费 draw buffers 和 proxies |\n\n---\n\n## 7. 非功能需求\n\n| 需求项 | 目标 | 验证方式 |\n|--------|------|----------|\n| **性能** | 数千 visual proxy 每帧稳定输出 | `PerformerEmitSystem` 的静态 visual fast path 只 emit dirty-only；`StableDrawCache` 增量投影 |\n| **内存效率** | 零 GC 分配（固定步长） | 全部使用 SoA 缓冲和固定容量数组 |\n| **平台无关性** | Core 不引用任何图形 API | 仅输出 draw buffers / proxies / event streams |\n| ** retained 投影效率** | UI / HUD 内容不变时只更新位置 | `WorldHudToScreenSystem` 的 retained build + position-only delta |\n| **LOD 支持** | 相机距离裁剪 + 密度控制 | `CameraCullingRuntimeConfig`（High/Medium/Low 距离配置）+ `WorldHudToScreenSystem` 密度跳过 |\n| **UI 合成正确性** | 无多写冲突 | `UiSurfaceHost` 唯一写者 + 租约模型 |\n\n---\n\n## 8. 关键类清单\n\n### 8.1 Performer 核心\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `PerformerDefinition` | `src/Core/Presentation/Performers/PerformerDefinition.cs` | 声明式 performer 定义 |\n| `BehaviorSlot` | `src/Core/Presentation/Performers/BehaviorSlot.cs` | 行为组合单元 |\n| `BehaviorKind` | `src/Core/Presentation/Performers/BehaviorSlot.cs` | 行为种类枚举 |\n| `AssetBindingConfig` | `src/Core/Presentation/Performers/BehaviorSlot.cs` | 资产绑定配置 |\n| `PerformerCommand` | `src/Core/Presentation/Performers/PerformerCommand.cs` | 命令 DTO（Create/Destroy/SetParam/Activate/Deactivate） |\n| `PerformerCommandKind` | `src/Core/Presentation/Performers/PerformerCommandKind.cs` | 命令种类枚举 |\n| `PerformerCommandBuffer` | `src/Core/Presentation/Performers/PerformerCommandBuffer.cs` | 固定容量环形命令缓冲 |\n| `PerformerEntityRuntime` | `src/Core/Presentation/Performers/PerformerEntityRuntime.cs` | 核心运行时：实例树 + StableId + 参数传播 |\n| `PerformerDefinitionRegistry` | `src/Core/Presentation/Performers/PerformerDefinitionRegistry.cs` | String→Int 注册表 |\n| `CompiledPerformerBootstrapRegistry` | `src/Core/Presentation/Performers/CompiledPerformerBootstrapRegistry.cs` | 编译时 bootstrap 规则索引 |\n| `ChildPerformerRef` | `src/Core/Presentation/Performers/PerformerDefinition.cs` | 子 performer 引用 |\n| `ParamDefault` | `src/Core/Presentation/Performers/PerformerDefinition.cs` | 参数默认值 |\n| `ConditionRef` | `src/Core/Presentation/Performers/ConditionRef.cs` | 规则条件引用 |\n\n### 8.2 事件流\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `PresentationEvent` | `src/Core/Presentation/Events/PresentationEvent.cs` | 事件 DTO |\n| `PresentationEventKind` | `src/Core/Presentation/Events/PresentationEventKind.cs` | 事件种类枚举 |\n| `PresentationEventStream` | `src/Core/Presentation/Events/PresentationEventStream.cs` | 固定容量事件流缓冲 |\n| `PresentationOwnerChangeBuffer` | `src/Core/Presentation/Events/PresentationOwnerChangeBuffer.cs` | Owner 变化位投影索引 |\n| `GlobalPresentationEventBuffer` | `src/Core/Presentation/Events/GlobalPresentationEventBuffer.cs` | 全局事件缓冲 |\n\n### 8.3 渲染输出\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `PresentationVisualProxy` | `src/Core/Presentation/Rendering/PresentationVisualProxy.cs` | 视觉代理（适配器消费核心单位） |\n| `VisualRenderPath` | `src/Core/Presentation/Components/VisualRenderPath.cs` | 渲染通道枚举 |\n| `VisualRenderPathSemantics` | `src/Core/Presentation/Components/VisualRenderPath.cs` | 渲染通道扩展方法 |\n| `VisualRenderPayload` | `src/Core/Presentation/Rendering/VisualRenderPayload.cs` | 13 字段公共渲染载荷 |\n| `PrimitiveDrawBuffer` | `src/Core/Presentation/Rendering/PrimitiveDrawBuffer.cs` | 调试图元输出 |\n| `GroundOverlayBuffer` | `src/Core/Presentation/Rendering/GroundOverlayBuffer.cs` | 地面叠加绘制输出 |\n| `SkinnedVisualBatchBuffer` | `src/Core/Presentation/Rendering/SkinnedVisualBatchBuffer.cs` | 蒙皮网格批次缓冲 |\n| `StableDrawCache` | `src/Core/Presentation/Rendering/StableDrawCache.cs` | Retained 静态内容缓存 |\n| `PresentationTargetGeneration` | `src/Core/Presentation/Rendering/PresentationTargetGeneration.cs` | Adapter target 生命周期 generation 信号 |\n\n### 8.4 HUD / Minimap / Camera\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `WorldHudBatchBuffer` | `src/Core/Presentation/Hud/WorldHudBatchBuffer.cs` | 世界空间 HUD 批量缓冲 |\n| `ScreenHudBatchBuffer` | `src/Core/Presentation/Hud/ScreenHudBatchBuffer.cs` | 屏幕空间 HUD 缓冲 |\n| `WorldHudToScreenSystem` | `src/Core/Presentation/Systems/WorldHudToScreenSystem.cs` | WorldHud → Screen HUD 投影 |\n| `MinimapPresentationSystem` | `src/Core/Presentation/Minimap/MinimapPresentationSystem.cs` | 小地图系统 |\n| `MinimapRuntime` | `src/Core/Presentation/Minimap/MinimapRuntime.cs` | 小地图运行时（缩放/平移/旋转） |\n| `MinimapMarkerBuffer` | `src/Core/Presentation/Minimap/MinimapMarkerBuffer.cs` | 小地图 marker SoA 缓冲 |\n| `MinimapScreenMarkerBuffer` | `src/Core/Presentation/Minimap/MinimapScreenMarkerBuffer.cs` | 屏幕 marker 缓冲 |\n| `CameraPresenter` | `src/Core/Presentation/Camera/CameraPresenter.cs` | 逻辑相机 → 渲染相机插值 |\n| `ICameraAdapter` | `src/Core/Presentation/Camera/ICameraAdapter.cs` | 平台相机适配接口 |\n| `IViewController` | `src/Core/Presentation/Camera/IViewController.cs` | 视图控制器接口 |\n| `CoreScreenProjector` | `src/Core/Presentation/Camera/CoreScreenProjector.cs` | 核心屏幕投影器 |\n\n### 8.5 Surface 与 Instancing\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `SurfaceSourcePayloadRegistry` | `src/Core/Presentation/Surfaces/SurfaceSourcePayloadRegistry.cs` | Surface 载荷注册表 |\n| `SurfaceSourceRuntimeRegistry` | `src/Core/Presentation/Surfaces/SurfaceSourceRuntimeRegistry.cs` | Surface 运行时注册表 |\n| `InstancedBatchAssetRegistry` | `src/Core/Presentation/Instancing/InstancedBatchAssetRegistry.cs` | 实例化批次资产注册表 |\n| `InstancedBatchAsset` | `src/Core/Presentation/Instancing/InstancedBatchAsset.cs` | 实例化批次资产定义 |\n| `InstancedBatchOperationBuffer` | `src/Core/Presentation/Instancing/InstancedBatchOperationBuffer.cs` | 实例化批次操作缓冲 |\n| `InstancedBatchSubmissionRuntime` | `src/Core/Presentation/Instancing/InstancedBatchSubmissionRuntime.cs` | 实例化批次提交运行时 |\n\n### 8.6 资产注册表\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `PrefabRegistry` | `src/Core/Presentation/Assets/PrefabRegistry.cs` | 预制体注册表（legacy） |\n| `MeshAssetRegistry` | `src/Core/Presentation/Assets/MeshAssetRegistry.cs` | 网格资产注册表 |\n| `PresentationMaterialRegistry` | `src/Core/Presentation/Assets/PresentationMaterialRegistry.cs` | 表现材质注册表 |\n| `AnimatorControllerRegistry` | `src/Core/Presentation/Assets/AnimatorControllerRegistry.cs` | 动画控制器注册表 |\n| `AnimationProfileRegistry` | `src/Core/Presentation/Assets/AnimationProfileRegistry.cs` | 动画剪辑绑定注册表 |\n| `PresentationBehaviorRegistry` | `src/Core/Presentation/Assets/PresentationBehaviorRegistry.cs` | 表现行为注册表（legacy） |\n\n> **遗留代码**：`PrefabRegistry`、`PresentationBehaviorRegistry` 等文件在 `gitbook/architecture/performer-legacy-consolidation.md` 中已标记为删除，但代码中仍存在。`PerformerDefinition` 已全面取代旧系统，但遗留文件可能仍有运行时依赖，需确认后彻底移除。\n\n### 8.7 UI\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `IUiSystem` | `src/Core/UI/IUiSystem.cs` | 极简 UI 系统接口：`SetHtml` |\n| `EntityCommandPanelHandle` | `src/Core/UI/EntityCommandPanels/EntityCommandPanelContracts.cs` | Slot + Generation 句柄 |\n| `IEntityCommandPanelService` | `src/Core/UI/EntityCommandPanels/EntityCommandPanelContracts.cs` | 实体命令面板服务 |\n| `IEntityCommandPanelSource` | `src/Core/UI/EntityCommandPanels/EntityCommandPanelContracts.cs` | 面板数据源接口 |\n| `IEntityCommandPanelActionSource` | `src/Core/UI/EntityCommandPanels/EntityCommandPanelContracts.cs` | 面板动作源接口 |\n| `EntityCommandPanelSlotView` | `src/Core/UI/EntityCommandPanels/EntityCommandPanelContracts.cs` | 槽位视图 |\n| `EntityCommandPanelSourceDispatch` | `src/Core/UI/EntityCommandPanels/EntityCommandPanelContracts.cs` | 静态分发助手 |\n\n### 8.8 Tweening\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `TweenTrack<T>` | `src/Core/Tweening/TweenTrack.cs` | 泛型补间轨道 |\n| `TweenEasing` | `src/Core/Tweening/TweenEasing.cs` | 缓动枚举：Cut / Linear / SmoothStep |\n| `TweenEasingUtil` | `src/Core/Tweening/TweenEasing.cs` | 缓动求值工具 |\n| `TweenProgress` | `src/Core/Tweening/TweenEasing.cs` | 补间进度结构体 |\n\n### 8.9 运行时 System（Presentation Phase）\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `PresentationFrameSetupSystem` | `src/Core/Presentation/Systems/PresentationFrameSetupSystem.cs` | 插值 alpha 计算，帧状态单例 |\n| `PresentationEntityLifecycleSystem` | `src/Core/Presentation/Systems/PresentationEntityLifecycleSystem.cs` | 实体 spawn/destroy → 事件流 + bootstrap |\n| `WorldToVisualSyncSystem` | `src/Core/Presentation/Systems/WorldToVisualSyncSystem.cs` | 逻辑位置插值到 VisualTransform |\n| `TerrainHeightSyncSystem` | `src/Core/Presentation/Systems/TerrainHeightSyncSystem.cs` | 地形高度贴附 |\n| `GameplayPresentationProjectionSystem` | `src/Core/Presentation/Systems/GameplayPresentationProjectionSystem.cs` | Gameplay/GAS 事件 → PresentationEventStream |\n| `SelectionPresentationEventSystem` | `src/Core/Presentation/Systems/SelectionPresentationEventSystem.cs` | 选择变化 → 事件流 |\n| `GlobalPresentationEventProjectionSystem` | `src/Core/Presentation/Systems/GlobalPresentationEventProjectionSystem.cs` | 全局事件 → 事件流 |\n| `PerformerRuleSystem` | `src/Core/Presentation/Systems/PerformerRuleSystem.cs` | 事件 × 规则 → 命令缓冲 |\n| `PerformerRuntimeSystem` | `src/Core/Presentation/Systems/PerformerRuntimeSystem.cs` | 命令消费、实例生命周期、参数写入 |\n| `PerformerBehaviorSystem` | `src/Core/Presentation/Systems/PerformerBehaviorSystem.cs` | 行为驱动：AttributeBinding / TagBinding / Material / Animator / Sound / Spline / Grounding / Attachment |\n| `PerformerEmitSystem` | `src/Core/Presentation/Systems/PerformerEmitSystem.cs` | 资产发射 → draw buffers / proxy / snapshot |\n| `PerformerMinimapMarkerSystem` | `src/Core/Presentation/Systems/PerformerMinimapMarkerSystem.cs` | MinimapMarker → marker buffer |\n| `PerformerEntityTransformSyncSystem` | `src/Core/Presentation/Systems/PerformerEntityTransformSyncSystem.cs` | Owner entity transform → performer transform |\n| `AnimatorRuntimeSystem` | `src/Core/Presentation/Systems/AnimatorRuntimeSystem.cs` | 动画状态机推进 |\n| `PresentationRequestFlushSystem` | `src/Core/Presentation/Requests/PresentationRequestFlushSystem.cs` | 请求缓冲刷新 → 各类 draw buffer |\n| `SurfaceSourceFlushSystem` | `src/Core/Presentation/Systems/SurfaceSourceFlushSystem.cs` | Surface 载荷刷新 |\n| `SurfaceSourceLifecycleSystem` | `src/Core/Presentation/Systems/SurfaceSourceLifecycleSystem.cs` | Surface 运行时生命周期 |\n\n---\n\n*本章完*\n";
function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
