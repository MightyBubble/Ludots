const mdContent = "# 存档系统（Persistence）\n\n## 1. 功能概述\n\nLudots 的存档系统提供**完整的世界状态捕获与恢复能力**，覆盖 ECS 世界（通过 `Arch.Persistence` 二进制序列化）和非 ECS 域（通过 `ISaveParticipant` 接口）。存档以 `.ldsave` 单文件容器格式存储，包含 `header.json`（元数据）、`domains.json`（非 ECS 域状态）和 `world.bin`（ECS 世界二进制快照）三段内容，并带有 SHA-256 校验。整个系统遵循 fail-fast 原则：读档时严格校验存档头与当前引擎/Mod 的兼容性，任何不匹配都拒绝加载。\n\n存档系统的设计目标包括：\n- **完整性**：捕获 ECS 世界的全部实体、组件和关系，以及非 ECS 域（如叙事变量、库存、关系网络、时间流）的状态。\n- **版本安全**：存档头包含 `schemaVersion`、`modSetHash`、`registryFingerprint`、`engineVersion`，确保存档与引擎版本兼容。\n- **引用完整性**：`SaveEntityReferenceValidator` 校验 entity ref 不指向缺失或被排除的实体。\n- **参与者扩展**：通过 `ISaveParticipant` 接口，任何玩法系统都可以将其非 ECS 状态参与存档。\n\n## 2. 目标用户\n\n- **Gameplay 开发者**：需要实现 `ISaveParticipant` 接口，将自定义系统的非 ECS 状态参与存档。\n- **Mod 作者**：需要理解存档格式和 `ISaveParticipant` 的契约，确保 Mod 添加的非 ECS 状态不会在读档时丢失。\n- **工具开发者**：需要解析 `.ldsave` 文件格式，独立读取存档的 `header.json` 和 `domains.json`。\n- **引擎开发者**：需要理解 `WorldSnapshotService` 的捕获流程、`LudotsBinaryWorldSerializer` 的序列化机制和 `SaveContainerCodec` 的编码格式。\n\n## 3. 使用场景\n\n- **手动存档**：玩家触发存档操作 → `SaveContextFactory.Create()` → `WorldSnapshotService.Capture()` → `SaveSlotStore.Write(slot, snapshot)` → 生成 `.ldsave` 文件。\n- **自动存档**：引擎在 `ClearPresentationFlags` phase 后自动触发 `SaveSnapshotBoundary.CleanAfter()` → `WorldSnapshotService.Capture()` → `SaveSlotStore.Write(\"autosave\", ...)`。\n- **读档**：玩家选择存档槽 → `SaveSlotStore.ReadSlot()` → `SaveContainerCodec.Decode()` → `SaveContextValidator.Validate()` → `WorldRestoreService.Restore()` → 各 `ISaveParticipant` 恢复状态。\n- **Mod 状态存档**：Mod 在 `OnLoad` 中注册 `ISaveParticipant` 到 `SaveParticipantRegistry`，其 `CaptureState()` 和 `RestoreState()` 方法在存档/读档时自动调用。\n- **跨版本兼容性检查**：读档时 `SaveContextValidator` 比较存档头的 `modSetHash` 和 `registryFingerprint` 与当前引擎，不匹配时拒绝加载。\n\n## 4. 核心能力\n\n### 4.1 SaveSlot — 存档槽位\n\n`SaveSlotStore` 提供槽位语义：\n\n```csharp\npublic class SaveSlotStore\n{\n    // 槽位路径：saves/{kind}/{name}.ldsave\n    // kind: \"manual\", \"autosave\", \"quicksave\"\n    // 原子写入：temp + commit\n    // autosave 保留策略：保留最近 N 个自动存档\n}\n```\n\n**关键文件**：`src/Core/Persistence/SaveSlotStore.cs`。\n\n### 4.2 WorldSnapshot — 世界快照\n\n`WorldSnapshotService` 负责捕获和恢复世界快照：\n\n```csharp\npublic class WorldSnapshotService\n{\n    // 捕获\n    SaveContext Capture(GameEngine engine, SaveSnapshotBoundary boundary);\n\n    // 恢复\n    void Restore(GameEngine engine, SaveContext snapshot);\n}\n```\n\n捕获流程：\n\n```\nSaveSnapshotBoundary.CleanAfter(SystemGroup.ClearPresentationFlags)\n     ↓\nWorldSnapshotService.Capture(engine, boundary)\n     ↓\n  ├── SaveContextFactory.Capture(engine) → header.json\n  │   ├── schemaVersion\n  │   ├── modSetHash（当前加载的 Mod 集合哈希）\n  │   ├── registryFingerprint（注册表指纹）\n  │   ├── mapId\n  │   ├── tick（当前仿真 tick）\n  │   └── engineVersion\n  ├── SaveParticipantRegistry.CaptureDomains() → domains.json\n  │   └── 遍历所有已注册的 ISaveParticipant，调用 CaptureState()\n  └── LudotsBinaryWorldSerializer.Serialize(world) → world.bin\n       ├── 过滤排除的实体（SaveExcludedTag / GameplayEvent / SimulationBudgetFuseEvent / PresentationDestroyPending）\n       ├── CloneIncludedWorld（克隆需存档的世界）\n       ├── SaveEntityReferenceValidator（验证引用完整性）\n       ├── ArchBinarySerializer.Serialize(filteredWorld)\n       └── EnsureWorldComponentFormatters（校验 formatter 覆盖）\n       └── SaveContainerCodec.Encode → .ldsave\n```\n\n恢复流程：\n\n```\nSaveSlotStore.ReadSlot → SaveContainerCodec.Decode\n     ↓\nWorldRestoreService.Restore(engine, snapshot)\n     ↓\n  ├── SaveContextValidator.Validate(header, engine)\n  │   ├── 校验 schemaVersion\n  │   ├── 校验 modSetHash（当前 Mod 集合是否匹配）\n  │   ├── 校验 registryFingerprint\n  │   └── 校验 engineVersion\n  ├── LudotsBinaryWorldSerializer.Deserialize → World\n  └── GameEngine.RestoreWorldSnapshot(world, domains)\n       ├── LudotsWorldStateImporter.ImportOwnedSnapshotInto\n       └── SaveParticipantRegistry.RestoreDomains(domains)\n            └── 遍历所有 ISaveParticipant，调用 RestoreState(JsonNode)\n       └── SaveEntityWorldIdNormalizer（读档后对齐 WorldId）\n```\n\n**关键文件**：`src/Core/Persistence/WorldSnapshotService.cs`、`src/Core/Persistence/WorldRestoreService.cs`。\n\n### 4.3 BinarySerializer — 二进制序列化\n\n`LudotsBinaryWorldSerializer` 基于 `Arch.Persistence` 实现二进制世界序列化：\n\n- **排除策略**：`SaveEntityInclusionPolicy` 默认排除 `SaveExcludedTag`、`GameplayEvent`、`SimulationBudgetFuseEvent`、`PresentationDestroyPending` 标记的实体。\n- **引用验证**：`SaveEntityReferenceValidator` 校验 entity ref 不指向缺失或被排除的实体。\n- **Formatter 覆盖**：`LudotsCorePersistenceFormatters` 提供静态 formatter 缓存：\n  - `unmanaged` 类型：原始字节序列化（无反射）。\n  - `managed` 类型：显式 formatter（如 `Name` 组件、`MapEntity` 组件）。\n- **WorldId 对齐**：`SaveEntityWorldIdNormalizer` 在读档后对齐 `WorldId`，确保 entity 引用的连续性。\n\n⚠️ **注意**：`SaveEntityReferenceValidator` 在 `CloneIncludedWorld` 后执行一次验证，然后 `Serialize` 完成后再次执行 `EnsureWorldComponentFormatters`，导致两次完整 world 遍历，性能代价较高。\n\n⚠️ **注意**：`gitbook/architecture/save-system.md` 中提到 `inventory` 和 `relationships` 是 \"空 domain 占位\"，但代码中 `CoreSaveParticipants` 可能已部分实现，需要确认当前状态。\n\n**关键文件**：`src/Core/Persistence/LudotsBinaryWorldSerializer.cs`、`src/Core/Persistence/SaveEntityInclusionPolicy.cs`、`src/Core/Persistence/SaveEntityReferenceValidator.cs`、`src/Core/Persistence/LudotsCorePersistenceFormatters.cs`、`src/Core/Persistence/SaveEntityWorldIdNormalizer.cs`。\n\n### 4.4 ISaveParticipant — 存档参与者接口\n\n```csharp\npublic interface ISaveParticipant\n{\n    // 域标识（唯一）\n    string DomainKey { get; }\n\n    // 捕获状态 → JsonNode\n    JsonNode CaptureState();\n\n    // 从 JsonNode 恢复状态\n    void RestoreState(JsonNode state);\n}\n```\n\n`SaveParticipantRegistry` 管理所有参与者：\n\n```csharp\npublic class SaveParticipantRegistry\n{\n    // 注册参与者\n    void Register(ISaveParticipant participant);\n\n    // 捕获所有域状态\n    Dictionary<string, JsonNode> CaptureDomains();\n\n    // 恢复所有域状态\n    void RestoreDomains(Dictionary<string, JsonNode> domains);\n}\n```\n\n**内置参与者**（`CoreSaveParticipants`）：\n\n| 域 | DomainKey | 状态 |\n|----|-----------|------|\n| 时钟 | `\"clock\"` | 已实现 |\n| 游戏会话 | `\"gameSession\"` | 已实现 |\n| 库存 | `\"inventory\"` | ⚠️ 可能为占位（待确认） |\n| 地图会话 | `\"mapSessions\"` | 已实现 |\n| 叙事 | `\"narrative\"` | 已实现（`NarrativeDirector` 支持 Snapshot/Restore） |\n| 关系 | `\"relationships\"` | ⚠️ 可能为占位（待确认） |\n| 阵营 | `\"teams\"` | 已实现 |\n| 时间流 | `\"timeFlow\"` | 已实现 |\n\n**关键文件**：`src/Core/Persistence/ISaveParticipant.cs`、`src/Core/Persistence/SaveParticipantRegistry.cs`、`src/Core/Persistence/CoreSaveParticipants.cs`。\n\n### 4.5 SaveContainerCodec — .ldsave 容器格式\n\n`.ldsave` 是 Ludots 的存档单文件容器格式：\n\n```\n.ldsave 文件结构\n├── Frame Header\n│   ├── Magic Number（标识 .ldsave 格式）\n│   ├── Version（容器版本）\n│   └── Flags\n├── Section 1: header.json\n│   ├── Length（4 bytes）\n│   └── JSON 内容（UTF-8）\n├── Section 2: domains.json\n│   ├── Length（4 bytes）\n│   └── JSON 内容（UTF-8）\n├── Section 3: world.bin\n│   ├── Length（4 bytes）\n│   └── 二进制内容（Arch.Persistence 格式）\n└── SHA-256 校验（覆盖全部三段内容）\n```\n\n**原子写入**：`SaveSlotStore` 使用 `temp + commit` 模式，确保存档写入是原子操作，避免写入中断导致文件损坏。\n\n**关键文件**：`src/Core/Persistence/SaveContainerCodec.cs`。\n\n### 4.6 SaveContext — 存档上下文\n\n`SaveContext` 是存档的内存表示：\n\n```csharp\npublic class SaveContext\n{\n    public SaveContextHeader Header { get; }\n    public Dictionary<string, JsonNode> Domains { get; }\n    public byte[] WorldBytes { get; }\n}\n```\n\n`SaveContextHeader` 包含：\n\n| 字段 | 说明 |\n|------|------|\n| `schemaVersion` | 存档 schema 版本 |\n| `modSetHash` | 当前加载的 Mod 集合哈希 |\n| `registryFingerprint` | 注册表指纹（组件、能力、效果等） |\n| `mapId` | 当前地图 ID |\n| `tick` | 捕获时的仿真 tick |\n| `engineVersion` | 引擎版本 |\n\n`SaveContextFactory` 从 `GameEngine` 构建 `SaveContextHeader`。\n\n`SaveContextValidator` 在读档时校验：\n\n```csharp\npublic class SaveContextValidator\n{\n    ValidationResult Validate(SaveContextHeader header, GameEngine engine);\n    // 校验项：schemaVersion、modSetHash、registryFingerprint、engineVersion\n}\n```\n\n**关键文件**：`src/Core/Persistence/SaveContextFactory.cs`、`src/Core/Persistence/SaveContextHeader.cs`、`src/Core/Persistence/SaveContextValidator.cs`。\n\n## 5. Save/Load Pipeline 详解\n\n### 5.1 Save Pipeline\n\n```\n触发条件：手动存档 / 自动存档 / 关卡切换\n     ↓\nSaveSnapshotBoundary.CleanAfter(SystemGroup.ClearPresentationFlags)\n     ↓\nWorldSnapshotService.Capture(engine, boundary)\n     ↓\n  ├── SaveContextFactory.Capture(engine)\n  │   └── SaveContextHeader\n  │       ├── schemaVersion = 当前 schema 版本\n  │       ├── modSetHash = Hash(LoadedModIds + ModVersions)\n  │       ├── registryFingerprint = ComponentRegistry.Fingerprint + StringIntRegistry.Fingerprint\n  │       ├── mapId = CurrentMapId\n  │       ├── tick = CurrentSimulationTick\n  │       └── engineVersion = AssemblyVersion\n  │\n  ├── SaveParticipantRegistry.CaptureDomains()\n  │   └── 遍历 ISaveParticipant[]\n  │       ├── participant.CaptureState() → JsonNode\n  │       └── domains[participant.DomainKey] = JsonNode\n  │\n  └── LudotsBinaryWorldSerializer.Serialize(world)\n       ├── SaveEntityInclusionPolicy.GetIncludedEntities(world)\n       │   └── 排除 SaveExcludedTag / GameplayEvent / SimulationBudgetFuseEvent / PresentationDestroyPending\n       ├── CloneIncludedWorld(includedEntities)\n       ├── SaveEntityReferenceValidator.Validate(clonedWorld)\n       │   └── 校验所有 entity ref 指向有效实体\n       ├── ArchBinarySerializer.Serialize(clonedWorld) → byte[]\n       └── EnsureWorldComponentFormatters(clonedWorld)\n           └── 校验所有组件类型有对应的 formatter\n     ↓\nSaveContainerCodec.Encode(headerJson, domainsJson, worldBytes) → byte[] .ldsave\n     ↓\nSaveSlotStore.Write(slotName, ldsaveBytes)\n     └── 原子写入：tempFile → write → rename to slotFile\n```\n\n### 5.2 Load Pipeline\n\n```\n玩家选择存档槽 / 自动读档\n     ↓\nSaveSlotStore.ReadSlot(slotName) → byte[] .ldsave\n     ↓\nSaveContainerCodec.Decode(ldsaveBytes)\n     ├── 验证 SHA-256 校验和\n     ├── 解析 header.json → SaveContextHeader\n     ├── 解析 domains.json → Dictionary<string, JsonNode>\n     └── 解析 world.bin → byte[]\n     ↓\nSaveContextValidator.Validate(header, engine)\n     ├── schemaVersion 匹配？\n     ├── modSetHash 匹配？（当前加载的 Mod 是否与存档时一致）\n     ├── registryFingerprint 匹配？（注册表是否一致）\n     └── engineVersion 匹配？\n     → 任一不匹配 → 拒绝加载，返回错误\n     ↓\nWorldRestoreService.Restore(engine, snapshot)\n     ↓\n  ├── LudotsBinaryWorldSerializer.Deserialize(worldBytes) → World\n  │   └── ArchBinarySerializer.Deserialize(worldBytes) → 重建 ECS World\n  │\n  └── GameEngine.RestoreWorldSnapshot(world, domains)\n       ├── LudotsWorldStateImporter.ImportOwnedSnapshotInto(engine, world)\n       │   └── 将反序列化的世界导入当前引擎\n       └── SaveParticipantRegistry.RestoreDomains(domains)\n           └── 遍历 ISaveParticipant[]\n               ├── participant.RestoreState(domains[participant.DomainKey])\n               └── 恢复非 ECS 状态\n       └── SaveEntityWorldIdNormalizer.Normalize(engine)\n           └── 对齐 WorldId，确保 entity 引用连续性\n     ↓\nTriggerManager.FireMapEvent(mapId, GameEvents.MapResumed, ctx)\n     ↓\n游戏继续运行\n```\n\n## 6. 关键类清单（带文件路径）\n\n| 类名 | 文件路径 | 说明 | 行数 |\n|------|----------|------|------|\n| `WorldSnapshotService` | `src/Core/Persistence/WorldSnapshotService.cs` | 世界快照捕获 | — |\n| `WorldRestoreService` | `src/Core/Persistence/WorldRestoreService.cs` | 世界快照恢复 | — |\n| `LudotsBinaryWorldSerializer` | `src/Core/Persistence/LudotsBinaryWorldSerializer.cs` | 基于 Arch.Persistence 的二进制序列化 | — |\n| `ISaveParticipant` | `src/Core/Persistence/ISaveParticipant.cs` | 存档参与者接口 | — |\n| `SaveParticipantRegistry` | `src/Core/Persistence/SaveParticipantRegistry.cs` | 参与者注册表 | — |\n| `CoreSaveParticipants` | `src/Core/Persistence/CoreSaveParticipants.cs` | 引擎内置参与者（8 个域） | — |\n| `SaveContextFactory` | `src/Core/Persistence/SaveContextFactory.cs` | 从 GameEngine 构建 SaveContextHeader | — |\n| `SaveContextHeader` | `src/Core/Persistence/SaveContextHeader.cs` | 存档头：schemaVersion, modSetHash, registryFingerprint, mapId, tick, engineVersion | — |\n| `SaveContextValidator` | `src/Core/Persistence/SaveContextValidator.cs` | 读档时校验 header 与当前引擎/Mod 是否匹配 | — |\n| `SaveContainerCodec` | `src/Core/Persistence/SaveContainerCodec.cs` | `.ldsave` 单文件容器：frame header + 三段长度 + SHA-256 + 三段内容 | — |\n| `SaveSlotStore` | `src/Core/Persistence/SaveSlotStore.cs` | 槽位语义：`saves/{kind}/{name}.ldsave`；原子写入；autosave 保留策略 | — |\n| `LudotsCorePersistenceFormatters` | `src/Core/Persistence/LudotsCorePersistenceFormatters.cs` | 静态 formatter 缓存：unmanaged raw-bytes + managed 显式 | — |\n| `SaveEntityInclusionPolicy` | `src/Core/Persistence/SaveEntityInclusionPolicy.cs` | 默认排除 SaveExcludedTag / GameplayEvent / SimulationBudgetFuseEvent / PresentationDestroyPending | — |\n| `SaveEntityReferenceValidator` | `src/Core/Persistence/SaveEntityReferenceValidator.cs` | 校验 entity ref 不指向缺失/被排除实体 | — |\n| `SaveEntityWorldIdNormalizer` | `src/Core/Persistence/SaveEntityWorldIdNormalizer.cs` | 读档后对齐 WorldId | — |\n\n## 7. 输入 / 输出\n\n| 输入 | 来源 | 处理路径 |\n|------|------|---------|\n| 存档触发信号 | 玩家操作 / 自动存档 / 关卡切换 | `SaveSnapshotBoundary.CleanAfter(SystemGroup.ClearPresentationFlags)` |\n| ECS World | `GameEngine` | `LudotsBinaryWorldSerializer.Serialize(world)` |\n| 非 ECS 域状态 | `ISaveParticipant.CaptureState()` | `SaveParticipantRegistry.CaptureDomains()` |\n| 存档文件 | 文件系统 | `SaveSlotStore.ReadSlot` → `SaveContainerCodec.Decode` |\n\n| 输出 | 目标 | 生成路径 |\n|------|------|---------|\n| `.ldsave` 存档文件 | 文件系统 | `SaveContainerCodec.Encode` → `SaveSlotStore.Write` |\n| 恢复后的 ECS World | `GameEngine` | `LudotsBinaryWorldSerializer.Deserialize` → `LudotsWorldStateImporter.ImportOwnedSnapshotInto` |\n| 恢复后的非 ECS 状态 | 各子系统 | `SaveParticipantRegistry.RestoreDomains` → `ISaveParticipant.RestoreState` |\n| 校验失败错误 | 日志 / 用户界面 | `SaveContextValidator.Validate` |\n\n## 8. 依赖关系\n\n| 依赖项 | 说明 |\n|--------|------|\n| `Arch.Persistence` | ECS 世界二进制序列化 |\n| `System.Text.Json` | `domains.json` 和 `header.json` 的序列化 |\n| `System.Security.Cryptography` | SHA-256 校验 |\n| `GameEngine` | 存档上下文来源 / 恢复目标 |\n| `ModLoader` | `modSetHash` 的计算依赖已加载的 Mod 集合 |\n| `ComponentRegistry` | `registryFingerprint` 的计算依赖组件注册表 |\n| `StringIntRegistry` | `registryFingerprint` 的计算依赖各子系统注册表 |\n| `TriggerManager` | 读档完成后触发 `MapResumed` 事件 |\n\n## 9. 非功能需求（性能约束）\n\n| 约束项 | 目标 | 实现 |\n|--------|------|------|\n| 存档文件完整性 | SHA-256 校验 | `SaveContainerCodec` 编码时计算 SHA-256，解码时校验 |\n| 原子写入 | 避免写入中断损坏 | `SaveSlotStore` 使用 `temp + commit` 模式 |\n| 版本兼容性 | fail-fast 拒绝不兼容存档 | `SaveContextValidator` 校验 schemaVersion、modSetHash、registryFingerprint、engineVersion |\n| 引用完整性 | 校验 entity ref 有效性 | `SaveEntityReferenceValidator` 在序列化前后执行 |\n| 存档大小 | 排除不必要实体 | `SaveEntityInclusionPolicy` 默认排除 4 类标记实体 |\n| 存档加载时间 | < 2 秒（中型世界） | `Arch.Persistence` 的原始字节序列化，无反射 |\n| 序列化零分配 | 避免 GC 压力 | `LudotsBinaryWorldSerializer` 使用 `ArchBinarySerializer` 的原始字节路径 |\n| 恢复后 WorldId 对齐 | entity 引用连续性 | `SaveEntityWorldIdNormalizer` 读档后对齐 |\n\n---\n\n> **版本说明**：本章节基于 Ludots `main` 分支（2026-07-02 扫描）。\n> - ⚠️ `SaveEntityReferenceValidator` 在 `CloneIncludedWorld` 后执行一次验证，然后 `Serialize` 完成后再次执行 `EnsureWorldComponentFormatters`，导致两次完整 world 遍历，性能代价较高。\n> - ⚠️ `inventory` 和 `relationships` 域可能仍为占位实现，需要确认当前状态。\n> - ⚠️ `gitbook/architecture/save-system.md` 中提到的空 domain 占位需要进一步验证。";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
