<script>
const mdContent = "# Relationships & Teams System PRD\n\n## 1. 功能概述\n\nRelationships & Teams System 是 Ludots 引擎中负责**实体间关系图**与**阵营外交**的两个紧密协作子系统。\n\n- **关系系统（Relationships）**基于 Arch ECS 的 Relationship 扩展，在运行时维护实体间有向/无向的多类型关系边。每条边携带指标（Metric）数组、标志（Flag）和版本号，支持协同效应（Synergy）和变更回调（Callback）。关系系统通过 `RelationshipProcessingSystem` 每帧处理变更记录，驱动标签/效果回调和协同规则评估。\n- **阵营系统（Teams）**是静态全局的阵营关系管理器（`TeamManager`），维护阵营间的外交关系（Friendly/Hostile/Neutral）。`RelationshipFilter` 在 GAS 的 `TargetResolver` 中被用于目标过滤（如\"只选中敌对目标\"）。`RelationshipTeamBootstrapper` 在启动时将 `TeamManager` 的阵营关系同步到 `RelationshipRuntime`，实现阵营关系与实体关系的统一。\n\n---\n\n## 2. 目标用户\n\n| 用户类型 | 使用方式 |\n|----------|----------|\n| **Gameplay 程序员** | 调用 `RelationshipRuntime` API 建立/修改关系边；配置 `TeamManager` 的默认阵营关系 |\n| **Mod 开发者** | 通过 JSON 配置关系类型、指标、带、协同规则；注册到各 Registry |\n| **技术策划** | 设计好感度系统、阵营外交、NPC 关系网；配置关系变更触发的事件和效果 |\n| **AI 程序员** | 利用关系指标和阵营关系驱动 AI 目标选择（Utility/GOAP/HTN） |\n\n---\n\n## 3. 使用场景\n\n| 场景 | 描述 |\n|------|------|\n| **NPC 好感度** | 玩家与 NPC 之间建立 `Friendship` 关系边，`SetMetric` 增加好感度指标 → 达到阈值触发 `RelationshipBand` 变更 → 激活新对话选项或任务 |\n| **阵营外交** | `TeamManager.SetRelationship(teamA, teamB, Hostile)` → 所有 teamA 实体对 teamB 实体默认敌对 → `TargetResolver` 的 `RelationshipFilter` 过滤目标 |\n| **团队协同** | 同队成员间建立 `Synergy` 关系，`RelationshipSynergyProcessor` 评估协同规则，满足条件时激活团队 Buff（通过 GAS Effect） |\n| **关系图查询** | 查询某实体的所有 outgoing 关系 → 筛选类型为 `Ally` 的目标 → 按 `Trust` 指标排序 → 选择最信任的目标执行救援 |\n| **关系变更回调** | 当玩家与某阵营关系从 `Friendly` 变为 `Hostile` 时，`RelationshipCallbackProcessor` 触发预注册的回调：移除所有该阵营的贸易许可标签，并发布 `EffectRequest` 施加敌对状态效果 |\n\n---\n\n## 4. 核心能力\n\n### 4.1 RelationshipRuntime（关系图运行时）\n\n- **关系边存储**：`RelationshipEdge`（`Relationships/RelationshipEdge.cs`）存储单条关系边的指标数组、标志和版本。`RelationshipEdgeSet`（`Relationships/RelationshipEdgeSet.cs`）管理同一目标实体上的多类型边集合。\n- **关系操作**：`RelationshipRuntime`（`Relationships/RelationshipRuntime.cs`）提供：\n  - `HasLink(...)` / `EnsureLink(...)` / `RemoveLink(...)`：查询/建立/删除关系边\n  - `SetMetric(...)` / `AddMetric(...)` / `TryGetMetric(...)`：读写关系指标\n  - `SetFlag(...)`：设置关系标志\n  - `CollectOutgoing(...)` / `CollectIncoming(...)` / `CollectMutual(...)`：收集关系方向\n- **变更记录**：`RelationshipChangeBuffer`（`Relationships/RelationshipChangeBuffer.cs`）为环形缓冲，记录所有关系变更，供 `RelationshipProcessingSystem` 消费。\n- **类型校验**：`ValidateTypeId` 调用 `_types.Get(typeId)` 进行校验。> **注意**：`_types.Get` 在 typeId 不存在时可能抛出异常，热路径中需确保类型已注册。\n\n### 4.2 RelationshipProcessingSystem（变更处理）\n\n- **回调处理**：`RelationshipCallbackProcessor`（`Relationships/RelationshipCallbackProcessor.cs`）按 `RelationshipChangeBuffer` 中的记录，触发预注册的标签/效果回调。\n- **协同效应**：`RelationshipSynergyProcessor`（`Relationships/RelationshipSynergyProcessor.cs`）评估协同规则，满足条件时激活/停用协同效果。\n- **启动绑定**：`RelationshipTeamBootstrapper`（`Relationships/RelationshipTeamBootstrapper.cs`）在运行时启动阶段将 `TeamManager` 的阵营关系同步到 `RelationshipRuntime`，确保阵营关系与实体关系一致。\n\n### 4.3 关系 Registry 体系\n\n| Registry | 路径 | 职责 |\n|----------|------|------|\n| `RelationshipTypeRegistry` | `Relationships/RelationshipTypeRegistry.cs` | 关系类型名→ID（如 \"Friendship\" / \"Hostile\"） |\n| `RelationshipMetricRegistry` | `Relationships/RelationshipMetricRegistry.cs` | 指标定义（MinValue / MaxValue / DefaultValue） |\n| `RelationshipFlagRegistry` | `Relationships/RelationshipFlagRegistry.cs` | 标志名→掩码 |\n| `RelationshipBandRegistry` | `Relationships/RelationshipBandRegistry.cs` | 指标带（阈值+比较+标志激活） |\n| `RelationshipReasonRegistry` | `Relationships/RelationshipReasonRegistry.cs` | 变更原因名→ID |\n\n### 4.4 TeamManager（阵营管理）\n\n- **全局静态**：`TeamManager`（`Teams/TeamManager.cs`）为静态全局类，不依附于 ECS World，管理所有阵营间的默认关系。\n- **关系设置**：`SetRelationship(int, int, TeamRelationship)` / `GetRelationship(int, int)` 设置/查询阵营关系。\n- **配置加载**：`LoadConfig(TeamConfig)` 从配置加载阵营关系矩阵。\n- **快照/恢复**：`CaptureSnapshot()` / `RestoreSnapshot(...)` 支持存档级阵营关系保存。\n- **实体查询**：`TeamEntityLookup`（`Teams/TeamEntityLookup.cs`）和 `PlayerEntityLookup`（`Teams/PlayerEntityLookup.cs`）提供队伍/玩家实体查询。\n- **参与者绑定**：`ParticipantBindingResolver`（`Teams/ParticipantBindingResolver.cs`）解析参与者绑定。\n- **Revision 溢出**：`TeamManager` 使用 `unchecked { _revision++; }` 进行版本递增。`int` 溢出会绕回为负数，可能影响缓存失效语义。> **注意**：Revision 溢出绕回为负数，依赖缓存失效的系统需确认是否受负版本影响。\n\n### 4.5 RelationshipFilter（目标过滤）\n\n- `RelationshipFilter`（`Teams/RelationshipFilter.cs`）为枚举，含 `Friendly`、`Hostile`、`Neutral` 三个值。\n- 在 GAS `TargetResolver` 的 `TargetFilter` 阶段，`RelationshipFilter` 被用于过滤目标：只保留与 Source 实体关系匹配的目标（如只选 Hostile）。\n\n---\n\n## 5. 输入 / 输出\n\n### 5.1 输入\n\n| 输入 | 来源 | 处理者 |\n|------|------|--------|\n| 关系配置 JSON | Mod / ConfigPipeline | `RelationshipCatalogPipelineLoader` |\n| 阵营配置 JSON | Mod / ConfigPipeline | `TeamManager.LoadConfig` |\n| 关系变更指令 | GAS（效果/标签）/ 叙事 / Exchange | `RelationshipRuntime.SetMetric` / `SetFlag` |\n| 阵营关系变更 | 叙事 / 游戏逻辑 | `TeamManager.SetRelationship` |\n| 实体查询请求 | AI / GAS TargetResolver | `TeamEntityLookup` / `RelationshipFilter` |\n\n### 5.2 输出\n\n| 输出 | 目标 | 驱动者 |\n|------|------|--------|\n| 关系变更回调 | GAS Effect Pipeline / Tag 系统 | `RelationshipCallbackProcessor` |\n| 协同效果 | GAS Effect Pipeline | `RelationshipSynergyProcessor` |\n| 阵营关系状态 | AI 目标选择 / UI 外交面板 | `TeamManager.GetRelationship` |\n| 目标过滤结果 | GAS TargetResolver | `RelationshipFilter` |\n| 实体集合 | AI / 游戏逻辑 | `TeamEntityLookup` / `PlayerEntityLookup` |\n\n---\n\n## 6. 依赖关系\n\n```\nRelationships & Teams\n├── 依赖 Arch ECS：RelationshipRuntime 使用 Arch Relationship<RelationshipEdgeSet>\n├── 依赖 GAS：关系变更通过 CallbackProcessor 发布 EffectRequest；RelationshipFilter 用于 TargetResolver\n├── 依赖 Narrative：叙事任务可修改关系指标；关系带变更可触发叙事事件\n├── 依赖 AI：AI 目标选择依赖 TeamManager 和 RelationshipRuntime\n├── 依赖 Exchange：交易可能受关系条件限制（RelationshipRequirement）\n├── 依赖 ConfigPipeline：RelationshipCatalogPipelineLoader 和 TeamConfig 加载\n└── 依赖 Presentation：关系状态变化驱动 UI 提示和 VFX\n```\n\n---\n\n## 7. 非功能需求\n\n| 需求 | 目标 | 实现方式 |\n|------|------|----------|\n| **性能** | 10,000+ 关系边处理无 GC | 0-GC struct 边数据、环形变更缓冲、批量处理 |\n| **内存** | 关系存储可控 | `RelationshipEdge` 紧凑数组，`RelationshipEdgeSet` 按需分配 |\n| **可扩展性** | Mod 可定义新关系类型/指标/带 | 加载期 Registry 注册 |\n| **快照** | 支持阵营关系存档 | `TeamManager.CaptureSnapshot` / `RestoreSnapshot` |\n| **一致性** | 阵营关系与实体关系同步 | `RelationshipTeamBootstrapper` 启动时同步 |\n\n---\n\n## 8. 关键类清单\n\n### 8.1 关系图运行时\n\n| 类 | 路径 | 职责 |\n|----|------|------|\n| `RelationshipRuntime` | `src/Core/Gameplay/Relationships/RelationshipRuntime.cs` | 关系图运行时（HasLink/EnsureLink/SetMetric/Collect） |\n| `RelationshipProcessingSystem` | `src/Core/Gameplay/Relationships/RelationshipProcessingSystem.cs` | 关系变更处理系统（Callback + Synergy） |\n| `RelationshipEdge` | `src/Core/Gameplay/Relationships/RelationshipEdge.cs` | 单条关系边（metric 数组 + flags + version） |\n| `RelationshipEdgeSet` | `src/Core/Gameplay/Relationships/RelationshipEdgeSet.cs` | 同目标多类型边集合 |\n| `RelationshipChangeBuffer` | `src/Core/Gameplay/Relationships/RelationshipChangeBuffer.cs` | 变更记录环形缓冲 |\n| `RelationshipCallbackProcessor` | `src/Core/Gameplay/Relationships/RelationshipCallbackProcessor.cs` | 回调处理器 |\n| `RelationshipSynergyProcessor` | `src/Core/Gameplay/Relationships/RelationshipSynergyProcessor.cs` | 协同效应处理器 |\n| `RelationshipTeamBootstrapper` | `src/Core/Gameplay/Relationships/RelationshipTeamBootstrapper.cs` | 队伍关系启动器 |\n\n### 8.2 关系定义与配置\n\n| 类 | 路径 | 职责 |\n|----|------|------|\n| `RelationshipCatalogRuntime` | `src/Core/Gameplay/Relationships/RelationshipCatalogRuntime.cs` | 关系目录运行时（Synergies / Callbacks） |\n| `RelationshipCatalogInstaller` | `src/Core/Gameplay/Relationships/RelationshipCatalogInstaller.cs` | 目录安装器 |\n| `RelationshipCatalogPipelineLoader` | `src/Core/Gameplay/Relationships/Config/RelationshipCatalogPipelineLoader.cs` | 配置加载器 |\n| `RelationshipCatalogConfig` | `src/Core/Gameplay/Relationships/Config/RelationshipCatalogConfig.cs` | 配置模型 |\n| `RelationshipTypeRegistry` | `src/Core/Gameplay/Relationships/RelationshipTypeRegistry.cs` | 关系类型注册表 |\n| `RelationshipMetricRegistry` | `src/Core/Gameplay/Relationships/RelationshipMetricRegistry.cs` | 指标定义注册表 |\n| `RelationshipFlagRegistry` | `src/Core/Gameplay/Relationships/RelationshipFlagRegistry.cs` | 标志注册表 |\n| `RelationshipBandRegistry` | `src/Core/Gameplay/Relationships/RelationshipBandRegistry.cs` | 指标带注册表 |\n| `RelationshipReasonRegistry` | `src/Core/Gameplay/Relationships/RelationshipReasonRegistry.cs` | 变更原因注册表 |\n| `RelationshipMetricDefinition` | `src/Core/Gameplay/Relationships/RelationshipMetricDefinition.cs` | 指标定义（Min/Max/Default） |\n| `RelationshipBandDefinition` | `src/Core/Gameplay/Relationships/RelationshipBandDefinition.cs` | 带定义（TypeId/MetricId/Threshold/Comparison/FlagId） |\n\n### 8.3 阵营系统\n\n| 类 | 路径 | 职责 |\n|----|------|------|\n| `TeamManager` | `src/Core/Gameplay/Teams/TeamManager.cs` | 静态全局阵营关系管理（Set/Get/Capture/Restore） |\n| `TeamRelationshipSnapshot` | `src/Core/Gameplay/Teams/TeamManager.cs`（内部类） | 关系快照 |\n| `TeamConfig` / `RelationshipEntry` | `src/Core/Gameplay/Teams/TeamManager.cs`（内部类） | 配置模型 |\n| `TeamEntityLookup` | `src/Core/Gameplay/Teams/TeamEntityLookup.cs` | 队伍实体查询 |\n| `PlayerEntityLookup` | `src/Core/Gameplay/Teams/PlayerEntityLookup.cs` | 玩家实体查询 |\n| `ParticipantBindingResolver` | `src/Core/Gameplay/Teams/ParticipantBindingResolver.cs` | 参与者绑定解析 |\n| `RelationshipFilter` | `src/Core/Gameplay/Teams/RelationshipFilter.cs` | 关系过滤枚举（Friendly/Hostile/Neutral） |\n\n---\n\n*本 PRD 基于 `report_Gameplay_GAS.md` Stage 1 扫描报告编写。Revision 溢出和类型校验异常风险已在文中标注。*\n";

document.getElementById('content').innerHTML = marked.parse(mdContent);
</script>
