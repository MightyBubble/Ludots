const mdContent = "# 核心引擎（Core Engine）\n\n## 1. 功能概述\n\nLudots 的 Core Engine 是基于 **Arch ECS**（Entity Component System）架构的高性能游戏运行时内核。它将传统的游戏主循环拆分为两个独立的循环：**Simulation Loop**（逻辑仿真，受预算限制）与 **Visual Loop**（视觉表现，不受预算限制）。这种双层循环设计确保逻辑帧的繁重计算不会拖慢视觉帧率，同时保持逻辑层的确定性——这对 RTS/MOBA 等需要网络同步或回放验证的游戏类型至关重要。\n\nCore Engine 的核心组件包括：\n- **`GameEngine`**（2967 行，partial class）：引擎主类，负责 `Tick`（仿真循环）与 `Update`（表现循环）的驱动。\n- **`WorldRuntime`**：工厂包装器，负责从 `GameConfig` 和 `assetsRoot` 构造并初始化 `GameEngine`。\n- **`SystemFactoryRegistry`**：System 工厂的注册表，支持按 `SystemGroup` 分组注册和延迟激活。\n- **`Time`** 与 **`ClockFoundation`**：全局时间状态管理，支持 `TotalTime`、`DeltaTime`、`FixedTotalTime`（默认 50 Hz）、`FixedDeltaTime` 和 `TimeScale`。\n- **`GameTask`** 与 **`GameSynchronizationContext`**：全局任务调度与异步回调的游戏线程同步。\n\n## 2. 目标用户\n\n![整体引擎架构](diagrams/engine-architecture.svg)\n\n- **引擎开发者**：需要理解 `GameEngine` 的内部循环、System 分组、时间管理与任务调度机制。\n- **Gameplay 开发者**：需要理解如何在正确的 `SystemGroup` phase 中注册自定义 System，以及如何读取 `Time` 和 `ClockFoundation` 的状态。\n- **Mod 作者**：需要通过 `IModContext.SystemFactoryRegistry` 注册 System 工厂，并了解 `GameEvents` 事件的生命周期。\n\n## 3. 使用场景\n\n- **注册自定义 System**：Mod 作者在 `IMod.OnLoad` 中调用 `context.SystemFactoryRegistry.Register(\"MySystem\", SystemGroup.PostMovement, ctx => new MySystem(...))`，将自定义 System 绑定到 `PostMovement` phase。\n- **读取时间状态**：Gameplay System 在 `Update` 中通过 `Time.DeltaTime` 计算动画插值，或通过 `Time.FixedDeltaTime` 计算物理步进。\n- **调度异步任务**：开发者通过 `GameTask` 将非阻塞工作（如配置重载、资源预热）调度到游戏线程，避免跨线程访问 ECS World。\n- **网络同步**：RTS 游戏使用 `ClockFoundation.DiscreteClock` 的 5 个 domain（`FixedFrame`、`Step`、`Turn`、`PhysicsStep`、`NavigationStep`）对齐客户端与服务器的时间步。\n\n## 4. 核心能力\n\n### 4.1 ECS 引擎核心\n\n![SystemGroup 流水线](diagrams/systemgroup-pipeline.svg)\n\n#### Arch ECS 集成\n\nLudots 基于 `Arch` 的 `World` 作为 ECS 运行时。`GameEngine` 在 `InitializeWorld()` 中构造 `World` 并注入 `JobScheduler`（并行 System 执行器）。所有 ECS 实体、组件、查询和关系均通过 Arch 的 API 操作。\n\n关键文件：\n- `src/Core/Engine/GameEngine.cs` — 引擎主类，含 `Tick` 和 `Update` 循环。\n- `src/Core/Engine/WorldRuntime.cs` — `WorldRuntime.Create(GameConfig, assetsRoot)` 工厂方法。\n- `src/Core/Engine/GameContext.cs` — 轻量级服务访问器，`GetService<T>(ServiceKey<T>)` 为当前推荐路径，`GetService<T>(string)` 为遗留 API（⚠️ 待迁移）。\n\n#### SystemGroup Phase 固化\n\n`SystemGroup` 枚举定义 11 个固定 phase，顺序不可变更。所有 System 必须归属其中之一（Presentation System 除外，它们通过 `RegisterPresentation` 注册，不绑定到 `SystemGroup`）。\n\n| Phase | 枚举值 | 典型 System | 职责 |\n|-------|--------|------------|------|\n| `SchemaUpdate` | 0 | `AttributeSchemaUpdateSystem` | 运行时 schema 注册：属性定义、图定义、Tag 规则等 |\n| `InputCollection` | 1 | `InputCollectionSystem`, `SelectionInputSystem`, `InteractionSystem` | 收集玩家输入、更新选择状态、处理交互动作 |\n| `PostMovement` | 2 | `WorldToGridSyncSystem`, `SpatialPartitionUpdateSystem`, `SavePreviousWorldPositionSystem` | 移动后同步世界坐标到网格、更新空间分区 |\n| `AbilityActivation` | 3 | `AbilityActivationSystem`, `OrderProcessingSystem`, `ResponseChainSystem` | 能力激活、指令处理、响应链执行 |\n| `EffectProcessing` | 4 | `EffectPhaseExecutor`, `EffectLifetimeSystem`, `EffectApplicationSystem` | 效果阶段执行、生命周期管理、应用效果 |\n| `RuntimeEntityBinding` | 5 | `RuntimeEntityBindingSystem` | 运行时实体创建后的能力/表现绑定 |\n| `AttributeCalculation` | 6 | `AttributeBindingSystem`, `AttributeCalculationSystem` | 属性计算、属性缓冲落地到 Sink |\n| `DeferredTriggerCollection` | 7 | `DeferredTriggerCollectionSystem`, `DeferredTriggerProcessSystem` | 收集延迟触发器、处理延迟触发 |\n| `Cleanup` | 8 | `EffectCleanupSystem`, `EntityCleanupSystem`, `PresentationEntityFinalizeDestroySystem` | 效果清理、实体清理、表现实体最终销毁 |\n| `EventDispatch` | 9 | `EventDispatchSystem`, `GameplayPresentationProjectionSystem`, `GlobalPresentationEventProjectionSystem` | 事件分发、表现投影 |\n| `ClearPresentationFlags` | 10 | `ClearPresentationFlagsSystem` | 清除所有表现标记，为下一帧做准备 |\n\n⚠️ **注意**：`GameEngine.cs` 第 116 行注释使用了 `\"Phase 3.5\"` 描述 `RuntimeEntityBinding`，但枚举值是离散的 `RuntimeEntityBinding`（值为 5），不是小数 phase。这是注释与代码的不一致。\n\n### 4.2 每帧主循环 Pipeline\n\n![Game Tick 循环](diagrams/tick-loop.svg)\n\n#### Tick（仿真循环）\n\n```\nTick(platformDeltaTime)\n  ├── ApplyBuiltInTimeFlowScales() → Time.TimeScale\n  ├── dt = platformDeltaTime * Time.TimeScale\n  ├── GameTask.Update(dt) → 全局任务调度\n  ├── SyncContext.ProcessQueue() → 异步回调同步到游戏线程\n  ├── EnsureCameraRuntimeConfigured() → 确保相机已配置\n  ├── ProcessPendingMapLoads() → 地图加载/切换请求\n  │\n  ├── [Simulation Loop] — Pacemaker 控制，受预算限制\n  │   └── Pacemaker.Update(dt, cooperativeSimulation, budgetMs, maxSlices)\n  │       └── 按 SystemGroup 顺序执行 11 个 phase\n  │\n  ├── [Visual Loop] — 不受预算限制，始终运行\n  │   └── Update(dt)\n  │       ├── 清空各表现 Buffer\n  │       ├── BeginPresentationCameraSnapshotScope()\n  │       ├── for each _presentationSystems → Update(dt)\n  │       ├── EndPresentationCameraSnapshotScope()\n  │       ├── InstancedBatchCapabilityValidator.Validate()\n  │       └── _gasPresentationEvents.Clear()\n  │\n  └── 观察 PresentationTimingDiagnostics\n```\n\n**关键文件**：`src/Core/Engine/GameEngine.cs` 第 97–134 行（SystemGroup phase 顺序），`src/Core/Engine/GameEngine.cs` 的 `Tick` 和 `Update` 方法。\n\n#### Pacemaker 仿真预算\n\n`IPacemaker` 控制 simulation 循环的时间预算，防止逻辑帧耗尽宿主线程。\n\n- `SimulationBudgetMsPerFrame`：每帧 simulation 的最大时间预算（毫秒）。\n- `SimulationMaxSlicesPerLogicFrame`：每帧 simulation 的最大切片数。\n- `cooperativeSimulation`：合作式仿真，允许 simulation 在预算耗尽时提前终止，将剩余工作推迟到下一帧。\n\n如果 simulation 预算耗尽，会触发 `SimulationBudgetFuseEvent`。\n\n⚠️ **注意**：`gitbook/architecture/entity-simulation-layering.md` 中描述了 `Authority` 和 `Budgeted` 仿真车道概念，但代码中 `Authority` 组件/标记在本次扫描中未明确发现。`SimulationBudgetFuseEvent` 已存在，但车道标记可能尚未实现。\n\n### 4.3 WorldRuntime 与 GameEngine 初始化\n\n```\nApp 入口 (Raylib/Web)\n  ↓\nGameBootstrapper.InitializeFromBaseDirectory(baseDir, gameConfigFile)\n  ↓\n读取 launcher.runtime.json → 解析 launcher graph → ResolvedModLoadPlan\n  ↓\nWorldRuntime.Create(config, assetsRoot)\n  ↓\nGameEngine.InitializeWithConfigPipeline(modPlan, assetsRoot)\n  ├── 1. 初始化 VFS, FunctionRegistry, TriggerManager, SystemFactoryRegistry, ModLoader\n  ├── 2. ModLoader.LoadResolvedPlan(orderedMods) → ALC 加载 → IMod.OnLoad\n  ├── 3. ConfigPipeline.MergeGameConfig() → 合并 Core + Mods 的 game.json\n  ├── 4. InitializeWorld() → Arch World + PhysicsWorld + JobScheduler\n  ├── 5. InitializeCoreSystems(MergedConfig) → 构建所有 GAS/Presentation/Spatial 系统\n  ├── 6. RegisterSystem() / RegisterPresentationSystem() → 按 SystemGroup 分组\n  └── 7. 打印 ConflictReport 摘要\n```\n\n**关键文件**：`src/Core/Engine/WorldRuntime.cs`、`src/Core/Engine/GameBootstrapper.cs`、`src/Core/Modding/ModLoader.cs`。\n\n### 4.4 TimeFlow 与 ClockFoundation\n\n#### Time（静态类）\n\n`Time` 提供全局时间状态，所有 Gameplay System 和 Presentation System 均可读取：\n\n| 属性 | 类型 | 说明 |\n|------|------|------|\n| `TotalTime` | `float` | 自游戏启动以来的总时间（秒） |\n| `DeltaTime` | `float` | 当前帧的时间间隔（秒） |\n| `FixedTotalTime` | `float` | 自启动以来的固定步进总时间 |\n| `FixedDeltaTime` | `float` | 固定步进间隔（默认 0.02f = 50 Hz） |\n| `TimeScale` | `float` | 时间缩放因子（默认 1.0） |\n\n⚠️ **注意**：`Time.FixedDeltaTime` 在 `Time.cs` 中硬编码为 `0.02f`（50 Hz），但在 `InitializeCoreSystems` 中会从 `EngineClockConfig.FixedHz` 覆盖。如果 `EngineClockConfig` 加载失败，默认值保持 50 Hz，但配置文件中可能声明其他值，这可能导致行为不一致。\n\n#### ClockFoundation\n\n`ClockFoundation` 提供多个离散时钟 domain，用于不同子系统的步进对齐：\n\n- `DiscreteClock`：支持 5 个 domain：`FixedFrame`、`Step`、`Turn`、`PhysicsStep`、`NavigationStep`。\n- `IClock` 接口：抽象时钟读取。\n- `DiscreteClockSnapshot`：用于存档的时钟快照。\n\n**关键文件**：`src/Core/Engine/ClockFoundation.cs`。\n\n### 4.5 SystemFactoryRegistry\n\n`SystemFactoryRegistry` 是 System 的注册与延迟激活中心。\n\n**关键 API**：\n\n```csharp\n// 注册仿真系统（绑定到 SystemGroup）\nvoid Register(string name, SystemGroup group, Func<ScriptContext, GameEngine, ISystem> factory);\n\n// 注册表现系统（不绑定到 SystemGroup）\nvoid RegisterPresentation(string name, Func<ScriptContext, GameEngine, ISystem> factory);\n\n// 延迟激活（通常由 Map Trigger 在 MapLoaded 时触发）\nbool TryActivate(string name, ScriptContext context, GameEngine engine);\n\n// 查询是否已激活\nbool IsActivated(string name);\n```\n\n**关键文件**：`src/Core/Engine/SystemFactoryRegistry.cs`。\n\n### 4.6 GameTask 与 GameSynchronizationContext\n\n- `GameTask`：全局任务调度器，`Update(dt)` 在 `Tick` 开始时调用，执行所有已排队的任务。\n- `GameSynchronizationContext`：将异步回调（如 `Task.ContinueWith`）调度到游戏线程，避免跨线程访问 ECS World。\n\n**关键文件**：`src/Core/Engine/GameTask.cs`、`src/Core/Engine/GameSynchronizationContext.cs`。\n\n## 5. 关键类清单（带文件路径）\n\n| 类名 | 文件路径 | 说明 | 行数 |\n|------|----------|------|------|\n| `GameEngine` | `src/Core/Engine/GameEngine.cs` | 引擎主类，Tick + Update 双循环 | 2967 |\n| `WorldRuntime` | `src/Core/Engine/WorldRuntime.cs` | World 工厂与初始化封装 | — |\n| `GameContext` | `src/Core/Engine/GameContext.cs` | 服务访问器，typed key + legacy string | — |\n| `SystemFactoryRegistry` | `src/Core/Engine/SystemFactoryRegistry.cs` | System 注册与延迟激活 | — |\n| `Time` | `src/Core/Engine/Time.cs` | 全局时间状态 | — |\n| `ClockFoundation` | `src/Core/Engine/ClockFoundation.cs` | 离散时钟与存档快照 | — |\n| `DiscreteClock` | `src/Core/Engine/ClockFoundation.cs` | 5 domain 离散时钟 | — |\n| `GameTask` | `src/Core/Engine/GameTask.cs` | 全局任务调度 | — |\n| `GameSynchronizationContext` | `src/Core/Engine/GameSynchronizationContext.cs` | 异步回调到游戏线程 | — |\n| `GameSessionSystem` | `src/Core/Systems/GameSessionSystem.cs` | 包装 `GameSession.FixedUpdate` | — |\n| `MapLoader` | `src/Core/Systems/MapLoader.cs` | 从 ConfigPipeline 加载 EntityTemplate | — |\n| `CameraRuntimeSystem` | `src/Core/Systems/CameraRuntimeSystem.cs` | 相机运行时 | — |\n| `CameraCullingSystem` | `src/Core/Systems/CameraCullingSystem.cs` | 视锥剔除 | — |\n| `GridMovementSystem` | `src/Core/Systems/GridMovementSystem.cs` | 网格移动 | — |\n| `GridVisualSyncSystem` | `src/Core/Systems/GridVisualSyncSystem.cs` | 网格视觉同步 | — |\n| `SpatialPartitionUpdateSystem` | `src/Core/Systems/SpatialPartitionUpdateSystem.cs` | 空间分区更新 | — |\n| `WorldToGridSyncSystem` | `src/Core/Systems/WorldToGridSyncSystem.cs` | 世界坐标到网格坐标同步 | — |\n\n## 6. 输入 / 输出\n\n| 输入 | 来源 | 处理路径 |\n|------|------|---------|\n| `platformDeltaTime` | `RaylibHostLoop` / `WebHostLoop` | `GameEngine.Tick(platformDeltaTime)` |\n| `GameConfig` | `ConfigPipeline.MergeGameConfig()` | `WorldRuntime.Create` → `GameEngine.InitializeWithConfigPipeline` |\n| `ResolvedModLoadPlan` | Launcher CLI | `ModLoader.LoadResolvedPlan` → `IMod.OnLoad` |\n| 异步任务 | `GameTask` / `Task` | `GameTask.Update(dt)` 在 `Tick` 开始时调用 |\n| 异步回调 | `Task.ContinueWith` / `await` | `GameSynchronizationContext.ProcessQueue()` 在 `Tick` 中调用 |\n\n| 输出 | 目标 | 生成路径 |\n|------|------|---------|\n| 各 phase System 执行 | ECS World 状态变更 | `Pacemaker.Update` → 按 `SystemGroup` 顺序执行 |\n| 表现 Buffer | `Update` 循环 | `_presentationSystems.Update(dt)` → 各 Buffer 填充 |\n| 冲突报告 | 日志 | `InitializeWithConfigPipeline` 结束时打印 |\n| 仿真预算熔断事件 | ECS World | `SimulationBudgetFuseEvent`（预算耗尽时触发） |\n\n## 7. 依赖关系\n\n| 依赖项 | 说明 |\n|--------|------|\n| `Arch` / `Arch.System` | ECS World、System、Query、Entity |\n| `Arch.Persistence` | 世界二进制序列化（存档系统使用） |\n| `JobScheduler` | 并行 System 执行（`InitializeWorld` 中构造） |\n| `Physics2D`（自研） | `PhysicsWorld` / `Physics2DController`（`InitializeWorld` 中构造） |\n| `ModLoader` | 加载 Mod 并触发 `IMod.OnLoad` |\n| `ConfigPipeline` | 合并 `GameConfig` 后传入 `InitializeCoreSystems` |\n| `TriggerManager` | 分发 `GameEvents.GameStart` / `MapLoaded` 等事件 |\n\n## 8. 非功能需求（性能约束）\n\n| 约束项 | 目标 | 实现 |\n|--------|------|------|\n| 逻辑帧率 | 固定 50 Hz（默认） | `Time.FixedDeltaTime = 0.02f`，可在 `EngineClockConfig` 覆盖 |\n| 仿真预算 | 可配置 ms/帧 + 最大 slices/帧 | `IPacemaker` 控制，`SimulationBudgetMsPerFrame` + `SimulationMaxSlicesPerLogicFrame` |\n| 零 GC 触发 | 固定 64 槽 | `BuiltinHandlerRegistry` 通过索引直接访问 |\n| 批量实体生成 | 10,000+ 实体/帧 | `TemplateEntityBatchSpawner` 通过 Arch chunk span 填充 |\n| System 顺序不可变更 | 严格 11 phase | `SystemGroup` 枚举，`GameEngine.cs` 第 97-134 行 |\n| 存档加载时间 | < 2 秒（中型世界） | `LudotsBinaryWorldSerializer` 基于 `Arch.Persistence` |\n| 异步回调安全 | 禁止跨线程访问 ECS World | `GameSynchronizationContext` 将回调调度到游戏线程 |\n\n---\n\n> **版本说明**：本章节基于 Ludots `main` 分支（2026-07-02 扫描）。\n> - ⚠️ `Authority` 和 `Budgeted` 仿真车道在代码中未明确发现，可能尚未实现。\n> - ⚠️ `GameEngine.cs` 第 116 行注释的 `\"Phase 3.5\"` 与枚举的离散值不一致。\n> - ⚠️ `Time.FixedDeltaTime` 的硬编码默认值与 `EngineClockConfig` 覆盖可能存在不一致风险。";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
