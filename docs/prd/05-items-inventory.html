<script>
const mdContent = "# Items & Inventory System PRD\n\n## 1. 功能概述\n\nItems & Inventory System 是 Ludots 引擎中负责物品定义、库存管理、装备穿戴、容器布局与物品交换的核心子系统。它与 GAS 紧密协作：物品可以授予能力槽位（`ItemGrantedSlotBuffer`），装备变更通过 `InventoryEquipmentGrantSyncSystem` 同步到 GAS 的 `AbilitySlotResolver`，实现“穿装备=获得新技能”的语义。\n\n所有物品、容器、布局、形状均在加载期通过 Registry 注册，运行时由 `InventoryRuntimeService` 以 ECS 查询驱动的方式执行创建、移动、堆叠、拆分、销毁等操作。容器支持两种布局：**网格（Grid）**和**命名插槽（NamedSlot）**，物品形状支持多旋转形态。\n\n---\n\n## 2. 目标用户\n\n| 用户类型 | 使用方式 |\n|----------|----------|\n| **Gameplay 程序员** | 调用 `InventoryRuntimeService` API 进行物品操作；实现装备变更回调 |\n| **Mod 开发者** | 通过 JSON 配置物品定义、形状、容器布局；注册到 `ItemDefinitionRegistry` |\n| **技术策划** | 配置物品属性（堆叠数、耐久、充能）、装备插槽部位、装备后授予的能力 |\n| **UI 程序员** | 绑定 `ItemInstanceCm` / `ItemLocationCm` 渲染背包网格/装备面板 |\n\n---\n\n## 3. 使用场景\n\n| 场景 | 描述 |\n|------|------|\n| **拾取物品到背包** | 调用 `CreateItem(definitionId)` 生成 ECS 实体，再通过 `TryAutoPlaceItem` 放入目标容器的空闲网格位置 |\n| **穿戴装备** | `TryMoveItemToNamedSlot` 将武器放入右手槽 → `InventoryEquipmentGrantSyncSystem` 同步到 GAS 能力槽位 → 角色获得该装备绑定的新能力 |\n| **拆分堆叠** | `TrySplitStack` 将一组药水拆出一半，分别放入背包和快捷栏 |\n| **消费物品** | `ConsumeStackUnits` 扣除指定数量，当 `StackCount` 减至 0 时销毁实体 |\n| **交易/Exchange** | `ExchangeRuntime` 调用 `InventoryRuntimeService.ConsumeStackUnits` 扣减输入，调用 `TryCreateAndPlaceItem` 生成输出，失败时自动回滚 |\n| **嵌套容器** | 背包里放宝箱，宝箱里有物品。`ItemMountedContainerCm` 支持物品挂载子容器，形成树状容器结构 |\n\n---\n\n## 4. 核心能力\n\n### 4.1 Item（物品）\n\n- **物品定义**：`ItemDefinition`（`Items/ItemModel.cs`）包含标签、效果、能力授予、挂载容器定义。`ItemDefinitionRegistry`（同文件）管理定义注册。\n- **形状定义**：`ItemShapeDefinition`（`Items/ItemModel.cs`）支持多旋转（`GetRotation(int)`），用于网格碰撞检测。\n- **物品实例**：`ItemInstanceCm`（`Items/ItemComponents.cs`）存储 `DefinitionId`、`StackCount`（堆叠数）、`Charges`（充能次数）、`Durability`（耐久度）。\n- **物品位置**：`ItemLocationCm`（`Items/ItemComponents.cs`）记录 `Container`（所在容器实体）、`PlacementKind`（Grid 或 NamedSlot）、`GridX`/`GridY`（网格坐标）、`NamedSlotIndex`（命名插槽索引）、`RotationQuarterTurns`（旋转次数，0–3）。\n\n### 4.2 Container（容器）\n\n- **容器组件**：`ItemContainerCm`（`Items/ItemComponents.cs`）存储 `LayoutId`（布局定义 ID）和 `Purpose`（用途标记）。\n- **布局定义**：`ItemLayoutDefinition`（`Items/ItemModel.cs`）支持 `HasGrid`（网格布局）和 `IsBlockedCell(...)`（阻塞格子检测），以及 `TryGetNamedSlotIndex(...)`（命名插槽查询）。\n- **挂载容器**：`ItemMountedContainerCm`（`Items/ItemComponents.cs`）支持物品挂载子容器（`ParentItem` + `MountIndex`），实现容器嵌套。\n- **布局注册**：`ItemLayoutRegistry`（`Items/ItemModel.cs`）管理所有容器布局注册。\n\n### 4.3 Inventory（库存运行时）\n\n- **核心服务**：`InventoryRuntimeService`（`Items/InventoryRuntimeService.cs`）提供 ECS 查询驱动的库存操作：\n  - `CreateContainer(...)`：创建容器实体\n  - `CreateItem(...)`：创建物品实体\n  - `TryMoveItemToNamedSlot(...)`：移动到命名插槽\n  - `TryMoveItemToGrid(...)`：移动到网格指定位置\n  - `TryAutoPlaceItem(...)`：自动寻找空闲位置放置\n  - `TrySplitStack(...)`：拆分堆叠\n  - `ConsumeStackUnits(...)`：消费指定数量\n  - `DestroyItemTree(...)`：递归销毁物品及其挂载子树\n- **自动放置**：`TryAutoPlaceItem` 在 Grid 布局中按形状+旋转做碰撞检测，在 NamedSlot 布局中查找空槽位。\n- **回滚语义**：`ConsumeStackUnits` 带记录的重载版本支持回滚（`RestoreConsumedUnits`）。但 **当 `StackCount` 减至 0 触发 `DestroyItemEntity` 时，回滚语义存在风险**：`consumedRecords` 虽记录了 `HadLocation` 和 `Location`，但 `DestroyItemEntity` 若不可逆，则回滚无法完全重建原实体。> **文档过承诺/待实现**：消费导致实体销毁场景下的完整回滚恢复需进一步验证。\n\n### 4.4 Equipment（装备系统）\n\n- **装备插槽**：`ItemLayoutDefinition` 的 NamedSlot 布局定义装备部位（如 Head、Chest、RightHand、LeftHand）。\n- **能力槽位同步**：`InventoryEquipmentGrantSyncSystem`（`Items/InventoryEquipmentGrantSyncSystem.cs`）监听装备变更，将物品上的 `ItemGrantedSlotBuffer` 同步到实体的 `AbilitySlotResolver`。\n- **物品授予槽位**：`ItemGrantedSlotBuffer`（`Items/ItemComponents.cs`）提供 8 槽能力覆盖，支持 `SetOverride`、`HasOverride`、`GetOverride`。装备穿上时激活覆盖，脱下时移除。\n- **属性加成**：`ItemDefinition` 可配置 `OnEquipEffects`（装备时自动施加的 Effect），通过 GAS Effect Pipeline 实现属性加成。> **注意**：装备属性加成依赖 GAS 的 Effect 系统，不单独维护平行加成管线。\n\n### 4.5 物品 Showcase 套件\n\n物品 Showcase 是 Ludots 的**标准验收入口**（`mods/showcases/capability_standard/`），提供以下演示场景：\n\n- **物品创建与放置**：展示 `CreateItem` + `TryAutoPlaceItem` 的网格碰撞检测与旋转适配\n- **装备穿戴/脱下**：展示 `TryMoveItemToNamedSlot` + `InventoryEquipmentGrantSyncSystem` 的能力槽位同步\n- **堆叠与拆分**：展示 `TrySplitStack` 在 Grid 与 NamedSlot 两种布局下的行为\n- **容器嵌套**：展示 `ItemMountedContainerCm` 的父子容器树操作\n- **Exchange 集成**：展示 `ExchangeRuntime` 通过 `InventoryRuntimeService` 进行原子交易\n\nShowcase 套件的命令列表详见 `gitbook/architecture/capability-standard-showcases.md`。\n\n---\n\n## 5. 输入 / 输出\n\n### 5.1 输入\n\n| 输入 | 来源 | 处理者 |\n|------|------|--------|\n| 物品配置 JSON | Mod / ConfigPipeline | `ItemConfigLoader` |\n| 拾取/移动指令 | 玩家输入 / AI / Exchange | `InventoryRuntimeService` |\n| 装备变更指令 | 玩家 UI / 自动换装 | `TryMoveItemToNamedSlot` + `InventoryEquipmentGrantSyncSystem` |\n| 消费/销毁指令 | 技能使用 / Exchange / 任务 | `ConsumeStackUnits` / `DestroyItemTree` |\n\n### 5.2 输出\n\n| 输出 | 目标 | 驱动者 |\n|------|------|--------|\n| 物品实体（ECS） | Arch World | `InventoryRuntimeService.CreateItem` |\n| 能力槽位覆盖 | GAS `AbilitySlotResolver` | `InventoryEquipmentGrantSyncSystem` |\n| EffectRequest（装备效果） | GAS Effect Pipeline | `ItemDefinition.OnEquipEffects` → `EffectRequestQueue` |\n| 容器状态变更 | UI 渲染 | ECS 查询 `ItemLocationCm` + `ItemContainerCm` |\n| 物品销毁/创建回滚 | Exchange 原子结算 | `ExchangeRuntime` |\n\n---\n\n## 6. 依赖关系\n\n```\nItems & Inventory\n├── 依赖 GAS：装备变更通过 InventoryEquipmentGrantSyncSystem 同步到 AbilitySlotResolver\n├── 依赖 Exchange：ExchangeRuntime 调用 InventoryRuntimeService 进行物品扣减/创建\n├── 依赖 ConfigPipeline：ItemConfigLoader 加载 JSON 到 ItemDefinitionRegistry / ItemShapeRegistry / ItemLayoutRegistry\n├── 依赖 Arch ECS：所有物品/容器均为 ECS Entity，通过 Component 存储状态\n└── 依赖 Presentation/UI：ItemLocationCm / ItemInstanceCm 提供 UI 绑定数据\n```\n\n---\n\n## 7. 非功能需求\n\n| 需求 | 目标 | 实现方式 |\n|------|------|----------|\n| **性能** | 1,000+ 物品同时操作无 GC | 0-GC struct 组件、ECS 批量查询、无 Dictionary 热路径 |\n| **内存** | 单物品存储紧凑 | `ItemInstanceCm` 内联存储，`ItemLocationCm` 固定字段 |\n| **原子性** | 交易不中途失败 | `ExchangeRuntime` 预校验 + 分阶段 Apply + 失败回滚 |\n| **可扩展性** | Mod 可定义新物品/形状/布局 | 加载期 Registry + `ItemConfigLoader` |\n| **可测试性** | Showcase 可自动化验证 | `mods/showcases/capability_standard/` 提供标准验收入口 |\n\n---\n\n## 8. 关键类清单\n\n### 8.1 定义与注册表\n\n| 类 | 路径 | 职责 |\n|----|------|------|\n| `ItemDefinition` | `src/Core/Gameplay/Items/ItemModel.cs` | 物品定义（标签/效果/能力授予/挂载容器） |\n| `ItemDefinitionRegistry` | `src/Core/Gameplay/Items/ItemModel.cs` | 物品定义注册表 |\n| `ItemShapeDefinition` | `src/Core/Gameplay/Items/ItemModel.cs` | 物品形状定义（多旋转） |\n| `ItemShapeRegistry` | `src/Core/Gameplay/Items/ItemModel.cs` | 物品形状注册表 |\n| `ItemLayoutDefinition` | `src/Core/Gameplay/Items/ItemModel.cs` | 容器布局定义（Grid/NamedSlot） |\n| `ItemLayoutRegistry` | `src/Core/Gameplay/Items/ItemModel.cs` | 容器布局注册表 |\n| `ItemConfigLoader` | `src/Core/Gameplay/Items/ItemConfigLoader.cs` | 物品配置加载器 |\n\n### 8.2 ECS 组件\n\n| 组件 | 路径 | 职责 |\n|------|------|------|\n| `ItemInstanceCm` | `src/Core/Gameplay/Items/ItemComponents.cs` | 物品实例（DefinitionId / StackCount / Charges / Durability） |\n| `ItemLocationCm` | `src/Core/Gameplay/Items/ItemComponents.cs` | 物品位置（Container / PlacementKind / GridX / GridY / NamedSlotIndex / RotationQuarterTurns） |\n| `ItemContainerCm` | `src/Core/Gameplay/Items/ItemComponents.cs` | 容器组件（LayoutId / Purpose） |\n| `ItemMountedContainerCm` | `src/Core/Gameplay/Items/ItemComponents.cs` | 挂载容器组件（ParentItem / MountIndex） |\n| `ItemGrantedSlotBuffer` | `src/Core/Gameplay/Items/ItemComponents.cs` | 物品授予能力槽位（8 槽覆盖） |\n\n### 8.3 运行时服务与系统\n\n| 类 | 路径 | 职责 |\n|----|------|------|\n| `InventoryRuntimeService` | `src/Core/Gameplay/Items/InventoryRuntimeService.cs` | 库存运行时服务（创建/移动/拆分/消费/销毁） |\n| `InventoryEquipmentGrantSyncSystem` | `src/Core/Gameplay/Items/InventoryEquipmentGrantSyncSystem.cs` | 装备→能力槽位同步系统 |\n\n---\n\n*本 PRD 基于 `report_Gameplay_GAS.md` Stage 1 扫描报告编写。回滚语义未完善项已在文中标注。*\n";

document.getElementById('content').innerHTML = marked.parse(mdContent);
</script>
