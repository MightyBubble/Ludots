const mdContent = "# 产品概述（Product Overview）\n\n## 1. 产品定位\n\n**Ludots** 是一个基于 **Arch ECS**（Entity Component System）架构的高性能 C# 游戏引擎框架，定位于**\"游戏逻辑基础设施\"**——而非传统意义上的全功能游戏引擎（如 Unity 或 Unreal）。它不提供完整的关卡编辑器、材质系统或动画制作工具，而是提供一套高度可扩展的**逻辑仿真管线**（Simulation Pipeline）与**表现抽象层**（Presentation Abstraction），让开发者将精力集中在游戏设计而非引擎集成上。\n\nLudots 的核心设计哲学是 **\"一切皆 Mod\"**：引擎本身的最小核心（`LudotsCoreMod`）以 `priority: -1000` 加载，仅提供 ECS 运行时、System 分组、配置合并、Mod 加载与存档等基础设施。所有游戏逻辑——RTS 的单位调度、MOBA 的技能释放、ARPG 的装备系统、回合制策略的外交贸易——均以独立 `IMod` 的形式存在，通过 `IModContext` 的正式扩展点注册到引擎中。这种设计严格遵循**六边形架构**（Ports and Adapters）：Core 层只依赖抽象接口（`IInputBackend`、`ICameraAdapter`、`IViewController`），所有平台 specifics（Raylib 窗口、WebSocket、Three.js 渲染、Skia UI 合成）被隔离在 Adapter 层。\n\n## 2. 用户画像\n\n### 2.1 独立游戏开发者（Indie Game Developer）\n\n**核心诉求**：在有限团队规模下快速构建可验证的游戏原型，同时保证架构在长期演进中不会崩溃。\n\n**Ludots 提供的价值**：\n- 开箱即用的 GAS（Gameplay Ability System）管线，无需从零实现技能/效果/属性计算。\n- `TemplateEntityBatchSpawner` 实现千人同屏级别的实体批量生成，无需手写 ECS chunk 操作。\n- 双平台路径：Raylib 桌面路径用于开发调试与基准测试；Web 串流路径用于快速分发与浏览器试玩。\n- 50+ 个现有 Mod 作为参考实现（`RtsDemoMod`、`MobaDemoMod`、`ArpgDemoMod` 等），可直接阅读源码学习最佳实践。\n\n**典型用户路径**：\n```\nclone 仓库 → 运行 launcher --adapter raylib --mod RtsDemoMod\n→ 阅读 RtsDemoModEntry.cs 了解 OnLoad 注册模式\n→ 复制 ExampleMod 目录，修改 mod.json 与 Entry 类\n→ 通过 ConfigPipeline 覆写 game.json 配置\n→ 通过 IModContext.RegisterSystemFactory 注册自定义 System\n```\n\n### 2.2 Mod 作者（Mod Author）\n\n**核心诉求**：在不修改引擎源码、不重新编译引擎的前提下，扩展或修改游戏玩法。\n\n**Ludots 提供的价值**：\n- `IModContext` 提供 6 个正式扩展点（`OnEvent`、`SystemFactoryRegistry`、`TriggerDecorators`、`FunctionRegistry`、`VFS`、`LogChannel`），所有操作均通过接口契约完成，禁止直接访问 Core 内部状态。\n- `ConfigPipeline` 自动合并 Mod 的 `assets/Configs/game.json` 与引擎默认配置，无需手动解析 JSON。\n- `VirtualFileSystem` 以 `ModId:Path` 格式统一资源访问，Mod 可以覆写其他 Mod 的资源（通过 `priority` 控制合并顺序）。\n- `TriggerDecoratorRegistry` 允许跨 Mod 注入命令到已有 Trigger（如给所有 `map_ready` 锚点的 Trigger 添加相机初始化命令）。\n\n### 2.3 工具开发者（Tool Developer）\n\n**核心诉求**：为 Ludots 生态开发外部编辑器、数据验证工具、CI 流水线或服务器后端。\n\n**Ludots 提供的价值**：\n- `ScriptContext` + `CoreServiceKeys` 提供类型安全的服务访问机制，工具可以通过 `GameContext.GetService<T>(ServiceKey<T>)` 读取运行时状态。\n- `.ldsave` 存档格式规范公开，工具可以独立解析 `header.json` + `domains.json` + `world.bin`。\n- `StringIntRegistry` 的公开 API 允许工具读取 ID 映射（如 `AbilityIdRegistry`、`AttributeRegistry`），生成数据字典或文档。\n- `GraphCompiler` + `GraphValidator` 提供独立的图校验与编译能力，工具可以在不启动引擎的情况下验证 GAS 图配置的正确性。\n\n### 2.4 大型团队技术负责人（Tech Lead）\n\n**核心诉求**：架构治理、多团队协作、长期可维护、避免技术债务。\n\n**Ludots 提供的价值**：\n- 六边形架构严格隔离 Core / Gameplay / Presentation / Adapter 四层，每层只向下依赖，禁止跨层访问。\n- `ComponentRegistry` 的冲突报告（Conflict Report）在引擎启动时自动打印，帮助发现 Mod 之间的组件注册冲突。\n- `DependencyResolver` 的 SemVer 范围匹配（`^`、`~`、`>=`、`<=`）确保 Mod 依赖兼容性可追踪。\n- `ModLoadContext` 的 `AssemblyLoadContext`（`isCollectible: true`）支持 Mod 热卸载与重载，降低测试与迭代成本。\n\n## 3. 使用场景\n\n### 3.1 RTS（即时战略）\n\n**典型需求**：大规模单位调度、编队移动、资源采集、战争迷雾、科技树、技能释放。\n\n**Ludots 支持能力**：\n- `MassNavigationRuntime` + `NavTileStore` + `AutoPathService` + `NodeGraphPathServiceAdapter` 提供多策略寻路（A* + MassNavigation）。\n- `ChunkedGridSpatialPartitionWorld` / `HexGridAOI` 支持空间分区与六边形 AOI 查询。\n- `VisionSystem` / `FogField` / `FogFieldStore` 提供战争迷雾与视野解析。\n- `TeamManager` / `RelationshipRuntime` 支持阵营关系与外交关系网络。\n- `ExchangeRuntime` / `ExchangeOperationRegistry` 支持资源交易与经济系统。\n- `RuntimeEntitySpawnSystem` / `TemplateEntityBatchSpawner` 支持大规模单位批量生成。\n\n**参考 Mod**：`RtsDemoMod`、`RtsStarcraftLikeMod`、`RtsRedAlertLikeMod`、`RtsTrainingCncMod`、`RtsTrainingSc2Mod`、`RtsTrainingWar3Mod`、`RtsPlacementCncMod`、`RtsWarpGateSc2Mod`、`RtsBuildWar3Mod`、`RtsGarrisonSharedMod`。\n\n### 3.2 MOBA（多人在线战术竞技）\n\n**典型需求**：英雄技能设计、属性计算、装备系统、团队战斗、视野控制、投射物追踪。\n\n**Ludots 支持能力**：\n- `AbilityDefinitionRegistry` / `AbilityIndicatorConfig` / `AbilityToggleSpec` 提供完整的能力定义。\n- `EffectPhaseExecutor` / `EffectPhase`（OnCast / OnCommit / OnImpact / OnExpire）驱动技能效果阶段。\n- `BuiltinHandlerRegistry`（11 个内置 handler）支持 `ApplyModifiers`、`ApplyForce`、`SpatialQuery`、`CreateProjectile`、`CreateUnit` 等通用效果。\n- `AttributeBindingSystem` / `AttributeSinkRegistry` 支持属性（攻击力、防御力、生命值）的实时计算与缓冲。\n- `GameplayCueSystem` / `CueEventBuffer` 支持技能表现（粒子、音效、屏幕震动）的事件驱动。\n\n**参考 Mod**：`MobaDemoMod`、`ChampionSkillSandboxMod`、`ChampionSkillStressEntryMod`。\n\n### 3.3 ARPG（动作角色扮演）\n\n**典型需求**：实时战斗、装备/物品系统、角色成长、叙事任务、实体生成与销毁。\n\n**Ludots 支持能力**：\n- `InventoryRuntimeService` / `ItemModel` / `ItemLayoutDefinition` 支持 8 种物品用途（背包、装备、stash 等）。\n- `ProgressionDomain` / `ProgressionRequirementEvaluator` 支持 8 种进度需求节点（All/Any/Not/EntityCount/TagAll/GraphValidation 等）。\n- `NarrativeDirector`（1156 行）管理 Quest、Dialogue、Cinematic、Variables、Entity Bindings，支持 Snapshot/Restore。\n- `RuntimeEntitySpawnSystem`（1246 行）支持 `PerformerEntityRuntime` 绑定与 `PresentationStableId` 生成。\n\n**参考 Mod**：`ArpgDemoMod`。\n\n### 3.4 回合制策略（Turn-based / 4X）\n\n**典型需求**：回合管理、外交关系、贸易交易、科技树、地图层控制、实体关联。\n\n**Ludots 支持能力**：\n- `ExchangeRuntime.TryExecute(operationId, context)` 支持交易验证、扣减输入、生成输出、回滚（Rollback）。\n- `RelationshipRuntime`（482 行）基于 Arch.Core `Relationship<RelationshipEdgeSet>` 实现 source→target 的多类型关系图，支持 `HasLink`、`EnsureLink`、`SetMetric`、`AddMetric`、`GetSynergy`。\n- `MapManager` / `MapSession` / `MapSessionManager` 支持地图继承、循环检测、Code-First `MapDefinition` 与 JSON `MapConfig` 合并加载。\n- `TeamManager` 支持对称/非对称阵营关系，`DefaultRelationship` 可配置（⚠️ 注意：代码中硬编码为 `Hostile`，但 `TeamConfig` 默认值为 `Neutral`，存在不一致）。\n\n**参考 Mod**：`FourXDemoMod`、`DiplomacyTradeGateMod`、`FourXAssociationMod`。\n\n## 4. 版本目标\n\n### 4.1 当前 main 已实现的能力\n\n| 能力域 | 状态 | 关键证据 |\n|--------|------|---------|\n| ECS 核心（World、SystemGroup、TimeFlow） | ✅ 完整 | `GameEngine.cs`（2967 行）、`WorldRuntime.cs`、`SystemFactoryRegistry.cs` |\n| GAS 管线（Ability、Effect、Attribute、Tag） | ✅ 完整 | `AbilityDefinitionRegistry.cs`、`EffectPhaseExecutor.cs`、`AttributeBindingSystem.cs`、`TagOps.cs` |\n| 实体生成（Spawn、Template、Batch） | ✅ 完整 | `RuntimeEntitySpawnSystem.cs`（1246 行）、`TemplateEntityBatchSpawner.cs`、`EntityBuilder.cs` |\n| 寻路与导航（NavMesh、MassNavigation、Path） | ✅ 完整 | `NavQueryServiceRegistry.cs`、`MassNavigationRuntime.cs`、`PathStore.cs`、`AutoPathService.cs` |\n| 空间查询（AABB、Radius、Cone、Hex） | ✅ 完整 | `SpatialQueryService.cs`（325 行）、`ChunkedGridSpatialPartitionWorld.cs` |\n| 物品与库存（Item、Inventory、Equipment） | ✅ 完整 | `InventoryRuntimeService.cs`、`ItemModel.cs`、`ItemConfigLoader.cs` |\n| 交易与经济（Exchange、Rollback） | ✅ 完整 | `ExchangeRuntime.cs`、`ExchangeOperationRegistry.cs` |\n| 关系网络（Relationship、Team、Synergy） | ✅ 完整 | `RelationshipRuntime.cs`（482 行）、`RelationshipProcessingSystem.cs`、`TeamManager.cs` |\n| 叙事系统（Quest、Dialogue、Cinematic） | ✅ 完整 | `NarrativeDirector.cs`（1156 行）、`NarrativeRuntimeSystem.cs` |\n| 进度系统（Progression、Requirement） | ✅ 完整 | `ProgressionDomain.cs`、`ProgressionRequirementEvaluator.cs` |\n| 表现系统（Primitive、Performer、UI、Tween） | ✅ 完整 | `PresentationEntityLifecycle.cs`、`PerformerEntityRuntime.cs`、`UIRoot.cs`、`TweenTrack.cs` |\n| 相机系统（Camera、Culling、Minimap） | ✅ 完整 | `CameraRuntimeSystem.cs`、`CameraCullingSystem.cs`、`MinimapRenderSystem.cs` |\n| 配置管线（DeepMerge、ArrayById、Catalog） | ✅ 完整 | `ConfigPipeline.cs`（218 行）、`ConfigMerger.cs`、`ConfigCatalogLoader.cs` |\n| 图运行时 VM（GraphCompiler、GraphExecutor） | ✅ 完整 | `GraphCompiler.cs`、`GraphExecutor.cs`（38 行）、`GraphProgramRegistry.cs` |\n| Mod 加载（ALC、VFS、DependencyResolver） | ✅ 完整 | `ModLoader.cs`（599 行）、`ModLoadContext.cs`（290 行）、`DependencyResolver.cs` |\n| 存档系统（Snapshot、Binary、.ldsave） | ✅ 完整 | `WorldSnapshotService.cs`、`LudotsBinaryWorldSerializer.cs`、`SaveContainerCodec.cs` |\n| Raylib 适配器（3D 渲染、Skia UI、输入） | ✅ 完整 | `RaylibHostLoop.cs`（1996 行）、`RaylibHostComposer.cs`（111 行）、`RaylibPrimitiveRenderer.cs` |\n| Web 串流适配器（WebSocket、二进制帧、Three.js） | ✅ 完整 | `WebHostLoop.cs`、`WebTransportLayer.cs`、`BinaryFrameEncoder.cs`、`FrameProtocol.cs` |\n\n### 4.2 规划中 / 文档过承诺的能力\n\n| 能力域 | 状态 | 说明 |\n|--------|------|------|\n| UE5 适配器 | ❌ 空壳 | `src/Adapters/UE5/` 目录下**无任何 `.cs` 源码文件**，仅有构建残留。文档中将其作为未来目标引用，但当前完全不可用。 |\n| Ultralight 浏览器 Provider | ❌ 缺失 | `docs/architecture/browser_ui_runtime.md` 将其列为正式内置 provider，但仓库中无 `Ludots.UI.Browser.Ultralight` 项目。 |\n| WebUI DataPlane 高级机制 | ⚠️ 未落地 | `docs/architecture/webui_dataplane_architecture.md` 描述了 `IWebUiDataTransport`、`entity-10k-delta`、`minimap-250k-static` 等高级机制，但 `WebHostLoop` 实际使用的是低层二进制帧协议，未使用 DataPlane 能力。 |\n| Unity 适配器 | ❌ 不存在 | `docs/architecture/adapter_pattern.md` 提及 `UnityRenderAdapter` 为示例，但仓库中无此实现。 |\n| `Authority` 与 `Budgeted` 仿真车道 | ⚠️ 未确认 | `gitbook/architecture/entity-simulation-layering.md` 详细描述了 Authority/Budgeted 车道概念，但代码中 `Authority` 组件/标记在本次扫描中未明确发现。`SimulationBudgetFuseEvent` 已存在，但车道标记可能尚未实现。 |\n| Performer 编译式执行车道 | ⚠️ 未确认 | `gitbook/architecture/performer-compiled-lanes.md` 描述了编译式执行分层，但代码中缺少显式的 \"compiled lane\" 标识或接口。`PerformerRuleSystem` 和 `PerformerBehaviorSystem` 可能是对应实现，但尚未验证。 |\n| `GameEvents.ModLoaded` 事件 | ❌ 未实现 | `ModLoader.cs` 第 419 行注释 \"will be implemented in future TriggerManager\"，但 `TriggerManager` 已支持 `FireEvent`，该事件只是未在 Mod 加载时触发。 |\n| FormationPhysicsPlaygroundMod | ❌ 源码缺失 | 被 `uat-playable-showcase-matrix.md` 宣称为 UAT-1 主入口，但目录下仅有预编译 DLL，无源码。 |\n\n## 5. 依赖关系\n\n| 层级 | 依赖项 | 版本/说明 |\n|------|--------|----------|\n| Core 运行时 | `Arch` / `Arch.System` / `Arch.Persistence` | ECS 核心、二进制序列化 |\n| Core 运行时 | `JobScheduler` | 并行 System 执行 |\n| Raylib 路径 | `Raylib-cs` | 跨平台图形/输入 |\n| Raylib 路径 | `SkiaSharp` | 2D 矢量 UI 渲染 |\n| Web 路径 | `ASP.NET Core` + `System.Net.WebSockets` | WebSocket 服务器 |\n| Web 客户端 | `Three.js` | 浏览器端 3D 渲染 |\n| 编译时 | `.NET 8` | 目标框架 |\n\n## 6. 非功能需求（性能约束）\n\n| 约束项 | 目标值 | 当前实现 |\n|--------|--------|---------|\n| 逻辑帧率 | 固定 50 Hz（默认） | `Time.FixedDeltaTime = 0.02f`，可在 `EngineClockConfig` 中覆盖。 |\n| 仿真预算 | 可配置 ms/帧 + 最大 slices/帧 | `IPacemaker` 控制，`SimulationBudgetMsPerFrame` 与 `SimulationMaxSlicesPerLogicFrame` 防止逻辑帧耗尽宿主线程。 |\n| 批量实体生成 | 10,000+ 实体/帧 | `TemplateEntityBatchSpawner` 直接通过 Arch chunk span 填充组件，绕过 `ComponentRegistry` 逐 entity 设置。 |\n| 二进制帧大小 | < 50 KB（典型场景） | `BinaryFrameEncoder` 零分配编码 + `DeltaCompressor` 仅传输变更项。 |\n| 图 VM 执行 | < 4096 指令/次 | `GraphVmLimits.MaxInstructionsPerExecution = 4096`，防止无限循环。 |\n| 存档加载时间 | < 2 秒（中型世界） | `LudotsBinaryWorldSerializer` 基于 `Arch.Persistence` 的原始字节序列化，无需反射。 |\n| Mod 内存隔离 | 支持 collectible ALC 卸载 | `ModLoadContext` 继承 `AssemblyLoadContext`（`isCollectible: true`），`UnloadAll` 可卸载。 |\n\n---\n\n> **版本说明**：本章节基于 Ludots `main` 分支（2026-07-02 扫描）。⚠️ 标注为「文档过承诺/待实现」的能力，在当前代码中不存在或仅有空壳。";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
