const mdContent = "# 平台适配器（Platform Adapters）\n\n## 1. 功能概述\n\nLudots 的**平台适配器层（Platform Adapters）** 严格遵循六边形架构的 **Ports and Adapters** 原则：Core 层只依赖抽象端口（`IInputBackend`、`ICameraAdapter`、`IViewController`、`IUiSystem` 等），所有平台特定的实现（Raylib 窗口、WebSocket、Three.js 渲染、Skia UI 合成）被隔离在 Adapter 与 Client 项目中。适配器层不是 Mod，不走 `IMod.OnLoad`，而是由 Launcher CLI 在启动时选择（`--adapter raylib` / `--adapter web`），通过 `GameBootstrapper` 加载对应的 adapter app DLL。\n\n当前支持三条平台路径：\n- **Raylib 桌面路径**（完整实现）：`src/Apps/Raylib/` → `RaylibGameHost` → `RaylibHostLoop`，以原生窗口驱动 3D 渲染（地形、Instanced Mesh、Skia UI Overlay），适用于开发调试、基准测试与能力验证。\n- **Web 串流路径**（完整实现）：`src/Apps/Web/` → `WebGameHost` → `WebHostLoop`，以 ASP.NET Core 宿主 WebSocket 服务器，将每帧的相机/图元/GroundOverlay/HUD/UI 场景编码为二进制协议，推送给基于 Three.js 的瘦客户端（`src/Client/Web`）。\n- **UE5 路径**（⚠️ 空壳/规划）：`src/Adapters/UE5/` 目录下**无任何 `.cs` 源码文件**，仅有 `bin/` 和 `obj/` 构建残留。文档中将其作为未来目标引用，但当前完全不可用。\n\n## 2. 目标用户\n\n- **平台开发者**：需要理解 `IGameHost`、`IInputBackend`、`ICameraAdapter` 等抽象端口，以及 Raylib/Web 的具体实现。\n- **Web 开发者**：需要理解 `FrameProtocol`、`BinaryFrameEncoder`、`DeltaCompressor` 和 Web 客户端的 `FrameDecoder` 解码逻辑。\n- **UI 开发者**：需要理解 `RaylibOverlayCompositor` 的 Skia 三层合成（Underlay / UI / Overlay）和 `WebUiRuntimeBridge` 的 `UiScene` 序列化。\n- **技术负责人**：需要评估不同平台的成熟度、功能覆盖率和性能特征，以选择合适的产品路径。\n\n## 3. 使用场景\n\n- **Raylib 开发调试**：开发者运行 `launcher --adapter raylib --mod RtsDemoMod`，在原生窗口中调试 gameplay 逻辑、观察 3D 渲染和 UI 交互。\n- **Web 浏览器试玩**：部署 `Ludots.App.Web`，玩家通过浏览器访问 `http://localhost:5000`，WebSocket 接收二进制帧，Three.js 渲染游戏画面，Canvas 2D 绘制 HUD。\n- **基准测试**：`RaylibBenchmarkRenderService` 驱动 `RaylibBenchmarkRenderer`，响应鼠标 slider 调整实例数，生成 Skia HUD 压力面板，用于验证引擎性能。\n- **跨平台产品发布**：同一套 Core 逻辑通过不同的 Adapter 部署到桌面（Raylib）和浏览器（Web），无需修改 gameplay 代码。\n- **UI 迭代**：`MarkupUiSystem` 加载 HTML/CSS 定义 UI 布局，`SkiaUiRenderer` 在 Raylib 路径中渲染，Web 路径中通过 `WebUiRuntimeBridge` 序列化为 JSON 推送。\n\n![三平台对比](../diagrams/adapter-comparison.svg)\n\n## 4. 核心能力\n\n### 4.1 Raylib 桌面路径（完整实现）\n\n![Raylib 渲染循环](../diagrams/raylib-render-loop.svg)\n\n#### RaylibHostComposer — 依赖组装器\n\n`RaylibHostComposer`（111 行）是静态依赖组装器：\n\n```csharp\npublic static class RaylibHostComposer\n{\n    public static RaylibHostSetup Compose(string baseDir, string configFile)\n    {\n        // 1. GameBootstrapper.InitializeFromBaseDirectory(baseDir, configFile)\n        // 2. 加载 PresentationHostAssetConfigLoader\n        // 3. 注入 SkiaUiRenderer\n        // 4. 注入 UIRoot\n        // 5. 注入 MarkupUiSystem (IUiSystem)\n        // 6. 注入 RaylibInputBackend (IInputBackend)\n        // 7. 注入 PlayerInputHandler\n        // 8. 验证所有必需 CoreServiceKeys\n    }\n}\n```\n\n**关键文件**：`src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibHostComposer.cs`。\n\n#### RaylibHostLoop — 主循环驱动\n\n`RaylibHostLoop`（1996 行）是 Raylib 路径的主循环：\n\n```\n[RaylibHostLoop.Run]\n  │\n  ├─► 窗口事件轮询 (WindowShouldClose, Resize)\n  │\n  ├─► UI 输入更新 (UpdateInput)\n  │   ├─ RaylibInputBackend → PointerEvent/KeyboardEvent → UIRoot.HandleInput\n  │   └─ 返回 uiCaptured, uiWheelCaptured → 写入 CoreServiceKeys.UiCaptured\n  │\n  ├─► engine.Tick(dt)  [Core 逻辑帧]\n  │   ├─ SystemGroup phases (InputCollection → AbilityActivation → EffectProcessing → ...)\n  │   └─ 生成 Presentation buffers\n  │\n  ├─► 相机插值更新 (cameraPresenter.Update)\n  │\n  ├─► 3D 渲染阶段 (BeginMode3D)\n  │   ├─ Terrain / VisualHeightmap (RaylibTerrainRenderer / RaylibVisualHeightmapRenderer)\n  │   ├─ Global Field Overlays (Fog) (RaylibFieldRenderPerformer)\n  │   ├─ Primitives (RaylibPrimitiveRenderer)\n  │   │   ├─ Immediate 模式：逐 item 绘制\n  │   │   ├─ Instanced 模式：批量提交\n  │   │   └─ Persistent ISM 模式：持久化静态批次 (RaylibIsmRenderBridge)\n  │   ├─ Ground Overlays (range circles, cones)\n  │   ├─ Road Splines\n  │   └─ DebugDraw (lines, circles, boxes) (RaylibDebugDrawRenderer)\n  │\n  ├─► 2D / UI 渲染阶段 (EndMode3D)\n  │   ├─ Browser Layer (RaylibBrowserLayerRenderer)\n  │   │   └── 上传 CEF 帧到 Texture2D\n  │   └─ Overlay Composite (RaylibOverlayCompositor)\n  │       ├─ Underlay (Skia, PresentationOverlayScene)\n  │       ├─ UI Layer (Skia, UIRoot.Scene)\n  │       └─ Top Overlay (Skia, PresentationOverlayScene)\n  │\n  └─► 诊断 HUD / Screenshot / 帧率控制\n```\n\n**关键文件**：`src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibHostLoop.cs`。\n\n#### RaylibPrimitiveRenderer — 核心 3D 渲染器\n\n`RaylibPrimitiveRenderer` 支持三种渲染模式：\n\n| 模式 | 说明 | 适用场景 |\n|------|------|---------|\n| `Immediate` | 逐 item 绘制，每帧重建 | 动态变化的小批量物体 |\n| `Instanced` | 批量提交，每帧更新 instance buffer | 中等批量动态物体 |\n| `Persistent ISM` | 持久化静态批次，仅在变化时更新 | 大量静态物体（建筑、地形装饰） |\n\n还支持 `SkinnedVisualBatchBuffer`：GPU Skinned Instance + 原型动画降级。\n\n**关键文件**：`src/Client/Ludots.Client.Raylib/Rendering/RaylibPrimitiveRenderer.cs`。\n\n#### RaylibOverlayCompositor — Skia UI 合成器\n\n`RaylibOverlayCompositor` 管理三层 Skia 输出：\n\n| 层 | 内容 | 渲染方式 |\n|----|------|---------|\n| Underlay | `PresentationOverlayScene` | GPU direct underlay (`RaylibSkiaGpuOverlaySurface`) / Framebuffer direct underlay (`RaylibSkiaFramebufferOverlaySurface`) |\n| UI Layer | `UIRoot.Scene` | 纯 Raster 回退 (`RaylibSkiaRenderer`) |\n| Top Overlay | `PresentationOverlayScene` | 同上 |\n\n按 `IsDirty` 与版本号决定重绘策略，避免不必要的 Skia 绘制。\n\n**关键文件**：`src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibOverlayCompositor.cs`。\n\n#### RaylibBrowserLayerRenderer — 浏览器表面渲染\n\n将浏览器表面（`IUiBrowserCanvasContent`）的 BGRA/RGBA 脏矩形帧上传到 Raylib `Texture2D`，并绘制到 UI 层。\n\n⚠️ **注意**：`docs/architecture/browser_ui_runtime.md` 将 Ultralight 列为正式内置 provider，但仓库中无 `Ludots.UI.Browser.Ultralight` 项目。当前实际只有 CEF 实现。\n\n**关键文件**：`src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibBrowserLayerRenderer.cs`。\n\n#### Raylib 服务注入\n\n`RaylibHostComposer` 和 `RaylibHostLoop` 向 `GameEngine` 注入以下服务：\n\n| ServiceKey | 注入类型 | 说明 |\n|------------|---------|------|\n| `LogBackend` | `ILogBackend` | `RaylibConsoleLogBackend`（彩色控制台） |\n| `UIRoot` | `UIRoot` | UI 根节点 |\n| `UiSurfaceHost` | `IUiSurfaceHost` | UI 表面宿主 |\n| `UiTextMeasurer` | `IUiTextMeasurer` | `SkiaTextMeasurer` |\n| `UiImageSizeProvider` | `IUiImageSizeProvider` | `SkiaImageSizeProvider` |\n| `UISystem` | `IUiSystem` | `MarkupUiSystem` |\n| `InputHandler` | `PlayerInputHandler` | 输入处理器 |\n| `InputBackend` | `IInputBackend` | `RaylibInputBackend` |\n| `ViewController` | `IViewController` | `RaylibViewController`（实时读取屏幕宽高） |\n| `ScreenProjector` | `IScreenProjector` | 屏幕投影器 |\n| `ScreenRayProvider` | `IScreenRayProvider` | 屏幕射线提供器 |\n| `CameraCullingDebugState` | `CameraCullingDebugState` | 视锥剔除调试状态 |\n| `RenderCameraDebugState` | `RenderCameraDebugState` | 相机渲染调试状态 |\n| `UiCaptured` | `bool` | UI 是否捕获了输入 |\n| `UiWheelCaptured` | `bool` | UI 是否捕获了滚轮 |\n\n### 4.2 Web 串流路径（完整实现）\n\n![Web 串流](../diagrams/web-streaming.svg)\n\n#### WebHostComposer — 依赖组装器\n\n`WebHostComposer` 逻辑与 `RaylibHostComposer` 几乎一致，但注入 `WebInputBackend`、`WebViewController`、`WebCameraAdapter`、`WebUiRuntimeBridge`、`WebTransportLayer`。\n\n**关键文件**：`src/Adapters/Web/Ludots.Adapter.Web/WebHostComposer.cs`。\n\n#### WebHostLoop — 主循环\n\n`WebHostLoop` 基于 `Thread.Sleep` 的固定帧率（默认 30 FPS）：\n\n```\n[WebHostLoop.Run]\n  │\n  ├─► WebUiRuntimeBridge.Update(dt)\n  │   ├─ SyncResolution → UIRoot.Resize\n  │   ├─ UIRoot.HandleInput (PointerEvent from WebInputBackend)\n  │   └─ 返回 uiCaptured → 写入 CoreServiceKeys.UiCaptured\n  │\n  ├─► engine.Tick(dt)  [与 Raylib 同 Core 逻辑]\n  │\n  ├─► cameraPresenter.Update\n  │\n  ├─► hudProjection?.Update(dt)\n  │\n  ├─► PresentationExtractor.CaptureFrame()\n  │   ├─ 读取所有 Core presentation buffers\n  │   ├─ WebUiRuntimeBridge.TryConsumeScene → uiSceneJson\n  │   └─ BinaryFrameEncoder.Encode → byte[] snapshot\n  │\n  └─► WebTransportLayer.BroadcastFrame(snapshot) → 所有 WebSocket 客户端\n```\n\n**关键文件**：`src/Adapters/Web/Ludots.Adapter.Web/WebHostLoop.cs`。\n\n#### Web 串流协议\n\n##### FrameProtocol（服务器到客户端）\n\n`FrameProtocol` 定义二进制帧协议常量：\n\n| MsgType | 值 | 说明 |\n|---------|----|------|\n| `MsgTypeFrame` | 0x01 | 完整帧 |\n| `MsgTypeMeshMap` | 0x03 | 资产 ID 映射（首次连接发送） |\n| `MsgTypeDelta` | 0x05 | Delta 帧（仅传输变更） |\n\nSection 类型：\n\n| Section | 说明 |\n|---------|------|\n| `Camera` | 相机渲染状态（位置、朝向、FOV） |\n| `Primitives` | 图元绘制数据（Cube/Sphere/Model/Billboard） |\n| `GroundOverlays` | 地面覆盖（范围圈、锥形指示器） |\n| `WorldHud` | 世界空间 HUD（3D 血条/标记） |\n| `ScreenHud` | 屏幕空间 HUD（2D 血条/状态面板） |\n| `DebugDraw` | 调试绘制（线、圆、盒） |\n| `ScreenOverlay` | 屏幕叠加（文字提示、矩形面板） |\n| `UiScene` | UI 场景 JSON |\n| `PrimitivesDelta` | 图元变更 Delta |\n\n⚠️ **注意**：Web 客户端 `FrameDecoder.ts` 第 176 行对 `WorldHud` Section 直接 `skip`（`p += byteLen; break;`），未解析也未渲染。服务器仍在每帧编码并传输该数据，造成带宽浪费。\n\n**关键文件**：`src/Adapters/Web/Ludots.Adapter.Web/Protocol/FrameProtocol.cs`。\n\n##### InputProtocol（客户端到服务器）\n\n| MsgType | 大小 | 字段 |\n|---------|------|------|\n| `MsgTypeInputState` | 33 字节 | ButtonMask, MouseX, MouseY, MouseWheel, KeyBits, ViewportW, ViewportH |\n| `MsgTypePointerEvent` | 30 字节 | Action, ButtonMask, X, Y, DeltaX, DeltaY, ViewportW, ViewportH |\n\n**关键文件**：`src/Adapters/Web/Ludots.Adapter.Web/Protocol/InputProtocol.cs`。\n\n##### BinaryFrameEncoder\n\n零分配二进制编码器：\n- 使用 `Span<byte>` 连续编码。\n- 支持 UTF-8 字符串表和 TextTemplate 表，避免每帧字符串分配。\n\n**关键文件**：`src/Adapters/Web/Ludots.Adapter.Web/Streaming/BinaryFrameEncoder.cs`。\n\n##### DeltaCompressor\n\nDelta 编码器：\n- 对比当前帧与上一帧，仅输出变更的 Primitive item（索引 + 数据）。\n- 仅输出变更的 DebugDraw / Overlay 项。\n\n**关键文件**：`src/Adapters/Web/Ludots.Adapter.Web/Streaming/DeltaCompressor.cs`。\n\n##### PresentationExtractor\n\n每帧调用 `BinaryFrameEncoder` 生成完整帧，捕获 `uiSceneJson`，输出 `byte[] snapshot` + `length`。\n\n**关键文件**：`src/Adapters/Web/Ludots.Adapter.Web/Streaming/PresentationExtractor.cs`。\n\n##### WebTransportLayer\n\nWebSocket 传输层：\n- `ConcurrentDictionary` 管理客户端会话。\n- `BroadcastFrame` 全量复制帧数据到每个客户端。\n- `HandleClientAsync`：receive/send 双循环。\n- `SetMeshMap`：首次连接发送资产 ID 映射。\n\n⚠️ **注意**：`BroadcastFrame` 对每个客户端都生成一份 `byte[]` 拷贝（`ToArray()`），在高并发或高频帧率下 GC 压力较大。可考虑使用 `ArrayPool<byte>` 或 `ReadOnlyMemory<byte>` 共享。\n\n**关键文件**：`src/Adapters/Web/Ludots.Adapter.Web/Streaming/WebTransportLayer.cs`。\n\n#### Web 客户端（Three.js 瘦客户端）\n\n`src/Client/Web/` 是基于 TypeScript + Three.js 的瘦客户端：\n\n| 模块 | 文件 | 说明 |\n|------|------|------|\n| 入口 | `src/main.ts` | 初始化 Three.js 场景、相机、渲染器、灯光；驱动 `requestAnimationFrame` 循环 |\n| 帧解码 | `src/core/FrameDecoder.ts` | 解码服务器二进制帧协议，支持 `MSG_FULL`、`MSG_DELTA`、`MSG_MESH_MAP` |\n| WebSocket | `src/core/WebSocketTransport.ts` | 连接管理，自动重连（2 秒间隔） |\n| 实体管理 | `src/rendering/EntityManager.ts` | 管理 Three.js `InstancedMesh` 或独立 Mesh |\n| HUD 渲染 | `src/rendering/HudRenderer.ts` | Canvas 2D 绘制 ScreenHud 血条与 ScreenOverlay 文字 |\n| GroundOverlay | `src/rendering/GroundOverlayRenderer.ts` | Three.js 平面几何渲染 |\n| UI 场景 | `src/rendering/UiSceneOverlay.ts` | Canvas 2D 渲染 `UiScene` JSON |\n| 位置插值 | `src/rendering/PositionInterpolator.ts` | 基于时间戳的实体位置平滑插值 |\n| 输入捕获 | `src/input/...` | DOM 鼠标/键盘/滚轮事件编码为 `InputProtocol` |\n\n⚠️ **注意**：Web 客户端 `src/Client/Web/src/core/FrameProtocol.ts` 是一套废弃的 Section ID 定义（`PRIMITIVES: 0x10` 等），与 C# 服务器端的 `FrameProtocol.cs`（`SectionPrimitives = 0x02`）完全不匹配，且未被任何代码引用。这是遗留死文件。\n\n⚠️ **注意**：`WebInputBackend.GetCharBuffer()` 返回 `string.Empty`，`EnableIME(bool)` 和 `SetIMECandidatePosition` 为空实现。Web 路径不支持中文输入或任何需要字符缓冲的输入场景。\n\n⚠️ **注意**：`src/Client/Web/src/main.ts` 的 `worldToScreen2D` 函数硬编码 `planeY = 0.35`，无法正确投影不在 Y=0.35 平面上的物体。\n\n### 4.3 UE5 路径（⚠️ 空壳/规划）\n\n![AdapterSync 同步](../diagrams/adapter-sync.svg)\n\n`src/Adapters/UE5/Ludots.Adapter.UE5/` 目录下**无任何 `.cs` 源码文件**，仅有 `bin/` 和 `obj/` 构建残留。\n\n文档 `gitbook/architecture/performer-raylib-uat.md` 提到 \\\"Raylib → 商业引擎适配顺序\\\"，第一步就是 Raylib 测通后 \\\"UE5 adapter 实现 AssetKind 映射\\\"。但当前 UE5 adapter 完全不存在，不应将其视为可用能力。\n\n## 5. 关键类清单（带文件路径）\n\n### 5.1 Raylib 适配器\n\n| 类名 | 文件路径 | 说明 | 行数 |\n|------|----------|------|------|\n| `RaylibGameHost` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibGameHost.cs` | `IGameHost` 实现 | — |\n| `RaylibHostComposer` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibHostComposer.cs` | 静态依赖组装器 | 111 |\n| `RaylibHostLoop` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibHostLoop.cs` | 主循环驱动 | 1996 |\n| `RaylibBrowserLayerRenderer` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibBrowserLayerRenderer.cs` | 浏览器表面渲染 | — |\n| `RaylibOverlayCompositor` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibOverlayCompositor.cs` | Skia UI 合成器 | — |\n| `RaylibSkiaFramebufferOverlaySurface` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibSkiaFramebufferOverlaySurface.cs` | Framebuffer 直接绘制 | — |\n| `RaylibSkiaGpuOverlaySurface` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibSkiaGpuOverlaySurface.cs` | GPU 离屏纹理绘制 | — |\n| `RaylibSyntheticKeyboardInput` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibSyntheticKeyboardInput.cs` | 合成键盘输入测试工具 | — |\n| `RaylibWindowRepaintGuard` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/RaylibWindowRepaintGuard.cs` | Windows DWM 重绘守护 | — |\n| `DesktopUiSystem` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/UI/DesktopUiSystem.cs` | `IUiSystem` 实现 | — |\n| `RaylibCameraAdapter` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/Services/RaylibCameraAdapter.cs` | `ICameraAdapter` 实现 | — |\n| `RaylibViewController` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/Services/RaylibViewController.cs` | `IViewController` 实现 | — |\n| `RaylibBenchmarkRenderService` | `src/Adapters/Raylib/Ludots.Adapter.Raylib/Services/RaylibBenchmarkRenderService.cs` | 基准测试服务 | — |\n\n### 5.2 Raylib 客户端渲染\n\n| 类名 | 文件路径 | 说明 |\n|------|----------|------|\n| `RaylibInputBackend` | `src/Client/Ludots.Client.Raylib/Input/RaylibInputBackend.cs` | `IInputBackend` 实现 |\n| `RaylibInputPathParser` | `src/Client/Ludots.Client.Raylib/Input/RaylibInputPathParser.cs` | 设备路径映射 |\n| `RaylibConsoleLogBackend` | `src/Client/Ludots.Client.Raylib/Diagnostics/RaylibConsoleLogBackend.cs` | 彩色控制台日志 |\n| `RaylibSkiaRenderer` | `src/Client/Ludots.Client.Raylib/Rendering/RaylibSkiaRenderer.cs` | Skia 软件渲染到 Texture2D |\n| `RaylibPrimitiveRenderer` | `src/Client/Ludots.Client.Raylib/Rendering/RaylibPrimitiveRenderer.cs` | 核心 3D 渲染器（Immediate / Instanced / Persistent ISM） |\n| `RaylibTerrainRenderer` | `src/Client/Ludots.Client.Raylib/Rendering/RaylibTerrainRenderer.cs` | r` | `src/Adapters/Web/Ludots.Adapter.Web/Streaming/PresentationExtractor.cs` | 每帧捕获与编码 |\n| `WebTransportLayer` | `src/Adapters/Web/Ludots.Adapter.Web/Streaming/WebTransportLayer.cs` | WebSocket 传输层 |\n\n### 5.4 App 入口\n\n| 类名 | 文件路径 | 说明 |\n|------|----------|------|\n| `Raylib App` | `src/Apps/Raylib/Ludots.App.Raylib/Program.cs` | `new RaylibGameHost(baseDir, configFile).Run()` |\n| `Web App` | `src/Apps/Web/Ludots.App.Web/Program.cs` | ASP.NET Core 宿主，启动 WebSocket 服务器 |\n\n### 5.5 抽象端口（Port）\n\n| 接口 | 定义位置 | Raylib 实现 | Web 实现 |\n|------|----------|------------|---------|\n| `IGameHost` | `Ludots.Platform.Abstractions` | `RaylibGameHost` | `WebGameHost` |\n| `IInputBackend` | `Ludots.Core.Input.Runtime` | `RaylibInputBackend` | `WebInputBackend` |\n| `ICameraAdapter` | `Ludots.Core.Presentation.Camera` | `RaylibCameraAdapter` | `WebCameraAdapter` |\n| `IViewController` | `Ludots.Core.Presentation.Camera` | `RaylibViewController` | `WebViewController` |\n| `IUiSystem` | `Ludots.Core.UI` | `DesktopUiSystem` / `MarkupUiSystem` | `WebUiRuntimeBridge` |\n| `IUiRenderer` | `Ludots.UI.Runtime` | `SkiaUiRenderer` | — |\n| `IUiTextMeasurer` | `Ludots.UI.Runtime` | `SkiaTextMeasurer` | — |\n| `IUiImageSizeProvider` | `Ludots.UI.Runtime` | `SkiaImageSizeProvider` | — |\n| `IBrowserRuntime` | `Ludots.UI.Browser` | `CefBrowserRuntime` | — |\n\n## 6. 输入 / 输出\n\n### 6.1 Raylib 路径\n\n| 输入 | 来源 | 处理路径 |\n|------|------|---------|\n| 键鼠输入 | `Raylib_cs` | `RaylibInputBackend` → `PointerEvent`/`KeyboardEvent` → `UIRoot.HandleInput` |\n| 窗口事件 | `Raylib_cs` | `WindowShouldClose` / `Resize` → `RaylibHostLoop` |\n| Core 表现 Buffer | `GameEngine.Update()` | `RaylibPrimitiveRenderer` / `RaylibTerrainRenderer` / `RaylibOverlayCompositor` |\n| 浏览器表面 | `CefBrowserRuntime` | `RaylibBrowserLayerRenderer` → Texture2D |\n\n| 输出 | 目标 | 生成路径 |\n|------|------|---------|\n| 3D 场景 | 屏幕 | `BeginMode3D` → Terrain / Primitives / GroundOverlays / DebugDraw |\n| 2D UI | 屏幕 | `EndMode3D` → Browser Layer / Overlay Composite (Underlay / UI / Top) |\n| 诊断 HUD | 屏幕 | `RaylibBenchmarkRenderService` / Skia HUD 面板 |\n| 日志 | 控制台 | `RaylibConsoleLogBackend` |\n\n### 6.2 Web 路径\n\n| 输入 | 来源 | 处理路径 |\n|------|------|---------|\n| 键鼠输入 | DOM 事件 | `InputCapture` → `InputEncoder` → WebSocket `InputProtocol` → `WebInputBackend` |\n| Core 表现 Buffer | `GameEngine.Update()` | `PresentationExtractor` → `BinaryFrameEncoder` |\n| `UiScene` | `WebUiRuntimeBridge` | `TryConsumeScene` → `UiSceneDiffJsonSerializer` → JSON |\n\n| 输出 | 目标 | 生成路径 |\n|------|------|---------|\n| 二进制帧 | WebSocket 客户端 | `WebTransportLayer.BroadcastFrame` → `FrameProtocol` |\n| 资产映射 | 新连接客户端 | `WebTransportLayer.SetMeshMap` → `MsgTypeMeshMap` |\n| 静态文件 | 浏览器 | ASP.NET Core 静态文件服务（`src/Client/Web/dist`） |\n| 健康检查 | 监控端点 | `/health` 端点 |\n\n## 7. 依赖关系\n\n| 依赖项 | 被谁依赖 | 说明 |\n|--------|---------|------|\n| `Raylib-cs` | `RaylibHostLoop`, `RaylibInputBackend`, `RaylibPrimitiveRenderer` | 跨平台图形/输入 |\n| `SkiaSharp` | `RaylibOverlayCompositor`, `RaylibSkiaRenderer`, `SkiaUiRenderer` | 2D 矢量 UI |\n| `ASP.NET Core` | `WebHostLoop`, `WebTransportLayer` | WebSocket 服务器、静态文件 |\n| `System.Net.WebSockets` | `WebTransportLayer` | WebSocket 连接管理 |\n| `Three.js` | Web 客户端 | 浏览器 3D 渲染 |\n| `GameBootstrapper` | `RaylibHostComposer`, `WebHostComposer` | 引擎启动入口 |\n| `GameEngine` | `RaylibHostLoop`, `WebHostLoop` | Core 逻辑帧驱动 |\n| `PresentationExtractor` | `WebHostLoop` | 每帧捕获表现 Buffer |\n\n## 8. 非功能需求（性能约束）\n\n| 约束项 | 目标 | 实现 |\n|--------|------|------|\n| 桌面帧率 | 无上限（`targetFps = 0` 表示不锁帧） | `RaylibHostLoop` 支持 `targetFps = 0` |\n| Web 串流帧率 | 30 FPS（默认） | `WebHostLoop` 基于 `Thread.Sleep` 固定帧率 |\n| 二进制帧大小 | < 50 KB（典型场景） | `BinaryFrameEncoder` 零分配 + `DeltaCompressor` 仅传输变更 |\n| 带宽优化 | Delta 编码 | `DeltaCompressor` 对比当前帧与上一帧 |\n| 批量渲染 | 10,000+ 实例 | `RaylibPrimitiveRenderer` 的 Instanced 和 Persistent ISM 模式 |\n| UI 脏矩形 | 按需重绘 | `RaylibOverlayCompositor` 按 `IsDirty` 与版本号决定重绘 |\n| 浏览器表面 | 脏矩形上传 | `RaylibBrowserLayerRenderer` 仅上传 BGRA/RGBA 脏矩形 |\n| WebSocket 并发 | 多客户端会话 | `ConcurrentDictionary` 管理，`BroadcastFrame` 全量复制 |\n| 跨平台兼容 | 同一 Core 逻辑 | `GameEngine` 完全不依赖 Adapter  specifics |\n\n---\n\n> **版本说明**：本章节基于 Ludots `main` 分支（2026-07-02 扫描）。\n> - ⚠️ **UE5 Adapter 为空壳**：`src/Adapters/UE5/` 下无任何 `.cs` 源码，不应将其视为可用能力。\n> - ⚠️ **Ultralight Provider 缺失**：`docs/architecture/browser_ui_runtime.md` 将 Ultralight 列为内置 provider，但仓库中不存在。\n> - ⚠️ **WebUI DataPlane 未落地**：`docs/architecture/webui_dataplane_architecture.md` 描述的高级机制（`IWebUiDataTransport`、`entity-10k-delta`）在 `WebHostLoop` 中未使用。\n> - ⚠️ **Web 客户端 WorldHud 丢弃**：`FrameDecoder.ts` 直接跳过 `WorldHud` Section，服务器仍在传输，造成带宽浪费。\n> - ⚠️ **Web 输入 IME 未实现**：`WebInputBackend.GetCharBuffer()` 返回空，`EnableIME` 为空实现。\n> - ⚠️ **WebTransportLayer 全量复制**：`BroadcastFrame` 对每个客户端都生成 `byte[]` 拷贝，GC 压力较大。\n> - ⚠️ **RaylibHostLoop 与 WebHostLoop 重复代码**：Camera / Culling / HUD 初始化逻辑高度重复，违反 DRY 原则。\n> - ⚠️ **死文件 `FrameProtocol.ts`**：Web 客户端的 `FrameProtocol.ts` 与服务器协议完全不匹配，且未被引用。";
