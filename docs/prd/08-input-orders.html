const mdContent = "# PRD-08: Input & Orders（输入与指令系统）\n\n> 版本：基于 Stage 1 扫描报告（`report_Input_Nav.md`）\n> 关联模块：`src/Core/Input/`、`src/Core/Gameplay/GAS/Orders/`\n\n---\n\n## 1. 功能概述\n\nInput & Orders 子系统是 Ludots 引擎中连接\"玩家物理输入\"与\"游戏逻辑指令\"的桥梁。它负责从底层 I/O 设备（键盘、鼠标、手柄）捕获原始信号，经上下文编译、Action 实例化、映射转换，最终生成类型化的 `Order` 并提交至 Gameplay Ability System（GAS）的 Order Buffer。该子系统同时管理多层级选择容器（Selection Container）、控制组（Control Group）以及框选/单选等交互行为，形成\"输入 → 选择 → 指令 → 执行\"的完整链路。\n\n核心设计哲学是**\"意图驱动\"**：Input 层只负责表达玩家意图，不做 gameplay 决策；所有战术规则（如自动目标选择、队形规划、Context Scored 评分）均在 Input → Order 的映射层中通过配置化规则完成，确保 Mod 作者可通过 JSON 配置和 GAS 扩展自定义交互逻辑，无需修改 Core 代码。\n\n---\n\n## 2. 目标用户\n\n| 用户角色 | 使用场景 |\n|----------|----------|\n| **Mod 作者** | 定义新的输入映射、自定义技能交互模式、配置控制组行为 |\n| **Gameplay 设计师** | 调整技能施放手感（SmartCast / AimCast / 蓄力释放）、设计自动目标策略 |\n| **引擎开发者** | 接入新输入后端（手柄、触屏、网络回放）、调试输入确定性 |\n| **表现层开发者** | 通过 `AbilityIndicatorOverlayBridge` 接入技能指示器预览 |\n\n---\n\n## 3. 使用场景\n\n### 场景 A：RTS 右键移动\n玩家选中若干单位（框选或控制组）→ 右键点击地图 → `InputOrderMappingSystem` 将 `Command` 动作映射为 `Move` Order → `MoveFormationPlanner` 计算 `Grid` 队形 → 提交到 GAS Order Buffer → `MassNavigationOrderIngestionSystem` 驱动单位移动。\n\n### 场景 B：MOBA 技能施放（SmartCast / AimCast）\n玩家按下技能键（`Pressed` 触发）→ `InputOrderMappingSystem` 根据 `InteractionModeType` 判断：\n- **SmartCast**：若当前悬停目标在射程内，直接施放；否则进入 Aim 状态。\n- **AimCast**：显示技能指示器，等待 `Confirm` 或 `Release` 后提交 `Order`。\n- **ContextScored**：通过 `ContextScoredOrderResolver` 对 Graph 中的 Slot 进行评分，自动选择最优目标。\n\n### 场景 C：网络回放与确定性\n`AuthoritativeInputAccumulator` 在视觉帧累加输入事件，`AuthoritativePointerButtonAccumulator` 记录指针按钮状态。固定步长模拟时，从累加器中读取权威快照，确保回放与实时逻辑完全一致。\n\n---\n\n![Input → Order → Command 流程](diagrams/input-order-flow.svg)\n\n## 4. 核心能力\n\n### 4.1 输入配置与映射（InputConfig → InputOrderMapping）\n\n![Input 在 SystemGroup 中的位置](diagrams/input-systemgroup.svg)\n\n\n输入配置以三层模型组织：\n\n| 层级 | 类型 | 文件路径 | 说明 |\n|------|------|----------|------|\n| 配置根 | `InputConfigRoot` | `src/Core/Input/Config/InputConfigModels.cs:75` | Actions + Contexts + Bindings 的完整配置树 |\n| Action 定义 | `InputActionDef` | `src/Core/Input/Config/InputConfigModels.cs:18` | 每个 Action 的 Id / Name / Type（Button / Axis / Vector） |\n| 绑定定义 | `InputBindingDef` | `src/Core/Input/Config/InputConfigModels.cs:47` | Path（如 `<Keyboard>/w`）、Composite、Processors、Interactions |\n| 上下文定义 | `InputContextDef` | `src/Core/Input/Config/InputConfigModels.cs:64` | 输入映射上下文（IMC），支持上下文压栈 |\n\n运行时，`PlayerInputHandler` 每帧编译绑定、更新 Action 状态机，生成 `InputActionInstance`（含 `Value / Triggered / PressedThisFrame / ReleasedThisFrame` 四态）。`InputRuntimeSystem` 驱动整帧流程，并抑制 UI 捕获期间的输入泄漏。\n\n### 4.2 交互模式（InteractionModeType）\n\n![交互模式对比](diagrams/interaction-modes.svg)\n\n\n`InteractionModeType` 枚举定义了**代码中实际存在的 6 种交互模式**（`src/Core/Input/Orders/InputOrderMapping.cs:17`）：\n\n| 模式 | 枚举值 | 行为说明 |\n|------|--------|----------|\n| **TargetFirst** | 0 | 优先选中目标，再确认施放 |\n| **SmartCast** | 1 | 智能施放：满足条件直接执行，否则进入 Aim |\n| **AimCast** | 2 | 按住键显示指示器，释放/确认后施放 |\n| **SmartCastWithIndicator** | 3 | 按住键显示指示器，释放键后施放（文档注释描述为 hold-and-release） |\n| **ContextScored** | 4 | 基于 Graph 评分的上下文目标选择 |\n| **PressReleaseAimCast** | 5 | 按下进入 Aim，再次按下/释放确认施放 |\n\n此外，输入系统通过 `OrderSelectionType`（`src/Core/Input/Orders/InputOrderMapping.cs:74`）定义 Order 所需的选目标类型，形成交互模式的第二维度：\n\n| 选目标类型 | 枚举值 | 对应场景 |\n|-----------|--------|----------|\n| None | 0 | 无目标（Passive / Toggle 类） |\n| Position | 1 | 地图点目标（PointTarget / Placement） |\n| Entity | 2 | 单体目标（UnitTarget） |\n| Entities | 3 | 多体目标 |\n| Direction | 4 | 方向向量（DirectionSkillshot） |\n| Vector | 5 | 两点向量（如 Rumble R、Viktor E 风格的 Press-Drag-Release） |\n\n> **文档过承诺/待实现**：以下交互模式在 `InteractionModeType` 枚举中**未找到**对应定义，可能属于 GAS OrderType 层或未来规划：\n> - `Passive`、`InstantPress`、`ChargeHoldRelease`、`ComboMultistage`、`DefenseParry`、`ToggleStance`、`MovementAbility`、`PlacementMarkChannel`、`FinisherCompanion`\n> \n> 当前代码中，`ChargeHoldRelease` 的部分行为可由 `HeldPolicy`（`StartEnd` / `EveryFrame`）+ `SmartCastWithIndicator` 组合模拟；`UnitTarget` / `PointTarget` / `DirectionSkillshot` 则通过 `OrderSelectionType` 实现。\n\n### 4.3 选择系统（Selection System）\n\n![Selection 状态机](diagrams/selection-state-machine.svg)\n\n\n选择系统基于 ECS 组件化设计，通过 `SelectionRuntime` 管理多层级选择容器：\n\n| 容器 Key | 常量 | 用途 |\n|----------|------|------|\n| `LivePrimary` | `\"selection.live.primary\"` | 当前活跃主选择 |\n| `FormationPrimary` | `\"selection.formation.primary\"` | 队形主选择 |\n| `CommandPreview` | `\"selection.command.preview\"` | 指令预览选择 |\n| `CommandSnapshot` | `\"selection.command.snapshot\"` | 指令快照选择 |\n\n**核心架构——View/Set 双层解耦**：\n- **SelectionContainer**（ECS 实体）：带 `SelectionContainerTag`、`SelectionContainerOwner`、`SelectionContainerKindComponent`、`SelectionContainerRevision` 等组件，表示一个选择容器。\n- **SelectionMember**（ECS 关系）：`SelectionMemberTag` + `SelectionMemberTarget` + `SelectionMemberOrdinal` 表示实体与容器的成员关系。\n- **SelectionView**（表现绑定）：`SelectionViewBindingTag` + `SelectionViewBindingContainer` 将选择容器绑定到 UI 视图。\n\n**控制组（Control Group）**：`SelectionControlGroupRuntime`（`src/Core/Input/Selection/SelectionControlGroupRuntime.cs`）负责控制组的记忆与恢复。`SelectionContextRuntime` 管理当前视图切换。\n\n关键 ECS System：\n- `SelectionMaintenanceSystem`：每帧清理 dangling 选择状态和关系实体。\n- `CurrentSelectionApplySystem`：将正式选择同步到 `MassNavigationSimulationRuntime` 的选择快照。\n- `GasSelectionResponseSystem`：响应 GAS 选择请求，按 `Radius` / `SingleNearest` 规则查找实体。\n\n### 4.4 指令系统（Order System）\n\n`InputOrderMappingSystem`（`src/Core/Input/Orders/InputOrderMappingSystem.cs:136`）是核心转换器，将 `InputAction` 触发事件转换为 `Order` 提交。其处理流程：\n\n```\nInputAction 触发 (Pressed / Released / Held / DoubleTap)\n  → InputOrderMappingSystem (per mapping)\n    → OrderTypeRegistry.Resolve(orderTypeKey) → orderTypeId\n    → GroundPositionProvider / SelectedEntityProvider / HoveredEntityProvider (目标解析)\n    → ModifierSubmitBehavior (QueueOnModifier / AlwaysImmediate / AlwaysQueued)\n    → AutoTargetPolicy (None / NearestInRange / NearestEnemyInRange)\n    → OrderSubmitHandler → GAS OrderBufferSystem\n```\n\n`InputOrderMapping`（`src/Core/Input/Orders/InputOrderMapping.cs:219`）定义单个映射的全部参数：触发类型、选目标类型、自动目标策略、Held 策略、修饰键提交行为、群体移动队形模式等。\n\n**扩展交互能力**：\n- `ContextScoredOrderResolver`（`src/Core/Input/Orders/ContextScoredOrderResolver.cs:31`）：通过 Graph 评分选择最佳 `Slot` + `Target`，返回 `ContextScoredOrderResolution`。\n- `MoveFormationPlanner`：群体移动队形规划（当前仅支持 `None` 和 `Grid`，`Grid` 外的队形如 `Wedge` / `Line` / `Square` / `Circle` 在 `MassNavigationFormationMode` 中定义但输入端枚举未同步）。\n- `SelectedMovePathOverlayBridge` / `AbilityIndicatorOverlayBridge`：路径预览与技能指示器桥接。\n\n---\n\n## 5. 输入 / 输出\n\n### 5.1 输入\n\n| 输入源 | 类型 | 说明 |\n|--------|------|------|\n| `IInputBackend` | 接口 | 底层输入抽象：`GetAxis` / `GetButton` / `GetMousePosition` / `IME` |\n| `InputConfigRoot` | 配置 | 输入 Action / Context / Binding 的 JSON 配置 |\n| `InputOrderMappingConfig` | 配置 | InputAction → Order 的映射规则集 |\n| 交互输入 | 运行时 | 鼠标位置、指针按钮（Confirm / Command / Cancel）、框选拖拽状态 |\n| GAS 选择请求 | 运行时 | `GasSelectionResponseSystem` 接收的选择查询请求 |\n\n### 5.2 输出\n\n| 输出 | 类型 | 说明 |\n|------|------|------|\n| `Order` | GAS 指令 | 提交到 GAS Order Buffer 的类型化指令 |\n| `SelectionContainer` + `SelectionMember` | ECS 实体/关系 | 多层级选择状态 |\n| `AuthoritativeInputSnapshot` | 快照 | 固定步长模拟可用的权威输入状态 |\n| `PresentationEventStream` | 事件流 | 选择变化事件（`SelectionMemberAdded` / `SelectionMemberRemoved`）供表现层消费 |\n| `AbilityIndicatorOverlayBridge` / `SelectedMovePathOverlayBridge` | 桥接 | 技能指示器与路径预览请求 |\n\n---\n\n## 6. 依赖关系\n\n| 依赖模块 | 依赖类型 | 说明 |\n|----------|----------|------|\n| **GAS (Gameplay Ability System)** | 强依赖 | `OrderBufferSystem` 接收最终 Order；`OrderTypeRegistry` 解析 OrderTypeKey |\n| **MassNavigation** | 双向依赖 | `CurrentSelectionApplySystem` → `MassNavigationSelectionSyncSystem`；`MassNavigationLocalCommandInputSystem` 反向读取选择状态 |\n| **Navigation** | 弱依赖 | `MoveFormationPlanner` 可能读取 Nav 服务进行队形规划 |\n| **Presentation** | 弱依赖 | `SelectionPresentationEventSystem` 消费选择变化事件；`AbilityIndicatorOverlayBridge` 请求指示器表现 |\n| **Map / Board** | 弱依赖 | `GroundPositionProvider` 依赖地图的坐标转换 |\n\n---\n\n## 7. 非功能需求\n\n| 需求项 | 目标 | 验证方式 |\n|--------|------|----------|\n| **确定性（Determinism）** | 固定步长模拟的输入快照完全一致 | `AuthoritativeInputAccumulator` + `FrozenInputActionReader` 提供快照 |\n| **低延迟** | 输入到 Order 提交的端到端延迟 < 1 帧 | `InputRuntimeSystem` 在固定步长前完成输入处理 |\n| **可扩展性** | Mod 可新增 InputAction、OrderType、交互模式 | `InputConfigRoot` + `OrderTypeRegistry` 注册模型 |\n| **跨平台输入** | 支持键盘、鼠标、手柄、触屏 | `IInputBackend` 抽象接口 |\n| **UI 输入抑制** | 鼠标悬停 UI 时不触发世界输入 | `InputRuntimeSystem` 的 UI 捕获抑制逻辑 |\n| **配置验证** | 配置错误在加载时 fail-fast | `InputOrderMappingLoader.Validate` 强制 `IsSkillMapping` 时 `I0` 非负 |\n\n---\n\n## 8. 关键类清单\n\n### 8.1 输入核心\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `IInputBackend` | `src/Core/Input/Runtime/IInputBackend.cs:5` | 底层输入后端抽象 |\n| `PlayerInputHandler` | `src/Core/Input/Runtime/PlayerInputHandler.cs:10` | 核心输入处理器：Context 压栈、Binding 编译、Action 状态更新 |\n| `InputActionInstance` | `src/Core/Input/Runtime/InputRuntimeModels.cs:6` | 单个 Action 的运行时状态 |\n| `InputConfigRoot` | `src/Core/Input/Config/InputConfigModels.cs:75` | 输入配置根 |\n| `InputActionDef` | `src/Core/Input/Config/InputConfigModels.cs:18` | Action 定义 |\n| `InputBindingDef` | `src/Core/Input/Config/InputConfigModels.cs:47` | 绑定定义 |\n| `InputContextDef` | `src/Core/Input/Config/InputConfigModels.cs:64` | 输入映射上下文（IMC）定义 |\n| `InputRuntimeSystem` | `src/Core/Input/Systems/InputRuntimeSystem.cs:13` | 每帧驱动输入更新、UI 捕获抑制、权威输入快照 |\n| `AuthoritativeInputAccumulator` | `src/Core/Input/Runtime/AuthoritativeInputAccumulator.cs:11` | 视觉帧输入累加器 |\n| `FrozenInputActionReader` | `src/Core/Input/Runtime/FrozenInputActionReader.cs` | 冻结输入快照读取器 |\n\n### 8.2 选择系统\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `SelectionRuntime` | `src/Core/Input/Selection/SelectionRuntime.cs:38` | 核心选择运行时：管理容器、成员关系、View 绑定 |\n| `SelectionRuntimeConfig` | `src/Core/Input/Selection/SelectionRuntime.cs:10` | 选择配置（MutationBudget / ClickRadius / DragThreshold） |\n| `SelectionSetKeys` | `src/Core/Input/Selection/SelectionComponents.cs:18` | 选择集 Key 常量 |\n| `SelectionViewKeys` | `src/Core/Input/Selection/SelectionComponents.cs:36` | 选择视图 Key 常量 |\n| `SelectionContainerTag` | `src/Core/Input/Selection/SelectionComponents.cs:52` | 容器 ECS 标记组件 |\n| `SelectionMemberTag` | `src/Core/Input/Selection/SelectionComponents.cs:87` | 成员关系 ECS 标记 |\n| `SelectionDragState` | `src/Core/Input/Selection/SelectionComponents.cs:153` | 拖拽状态 |\n| `SelectionMaintenanceSystem` | `src/Core/Input/Selection/SelectionMaintenanceSystem.cs` | 每帧清理 dangling 状态 |\n| `CurrentSelectionApplySystem` | `src/Core/Input/Selection/CurrentSelectionApplySystem.cs` | 选择应用到 MassNavigation |\n| `GasSelectionResponseSystem` | `src/Core/Input/Selection/GasSelectionResponseSystem.cs:22` | GAS 选择请求响应 |\n| `SelectionControlGroupRuntime` | `src/Core/Input/Selection/SelectionControlGroupRuntime.cs` | 控制组记忆与恢复 |\n| `SelectionContextRuntime` | `src/Core/Input/Selection/SelectionContextRuntime.cs` | 选择上下文运行时 |\n| `ISelectionInputHandler` | `src/Core/Input/Selection/ISelectionInputHandler.cs` | 选择输入处理器接口 |\n\n### 8.3 Order 映射与指令\n\n| 类名 | 文件路径 | 职责 |\n|------|----------|------|\n| `InputOrderMapping` | `src/Core/Input/Orders/InputOrderMapping.cs:219` | 单个 InputAction → Order 的映射定义 |\n| `InputOrderMappingConfig` | `src/Core/Input/Orders/InputOrderMapping.cs:344` | 映射配置根 |\n| `InteractionModeType` | `src/Core/Input/Orders/InputOrderMapping.cs:17` | 交互模式枚举（6 种） |\n| `InputTriggerType` | `src/Core/Input/Orders/InputOrderMapping.cs:48` | 触发类型（Pressed / Released / Held / DoubleTap） |\n| `OrderSelectionType` | `src/Core/Input/Orders/InputOrderMapping.cs:74` | Order 选目标类型（6 种） |\n| `ModifierSubmitBehavior` | `src/Core/Input/Orders/InputOrderMapping.cs:177` | 修饰键提交行为 |\n| `AutoTargetPolicy` | `src/Core/Input/Orders/InputOrderMapping.cs:154` | 自动目标策略 |\n| `HeldPolicy` | `src/Core/Input/Orders/InputOrderMapping.cs:136` | Held 触发策略 |\n| `GroupMoveFormationMode` | `src/Core/Input/Orders/InputOrderMapping.cs:202` | 群体移动队形模式（None / Grid） |\n| `InputOrderMappingSystem` | `src/Core/Input/Orders/InputOrderMappingSystem.cs:136` | 核心系统：InputAction → Order 转换 |\n| `ContextScoredOrderResolver` | `src/Core/Input/Orders/ContextScoredOrderResolver.cs:31` | ContextScored 模式解析器 |\n| `MoveFormationPlanner` | `src/Core/Input/Orders/MoveFormationPlanner.cs` | 群体移动队形规划器 |\n| `SelectedMovePathOverlayBridge` | `src/Core/Input/Orders/SelectedMovePathOverlayBridge.cs` | 路径预览桥接 |\n| `AbilityIndicatorOverlayBridge` | `src/Core/Input/Orders/AbilityIndicatorOverlayBridge.cs` | 技能指示器预览桥接 |\n\n---\n\n*本章完*\n";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
