const mdContent = "# Narrative System PRD\n\n## 1. 概述\n\nNarrative System 负责把任务、对话、过场、叙事变量和事件回调组织成玩家可感知的剧情流程。Quest 长期进度已经拆入 Core `QuestRuntimeService`，NarrativeDirector 不再持有第二份任务状态，只负责编排对话、镜头、变量、动作派发和事件转发。\n\nQuest instance 是 ECS entity：通过 `(ScopeHost, DefinitionId)` 索引解析，携带 `QuestInstanceCm`、`AttributeBuffer`、`GameplayTagContainer`、`ActiveEffectContainer`，因此任务本身可以被现有 GAS buff、tag、effect 命中。对话和过场仍属于 Narrative 呈现与交互层。\n\n## 2. 结构\n\n| 模块 | 职责 |\n|------|------|\n| `src/Core/Gameplay/Quests` | Quest definition registry、config loader、runtime service、quest entity state。 |\n| `src/Core/Gameplay/Narrative` | 叙事变量、dialogue session、cinematic session、action/condition 编排、事件回调。 |\n| `CoreSaveParticipants` | Quest signals 存入 `quests` domain；Quest entity state 随 ECS world snapshot 保存。 |\n| `NarrativeFrontend` | 只读展示当前任务、对话、过场状态，不拥有业务状态。 |\n\n配置路径：\n\n- Quest：`Quests/quests.json`\n- Narrative variables/dialogues/cinematics：`Narrative/*.json`\n\n## 3. 详情\n\nQuest runtime 命令入口包括 `StartQuest`、`AdvanceQuestStage`、`CompleteQuest`、`FailQuest`、`EmitSignal`。命令遇到未注册 quest id、未注册 stage id、非 live scope host 时必须 fail-fast；查询类 `Try*` API 保持布尔返回。\n\nNarrativeDirector 只通过 QuestRuntimeService 访问任务状态：\n\n- `StartQuest` / `AdvanceQuestStage` 等动作委托给 Core Quest。\n- `QuestState` 条件通过 Core Quest 查询。\n- signal 先发 narrative event，再交给 Quest runtime 统计并推进 stage。\n- UI view 从 runtime view 组装，不保存第二份任务状态。\n\n存档规则：\n\n- Quest entity state 存在 ECS world snapshot。\n- signal counts 存在 `quests` save participant。\n- `QuestInstanceCm.ScopeHost` 必须参与 save reference validation 和 WorldId normalization。\n- restore 后重建 quest index，scoped quest 必须能通过 restored scope host 解析。\n\n## 4. 场景\n\n| 场景 | 玩家看到什么 | 系统如何支持 |\n|------|--------------|--------------|\n| 接任务 | 任务出现在追踪面板，目标进入第一阶段。 | Narrative action 调用 Core Quest runtime 创建 quest entity。 |\n| 完成目标 | 击败敌人或交互后，目标自动推进。 | Narrative signal 被 Quest runtime 统计，满足 stage required signals 后推进。 |\n| 任务被 buff | 任务压力、紧迫度、计时等属性被效果改变。 | Quest entity 直接作为 GAS target，属性由 AttributeBuffer 承载。 |\n| 局部任务 | 某个 NPC、据点或地图对象拥有自己的任务实例。 | ScopeHost 参与 quest index 和 save/load。 |\n| 读档 | 任务面板、目标、任务属性和信号计数恢复。 | ECS snapshot + quest participant restore 后重建 index。 |\n\n## 5. 边界\n\n- Quest 负责长期目标、阶段、信号条件、任务 entity 和 GAS 承载。\n- Dialogue 负责局部文本、角色表达、选项和分支操作。\n- Cinematic 负责镜头化呈现和步进。\n- Narrative variables 负责剧情变量，不替代 Quest state。\n- UI、showcase mod、trigger handler 禁止持有第二份任务状态。\n- 不新增 parallel runtime，不把 Quest 重新塞回 Narrative definition registry。\n\n## 6. UAT\n\n```gherkin\nFeature: Quest progress is owned by Core while Narrative presents it\n\n  Scenario: Player accepts a quest from dialogue\n    Given the player is talking to an NPC with an available quest\n    When the player chooses the accept option\n    Then the quest appears in the objective panel\n    And the first objective text is shown\n    And the quest is backed by a live ECS entity\n\n  Scenario: Player completes a signal-gated objective\n    Given the player has an active quest objective requiring a beast defeat\n    When the player defeats the beast\n    Then the objective advances or completes\n    And the dialogue/cinematic layer does not store a duplicate quest state\n\n  Scenario: Quest receives a gameplay effect\n    Given a quest has a tracked urgency attribute\n    When a gameplay effect targets the quest entity\n    Then the quest urgency value changes through the GAS pipeline\n    And the effect is visible through the quest entity\u0027s active effects\n\n  Scenario: Scoped quest survives save and load\n    Given a quest is scoped to a specific live host entity\n    When the player saves and reloads the game\n    Then the quest can still be resolved through the restored host entity\n    And the quest stage and signals remain correct\n\n  Scenario: Invalid quest content fails fast\n    Given a narrative action references a quest or stage id that is not registered\n    When the action is executed\n    Then the game reports a content error immediately\n    And the action is not silently ignored\n```";

document.getElementById('content').innerHTML = marked.parse(mdContent);
</script>
