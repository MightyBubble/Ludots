const mdContent = "# 配置与脚本（Config & Scripting）\n\n## 1. 功能概述\n\n**配置与脚本（Config & Scripting）** 是 Ludots 引擎的\"胶水层\"，承担配置管线合并、事件驱动脚本、图虚拟机（Graph VM）编译与执行三大核心职责。它将静态的 JSON 配置转换为运行时的 ECS 实体、组件和系统状态，同时为 GAS（Gameplay Ability System）提供可编译的节点图执行能力。整个模块遵循\"声明式优先、代码式补充\"的设计：大部分游戏数据通过 JSON 配置声明，Mod 通过 C# 代码注册扩展点，图 VM 在运行时执行配置化的逻辑。\n\n配置与脚本模块的核心设计特征包括：\n- **ConfigPipeline 深度合并**：从 Core 到 Mod 按优先级合并 `game.json` 及目录驱动配置，支持对象递归合并、数组按 ID 合并、数组追加等多种策略。\n- **Trigger 事件驱动**：`TriggerManager` 支持全局事件和 Map-scoped 事件分发，`Trigger` 承载条件判断与动作序列，`TriggerDecoratorRegistry` 允许 Mod 在不直接创建 Trigger 的情况下修饰已有 Trigger。\n- **图 VM 编译执行**：`GraphCompiler` 将 JSON 声明的 `GraphConfig` 编译为 `GraphInstruction[]` 字节码，`GraphExecutor` 通过 opcode handler 表执行，为 GAS 提供高性能的效果计算能力。\n\n## 2. 目标用户\n\n- **Mod 作者**：需要通过 `ConfigPipeline` 覆写引擎默认配置，通过 `TriggerManager` 注册事件响应，通过 `FunctionRegistry` 注册全局可调用函数。\n- **Gameplay 设计师**：需要编写 JSON 配置定义实体模板、能力效果、图逻辑，理解 `ConfigCatalog` 的合并策略与冲突报告。\n- **GAS 开发者**：需要编写 `GraphConfig` JSON 定义能力效果逻辑，理解 `GraphCompiler` 的编译输出与 `GraphExecutor` 的执行模型。\n- **工具开发者**：需要解析 `ConfigPipeline` 的合并结果、校验图配置的正确性（`GraphValidator`）、生成数据字典。\n\n## 3. 使用场景\n\n- **Mod 配置覆写**：Mod 在 `assets/Configs/game.json` 中声明自定义配置，`ConfigPipeline` 自动将其与 Core 配置合并。例如，`RtsDemoMod` 通过覆写 `game.json` 中的单位属性、技能参数来定制 RTS 玩法。\n- **Map Trigger 编写**：地图作者在 `MapConfig` 中声明 `TriggerTypes`，`TriggerManager` 在 `MapLoaded` 时自动激活这些 Trigger。Mod 作者通过 `TriggerDecoratorRegistry` 给所有 `map_ready` 锚点的 Trigger 添加相机初始化命令。\n- **GAS 图定义**：技能设计师在 JSON 中定义 `GraphConfig`（节点、连接、输出），`GraphCompiler` 在引擎启动时编译为字节码，`GraphExecutor` 在 `EffectProcessing` phase 执行该图。\n- **运行时配置重载**：通过 `ReloadConfigTrigger` 触发 `GameEngine.ReloadConfigs`，在不重启引擎的情况下重载配置并重建 AI 运行时。\n\n\n![GraphVM 结构](diagrams/graph-vm-structure.svg)\n\n## 4. 核心能力\n\n### 4.1 ConfigPipeline — 配置合并管线\n\n#### 整体流程\n\n```\n[Core:Configs/game.json]\n     ↓\n[Mod1:assets/game.json] → [Mod1:assets/Configs/game.json]\n     ↓\n[Mod2:assets/game.json] → [Mod2:assets/Configs/game.json]\n     ↓\nConfigPipeline.CollectFragments(\"game.json\")\n     ↓\nConfigPipeline.DeepMerge(target, source)  // 对象递归合并；数组/标量覆盖\n     ↓\nJsonSerializer.Deserialize<GameConfig>(merged)\n     ↓\nGameConfig (运行时唯一配置)\n```\n\n对于目录驱动配置（`config_catalog.json`）：\n\n```\nconfig_catalog.json\n     ↓\nConfigCatalogLoader.Load(pipeline)\n     ↓\nConfigCatalog (路径 → ConfigCatalogEntry)\n     ↓\nConfigPipeline.MergeFromCatalog(entry, [report])\n     ↓\nConfigMerger.MergeArrayByIdToEntriesCore\n     ↓\nMergedConfigEntry[] (或 JsonObject / JsonArray)\n     ↓\nDataRegistry<T>.Load → Dictionary<string, T>\n```\n\n**关键文件**：`src/Core/Config/ConfigPipeline.cs`（218 行）、`src/Core/Config/ConfigMerger.cs`、`src/Core/Config/ConfigCatalogLoader.cs`。\n\n#### 合并策略\n\n`ConfigMerger` 支持五种合并策略：\n\n| 策略 | 枚举值 | 说明 |\n|------|--------|------|\n| `Replace` | `ConfigMergePolicy.Replace` | 完全替换 target 为 source |\n| `DeepObject` | `ConfigMergePolicy.DeepObject` | 对象递归合并；标量覆盖；数组覆盖（非追加） |\n| `ArrayReplace` | `ConfigMergePolicy.ArrayReplace` | 数组完全替换 |\n| `ArrayAppend` | `ConfigMergePolicy.ArrayAppend` | 数组追加（在 `ArrayAppendFields` 指定时生效） |\n| `ArrayById` | `ConfigMergePolicy.ArrayById` | 按 `idField` 匹配条目合并；`__delete` 或 `Disabled` 删除；同名对象递归合并 |\n\n**ArrayById 合并细节**：\n- 按 `idField` 匹配条目（默认 `\"id\"`）。\n- `__delete` 或 `Disabled` 标记的条目被删除。\n- 同名对象递归合并（遵循 `DeepObject` 策略）。\n- `ArrayAppendFields` 指定数组字段追加而非覆盖。\n- 来源顺序 = Core → Mods 按 `LoadedModIds`。\n\n⚠️ **注意**：`ConfigMerger.MergeArrayById` 方法（接受 `IReadOnlyList<JsonNode>`）会创建空 report 传给 core 方法，丢失了 fragment 来源追踪。这是一个已知问题。\n\n#### 关键类型\n\n| 类型 | 文件路径 | 说明 |\n|------|----------|------|\n| `ConfigPipeline` | `src/Core/Config/ConfigPipeline.cs` | 配置片段收集与合并入口 |\n| `ConfigMerger` | `src/Core/Config/ConfigMerger.cs` | 静态合并器：Replace / DeepObject / ArrayReplace / ArrayAppend / ArrayById |\n| `ConfigCatalog` | `src/Core/Config/ConfigCatalog.cs` | 配置目录注册表 |\n| `ConfigCatalogLoader` | `src/Core/Config/ConfigCatalogLoader.cs` | 从合并 JSON 加载 Catalog，校验字段、解析策略 |\n| `ConfigCatalogEntry` | `src/Core/Config/ConfigCatalogEntry.cs` | 只读 struct：RelativePath, MergePolicy, IdField, ArrayAppendFields |\n| `ConfigMergePolicy` | `src/Core/Config/ConfigMergePolicy.cs` | 合并策略枚举 |\n| `ConfigFragment` | `src/Core/Config/ConfigFragment.cs` | 只读 struct：JSON 节点 + 来源 URI |\n| `MergedConfigEntry` | `src/Core/Config/MergedConfigEntry.cs` | 合并结果条目：ID + JsonObject |\n| `ConfigConflictReport` | `src/Core/Config/ConfigConflictReport.cs` | 记录 fragment 来源、winner 来源、deleted 条目 |\n| `GameConfig` | `src/Core/Config/GameConfig.cs` | 运行时游戏配置根对象 |\n| `MapConfig` | `src/Core/Config/MapConfig.cs` | 地图配置：Entities, Teams, Players, Boards, TriggerTypes 等 |\n| `DataRegistry<T>` | `src/Core/Config/DataRegistry.cs` | 泛型数据注册表：从合并配置加载 `IIdentifiable` 条目 |\n| `StrictJsonOptions` | `src/Core/Config/StrictJsonOptions.cs` | 严格 JSON 选项：大小写敏感、拒绝未知字段 |\n| `ConfigSourcePaths` | `src/Core/Config/ConfigSourcePaths.cs` | 生成 `Core:Configs/`、`modId:assets/`、`modId:assets/Configs/` URI |\n| `ReloadConfigTrigger` | `src/Core/Config/ReloadConfigTrigger.cs` | 触发 `GameEngine.ReloadConfigs` |\n| `ConfigEvents` | `src/Core/Config/ConfigEvents.cs` | `Config.Reload` EventKey |\n\n#### EntityBuilder 与 TemplateEntityBatchSpawner\n\n`EntityBuilder` 是基于 `EntityTemplate` 的实体构建器：\n\n```csharp\nvar entity = new EntityBuilder()\n    .UseTemplate(\"HeroTemplate\")\n    .WithOverride(\"Health\", 200)\n    .Build(world, context);\n```\n\n`TemplateEntityBatchSpawner` 是 `EntityBuilder` 的高性能替代方案：\n- 直接通过 Arch chunk span 填充组件，绕过逐 entity 的 `ComponentRegistry.Apply`。\n- 仅支持有限的内置组件（`Name`, `WorldPositionCm`, `FacingDirection`, `AttributeBuffer`, `GameplayTagContainer`, `TagCountContainer`, `OrderBuffer`, `SelectionSelectableState`, `EntityLayer`, `Team`, `PlayerOwner`, `PresentationStaticTransform`, `SpatialPartitionExcluded` 等）。\n- 任何其他组件必须通过 `EntityBuilder` 走 `ComponentRegistry`。\n\n⚠️ **注意**：`TemplateEntityBatchSpawner` 与 `EntityBuilder` 的能力分裂是一个已知问题。同一模板可能因组件选择不同而走两条完全不同的生成路径，Mod 作者需要明确了解哪些组件可走 batch 路径。\n\n**关键文件**：`src/Core/Config/EntityBuilder.cs`、`src/Core/Config/TemplateEntityBatchSpawner.cs`、`src/Core/Config/EntityTemplate.cs`。\n\n### 4.2 Scripting — 事件与脚本\n\n#### TriggerManager\n\n`TriggerManager`（376 行）是全局 + Map-scoped 的触发器注册与分发中心。\n\n**核心 API**：\n\n```csharp\n// 注册全局 Trigger 类型（单例）\nvoid RegisterType<T>(string name) where T : Trigger;\n\n// 注册全局事件处理器（回调）\nvoid RegisterEventHandler(EventKey eventKey, Func<ScriptContext, Task> handler);\n\n// 注册 Map-scoped 事件处理器\nvoid RegisterMapEventHandler(string mapId, EventKey eventKey, Func<ScriptContext, Task> handler);\n\n// 触发全局事件（同步/异步）\nvoid FireEvent(EventKey eventKey, ScriptContext context);\nTask FireEventAsync(EventKey eventKey, ScriptContext context);\n\n// 触发 Map 事件\nvoid FireMapEvent(string mapId, EventKey eventKey, ScriptContext context);\n```\n\n**事件优先级**：`FireEvent` 和 `FireMapEvent` 按 Priority 升序执行 Trigger，确保低优先级（基础行为）先执行，高优先级（覆写行为）后执行。\n\n**Map 生命周期**：\n- `MapLoaded`：激活 Map-scoped Trigger，调用 `OnMapEnter`。\n- `MapUnloaded`：注销 Map-scoped Trigger，调用 `OnMapExit`。\n\n⚠️ **注意**：`TriggerManager` 的 `_typeRegistry` 不是真正的单例注册——同一个类型只能注册一次，但 \"duplicate registration\" 警告只在 `type != typeof(Trigger)` 时打印。如果类型为 `Trigger` 基类，静默忽略。\n\n⚠️ **注意**：`FireTriggerAsync` 中对 `MapLoaded` 事件有特殊处理（`if (trigger.EventKey == GameEvents.MapLoaded)` 时调用 `OnMapEnter`），这违反了 \"Trigger 不应知道事件分发细节\" 的原则。\n\n**关键文件**：`src/Core/Scripting/TriggerManager.cs`。\n\n#### Trigger 与 TriggerBuilder\n\n`Trigger` 是事件处理单元：\n\n```csharp\npublic class Trigger\n{\n    public string Name { get; set; }\n    public EventKey EventKey { get; set; }\n    public int Priority { get; set; }\n    public List<TriggerCondition> Conditions { get; set; }\n    public List<TriggerAction> Actions { get; set; }\n    // OnMapEnter / OnMapExit 生命周期\n}\n```\n\n`TriggerBuilder` 提供 Fluent API：\n\n```csharp\nnew TriggerBuilder(\"MyTrigger\")\n    .OnEvent(GameEvents.MapLoaded)\n    .WithPriority(100)\n    .Do(new SpawnUnitsCommand())\n    .Do(async ctx => { /* async action */ })\n    .Anchor(\"map_ready\")\n    .Build();\n```\n\n**关键文件**：`src/Core/Scripting/Trigger.cs`、`src/Core/Scripting/TriggerBuilder.cs`。\n\n#### TriggerDecoratorRegistry\n\n`TriggerDecoratorRegistry` 允许 Mod 在不直接创建 Trigger 的情况下修饰已有 Trigger：\n\n```csharp\n// 按类型修饰\ncontext.TriggerDecorators.Register<MyCustomTrigger>(t => t.SomeProperty = 42);\n\n// 按类型名修饰（适用于 JSON 声明的 Trigger）\ncontext.TriggerDecorators.Register(\"SpawnUnitsTrigger\", t => { ... });\n\n// 按 Anchor 注入命令（跨所有含该 anchor 的 Trigger）\ncontext.TriggerDecorators.RegisterAnchor(\"map_ready\", new MyCameraCommand());\n```\n\n⚠️ **注意**：`RegisterAnchor` 的跨 Trigger 注入语义在 `mod_architecture.md` 中仅有一行示例，未详细解释。这是一个强大的跨 Mod 扩展机制。\n\n**关键文件**：`src/Core/Scripting/TriggerDecoratorRegistry.cs`。\n\n#### FunctionRegistry\n\n`FunctionRegistry` 是脚本函数的注册表：\n\n```csharp\n// 注册函数（last-wins 覆盖策略）\nvoid Register(string name, ScriptFunctionDelegate function);\n\n// 调用函数\nobject Invoke(string name, ScriptContext context, object[] args);\n```\n\n⚠️ **注意**：`FunctionRegistry.Register` 在 DEBUG 下才记录冲突，Release 模式下冲突静默覆盖。\n\n**关键文件**：`src/Core/Scripting/FunctionRegistry.cs`。\n\n#### ScriptContext 与 CoreServiceKeys\n\n`ScriptContext` 是基于 `TypedServiceScope` 的轻量 KV 上下文：\n\n```csharp\n// 推荐：typed service key（编译时类型安全）\nvar registry = ctx.Get(CoreServiceKeys.AbilityDefinitionRegistry);\n\n// 遗留：string key（逐步退场）\nvar registry = ctx.Get<string>(ContextKeys.AbilityDefinitionRegistry);\n```\n\n`CoreServiceKeys`（346 行）定义了引擎级 typed service key 常量，覆盖 ECS、Map、UI、Input、Camera、GAS、Presentation、Spatial、Navigation、Config、Diagnostics 等全域。\n\n⚠️ **注意**：`ScriptContext` 的 Legacy string API 仍在广泛使用（如 `ReloadConfigTrigger` 使用 `context.Get<string>(ConfigReloadContextKeys.Group)`），但 `CoreServiceKeys` 才是当前推荐路径。\n\n**关键文件**：`src/Core/Scripting/ScriptContext.cs`、`src/Core/Scripting/CoreServiceKeys.cs`、`src/Core/Scripting/ContextKeys.cs`（legacy）。\n\n#### GameEvents\n\n`GameEvents` 定义内置 EventKey 常量：\n\n| 事件 | 说明 |\n|------|------|\n| `GameStart` | 全局启动 |\n| `MapLoaded` | 地图加载完成 |\n| `MapUnloaded` | 地图卸载 |\n| `Tick` | 每帧 tick |\n| `ModLoaded` | ⚠️ 未实现（`ModLoader.cs` 第 419 行注释 \"will be implemented in future TriggerManager\"） |\n| `SimulationBudgetFused` | 仿真预算耗尽 |\n| `Physics2D*` | 物理事件系列 |\n| `Gas*` | GAS 事件系列 |\n\n**关键文件**：`src/Core/Scripting/GameEvents.cs`。\n\n### 4.3 GraphRuntime — 图虚拟机\n\n![GraphCompiler 编译](diagrams/graph-compiler-flow.svg)\n\n\n#### GraphExecutor\n\n![GraphExecutor 执行循环](diagrams/graph-execution-loop.svg)\n\n\n`GraphExecutor`（38 行）是图 VM 的通用执行器：\n\n```csharp\npublic static class GraphExecutor\n{\n    public static void Execute<TState>(\n        ref TState state,\n        ReadOnlySpan<GraphInstruction> program,\n        IOpHandlerTable<TState> handlerTable);\n}\n```\n\n执行模型：\n- PC（Program Counter）驱动循环，逐条读取 `GraphInstruction`。\n- 通过 `handlerTable.Handlers[ins.Op]` 分派到对应 opcode handler。\n- 超出 `MaxInstructionsPerExecution = 4096` 时自动终止，防止无限循环。\n\n⚠️ **注意**：`GraphExecutor` 是解释型执行，而 `gitbook/architecture/performer-compiled-lanes.md` 提到编译式执行。两者可能不是同一概念，或编译式执行是未来的优化方向。\n\n**关键文件**：`src/Core/GraphRuntime/GraphExecutor.cs`。\n\n#### GraphCompiler\n\n`GraphCompiler` 将 JSON 声明的 `GraphConfig` 编译为 `GraphInstruction[]` 字节码：\n\n```\nGraphConfig (JSON)\n     ↓\nGraphValidator.Validate → List<GraphDiagnostic>\n     ↓\nGraphCompiler.CompileWithOutputs\n     ↓\n  ├── 拓扑排序（Entry → Next 链）\n  ├── 寄存器分配（Float/Int/Bool/Entity 各 32）\n  ├── 符号表 intern（attribute/tag/effect 等 name→index）\n  └── GraphInstruction[] 生成\n     ↓\nGraphProgramPackage (GraphName, Symbols, Program)\n     ↓\nGraphProgramRegistry.Register(graphId, program)\n```\n\n**寄存器模型**：\n- `Float Registers`：32 个\n- `Int Registers`：32 个\n- `Bool Registers`：32 个\n- `Entity Registers`：32 个\n- `Max Targets`：256 个\n- `Max Instructions Per Execution`：4096 个\n- `Handler Table Size`：512 个\n\n⚠️ **注意**：当前 opcode 已用到 396（`GraphNodeOp`），`HandlerTableSize = 512` 的预留空间有限。如果继续增加 op，需扩大 handler 表。\n\n⚠️ **注意**：`GraphCompiler` 中的单个 switch 处理 60+ 种 opcode（`GraphCompiler.cs` 第 91-457 行），每新增一种 op 都需要修改此文件，是维护热点。\n\n**关键文件**：`src/Core/NodeLibraries/GASGraph/GraphCompiler.cs`、`src/Core/NodeLibraries/GASGraph/GraphValidator.cs`。\n\n#### GraphNodeOp\n\n![OpCode 分类](diagrams/opcode-taxonomy.svg)\n\n\n`GraphNodeOp` 定义 133 个 opcode，覆盖：\n\n| 类别 | 示例 Opcode |\n|------|------------|\n| 常量加载 | `LoadFloat`, `LoadInt`, `LoadBool`, `LoadEntity` |\n| 数学运算 | `AddFloat`, `MulFloat`, `DivFloat`, `Sqrt`, `Sin`, `Cos` |\n| 比较与逻辑 | `EqFloat`, `GtFloat`, `AndBool`, `OrBool`, `NotBool` |\n| 空间查询 | `QueryRadius`, `QueryCone`, `QueryRectangle`, `QueryLine`, `QueryHexRange` |\n| Effect | `DispatchEffect`, `FanOutDispatchEffect` |\n| 属性 | `GetAttribute`, `SetAttribute`, `ModifyAttribute` |\n| Tag | `AddTag`, `RemoveTag`, `HasTag` |\n| 关系 | `SetRelationship`, `AddRelationshipMetric`, `GetRelationshipSynergy` |\n| Blackboard | `ReadBlackboard`, `WriteBlackboard` |\n| Config | `ReadConfigFloat`, `ReadConfigInt` |\n| 上下文 | `GetCaster`, `GetTarget`, `GetTargetPosition`, `GetRandomSeed` |\n\n⚠️ **注意**：`GraphDiagnostics` 的 `GraphDiagnosticCodes` 缺少 `RelationshipAggMinMetric` / `RelationshipAggMaxEntityByMetric` / `RelationshipAggMinEntityByMetric` 等码（`GraphNodeOp` 中存在对应 opcode 394-396，但诊断码列表中无对应错误码）。\n\n**关键文件**：`src/Core/NodeLibraries/GASGraph/GraphOps.cs`。\n\n#### GasGraphRuntimeApi\n\n`GasGraphRuntimeApi` 是图 VM 的生产实现，提供运行时协议：\n\n```csharp\npublic sealed class GasGraphRuntimeApi : IGraphRuntimeApi\n{\n    // 空间查询\n    EntityCollection QueryRadius(Vector3 center, float radius, ...);\n    // 属性读写\n    float GetAttribute(Entity entity, int attributeId);\n    void SetAttribute(Entity entity, int attributeId, float value);\n    // Tag 操作\n    void AddTag(Entity entity, int tagId);\n    // Effect 分发\n    void DispatchEffect(Entity target, int effectTemplateId, ...);\n    // 关系操作\n    void SetRelationship(Entity source, Entity target, int relationshipTypeId);\n    // ... 大量默认抛出 NotAvailable 的接口方法\n}\n```\n\n`CreateProduction` 从 services dict 强类型拉取依赖（`World`, `SpatialQueryService`, `EntitySetQueryRuntime`, `RelationshipRuntime` 等）。\n\n⚠️ **注意**：`GasGraphRuntimeApi` 构造函数参数列表过长（15+ 可选参数），且 `typeRegistry`、`metricRegistry`、`flagRegistry`、`reasonRegistry` 被显式丢弃（`_ = typeRegistry`）。这些参数在 `CreateProduction` 中通过 `RequireService` 强制获取，但构造时却被丢弃。\n\n⚠️ **注意**：`IGraphRuntimeApi.FanOutDispatchEffect` 默认实现为空 `{}`（不是抛出异常），这可能导致静默失败。\n\n**关键文件**：`src/Core/NodeLibraries/GASGraph/Host/GasGraphRuntimeApi.cs`、`src/Core/NodeLibraries/GASGraph/IGraphRuntimeApi.cs`。\n\n## 5. 关键类清单（带文件路径）\n\n### 5.1 Config 管线\n\n| 类名 | 文件路径 | 说明 | 行数 |\n|------|----------|------|------|\n| `ConfigPipeline` | `src/Core/Config/ConfigPipeline.cs` | 配置片段收集与合并入口 | 218 |\n| `ConfigMerger` | `src/Core/Config/ConfigMerger.cs` | 静态合并器 | — |\n| `ConfigCatalog` | `src/Core/Config/ConfigCatalog.cs` | 配置目录注册表 | — |\n| `ConfigCatalogLoader` | `src/Core/Config/ConfigCatalogLoader.cs` | 从 JSON 加载 Catalog | — |\n| `ConfigCatalogEntry` | `src/Core/Config/ConfigCatalogEntry.cs` | 只读 struct | — |\n| `ConfigMergePolicy` | `src/Core/Config/ConfigMergePolicy.cs` | 合并策略枚举 | — |\n| `ConfigFragment` | `src/Core/Config/ConfigFragment.cs` | JSON 节点 + 来源 URI | — |\n| `MergedConfigEntry` | `src/Core/Config/MergedConfigEntry.cs` | 合并结果条目 | — |\n| `ConfigConflictReport` | `src/Core/Config/ConfigConflictReport.cs` | 冲突报告 | — |\n| `GameConfig` | `src/Core/Config/GameConfig.cs` | 运行时配置根对象 | — |\n| `MapConfig` | `src/Core/Config/MapConfig.cs` | 地图配置 | — |\n| `DataRegistry<T>` | `src/Core/Config/DataRegistry.cs` | 泛型数据注册表 | — |\n| `EntityBuilder` | `src/Core/Config/EntityBuilder.cs` | 实体构建器 | — |\n| `EntityTemplate` | `src/Core/Config/EntityTemplate.cs` | 可序列化模板 | — |\n| `TemplateEntityBatchSpawner` | `src/Core/Config/TemplateEntityBatchSpawner.cs` | 批量实体生成器 | — |\n| `ComponentRegistry` | `src/Core/Config/ComponentRegistry.cs` | 组件注册表（60+ 组件） | — |\n| `StrictJsonOptions` | `src/Core/Config/StrictJsonOptions.cs` | 严格 JSON 选项 | — |\n| `IIdentifiable` | `src/Core/Config/IIdentifiable.cs` | 唯一标识接口 | — |\n| `ConfigSourcePaths` | `src/Core/Config/ConfigSourcePaths.cs` | 配置来源路径生成 | — |\n| `ReloadConfigTrigger` | `src/Core/Config/ReloadConfigTrigger.cs` | 配置重载触发器 | — |\n| `ConfigEvents` | `src/Core/Config/ConfigEvents.cs` | 配置事件 | — |\n\n### 5.2 Scripting\n\n| 类名 | 文件路径 | 说明 | 行数 |\n|------|----------|------|------|\n| `TriggerManager` | `src/Core/Scripting/TriggerManager.cs` | 全局 + Map-scoped 触发器 | 376 |\n| `Trigger` | `src/Core/Scripting/Trigger.cs` | 事件处理单元 | — |\n| `TriggerBuilder` | `src/Core/Scripting/TriggerBuilder.cs` | Fluent API 构建器 | — |\n| `TriggerDecoratorRegistry` | `src/Core/Scripting/TriggerDecoratorRegistry.cs` | Trigger 修饰器注册表 | — |\n| `FunctionRegistry` | `src/Core/Scripting/FunctionRegistry.cs` | 脚本函数注册表 | — |\n| `GameEvents` | `src/Core/Scripting/GameEvents.cs` | 内置 EventKey 常量 | — |\n| `CoreServiceKeys` | `src/Core/Scripting/CoreServiceKeys.cs` | Typed service key 常量 | 346 |\n| `ScriptContext` | `src/Core/Scripting/ScriptContext.cs` | 轻量 KV 上下文 | — |\n| `EventKey` | `src/Core/Scripting/EventKey.cs` | 事件键封装 | — |\n| `ServiceKey<T>` | `src/Core/Scripting/ServiceKey.cs` | 编译时类型安全的服务键 | — |\n| `ContextKeys` | `src/Core/Scripting/ContextKeys.cs` | Legacy string key 常量 | — |\n\n### 5.3 GraphRuntime\n\n| 类名 | 文件路径 | 说明 | 行数 |\n|------|----------|------|------|\n| `GraphExecutor` | `src/Core/GraphRuntime/GraphExecutor.cs` | 图 VM 通用执行器 | 38 |\n| `GraphProgramRegistry` | `src/Core/GraphRuntime/GraphProgramRegistry.cs` | 图程序注册表 | — |\n| `GraphInstruction` | `src/Core/GraphRuntime/GraphInstruction.cs` | 指令 struct | — |\n| `GraphProgramPackage` | `src/Core/GraphRuntime/GraphProgramPackage.cs` | 只读 record | — |\n| `GraphProgramBuffer` | `src/Core/GraphRuntime/GraphProgramBuffer.cs` | unsafe fixed buffer | — |\n| `GraphCompiler` | `src/Core/NodeLibraries/GASGraph/GraphCompiler.cs` | 图编译器 | — |\n| `GraphValidator` | `src/Core/NodeLibraries/GASGraph/GraphValidator.cs` | 图校验器 | — |\n| `GraphConfig` | `src/Core/NodeLibraries/GASGraph/GraphConfig.cs` | 序列化配置 | — |\n| `GraphNodeConfig` | `src/Core/NodeLibraries/GASGraph/GraphConfig.cs` | 节点配置 | — |\n| `GraphOutputConfig` | `src/Core/NodeLibraries/GASGraph/GraphConfig.cs` | 输出配置 | — |\n| `GraphExecutionState` | `src/Core/NodeLibraries/GASGraph/GraphExecutionState.cs` | 执行状态 ref struct | — |\n| `IGraphRuntimeApi` | `src/Core/NodeLibraries/GASGraph/IGraphRuntimeApi.cs` | 图 VM 运行时协议 | — |\n| `GasGraphRuntimeApi` | `src/Core/NodeLibraries/GASGraph/Host/GasGraphRuntimeApi.cs` | 生产实现 | — |\n| `GraphIdRegistry` | `src/Core/NodeLibraries/GASGraph/Host/GraphIdRegistry.cs` | 静态 name→id 注册表 | — |\n| `GraphNodeOp` | `src/Core/NodeLibraries/GASGraph/GraphOps.cs` | 133 个 opcode 枚举 | — |\n| `GraphVmLimits` | `src/Core/NodeLibraries/GASGraph/GraphVmLimits.cs` | VM 限制常量 | — |\n| `GraphDiagnostics` | `src/Core/NodeLibraries/GASGraph/GraphDiagnostics.cs` | 诊断码 | — |\n| `GasGraphOpHandlerTable` | `src/Core/NodeLibraries/GASGraph/GasGraphOpHandlerTable.cs` | GAS opcode handler 表 | — |\n| `GraphProgramConfigLoader` | `src/Core/NodeLibraries/GASGraph/Host/GraphProgramConfigLoader.cs` | 配置加载器 | — |\n| `GraphProgramSymbolPatcher` | `src/Core/NodeLibraries/GASGraph/Host/GraphProgramSymbolPatcher.cs` | 符号 patching | — |\n| `GasGraphSymbolResolver` | `src/Core/NodeLibraries/GASGraph/Host/GasGraphSymbolResolver.cs` | 符号解析器 | — |\n\n## 6. 输入 / 输出\n\n| 输入 | 来源 | 处理路径 |\n|------|------|---------|\n| `game.json` 配置片段 | VFS（`ModId:Path`） | `ConfigPipeline.CollectFragments` → `DeepMerge` / `MergeArrayById` → `GameConfig` |\n| `config_catalog.json` | VFS | `ConfigCatalogLoader.Load` → `ConfigCatalog` → `MergeFromCatalog` → `DataRegistry<T>.Load` |\n| `GraphConfig` (JSON) | VFS / 配置 | `GraphValidator.Validate` → `GraphCompiler.CompileWithOutputs` → `GraphProgramRegistry.Register` |\n| 事件触发 | `GameEngine` / `MapManager` | `TriggerManager.FireEvent` / `FireMapEvent` → 按 Priority 执行 Trigger |\n| 脚本函数调用 | Trigger Action / System | `FunctionRegistry.Invoke` → `ScriptFunctionDelegate` |\n\n| 输出 | 目标 | 生成路径 |\n|------|------|---------|\n| 合并后的 `GameConfig` | `GameEngine.InitializeCoreSystems` | `ConfigPipeline.MergeGameConfig` |\n| 合并后的 `ConfigCatalog` | 各子系统 ConfigLoader | `ConfigCatalogLoader.Load` |\n| 图程序字节码 | `GraphProgramRegistry` | `GraphCompiler.CompileWithOutputs` |\n| 事件响应 | ECS World 状态变更 | Trigger Actions / EventHandlers |\n| 冲突报告 | 日志 | `ConfigConflictReport` / `RegistrationConflictReport` |\n\n## 7. 依赖关系\n\n| 依赖项 | 被谁依赖 | 说明 |\n|--------|---------|------|\n| `VirtualFileSystem` | `ConfigPipeline`, `ModLoader` | 配置片段从 VFS 读取 |\n| `StringIntRegistry` | `GraphCompiler`, `GasGraphSymbolResolver` | 符号表 intern |\n| `ComponentRegistry` | `EntityBuilder`, `TemplateEntityBatchSpawner` | 组件 authoring 解析 |\n| `SpatialQueryService` | `GasGraphRuntimeApi` | 图 VM 空间查询 |\n| `RelationshipRuntime` | `GasGraphRuntimeApi` | 图 VM 关系操作 |\n| `EntitySetQueryRuntime` | `GasGraphRuntimeApi` | 图 VM 实体集合查询 |\n| `Arch.World` | `GraphExecutionState` | 图 VM 访问 ECS World |\n\n## 8. 非功能需求（性能约束）\n\n| 约束项 | 目标 | 实现 |\n|--------|------|------|\n| 配置合并 | 启动时一次完成 | `ConfigPipeline.MergeGameConfig` 在初始化时执行 |\n| 批量实体生成 | 10,000+ 实体/帧 | `TemplateEntityBatchSpawner` 通过 Arch chunk span 填充 |\n| 图 VM 执行 | < 4096 指令/次 | `GraphVmLimits.MaxInstructionsPerExecution` |\n| 图 VM 寄存器 | 32/32/32/32（F/I/B/E） | `GraphVmLimits` 固定限制 |\n| 图 VM handler 表 | 512 槽 | `GraphVmLimits.HandlerTableSize` |\n| 零 GC 触发 | `BuiltinHandlerRegistry` 固定 64 槽 | 通过索引直接访问 |\n| 存档引用完整性 | 验证 entity ref | `SaveEntityReferenceValidator` |\n| 配置冲突可见 | DEBUG 模式打印冲突 | `ConfigConflictReport` / `RegistrationConflictReport` |\n\n---\n\n> **版本说明**：本章节基于 Ludots `main` 分支（2026-07-02 扫描）。\n> - ⚠️ `GraphExecutor` 是解释型执行，编译式执行（performer-compiled-lanes）可能尚未实现。\n> - ⚠️ `FanOutDispatchEffect` 默认空实现，可能导致静默失败。\n> - ⚠️ `GraphCompiler` 的 switch-case 维护成本高，opcode 编号空间预留有限。\n> - ⚠️ `ConfigMerger.MergeArrayById` 丢失 fragment 来源追踪。\n> - ⚠️ `FunctionRegistry` 在 Release 模式下静默覆盖冲突。\n> - ⚠️ `GameEvents.ModLoaded` 未实现。";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
</script>
