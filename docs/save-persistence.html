<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存档 · 回放 · 联机 — Ludots</title>
<meta name="description" content="Ludots 存档、确定性回放与断线恢复：门户一级入口，三份 Showcase 设计说明与通用存档合同。">
<link rel="stylesheet" href="site-assets/site.css">
<style>
  .docs-layout {
    display: grid; grid-template-columns: 300px 1fr; gap: 26px; align-items: start;
  }
  .docs-tree {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 14px;
    max-height: 74vh; overflow-y: auto; position: sticky; top: 84px;
  }
  .docs-tree .tree-title {
    font-size: 13px; font-weight: 700; color: var(--muted);
    padding: 0 10px 10px; letter-spacing: 1px;
  }
  .docs-tree a {
    display: block; padding: 5px 10px; border-radius: var(--radius-sm);
    color: var(--fg); font-size: 13.5px; line-height: 1.55;
  }
  .docs-tree a:hover { background: var(--accent-light); color: var(--accent); text-decoration: none; }
  .docs-tree a.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
  .docs-view {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 36px 44px; min-height: 400px;
    max-width: 100%; overflow-x: hidden;
  }
  .docs-view .doc-path { font-size: 12.5px; color: var(--faint); margin-bottom: 18px; font-family: var(--mono); }
  .md-body h1 { font-size: 26px; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin: 0 0 18px; }
  .md-body h2 { font-size: 21px; margin-top: 34px; border-bottom: 1px solid var(--border); padding-bottom: 7px; }
  .md-body h3 { font-size: 17px; margin-top: 26px; }
  .md-body h4 { font-size: 15.5px; margin-top: 22px; }
  .md-body p { margin: 12px 0; }
  .md-body ul, .md-body ol { margin: 12px 0; padding-left: 24px; }
  .md-body li { margin: 4px 0; }
  .md-body table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13.5px; display: block; overflow-x: auto; }
  .md-body th, .md-body td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; }
  .md-body th { background: var(--bg-soft); font-weight: 600; }
  .md-body blockquote {
    border-left: 3px solid var(--accent); margin: 16px 0;
    padding: 8px 16px; background: var(--bg-soft); color: var(--muted);
  }
  .md-body pre { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; overflow-x: auto; font-size: 13px; }
  .md-body code { font-family: var(--mono); font-size: 0.92em; background: var(--bg-soft); border-radius: 4px; padding: 1px 5px; }
  .md-body pre code { background: none; padding: 0; }
  .md-body img { max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); margin: 14px 0; }
  .md-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .docs-loading { color: var(--faint); padding: 40px 0; text-align: center; }
  .hub-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; margin-bottom: 14px; }
  .btn {
    display: inline-block; padding: 10px 18px; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 600; transition: all 0.15s;
  }
  .btn:hover { text-decoration: none; transform: translateY(-1px); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); color: #fff; }
  .btn-ghost { border: 1px solid var(--border-strong); color: var(--fg); background: var(--card); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 960px) {
    .docs-layout { grid-template-columns: 1fr; }
    .docs-tree { position: static; max-height: 320px; }
    .docs-view { padding: 24px 20px; }
  }
</style>
</head>
<body data-page="savepersistence">
<header id="topbar"></header>

<main class="page">
  <div class="hub-actions">
    <a class="btn btn-primary" href="#doc/architecture/save-persistence-showcases/README.md">家族总览</a>
    <a class="btn btn-ghost" href="gallery.html">Showcase 画廊 →</a>
    <a class="btn btn-ghost" href="tests.html">测试与验收 →</a>
    <a class="btn btn-ghost" href="index.html#docs">全部文档 →</a>
  </div>
  <div class="docs-layout">
    <aside class="docs-tree" id="hub-tree">
      <div class="tree-title">目录加载中…</div>
    </aside>
    <article class="docs-view">
      <div class="doc-path" id="doc-path"></div>
      <div class="md-body" id="doc-body">
        <div class="docs-loading">文档加载中…</div>
      </div>
    </article>
  </div>
</main>

<footer class="site-footer">
  <div class="inner">
    <span>Ludots 存档 · 回放 · 联机 · 写作源 gitbook/architecture/save-persistence-showcases/</span>
    <span>录像待补 artifacts/evidence/ · 截图见 artifacts/acceptance/ · 发布于 GitHub Pages</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="site-assets/site.js"></script>
<script>
(function () {
  "use strict";
  var esc = LudotsSite.esc;

  /* 与 gitbook/SUMMARY.md「存档 · 回放 · 联机」一级节对齐；改 SUMMARY 时同步此处 */
  var NAV = [
    { path: "architecture/save-persistence-showcases/README.md", title: "家族总览" },
    { path: "architecture/save-system.md", title: "通用存档系统" },
    { path: "architecture/save-load-showcase-design.md", title: "存档读档 Showcase" },
    { path: "architecture/deterministic-replay-showcase-design.md", title: "确定性回放 Showcase" },
    { path: "architecture/reconnect-recovery-showcase-design.md", title: "断线恢复 Showcase（单机模拟）" },
    { path: "architecture/persistence-online-replay-showcase-design.md", title: "历史复合条目（已退役）" }
  ];
  var DEFAULT_DOC = NAV[0].path;
  var currentDoc = null;

  if (window.marked && marked.setOptions) {
    marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });
  }

  function buildTree() {
    var host = document.getElementById("hub-tree");
    var html = '<div class="tree-title">存档 · 回放 · 联机</div>';
    for (var i = 0; i < NAV.length; i++) {
      var n = NAV[i];
      html += '<a href="#doc/' + esc(n.path) + '" data-doc="' + esc(n.path) + '">' + esc(n.title) + "</a>";
    }
    host.innerHTML = html;
  }

  function markActive() {
    document.querySelectorAll("#hub-tree a[data-doc]").forEach(function (a) {
      if (a.getAttribute("data-doc") === currentDoc) a.classList.add("active");
      else a.classList.remove("active");
    });
  }

  function resolveMd(href) {
    var decoded = decodeURIComponent(href).replace(/\.md$/i, "");
    var base = currentDoc.replace(/\/[^/]+$/, "").split("/");
    decoded.split("/").forEach(function (seg) {
      if (seg === "" || seg === ".") return;
      if (seg === "..") { if (base.length) base.pop(); }
      else base.push(seg);
    });
    return base.join("/") + ".md";
  }

  function rewriteLinks(container) {
    container.querySelectorAll("a[href]").forEach(function (a) {
      var href = a.getAttribute("href");
      if (!href || /^(https?:|mailto:|#)/i.test(href)) return;
      if (!/\.md$/i.test(href)) return;
      var resolved = resolveMd(href);
      var known = false;
      for (var i = 0; i < NAV.length; i++) if (NAV[i].path === resolved) { known = true; break; }
      if (known) a.setAttribute("href", "#doc/" + resolved);
      else a.setAttribute("href", LudotsSite.SITE_BASE + "index.html#docs/" + resolved);
    });
  }

  function loadDoc(path) {
    currentDoc = path;
    var body = document.getElementById("doc-body");
    var pathEl = document.getElementById("doc-path");
    body.innerHTML = '<div class="docs-loading">加载中…</div>';
    pathEl.textContent = "gitbook/" + path;
    markActive();

    LudotsSite.fetchText("gitbook/" + path).then(function (md) {
      body.innerHTML = marked.parse(md);
      rewriteLinks(body);
      LudotsSite.bindCopyButtons(body);
      window.scrollTo({ top: 0, behavior: "auto" });
    }).catch(function () {
      body.innerHTML = '<div class="docs-loading">无法加载 <code>gitbook/' + esc(path) +
        '</code><br>请确认文件存在，或先运行 <code>python scripts/build-site.py</code> 重建站点。</div>';
    });
  }

  function route() {
    var h = window.location.hash || "";
    var target = DEFAULT_DOC;
    if (h.indexOf("#doc/") === 0) {
      var raw = decodeURIComponent(h.slice("#doc/".length));
      if (raw && /\.md$/i.test(raw) && raw.indexOf("..") < 0) target = raw;
    }
    if (target !== currentDoc) loadDoc(target);
  }

  document.addEventListener("DOMContentLoaded", function () {
    buildTree();
    route();
  });
  window.addEventListener("hashchange", route);
})();
</script>
</body>
</html>
