<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面板矩阵 — Ludots</title>
<meta name="description" content="Ludots 面板矩阵：35 类面板一案一文——配置（graph+pins）、线框预期（三主题皮肤预览）、验收。目录数据由构建脚本从 panel-cases/README.md 解析生成。">
<link rel="stylesheet" href="site-assets/site.css">
<style>
  .docs-layout {
    display: grid; grid-template-columns: 320px 1fr; gap: 26px; align-items: start;
  }
  .docs-tree {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 14px;
    max-height: 74vh; overflow-y: auto; position: sticky; top: 84px;
  }
  .docs-tree .tree-title {
    font-size: 13px; font-weight: 700; color: var(--muted);
    padding: 0 10px 10px; letter-spacing: 1px;
  }
  .docs-tree a, .docs-tree .entry {
    display: block; padding: 5px 10px; border-radius: var(--radius-sm);
    color: var(--fg); font-size: 13.5px; line-height: 1.55;
  }
  .docs-tree a:hover { background: var(--accent-light); color: var(--accent); text-decoration: none; }
  .docs-tree a.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
  .docs-tree .grp > .entry { font-weight: 600; }
  .docs-tree .children { margin-left: 14px; border-left: 1px solid var(--border); padding-left: 6px; }
  .docs-tree .id {
    font-family: var(--mono); font-size: 11.5px; color: var(--accent);
    background: var(--accent-light); border-radius: 4px; padding: 0 5px; margin-right: 6px;
  }
  .wiki-filter {
    width: 100%; box-sizing: border-box; margin: 0 0 12px; padding: 7px 10px;
    font-size: 13px; font-family: inherit; color: var(--fg);
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .wiki-filter:focus { outline: none; border-color: var(--accent); }
  .docs-view {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 36px 44px; min-height: 400px;
    max-width: 100%; overflow-x: hidden;
  }
  .docs-view .doc-path { font-size: 12.5px; color: var(--faint); margin-bottom: 18px; font-family: var(--mono); }
  .md-body h1 { font-size: 26px; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin: 0 0 18px; }
  .md-body h2 { font-size: 21px; margin-top: 34px; border-bottom: 1px solid var(--border); padding-bottom: 7px; }
  .md-body h3 { font-size: 17px; margin-top: 26px; }
  .md-body h4 { font-size: 15.5px; margin-top: 22px; }
  .md-body p { margin: 12px 0; }
  .md-body ul, .md-body ol { margin: 12px 0; padding-left: 24px; }
  .md-body li { margin: 4px 0; }
  .md-body table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13.5px; display: block; overflow-x: auto; }
  .md-body th, .md-body td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; }
  .md-body th { background: var(--bg-soft); font-weight: 600; }
  .md-body blockquote {
    border-left: 3px solid var(--accent); margin: 16px 0;
    padding: 8px 16px; background: var(--bg-soft); color: var(--muted);
  }
  .md-body pre { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; overflow-x: auto; font-size: 13px; }
  .md-body code { font-family: var(--mono); font-size: 0.92em; background: var(--bg-soft); border-radius: 4px; padding: 1px 5px; }
  .md-body pre code { background: none; padding: 0; }
  .md-body img { max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); margin: 14px 0; }
  .md-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .md-body video {
    display: block; width: 100%; max-width: 900px; margin: 18px 0;
    border: 1px solid var(--border); border-radius: var(--radius-sm); background: #000;
  }
  .op-pager {
    display: flex; justify-content: space-between; gap: 16px;
    margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--border);
  }
  .op-pager a { font-size: 13.5px; color: var(--accent); }
  .op-pager .none { font-size: 13.5px; color: var(--faint); }
  .docs-loading { color: var(--faint); padding: 40px 0; text-align: center; }

  @media (max-width: 960px) {
    .docs-layout { grid-template-columns: 1fr; }
    .docs-tree { position: static; max-height: 320px; }
    .docs-view { padding: 24px 20px; }
  }
.hifi { border: 1.5px solid var(--border); border-radius: 12px; margin: 14px 0 18px; overflow: hidden; }
.hifi .hifi-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg-soft); }
.hifi .hifi-head .lbl { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; flex: 1; }
.hifi .hifi-head button { border: 1px solid var(--border); background: var(--card); color: var(--fg); border-radius: 99px; padding: 2px 10px; font-size: 11.5px; cursor: pointer; }
.hifi .hifi-head button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.hifi .mock { --m-panel: var(--card); --m-border: var(--border); --m-fg: var(--fg); --m-muted: var(--muted); --m-accent: var(--accent);
  padding: 14px 16px; font-size: 13.5px; display: flex; flex-direction: column; gap: 8px;
  background: var(--m-panel); color: var(--m-fg); }
.hifi[data-skin="ink-wash"] .mock { --m-panel:#f5f0e4e0; --m-border:#2b2b2bd0; --m-fg:#1c1c1c; --m-muted:#786e64; --m-accent:#8c1d18; font-family:"KaiTi","STKaiti",serif; }
.hifi[data-skin="fantasy"] .mock { --m-panel:#3d2c1ceb; --m-border:#c9a65a; --m-fg:#e2d6bc; --m-muted:#a08a68; --m-accent:#e4c47a; font-family:Georgia,"Palatino Linotype",serif; }
.hifi[data-skin="minimal"] .mock { --m-panel:#fafafaf5; --m-border:#141414c8; --m-fg:#111; --m-muted:#999; --m-accent:#111; font-family:"Segoe UI","Helvetica Neue",sans-serif; }
.mock .row { display: flex; align-items: center; gap: 8px; }
.mock .bar { flex: 1; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--m-muted) 25%, transparent); overflow: hidden; }
.mock .bar > i { display: block; height: 100%; background: var(--m-accent); border-radius: 4px; }
.mock .bar.hp > i { background:#e5484d; } .mock .bar.mp > i { background:#4c7ce5; }
.mock .t { font-size: 12px; color: var(--m-muted); }
.mock .chip { border:1px solid var(--m-border); border-radius:6px; padding:3px 8px; font-size:12px; }
.mock .chip.on { border-color:var(--m-accent); color:var(--m-accent); font-weight:700; }
.mock .item { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed color-mix(in srgb, var(--m-border) 60%, transparent); }
.mock .mini { background: color-mix(in srgb, var(--m-accent) 12%, var(--m-panel)); border-radius:8px; height:96px; position:relative; overflow:hidden; }
.mock .mini i { position:absolute; width:6px; height:6px; border-radius:50%; background:var(--m-accent); }
</style>
</head>
<body data-page="panels">
<header id="topbar"></header>


<main class="page">
  <div class="docs-layout" style="margin-top: 22px;">
    <aside class="docs-tree" id="panel-tree">
      <div class="tree-title">目录加载中…</div>
    </aside>
    <article class="docs-view">
      <div class="doc-path" id="doc-path"></div>
      <div class="md-body" id="doc-body">
        <div class="docs-loading">文档加载中…</div>
      </div>
      <div class="case-pager" id="case-pager"></div>
    </article>
  </div>
</main>

<footer class="site-footer">
  <div class="inner">
    <span>Ludots 面板矩阵 · 写作源 gitbook/reference/graph-node-op-wiki/（生成器维护，勿手改正文）</span>
    <span>录像存 artifacts/evidence/capability_standard_graph_op_*/ · 发布于 GitHub Pages</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="site-assets/site.js"></script>
<script src="site-assets/panels-nav.js"></script>
<script>
(function () {
  "use strict";
  var esc = LudotsSite.esc;

  var CASES_DIR = "architecture/panel-cases/";
  var DEFAULT_DOC = "README.md";
  var currentDoc = null;

  if (window.marked && marked.setOptions) {
    marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });
  }

  /* ============ 目录树（数据源：site-assets/panels-nav.js） ============ */
  function flatOps() {
    var flat = [];
    var nav = window.PANELS_NAV;
    if (!nav) return flat;
    for (var i = 0; i < nav.families.length; i++) {
      for (var j = 0; j < nav.families[i].ops.length; j++) {
        flat.push(nav.families[i].ops[j]);
      }
    }
    return flat;
  }

  function opName(file) {
    return file.replace(/\.md$/i, "");
  }

  function buildTree() {
    var host = document.getElementById("panel-tree");
    if (!window.PANELS_NAV || !window.PANELS_NAV.families) {
      host.innerHTML = '<div class="tree-title">目录不可用</div>' +
        '<div class="docs-loading">请先运行 python scripts/build-site.py 重建站点。</div>';
      return;
    }
    var nav = window.PANELS_NAV;
    var html = '<div class="tree-title">面板矩阵 · ' + nav.total + " op · " + nav.families.length + " 家族</div>";
    html += '<input class="wiki-filter" id="panel-filter" type="search" placeholder="过滤：面板 id / 名称">';
    html += '<a data-doc="' + esc("README.md") + '" href="#readme">总目录 · 分组索引</a>';
    for (var i = 0; i < nav.families.length; i++) {
      var fam = nav.families[i];
      html += '<div class="grp" data-family="' + esc(fam.title) + '">' +
        '<div class="entry">' + esc(fam.title) +
        ' <span style="color:var(--faint);font-weight:400;font-size:12px;">' + fam.ops.length + "</span></div>";
      html += '<div class="children">';
      for (var j = 0; j < fam.ops.length; j++) {
        var op = fam.ops[j];
        html += '<a data-doc="' + esc(op.file) + '" href="#case/' + esc(opName(op.file)) + '">' +
          '<span class="id">' + esc(opName(op.file)) + "</span>" + esc(op.title) + "</a>";
      }
      html += "</div></div>";
    }
    host.innerHTML = html;

    var filter = document.getElementById("panel-filter");
    filter.addEventListener("input", function () {
      var q = filter.value.trim().toLowerCase();
      host.querySelectorAll(".grp").forEach(function (grp) {
        var visible = 0;
        grp.querySelectorAll("a[data-doc]").forEach(function (a) {
          var hit = !q || a.textContent.toLowerCase().indexOf(q) >= 0 ||
            (a.getAttribute("data-desc") || "").toLowerCase().indexOf(q) >= 0;
          a.style.display = hit ? "" : "none";
          if (hit) visible++;
        });
        grp.style.display = visible ? "" : "none";
      });
    });
    markActive();
  }

  function markActive() {
    document.querySelectorAll("#panel-tree a[data-doc]").forEach(function (a) {
      a.classList.toggle("active", a.getAttribute("data-doc") === currentDoc);
    });
  }

  /* ============ 链接重写：同目录 .md 互链进页内路由，跨目录走门户文档区 ============ */
  function rewriteLinks(container) {
    container.querySelectorAll("a[href]").forEach(function (a) {
      var href = a.getAttribute("href");
      if (!href || /^(https?:|mailto:|#)/i.test(href)) return;
      if (!/\.md$/i.test(href)) return;
      var decoded = decodeURIComponent(href);
      if (decoded.indexOf("..") < 0) {
        var stem = decoded.replace(/\.md$/i, "");
        a.setAttribute("href", stem.toLowerCase() === "readme" ? "#readme" : "#case/" + stem);
        return;
      }
      var base = "reference/graph-node-op-wiki".split("/");
      decoded.replace(/\.md$/i, "").split("/").forEach(function (seg) {
        if (seg === "" || seg === ".") return;
        if (seg === "..") base.pop(); else base.push(seg);
      });
      a.setAttribute("href", LudotsSite.SITE_BASE + "index.html#docs/" + base.join("/"));
    });
  }

  function renderPager(file) {
    var host = document.getElementById("case-pager");
    var flat = flatOps();
    var idx = -1;
    for (var i = 0; i < flat.length; i++) if (flat[i].file === file) { idx = i; break; }
    if (idx < 0) { host.innerHTML = ""; return; }
    var prev = idx > 0 ? flat[idx - 1] : null;
    var next = idx < flat.length - 1 ? flat[idx + 1] : null;
    var html = "";
    if (prev) html += '<a href="#case/' + esc(opName(prev.file)) + '">← ' + esc(prev.title) + "</a>";
    else html += '<span class="none">已是第一案</span>';
    if (next) html += '<a href="#case/' + esc(opName(next.file)) + '">' + esc(next.title) + " →</a>";
    else html += '<span class="none">已是最后一案</span>';
    host.innerHTML = html;
  }

  /* ============ 高保真预期：案内 mock 代码块渲染为可换肤组件卡片 ============ */
  function mockHtml(spec) {
    var t = spec.type;
    if (t === "stat") return '<div class="row" style="gap:18px">' + (spec.items || []).map(function (x) { return "<b>" + esc(String(x)) + "</b>"; }).join("") + "</div>";
    if (t === "text") return '<div class="row">' + esc(spec.text || "") + "</div>";
    if (t === "bars") return (spec.bars || []).map(function (b) {
      return '<div class="row"><span style="width:26px">' + esc(b[0]) + '</span><div class="bar ' + String(b[0]).toLowerCase() + '"><i style="width:' + b[1] + '%"></i></div><span class="t">' + b[1] + "%</span></div>";
    }).join("");
    if (t === "chips") return '<div class="row" style="flex-wrap:wrap">' + (spec.chips || []).map(function (c, i) {
      return '<span class="chip' + (i === spec.on ? " on" : "") + '">' + esc(c) + "</span>";
    }).join("") + "</div>";
    if (t === "list") return (spec.rows || []).map(function (r) {
      return '<div class="item"><span>' + esc(r[0]) + '</span><span class="t">' + esc(r[1] || "") + "</span></div>";
    }).join("");
    if (t === "queue") return '<div class="row"><div class="bar hp" style="height:12px"><i style="width:' + spec.percent + '%"></i></div><span class="t">' + spec.percent + '%</span></div><div class="row" style="flex-wrap:wrap">' + (spec.items || []).map(function (c) { return '<span class="chip">' + esc(c) + "</span>"; }).join("") + "</div>";
    if (t === "mini") return '<div class="mini">' + (spec.dots || []).map(function (d) {
      return '<i style="left:' + d[0] + '%;top:' + d[1] + '%"></i>';
    }).join("") + "</div>";
    return '<div class="row">' + esc(JSON.stringify(spec)) + "</div>";
  }

  function renderHifi(container) {
    container.querySelectorAll("pre code.language-mock").forEach(function (code) {
      var spec = null;
      try { spec = JSON.parse(code.textContent); } catch (e) { spec = null; }
      if (!spec) return;
      var pre = code.parentElement;
      var card = document.createElement("div");
      card.className = "hifi";
      card.dataset.skin = "default";
      card.innerHTML =
        '<div class="hifi-head"><span class="lbl">高保真预期</span></div>' +
        '<div class="mock">' + mockHtml(spec) + "</div>";
      var names = { "default": "默认", "ink-wash": "水墨", "fantasy": "魔幻", "minimal": "极简" };
      Object.keys(names).forEach(function (skin) {
        var b = document.createElement("button");
        b.textContent = names[skin];
        if (skin === "default") b.classList.add("on");
        b.onclick = function () {
          card.querySelectorAll(".hifi-head button").forEach(function (x) { x.classList.remove("on"); });
          b.classList.add("on");
          card.dataset.skin = skin;
        };
        card.querySelector(".hifi-head").appendChild(b);
      });
      pre.replaceWith(card);
    });
  }

  function loadDoc(file) {
    currentDoc = file;
    var body = document.getElementById("doc-body");
    var pathEl = document.getElementById("doc-path");
    body.innerHTML = '<div class="docs-loading">加载中…</div>';
    pathEl.textContent = "gitbook/" + CASES_DIR + file;

    LudotsSite.fetchText("gitbook/" + CASES_DIR + file).then(function (md) {
      body.innerHTML = marked.parse(md);
      rewriteLinks(body);
      LudotsSite.bindCopyButtons(body);
      renderHifi(body);
      renderPager(file);
      markActive();
      window.scrollTo({ top: 0, behavior: "auto" });
    }).catch(function () {
      body.innerHTML = '<div class="docs-loading">无法加载 <code>gitbook/' + esc(CASES_DIR + file) +
        '</code><br>该篇可能尚未撰写，或需要先运行 <code>python scripts/build-site.py</code> 重建站点。</div>';
      renderPager("");
    });
  }

  function route() {
    var h = window.location.hash || "";
    var target = null;
    if (h.indexOf("#case/") === 0) {
      var stem = decodeURIComponent(h.slice("#case/".length)).replace(/[^A-Za-z0-9_.-]/g, "");
      if (stem) target = stem + ".md";
    } else if (h === "#readme" || h === "" || h === "#") {
      target = DEFAULT_DOC;
    }
    if (target && target !== currentDoc) loadDoc(target);
  }

  document.addEventListener("DOMContentLoaded", function () {
    buildTree();
    route();
  });

  window.addEventListener("hashchange", route);
})();
</script>
</body>
</html>
