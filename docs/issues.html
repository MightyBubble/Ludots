const mdContent = "# Ludots 文档异味与 Showcase 问题清单\n\n> 本文档基于 Stage 1 代码扫描结果原子化整理。  \n> 生成时间：2026-07-02  \n> 代码基线：main 分支\n\n---\n\n## 统计概览\n\n- **严重（🔴）**: 约 45 项\n- **中等（🟡）**: 约 85 项\n- **低（🟢）**: 约 120 项\n- **总计**: 约 250 项（去重后）\n\n---\n\n## 按模块分组\n\n### Engine_Core\n\n#### Issue-001: `docs/architecture/runtime-overview.md` 缺失\n- **严重度**: 🟡\n- **模块**: Engine_Core\n- **问题类型**: 文档缺失\n- **证据**: `gitbook/architecture/runtime-overview.md` 第 52 行指向该文件\n- **描述**: gitbook 正式文档引用了一个不存在的 docs 深度文件。\n- **建议**: 创建 `docs/architecture/runtime-overview.md` 或更新 gitbook 链接。\n- **相关文档**: `gitbook/architecture/runtime-overview.md`\n\n#### Issue-002: `docs/architecture/mod_runtime_single_source_of_truth.md` 可能缺失\n- **严重度**: 🟡\n- **模块**: Engine_Core\n- **问题类型**: 文档缺失\n- **证据**: `gitbook/architecture/mod-architecture.md` 第 43 行引用\n- **描述**: gitbook 引用的深度材料文件未确认存在。\n- **建议**: 确认文件是否存在，若不存在则创建或移除链接。\n- **相关文档**: `gitbook/architecture/mod-architecture.md`\n\n#### Issue-003: `docs/architecture/startup_entrypoints.md` 可能缺失\n- **严重度**: 🟡\n- **模块**: Engine_Core\n- **问题类型**: 文档缺失\n- **证据**: `gitbook/architecture/runtime-overview.md` 第 52 行引用\n- **描述**: gitbook 引用的深度材料文件未确认存在。\n- **建议**: 确认文件是否存在，若不存在则创建或移除链接。\n- **相关文档**: `gitbook/architecture/runtime-overview.md`\n\n#### Issue-004: `Authority` 和 `Budgeted` 仿真车道文档超前于代码\n- **严重度**: 🟡\n- **模块**: Engine_Core\n- **问题类型**: 文档过承诺\n- **证据**: `gitbook/architecture/entity-simulation-layering.md`、`entity-simulation-workstreams.md`\n- **描述**: 文档详细描述了 Authority 和 Budgeted 仿真车道，但代码中 `SimulationBudgetFuseEvent` 已存在，而 `Authority` 组件和 `Budgeted` 标签未明确发现。\n- **建议**: 核实代码实现状态，若未实现则文档标注为「规划中」。\n- **相关文档**: `gitbook/architecture/entity-simulation-layering.md`\n\n#### Issue-005: `Performer 编译式执行车道` 文档与代码不匹配\n- **严重度**: 🟡\n- **模块**: Engine_Core / Presentation\n- **问题类型**: 文档过承诺\n- **证据**: `gitbook/architecture/performer-compiled-lanes.md`\n- **描述**: 文档描述编译式执行分层，但代码中 `GraphExecutor` 是解释型 VM（38 行），未见显式编译车道标识。\n- **建议**: 核实编译车道实现状态，更新文档或补全代码。\n- **相关文档**: `gitbook/architecture/performer-compiled-lanes.md`\n\n#### Issue-006: `GameEngine.cs` 中 SystemGroup 注释 phase 编号不一致\n- **严重度**: 🟢\n- **模块**: Engine_Core\n- **问题类型**: 命名不一致\n- **证据**: `src/Core/Engine/GameEngine.cs` 第 100 行、第 116 行\n- **描述**: 注释使用「Phase 3.5」描述离散枚举值 `RuntimeEntityBinding`，不一致。\n- **建议**: 统一使用枚举值名称而非小数编号。\n- **相关文档**: `src/Core/Engine/GameEngine.cs`\n\n#### Issue-007: `src/Core/Maps/` 与 `src/Core/Map/` 并存\n- **严重度**: 🟡\n- **模块**: Engine_Core / Map\n- **问题类型**: 命名不一致\n- **证据**: `src/Core/Maps/Level1Map.cs` vs `src/Core/Map/MapManager.cs`\n- **描述**: 两个目录仅差一个字母，容易混淆。`Maps/` 只含一个具体地图文件。\n- **建议**: `Maps/` 改名为 `MapShowcases/` 或合并到 `Map/`。\n- **相关文档**: `src/Core/Map/`, `src/Core/Maps/`\n\n#### Issue-008: 四个物理目录并存\n- **严重度**: 🔴\n- **模块**: Engine_Core / Physics\n- **问题类型**: 架构冲突\n- **证据**: `src/Core/Physics/`, `src/Core/Physics2D/`, `src/Core/Ludots.Physics2D/`, `src/Core/Ludots.Physics.Broadphase/`\n- **描述**: 违反「禁止重复造轮子」铁律。`Physics/` 含旧物理，`Physics2D/` 可能为空，`Ludots.Physics2D/` 含 Shape 数据，`Ludots.Physics.Broadphase/` 含策略接口。\n- **建议**: 合并为一个统一的 Physics2D 目录，清理旧物理。\n- **相关文档**: `src/Core/Physics/`, `src/Core/Physics2D/`, `src/Core/Ludots.Physics2D/`, `src/Core/Ludots.Physics.Broadphase/`\n\n#### Issue-009: `GameEngine.cs` 2967 行单文件过大\n- **严重度**: 🟡\n- **模块**: Engine_Core\n- **问题类型**: 代码异味\n- **证据**: `src/Core/Engine/GameEngine.cs`\n- **描述**: 单文件近 3000 行，维护负担大。\n- **建议**: 按生命周期（初始化、Tick、保存、加载）拆分为多个 partial 文件。\n- **相关文档**: `src/Core/Engine/GameEngine.cs`\n\n#### Issue-010: `TeamManager` 静态全局与 Map-Owned 理念冲突\n- **严重度**: 🟡\n- **模块**: Engine_Core / Gameplay\n- **问题类型**: 架构冲突\n- **证据**: `src/Core/Gameplay/Teams/TeamManager.cs`\n- **描述**: `TeamManager` 是静态全局，但文档 `map-owned-participant-contract.md` 强调 map-owned。\n- **建议**: 将 `TeamManager` 改为 per-map 实例或通过 MapSession 管理。\n- **相关文档**: `gitbook/architecture/map-owned-participant-contract.md`\n\n#### Issue-011: `SchemaUpdate` phase 注释编号与枚举不一致\n- **严重度**: 🟢\n- **模块**: Engine_Core\n- **问题类型**: 命名不一致\n- **证据**: `src/Core/Engine/GameEngine.cs` 第 100 行\n- **描述**: 注释使用「Phase 0」，但枚举值本身没有编号。\n- **建议**: 移除注释中的 phase 编号，直接使用枚举名。\n- **相关文档**: `src/Core/Engine/GameEngine.cs`\n\n#### Issue-012: `GameEvents.ModLoaded` 未实现\n- **严重度**: 🟡\n- **模块**: Engine_Core / Modding\n- **问题类型**: 空实现\n- **证据**: `src/Core/Modding/ModLoader.cs` 第 419-420 行注释\n- **描述**: `ModLoader` 注释称事件将在未来实现，但 `GameEvents.ModLoaded` 已存在且 `TriggerManager` 已支持 `FireEvent`。\n- **建议**: 移除 TODO 注释，直接触发事件，或删除未实现的事件定义。\n- **相关文档**: `src/Core/Modding/ModLoader.cs`\n\n---\n\n### Gameplay_GAS\n\n#### Issue-013: `AbilityDefinitionRegistry.RegisterFromEntity` 未读取高级特性\n- **严重度**: 🔴\n- **模块**: Gameplay_GAS\n- **问题类型**: 代码异味\n- **证据**: `src/Core/Gameplay/GAS/AbilityDefinitionRegistry.cs`\n- **描述**: 未读取 `ToggleSpec`/`Indicator`/`Presentation`/`InputBindingOverride`，导致模板实体无法配置这些高级能力特性。\n- **建议**: 补全 `RegisterFromEntity` 的字段读取，或在文档中明确限制。\n- **相关文档**: `gitbook/architecture/gas-layered-architecture.md`\n\n#### Issue-014: `GameplayCueSystem` 硬编码实现\n- **严重度**: 🟡\n- **模块**: Gameplay_GAS\n- **问题类型**: 代码异味\n- **证据**: `src/Core/Gameplay/Cue/GameplayCueSystem.cs`\n- **描述**: `GameplayCueSystem` 仍为 Primitive 硬编码实现，未走正式 Performer 管道。\n- **建议**: 迁移到 Performer 事件系统，或文档中声明为「过渡实现」。\n- **相关文档**: `src/Core/Gameplay/Cue/GameplayCueSystem.cs`\n\n#### Issue-015: `ActiveEffectContainer` 残留 AI 开发注释\n- **严重度**: 🟢\n- **模块**: Gameplay_GAS\n- **问题类型**: 遗留代码\n- **证据**: `src/Core/Gameplay/GAS/ActiveEffectContainer.cs`\n- **描述**: 残留未清理的 AI 开发注释，可能误导开发者。\n- **建议**: 清理注释或更新为实际状态说明。\n- **相关文档**: `src/Core/Gameplay/GAS/ActiveEffectContainer.cs`\n\n#### Issue-016: `EffectModifiers` 超限时静默丢弃\n- **严重度**: 🟡\n- **模块**: Gameplay_GAS\n- **问题类型**: 代码异味\n- **证据**: `src/Core/Gameplay/GAS/EffectModifiers.cs`\n- **描述**: 效果修饰符超过容量时静默丢弃，无日志或异常。\n- **建议**: 添加溢出日志或改为显式异常（fail-fast）。\n- **相关文档**: `src/Core/Gameplay/GAS/EffectModifiers.cs`\n\n#### Issue-017: `FanOutDispatchEffect` 默认空实现\n- **严重度**: 🟡\n- **模块**: Gameplay_GAS\n- **问题类型**: 空实现\n- **证据**: `src/Core/Gameplay/GAS/TargetResolverFanOutHelper.cs`\n- **描述**: 扇出分发 : `docs/adr/ADR-0003-browser-ui-runtime-contract.md` 与 `docs/adr/ADR-0003-exchange-operation-scope-key.md`\n- **描述**: 两个不同主题的 ADR 使用相同编号。\n- **建议**: 重命名其中一个以消除冲突。\n- **相关文档**: `docs/adr/ADR-0003-browser-ui-runtime-contract.md`, `docs/adr/ADR-0003-exchange-operation-scope-key.md`\n\n#### Issue-081: RFC 编号重叠\n- **严重度**: 🟡\n- **模块**: Docs_Governance\n- **问题类型**: 文档异味\n- **证据**: `docs/rfcs/`\n- **描述**: RFC 0059/0060 编号重叠。\n- **建议**: 重命名以消除冲突。\n- **相关文档**: `docs/rfcs/`\n\n#### Issue-082: `gitbook/SUMMARY.md` 编码损坏\n- **严重度**: 🟡\n- **模块**: Docs_Governance\n- **问题类型**: 文档异味\n- **证据**: `gitbook/SUMMARY.md`\n- **描述**: 文件存在编码损坏字符。\n- **建议**: 修复编码并添加校验。\n- **相关文档**: `gitbook/SUMMARY.md`\n\n#### Issue-083: `docs/architecture/interaction/features/README.md` 使用不可解析的通配符链接\n- **严重度**: 🟡\n- **模块**: Docs_Governance\n- **问题类型**: 文档异味\n- **证据**: `docs/architecture/interaction/features/README.md`\n- **描述**: 174 个通配符链接在 GitBook/GitHub 中不可解析。\n- **建议**: 替换为显式链接或生成脚本。\n- **相关文档**: `docs/architecture/interaction/features/README.md`\n\n#### Issue-084: `docs/audits/README.md` 目录不完整\n- **严重度**: 🟡\n- **模块**: Docs_Governance\n- **问题类型**: 文档缺失\n- **证据**: `docs/audits/README.md`\n- **描述**: 目录声明不完整，缺少部分审计文件索引。\n- **建议**: 补全审计文件索引或移除目录声明。\n- **相关文档**: `docs/audits/README.md`\n\n#### Issue-085: Physics2D 路径分工不明\n- **严重度**: 🟡\n- **模块**: Docs_Governance\n- **问题类型**: 文档欠覆盖\n- **证据**: `src/Core/Physics2D/`, `src/Core/Ludots.Physics2D/`, `src/Core/Ludots.Physics.Broadphase/`\n- **描述**: 多个 Physics2D 相关目录存在，但文档未明确说明各自职责。\n- **建议**: 创建 `docs/architecture/physics2d_paths.md` 说明分工。\n- **相关文档**: `docs/architecture/`\n\n#### Issue-086: 交互文档分支基线声明过时\n- **严重度**: 🟡\n- **模块**: Docs_Governance\n- **问题类型**: 文档与代码不同步\n- **证据**: `docs/architecture/interaction/features/README.md`\n- **描述**: 分支基线声明与当前 main 分支状态不一致。\n- **建议**: 更新基线声明或移除。\n- **相关文档**: `docs/architecture/interaction/features/README.md`\n\n#### Issue-087: 根 `README.md` 环境要求与 gitbook 不一致\n- **严重度**: 🟡\n- **模块**: Docs_Governance\n- **问题类型**: 文档与代码不同步\n- **证据**: `README.md`, `gitbook/contributing/environment-setup.md`\n- **描述**: 根 README 的环境要求与 gitbook 正式文档不一致。\n- **建议**: 统一环境要求，以 gitbook 为准更新根 README。\n- **相关文档**: `README.md`, `gitbook/contributing/environment-setup.md`\n\n#### Issue-088: SystemGroup 新增 `RuntimeEntityBinding` phase 未在任何文档中提及\n- **严重度**: 🟡\n- **模块**: Docs_Governance\n- **问题类型**: 文档与代码不同步\n- **证据**: `src/Core/Engine/GameEngine.cs`\n- **描述**: 代码中新增了 `RuntimeEntityBinding` phase，但 gitbook 和 docs 均未更新。\n- **建议**: 更新 `gitbook/architecture/runtime-overview.md` 和 `docs/architecture/startup_entrypoints.md`。\n- **相关文档**: `gitbook/architecture/runtime-overview.md`\n\n---\n\n## 快速修复清单（低优先级批量建议）\n\n以下 🟢 低优先级问题建议批量处理：\n\n1. **[Engine_Core]** `SchemaUpdate` phase 注释编号与枚举不一致 → 移除注释中的小数编号\n2. **[Engine_Core]** `GameEvents.ModLoaded` 未实现 → 触发事件或删除 TODO\n3. **[Gameplay_GAS]** `ActiveEffectContainer` 残留 AI 开发注释 → 清理注释\n4. **[Input_Nav]** `MassNavigationKeys.cs` 仅含 2 个常量 → 迁移散落 key\n5. **[Input_Nav]** `SelectionSetKeys` vs `SelectionViewKeys` 分散 → 合并到一个类\n6. **[Input_Nav]** `InputOrderMapping` 中 `Ground` 过时别名 → 确认清理后删除\n7. **[Input_Nav]** `GraphQuery` 目录含 `Builder` → 调整目录结构\n8. **[Input_Nav]** `InputOrderMappingLoader.Validate` 硬性要求 → 添加条件验证\n9. **[Input_Nav]** `MassNavigationConfigLoader` 强制 `DeepObject` → 文档标注约束\n10. **[Map_Spatial]** `MapFeatureFlags` 使用 `byte` 存 0/1 → 改为 `bool` 或 bit flags\n11. **[Map_Spatial]** `MapGenerator` 过于简单 → 补充文档或标注占位\n12. **[Config_Script]** `StringIntRegistry` 不回收 ID → 文档标注限制\n13. **[Config_Script]** `GraphVmLimits.HandlerTableSize` 接近上限 → 扩大或动态扩展\n14. **[Config_Script]** `EntityBuilder` 的 `Presentation` 异常 → 确认迁移后移除\n15. **[Config_Script]** `ComponentRegistry` 命名大小写不一致 → 统一大小写\n16. **[Adapters_Apps]** `src/Build/` 目录名存实亡 → 清理或补充\n17. **[Mods]** `CapabilityStandardShowcaseMod` 命名过长 → 缩短命名\n18. **[Docs_Governance]** 根 `README.md` 环境要求不一致 → 统一\n\n---\n\n> **总评**：Ludots 代码库整体架构清晰，但文档与代码之间存在大量不同步（约 60% 的异味属于此类）。最严重的问题是「文档过承诺」（UE5、Ultralight、formation_capability、FireballDuelMod 等），以及物理目录的重复造轮子。建议优先修复 🔴 严重问题，然后建立自动化文档-代码同步检查（如 `scripts/validate-docs.ps1` 增强）。\n";

function buildNav() {
  let html = '';
  const pathParts = window.location.pathname.split('/');
  // 提取项目根路径（如 /Ludots 或 /）
  const basePath = pathParts.length >= 2 && pathParts[1] ? '/' + pathParts[1] : '';
  for (const [group, items] of Object.entries(navData)) {
    if (items.length === 0) continue;
    html += '<div class="group"><div class="group-title">' + group + '</div>';
    for (const [href, title] of items) {
      const cls = href === currentPage ? 'active' : '';
      const link = basePath + '/' + href;
      html += '<a href="' + link + '" class="' + cls + '">' + title + '</a>';
    }
    html += '</div>';
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  buildNav();
  document.getElementById('content').innerHTML = marked.parse(mdContent);
}
render();
